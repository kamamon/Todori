const SAVE_VERSION = 1;

function newGame(opts = {}) {
  const seed = (opts.seed ?? Math.floor(Math.random() * 2 ** 31)) | 0;
  G = {
    version: SAVE_VERSION, seed, rs: seed, m: 0,
    bankName: opts.bankName || DEFAULT_BANK, ceoName: opts.ceoName || '新頭取', difficulty: opts.difficulty || 'normal',
    seq: { co: 0, p: 0, app: 0, loan: 0, inbox: 0, asset: 0, bond: 0, branch: 10, if: 0 },
    ledger: newLedger(), news: [], inbox: [], apps: [], companies: {}, loans: [], bonds: [], assets: [],
    rates: { ord: 0.2, time: 0.4, prime: 1.875, primeLink: true, primeMargin: 1.375, ordLink: true, ordSpread: 0, timeLink: true, timeSpread: 0, mortDisc: 1.05, mortFixSpread: 0.65 },
    dep: { coh: [] },
    staff: { sales: 7, credit: 4, ops: 21, comp: 3 }, salaryLv: 1.0, adBudget: 150e4,
    branches: [], atms: { chuo: 2, ekimae: 1, newtown: 1 },
    vault: { lv: 1, buffer: 1.3, sec: 0, upgrade: null },
    sys: { core: 1, credit: 1, digital: 1, cyber: 0, aml: 0, audit: 0 }, itProjects: [],
    treasury: { autoCall: false, bojBuffer: 1.3 },
    trust: 62, scandalHeat: 0, runShock: 0, pendingInsurance: 0, pendingRecoveries: [],
    flags: { order: -1, lendingBan: -1, publicFunds: false, publicOffer: false, designated: 0, bigDep: 0 },
    stats: {
      investigations: 0, fraudFound: 0, fraudLent: 0, fraudAvoided: 0, fraudDodged: 0, fraudLossAmt: 0,
      loansMade: 0, lentTotal: 0, rejected: 0, declined: 0, prepaid: 0, defaults: 0, defaultAmt: 0, writeoffAmt: 0,
      nplSold: 0, cashShortages: 0, robberies: 0, sysFailures: 0, scandals: 0, auditHits: 0, projectsFunded: 0,
    },
    capUsed: { credit: 0, audit: 0 },
    hist: [], annual: [], fsa: { nextM: 0, history: [], special: false }, ifraud: [], branchReports: {},
    stock: { shares: 3000e4, price: 0, lastIdx: 100 }, shareholders: { sat: 60, warn: 0, hist: [] },
    rejectedLog: [], pendingModals: [], taxLossCF: 0, pendingDividend: null, over: null, termEnded: false,
    initGP: 5.3e8, initOpex: 4.6e8, initNI: 0.3e8, depCalib: 1, ratingIdx: undefined, tutorial: 0,
  };
  G.eco = newEconomy();
  G.city = newCity();
  G.fsa.nextM = randInt(13, 18);
  G.branches = [
    { id: 'b1', d: 'chuo', type: 'hq', openM: -999, name: '本店' },
    { id: 'b2', d: 'ekimae', type: 'full', openM: -120, name: '駅前支店' },
    { id: 'b3', d: 'newtown', type: 'full', openM: -96, name: '北部ニュータウン支店' },
    { id: 'b4', d: 'denen', type: 'small', openM: -200, name: '田園出張所' },
  ];
  setupOpeningBalance();
  // 預金の目標水準を初期残高に合わせて較正
  applyRateLinks();
  G.depCalib = 1;
  const tg = depositTargets();
  G.depCalib = (deposits() - tg.settle) / Math.max(1, tg.ord + tg.time - tg.settle);
  updateRating();
  G.stock.price = netAssets() / G.stock.shares * 0.42;
  G.stock.lastIdx = G.eco.stock;
  addNews('bank', `${G.bankName}が開業。${OLD_UNION}の事業を承継し、${G.ceoName}氏が初代頭取に就任`, 'good');
  addNews('reg', `金融庁は承継した貸出資産の自己査定に注目している。前経営陣の査定は甘かったとの指摘もある`, 'neutral');
  genApplications();
  G.hist.push({ m: -1, bs: bsSnapshot(), pl: {}, kpi: kpiSnapshot() });
  return G;
}

function setupOpeningBalance() {
  const cf = DIFFICULTY[G.difficulty].capital;
  // 承継した事業性融資
  const homeD = ['chuo', 'chuo', 'ekimae', 'ekimae', 'newtown', 'denen', 'kowan', 'kogyo'];
  let bizTotal = 0, lateN = 0, fraudN = 0, weakN = 0;
  const loans = [];
  for (let i = 0; i < 400 && bizTotal < 150e8; i++) {
    const co = genCompany({ district: pick(homeD), qBias: 0.15, fraudMul: 1.2, sizeMul: 2.0 });
    const r = latestRep(co);
    if (r.STD + r.LTD < 5e7) { G.seq.co--; continue; }
    // 承継先の大半は健全。問題先は粉飾2先・業況悪化2先までに限定
    const isFraud = co.fraud && co.fraud.years > 0;
    const weak = co.gTrue >= 8;
    if (isFraud ? fraudN >= 2 : weak ? weakN >= 2 : false) { G.seq.co--; continue; }
    if (isFraud) fraudN++; else if (weak) weakN++;
    G.companies[co.id] = co;
    const capAmt = (isFraud || weak) ? 3.5e8 : 6e8;
    let amt = (r.STD + r.LTD) * uni(0.4, 0.75);
    if (amt > capAmt) amt = capAmt * uni(0.5, 1.0);
    amt = niceAmount(Math.max(3e7, amt));
    const termM = randInt(3, 9) * 12;
    const age = randInt(6, Math.min(60, termM - 6));
    const rateType = chance(0.55) ? 'var' : 'fixed';
    const mrate = marketLoanRate(co.gRep, termM);
    const L = {
      id: 'L' + (++G.seq.loan), kind: 'biz', coId: co.id, name: co.name, ind: co.ind, district: co.district, purpose: pick(['wc', 'capex', 'refi']),
      principal: Math.round(amt * termM / (termM - age)), bal: amt, rateType, rate: +(mrate + uni(-0.2, 0.3)).toFixed(2), termM,
      startM: -age, endM: termM - age, repay: 'equal', status: 'current', dpd: 0, arrears: 0, cls: 0, provision: 0, paidInt: 0,
      restructured: false, ioUntil: -1, stressUntil: -1, grade: co.gRep, fraudKnown: false, inherited: true,
      cgc: chance(0.3) && amt <= 2.8e8 ? 0.8 : 0, personal: chance(0.6),
    };
    L.rate0 = L.rate;
    if (rateType === 'var') { L.spread = +(L.rate - 1.875).toFixed(2); }
    if (co.ownsRE && chance(0.75)) L.collateral = { bank0: reNow(co, co.reEst) * (co.reLien ? 0.6 : 1), true0: reNow(co, co.reTrue) * (co.reLien ? 0.6 : 1), land0: G.city.d[co.district].land };
    if (weak && co.gTrue >= 9 && lateN < 1 && chance(0.7)) { L.status = 'late'; L.dpd = 1; lateN++; }
    co.everBorrowed = true;
    bizTotal += amt;
    loans.push(L);
  }
  const poolBal = roundTo(Math.max(80e8, 270e8 - bizTotal), 1e6);
  G.initBiz = bizTotal;
  const pool = {
    id: 'POOL', kind: 'pool', name: `住宅ローン債権（${OLD_UNION}より承継）`, ind: 'mort', district: 'newtown',
    principal: poolBal, bal: poolBal, rateType: 'var', rate: 0.725, termM: 270, remainM: 270, startM: -60, endM: 270,
    repay: 'annuity', status: 'current', dpd: 0, arrears: 0, cls: 0, provision: 0, paidInt: 0, restructured: false, ioUntil: -1, stressUntil: -1, grade: 3,
  };
  G.loans = loans.concat([pool]);
  for (const L of G.loans) if (L.kind === 'biz') L.cls = L.status === 'late' ? 1 : 0; // 前経営陣の甘い査定
  // 国債
  const bonds = [
    { tenor: 2, face: 20e8, coupon: 0.8, buyM: -6 },
    { tenor: 5, face: 25e8, coupon: 0.3, buyM: -36 },
    { tenor: 10, face: 20e8, coupon: 0.1, buyM: -60 },
    { tenor: 10, face: 15e8, coupon: 0.95, buyM: -18 },
    { tenor: 20, face: 10e8, coupon: 0.8, buyM: -48 },
  ];
  for (const b of bonds) {
    G.bonds.push({ id: 'B' + (++G.seq.bond), tenor: b.tenor, face: b.face, coupon: b.coupon, buyM: b.buyM, matM: b.buyM + b.tenor * 12, book: b.face, name: `利付国債（${b.tenor}年）第${{ 2: 455, 5: 160, 10: 362, 20: 180 }[b.tenor] + G.seq.bond}回` });
  }
  // 固定資産
  const fa = [
    ['本店土地', 'tangible', 6e8, 0], ['本店建物', 'tangible', 5e8, 300], ['支店・出張所の店舗設備', 'tangible', 1.2e8, 120],
    ['ATM（承継分）', 'tangible', 0.6e8, 72], ['勘定系システム（承継）', 'intangible', 1e8, 48],
  ];
  for (const [name, kind, cost, life] of fa) G.assets.push({ id: 'F' + (++G.seq.asset), name, kind, cost, life, m0: 0, book: cost });
  // 定期預金（1年もの）の満期構成
  const timeTotal = 175e8;
  const ws = Array.from({ length: 12 }, () => uni(0.7, 1.3));
  const wsum = sum(ws);
  let allocated = 0;
  for (let i = 0; i < 12; i++) {
    const bal = i === 11 ? timeTotal - allocated : roundTo(timeTotal * ws[i] / wsum, 1e6);
    allocated += bal;
    G.dep.coh.push({ bal, rate: +(0.25 + 0.15 * ((i + 12 - 0) % 12) / 11).toFixed(3) });
  }
  const ordDep = 230e8;
  const cash = 11e8;
  const sec = sum(G.bonds, b => b.face);
  const loanSum = sum(G.loans, L => L.bal);
  const tang = sum(G.assets.filter(a => a.kind === 'tangible'), a => a.book);
  const intang = sum(G.assets.filter(a => a.kind === 'intangible'), a => a.book);
  const capital = roundTo(30e8 * cf, 1e8), surplus = 5e8, retained = 3e8;
  const boj = ordDep + timeTotal + capital + surplus + retained - cash - sec - loanSum - tang - intang;
  if (boj < 10e8) throw new Error('初期の日銀預け金が不足: ' + boj);
  post('開業時の資産・負債の承継', [
    ['cash', cash, 0], ['boj', boj, 0], ['securities', sec, 0], ['loans', loanSum, 0], ['tangible', tang, 0], ['intangible', intang, 0],
    ['depOrd', 0, ordDep], ['depTime', 0, timeTotal], ['capital', 0, capital], ['capSurplus', 0, surplus], ['retained', 0, retained],
  ]);
  // 承継債権の引当（前経営陣の区分のまま）
  let prov = 0;
  for (const L of G.loans) { L.provision = provisionFor(L, L.cls); prov += L.provision; }
  post('承継債権に対する貸倒引当金の計上', [['retained', prov, 0], ['allowance', 0, prov]]);
  G.ledger.mflow = {};
  closeJournalMonth(-1);
}

/* ---------- KPI ---------- */
function kpiSnapshot() {
  const rw = rwaBreakdown();
  const cs = cityStats();
  return {
    ta: Math.round(totalAssets()), dep: Math.round(deposits()), loans: Math.round(B('loans')), na: Math.round(netAssets()),
    cr: +(coreCapitalParts(rw).core / Math.max(1, rw.total) * 100).toFixed(2), npl: +nplRatio().toFixed(2), trust: +G.trust.toFixed(1),
    rating: G.ratingIdx, price: Math.round(G.stock.price || 0), pop: Math.round(cs.pop), vit: +cs.vit.toFixed(1),
    share: +(cs.share * 100).toFixed(2), policy: G.eco.policy, y10: +G.eco.y[10].toFixed(3), prime: G.rates.prime,
    ord: G.rates.ord, time: G.rates.time, unreal: Math.round(unrealizedGain()),
    gdp: +G.eco.gdp.toFixed(2), cpi: +G.eco.cpi.toFixed(2), unemp: +G.eco.unemp.toFixed(2), landN: +G.eco.land.toFixed(1), stockN: +G.eco.stock.toFixed(1),
  };
}

/* 月次の損益集計（mflowから） */
function plSummary(pl) {
  const g = k => pl[k] || 0;
  const fundInc = g('intLoans') + g('intSec') + g('intCall') + g('intBoj');
  const fundExp = g('intDep') + g('intCallM') + g('intBorrow');
  const feeNet = g('fees') - g('feeExp');
  const othNet = g('bondGain') - g('bondLoss');
  const opex = g('personnel') + g('premises') + g('taxes') + g('depreciation') + g('depInsurance');
  const credit = g('provExp') + g('writeoff') - g('provRev') - g('recoveries');
  const ordRev = sum(REV_KEYS.filter(k => ACCT[k].grp !== 'extra'), k => g(k));
  const ordExp = sum(EXP_KEYS.filter(k => ACCT[k].grp !== 'extra' && ACCT[k].grp !== 'tax'), k => g(k));
  const ordinary = ordRev - ordExp;
  const extra = g('extraGain') - g('extraLoss');
  const pretax = ordinary + extra;
  const net = pretax - g('incomeTax');
  const gross = fundInc - fundExp + feeNet + othNet;
  return { fundInc, fundExp, nii: fundInc - fundExp, feeNet, othNet, gross, opex, core: gross - othNet - opex, credit, ordinary, extra, pretax, tax: g('incomeTax'), net, ordRev, ordExp };
}
function sumPL(fromM, toM) {
  const acc = {};
  for (const h of G.hist) if (h.m >= fromM && h.m <= toM) for (const k in h.pl) acc[k] = (acc[k] || 0) + h.pl[k];
  return acc;
}

/* ---------- 月次処理 ---------- */
function advanceMonth() {
  if (G.over) return null;
  const m = G.m;
  const before = { dep: deposits(), loans: B('loans'), ta: totalAssets(), trust: G.trust, newsLen: G.news.length };
  G.pendingModals = [];
  // ===== 当月末の処理 =====
  processLoans();
  processDeposits();
  payDepositInterest();
  processTreasuryMonthly();
  processFeesAndExpenses();
  depreciateAssets();
  processVault();
  processInternalFraudMonthly();
  trueUpProvisions();
  manageLiquidity();
  if (G.over) return finishAdvance(m, before);
  makeBranchReports();
  let fyClosed = false;
  if (calMonth(m) === 3) { yearEndClosing(); fyClosed = true; }
  const flow = closeJournalMonth(m);
  G.hist.push({ m, bs: bsSnapshot(), pl: flow, kpi: kpiSnapshot() });
  if ([6, 9, 12, 3].includes(calMonth(m))) { updateRating(); G.hist[G.hist.length - 1].kpi.rating = G.ratingIdx; }
  pruneState();
  // ===== 翌月 =====
  G.m = m + 1;
  G.capUsed = { credit: 0, audit: 0 };
  ecoStep();
  applyRateLinks();
  for (const D of DISTRICTS) { const s = G.city.d[D.id]; s.mortNew.push(s.mortCur || 0); s.mortCur = 0; }
  cityStep();
  expireApps();
  expireInbox();
  borrowerMonthly();
  itProjectsStep();
  vaultUpgradeStep();
  for (const b of G.branches) if (b.openM === G.m) addNews('bank', `「${b.name}」が開業した`, 'good');
  staffStep();
  eventsStep();
  fsaStep();
  if (calMonth(G.m) === 5) payTaxes();
  if (calMonth(G.m) === 6) shareholdersMeeting();
  updateTrust();
  updateStock();
  checkCapital();
  if (!G.over) manageLiquidity();
  if (!G.over) genApplications();
  return finishAdvance(m, before, fyClosed);
}

function finishAdvance(m, before, fyClosed) {
  const h = G.hist[G.hist.length - 1];
  const rep = {
    m, fyClosed: !!fyClosed,
    pl: h && h.m === m ? plSummary(h.pl) : null,
    dDep: deposits() - before.dep, dLoans: B('loans') - before.loans, dTA: totalAssets() - before.ta, dTrust: G.trust - before.trust,
    news: G.news.slice(0, Math.max(0, G.news.length - before.newsLen)).filter(n => n.m >= m),
    newApps: G.apps.filter(a => a.m === G.m && a.status === 'pending').length,
  };
  G.lastReport = rep;
  return rep;
}

function expireApps() {
  for (const a of G.apps) {
    if (a.status === 'pending' && a.exp < G.m) { a.status = 'expired'; a.decidedM = G.m - 1; }
  }
  // 古い案件と、取引のない企業データを整理
  G.apps = G.apps.filter(a => a.status === 'pending' || G.m - (a.decidedM ?? a.m) <= 2);
}

function pruneState() {
  // 完済・償却から3年以上たった融資を整理
  G.loans = G.loans.filter(L => isActiveLoan(L) || G.m - (L.closedM ?? G.m) <= 36);
  const keep = new Set();
  for (const L of G.loans) if (L.coId) keep.add(L.coId);
  for (const a of G.apps) if (a.coId) keep.add(a.coId);
  for (const r of G.rejectedLog) keep.add(r.coId);
  for (const id of Object.keys(G.companies)) if (!keep.has(id)) delete G.companies[id];
  if (G.annual.length > 30) G.annual.shift();
  if (G.hist.length > 400) G.hist.shift();
}

function payTaxes() {
  const t = B('taxPayable');
  if (t > 0) { ensureFunds(t); post('法人税等の納付', [['taxPayable', t, 0], ['boj', 0, t]]); }
}

/* 市場連動の金利設定 */
function applyRateLinks() {
  const r = G.rates, e = G.eco;
  const r3 = x => Math.round(x * 1000) / 1000;
  if (r.primeLink) r.prime = r3(e.policy + r.primeMargin);
  if (r.ordLink) r.ord = r3(Math.max(0.001, e.mktOrd + r.ordSpread));
  if (r.timeLink) r.time = r3(Math.max(0.002, e.mktTime + r.timeSpread));
}

/* ---------- 決算 ---------- */
function yearEndClosing() {
  const fy = fyOf(G.m);
  const audit = externalAudit();
  const pretax = curProfit();
  let tax = 0;
  if (pretax > 0) {
    const taxable = pretax - G.taxLossCF;
    if (taxable > 0) { tax = Math.round(taxable * TAX_RATE); G.taxLossCF = 0; }
    else G.taxLossCF -= pretax;
  } else G.taxLossCF += -pretax;
  tax += 300e4; // 住民税均等割など
  post('法人税、住民税及び事業税の計上', [['incomeTax', tax, 0], ['taxPayable', 0, tax]]);
  const rep = buildAnnualReport(fy, audit);
  G.annual.push(rep);
  closeBooks('決算振替（損益勘定を利益剰余金へ）');
  const ni = rep.pl.net;
  const allowed = !G.flags.publicFunds && capitalRatio() >= 6 && ni > 0;
  G.pendingDividend = { fy, ni, allowed, max: allowed ? Math.round(ni * 0.6) : 0 };
  G.pendingModals.push({ type: 'yearEnd', fy });
  if (fy === TERM_YEARS - 1 && !G.termEnded) { G.termEnded = true; G.pendingModals.push({ type: 'term' }); }
}

function buildAnnualReport(fy, audit) {
  const fromM = fy * 12, toM = fy * 12 + 11;
  const acc = sumPL(fromM, toM - 1);
  for (const k in G.ledger.mflow) acc[k] = (acc[k] || 0) + G.ledger.mflow[k];
  const pl = plSummary(acc);
  const rw = rwaBreakdown();
  const parts = coreCapitalParts(rw);
  const npl = nplBreakdown();
  const prev = G.annual[G.annual.length - 1];
  const bs = bsSnapshot();
  return {
    fy, m: G.m, bs, plRaw: acc, pl,
    ta: totalAssets(), dep: deposits(), loans: B('loans'), na: netAssets(),
    cr: parts.core / rw.total * 100, core: parts.core, rwa: rw.total, npl: npl.ratio, nplAmt: npl.npl,
    roa: pl.net / Math.max(1, (totalAssets() + (prev ? prev.ta : totalAssets())) / 2) * 100,
    roe: pl.net / Math.max(1, (netAssets() + (prev ? prev.na : netAssets())) / 2) * 100,
    ohr: pl.gross > 0 ? pl.opex / pl.gross * 100 : 0,
    audit, rating: G.ratingIdx, trust: G.trust, price: G.stock.price, pop: cityStats().pop, vit: cityStats().vit,
    unreal: unrealizedGain(), branches: openBranches().length, staff: staffTotal(),
  };
}

/* 配当の決定（決算モーダルから） */
function decideDividend(ratio) {
  const d = G.pendingDividend;
  if (!d) return { ok: false };
  const amt = d.allowed ? Math.round(Math.max(0, d.ni) * clamp(ratio, 0, 0.6)) : 0;
  if (amt > 0) post('剰余金の配当の決議', [['retained', amt, 0], ['divPayable', 0, amt]]);
  const rep = G.annual.find(a => a.fy === d.fy);
  if (rep) { rep.dividend = amt; rep.payout = d.ni > 0 ? amt / d.ni : 0; }
  G.lastPayout = d.ni > 0 ? amt / d.ni : 0;
  G.pendingDividend = null;
  return { ok: true, amt };
}

/* ---------- 株主総会（6月） ---------- */
function shareholdersMeeting() {
  const div = B('divPayable');
  if (div > 0) { ensureFunds(div); post('配当金の支払', [['divPayable', div, 0], ['boj', 0, div]]); }
  const last = G.annual[G.annual.length - 1];
  if (!last) return;
  const h12 = G.hist[G.hist.length - 13];
  const ret = h12 && h12.kpi.price ? (G.stock.price / h12.kpi.price - 1) * 100 : 0;
  let sat = 55 + 2.5 * clamp(last.roe, -8, 10) + 30 * Math.min(0.5, G.lastPayout || 0) + 0.2 * clamp(ret, -50, 50)
    - 6 * Math.min(3, G.scandalHeat / 6) + (G.ratingIdx <= 5 ? 5 : 0) - (G.shareholders.dilution || 0) * 25;
  if (last.pl.net < 0) sat -= 6;
  sat = clamp(sat, G.annual.length <= 1 ? 30 : 0, 100);
  G.shareholders.dilution = 0;
  G.shareholders.sat = sat;
  const approval = clamp(42 + sat * 0.6 + randn() * 2, 20, 99);
  G.shareholders.hist.push({ m: G.m, sat, approval });
  if (approval < 50) {
    if (G.shareholders.warn >= 1 && G.annual.length >= 2) { gameOver('dismissed', approval); return; }
    G.shareholders.warn = 1;
    const ap = 50 + rand() * 2;
    G.shareholders.hist[G.shareholders.hist.length - 1].approval = ap;
    addNews('bank', `株主総会で頭取の再任議案は大株主の支持で辛うじて可決（賛成率${fmtNum(ap, 1)}%）。来年も業績が振るわなければ解任は避けられない`, 'bad');
    G.pendingModals.push({ type: 'agm', approval: ap, sat, warn: true });
    return;
  }
  if (sat < 30) {
    G.shareholders.warn++;
    addNews('bank', `株主総会で経営陣への批判が相次ぐ。頭取の再任議案の賛成率は${fmtNum(approval, 1)}%`, 'bad');
  } else {
    G.shareholders.warn = 0;
    addNews('bank', `定時株主総会を開催。頭取の再任議案は賛成率${fmtNum(approval, 1)}%で可決`, 'good');
  }
  G.pendingModals.push({ type: 'agm', approval, sat });
}

/* ---------- 自己資本・存続判定 ---------- */
function checkCapital() {
  const cr = capitalRatio();
  const na = netAssets();
  if (na < 0) { gameOver('insolvent'); return; }
  const q = [6, 9, 12, 3].includes(calMonth(G.m));
  if (cr < 4 && !G.flags.publicFunds && !G.flags.publicOffer && G.stats.publicFundsAmt === undefined) {
    G.flags.publicOffer = true;
    G.pendingModals.push({ type: 'publicFunds' });
  }
  if (!q) return;
  if (cr < 0) { gameOver('suspended'); return; }
  if (cr < 2 && G.flags.pca !== 2) {
    G.flags.pca = 2; G.flags.lendingBan = G.m + 3;
    addNews('reg', `自己資本比率が${fmtPct(cr)}に低下。早期是正措置（第2区分）により新規融資の抑制を命じられた`, 'bad');
  } else if (cr < 4 && !G.flags.pca) {
    G.flags.pca = 1;
    addNews('reg', `自己資本比率が${fmtPct(cr)}と国内基準の4%を下回り、早期是正措置（第1区分）として経営改善計画の提出を求められた`, 'bad');
  } else if (cr >= 4) G.flags.pca = 0;
}

  insolvent: { title: '債務超過', text: '純資産がマイナスとなり、銀行として存続できなくなりました。' },

/* ---------- 経営評価（任期満了・終了時） ---------- */
function finalEvaluation() {
  const first = G.hist[0].kpi;
  const cs = cityStats();
  const ta = totalAssets();
  const cumNI = sum(G.annual, a => a.pl.net);
  const s = G.stats;
  const parts = [];
  const add = (name, pts, max, note) => parts.push({ name, pts: Math.round(clamp(pts, 0, max)), max, note });
  add('規模の拡大', Math.log2(ta / first.ta) * 12 + 5, 25, `総資産 ${fmtYen(first.ta)} → ${fmtYen(ta)}`);
  add('収益力', cumNI / 1e8 * 0.6 + 5, 20, `累計当期純利益 ${fmtYen(cumNI)}`);
  add('健全性', (capitalRatio() - 4) * 1.5 + (5 - nplRatio()) * 1.5, 20, `自己資本比率 ${fmtPct(capitalRatio())}、不良債権比率 ${fmtPct(nplRatio())}`);
  add('審査の目', s.fraudFound * 1.2 + s.fraudDodged * 0.8 - s.fraudLent * 0.6 + 4, 15, `粉飾の発見 ${s.fraudFound}件、粉飾先への融資 ${s.fraudLent}件`);
  add('地域の発展', (cs.vit - 100) * 0.6 + (cs.pop / first.pop - 1) * 100 + s.projectsFunded * 1.5 + 4, 15, `人口 ${fmtNum(first.pop)}人 → ${fmtNum(cs.pop)}人、地域活力 ${fmtNum(cs.vit, 1)}`);
  add('ガバナンス', 5 - s.scandals * 1.2 - G.fsa.history.filter(h => h.grade === 'D').length * 2 - (G.flags.publicFunds || s.publicFundsAmt ? 3 : 0), 5, `不祥事 ${s.scandals}件`);
  const total = sum(parts, p => p.pts);
  const rank = total >= 85 ? 'S' : total >= 70 ? 'A' : total >= 55 ? 'B' : total >= 40 ? 'C' : 'D';
  const title = { S: '名頭取として語り継がれる', A: '地域に信頼される名経営者', B: '堅実な経営者', C: '可もなく不可もない頭取', D: '課題の多い経営だった' }[rank];
  return { parts, total, rank, title };
}

/* 内部整合性のチェック（開発・検証用） */
function integrityCheck() {
  const errs = [];
  const d = ledgerDiff();
  if (Math.abs(d) > 1) errs.push('貸借不一致 ' + d);
  const lsum = sum(G.loans.filter(isActiveLoan), L => L.bal);
  if (Math.abs(lsum - B('loans')) > 1) errs.push(`貸出金の補助元帳不一致 ${lsum} vs ${B('loans')}`);
  const bsum = sum(G.bonds, b => b.book);
  if (Math.abs(bsum - B('securities')) > 1) errs.push(`有価証券の補助元帳不一致 ${bsum} vs ${B('securities')}`);
  const tsum = sum(G.dep.coh, c => c.bal);
  if (Math.abs(tsum - B('depTime')) > 1) errs.push(`定期預金の補助元帳不一致 ${tsum} vs ${B('depTime')}`);
  const tg = sum(G.assets.filter(a => a.kind === 'tangible'), a => a.book);
  if (Math.abs(tg - B('tangible')) > 1) errs.push(`有形固定資産の補助元帳不一致 ${tg} vs ${B('tangible')}`);
  const ig = sum(G.assets.filter(a => a.kind === 'intangible'), a => a.book);
  if (Math.abs(ig - B('intangible')) > 1) errs.push(`無形固定資産の補助元帳不一致 ${ig} vs ${B('intangible')}`);
  const prov = sum(G.loans.filter(isActiveLoan), L => L.provision || 0);
  if (Math.abs(prov - B('allowance')) > 1) errs.push(`引当金の補助元帳不一致 ${prov} vs ${B('allowance')}`);
  for (const k of ['cash', 'boj', 'depOrd', 'depTime']) if (B(k) < -1) errs.push(`${ACCT[k].name}がマイナス ${B(k)}`);
  for (const k of ACCT_KEYS) if (!isFinite(B(k))) errs.push(`${k} が数値でない`);
  for (const L of G.loans) if (isActiveLoan(L) && (!isFinite(L.bal) || L.bal < 0)) errs.push(`融資残高異常 ${L.id} ${L.bal}`);
  return errs;
}

const LS = { auto: 'toudori.v1.auto', slot: i => `toudori.v1.slot${i}`, meta: i => `toudori.v1.meta${i}`, theme: 'toudori.theme', settings: 'toudori.settings' };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(b64) {
  const s = atob(b64);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function packSave(str) {
  if (typeof CompressionStream === 'undefined') return 'J' + str;
  try {
    const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
    return 'Z' + bufToB64(await new Response(stream).arrayBuffer());
  } catch (e) { return 'J' + str; }
}
async function unpackSave(s) {
  if (!s) return null;
  if (s[0] === 'J') return s.slice(1);
  if (s[0] === 'Z') {
    const stream = new Blob([b64ToBytes(s.slice(1))]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  return s;
}
function saveMeta() { return JSON.stringify({ bank: G.bankName, ceo: G.ceoName, m: G.m, ta: totalAssets(), at: Date.now(), over: !!G.over }); }

let saveTimer = null;

function bindEvents() {

    const el = e.target.closest('[data-act]');

/* =========================================================
 *  11_ui_charts.js : SVGチャートと汐見市の地図

function niceScale(lo, hi, n = 4) {
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  const mid = (lo + hi) / 2, minSpan = Math.abs(mid) * 0.04;
  if (hi - lo < minSpan) { lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
  if (lo === hi) { const d = Math.abs(lo) * 0.1 || 1; lo -= d; hi += d; }
  const raw = (hi - lo) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  return { lo: Math.floor(lo / step + 1e-9) * step, hi: Math.ceil(hi / step - 1e-9) * step, step };
}

  if (a >= 1e8) return s + fmtNum(a / 1e8, a >= 1e10 || a % 1e8 === 0 ? 0 : 1) + '億';
  if (a >= 1e4) return s + fmtNum(a / 1e4, 0) + '万';

/* 折れ線（複数系列）。series: [{name, color:'s1', values:[]}] */
const chartW = () => (typeof window !== 'undefined' && window.innerWidth < 640 ? 380 : 640);

  }
  if (sc.lo < 0 && sc.hi > 0) g += `<line class="ax" x1="${L}" x2="${W - R + 4}" y1="${y(0)}" y2="${y(0)}"/>`;

  let paths = '', ends = [];

/* 棒グラフ（正負対応）。値がマイナスの棒は朱色（赤字） */
function barChart(o) {
  const W = o.width || chartW(), H = Math.round((o.height || 190) * (chartW() < 640 ? 0.85 : 1));
  const L = 52, R = 12, T = 12, Bt = 24;
  const n = o.values.length;
  if (!n) return '<div class="empty">データがまだありません</div>';
  const vals = o.values.map(v => (isFinite(v) ? v : 0));
  const sc = niceScale(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const yf = o.yFmt || axisYen;
  const slot = (W - L - R) / n;
  const bw = Math.min(24, slot * 0.62);
  const y = v => T + (H - T - Bt) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  let g = '';
  for (let v = sc.lo; v <= sc.hi + sc.step / 2; v += sc.step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${yf(v)}</text>`;
  const y0 = y(0);
  g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}"/>`;
  const every = Math.max(1, Math.ceil(n / (W < 500 ? 5 : 8)));
  let bars = '';
  vals.forEach((v, i) => {
    const cx = L + slot * (i + 0.5);
    if (i % every === 0) g += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.labels[i])}</text>`;
    const yv = y(v);
    const hgt = Math.abs(yv - y0);

    const x0 = cx - bw / 2, x1 = cx + bw / 2;

    else d = `M${x0},${y0}V${yv - r}Q${x0},${yv} ${x0 + r},${yv}H${x1 - r}Q${x1},${yv} ${x1},${yv - r}V${y0}Z`;
    if (d) bars += `<path d="${d}" fill="var(--${v < 0 ? (o.negColor || 'shu') : (o.color || 's1')})"/>`;
    bars += `<rect class="hit" x="${(cx - slot / 2).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${H - T - Bt}" data-tip="${esc(o.labels[i] + '\n' + (o.name || '') + '　' + (o.tipFmt || fmtYen)(v))}"/>`;

function sparkline(values, o = {}) {

const MAP_SEA = [[20, 440], [262, 428], [560, 432], [640, 405], [780, 420], [780, 470], [20, 470]];

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }

}
function lotsFor(D, idx) {
  if (MAP_LOTS[D.id]) return MAP_LOTS[D.id];

  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);

    if (!pointInPoly(x, y, D.poly)) continue;
    if (!pointInPoly(x - 8, y - 10, D.poly) || !pointInPoly(x + 8, y + 4, D.poly)) continue;
    if (Math.hypot(x - D.label[0], y - D.label[1]) < 34) continue;

function fmtRatio(v, unit) {
  if (v === undefined || v === null || isNaN(v)) return '―';
  if (!isFinite(v)) return unit === '年' ? '返済不能' : '―';
  if (unit === '千円') return fmtK(v);
  const d = unit === '回' || unit === '倍' || unit === '年' || unit === 'か月' ? 1 : unit === '日' ? 0 : 1;
  return (v < 0 ? '△' : '') + fmtNum(Math.abs(v), d) + (unit === '%' ? '%' : unit === '千円' ? '' : unit);
}

function companyFS(co, view, showTrue, n = 3) {
  const years = co.years.slice(-(n + 1));
  const disp = years.slice(1);
  const found = co.fraud && co.fraud.found;
  const pick = y => (showTrue ? y.T : repOf(y));
  const heads = disp.map(y => `<th>${fiscalLabelFor(y.endM)}</th>`).join('');
  const diffHead = found ? `<th>差異（実態−提出）</th>` : '';
  if (view === 'ratio') {
    const avg = industryAvg(co.ind);
    const rs = disp.map((y, i) => ratiosOf(pick(y), pick(years[i])));
    const body = RATIO_ROWS.map(([name, f, unit, avgKey]) => {
      if (!f) return `<tr class="head"><td colspan="${disp.length + 2}">${name}</td></tr>`;
      const cells = rs.map(r => `<td>${fmtRatio(f(r), unit)}</td>`).join('');
      return `<tr class="i1"><td>${name}</td>${cells}<td class="muted">${avgKey && avg[avgKey] !== undefined ? fmtRatio(avg[avgKey], unit) : '―'}</td></tr>`;
    }).join('');
    return `<div class="tbl-wrap"><table class="fs"><thead><tr><th>指標${showTrue ? '（実態）' : ''}</th>${heads}<th>業界平均</th></tr></thead><tbody>${body}</tbody></table></div><p class="note">業界平均は中小企業の目安。決算書は千円単位。</p>`;
  }
  const rows = FS_ROWS[view];
  const body = rows.map(([name, f, cls]) => {
    if (!f) return `<tr class="head"><td colspan="${disp.length + 1 + (found ? 1 : 0)}">${name}</td></tr>`;
    const vals = disp.map((y, i) => {
      const s = pick(y);
      const c = view === 'cf' ? cfOf(s, pick(years[i])) : null;
      return f(s, c);
    });
    const cells = vals.map(v => `<td class="${v < 0 ? 'neg' : ''}">${fmtK(v)}</td>`).join('');
    let diff = '';
    if (found) {
      const last = disp[disp.length - 1], prevY = years[years.length - 2];
      const tv = f(last.T, view === 'cf' ? cfOf(last.T, prevY.T) : null);
      const rv = f(repOf(last), view === 'cf' ? cfOf(repOf(last), repOf(prevY)) : null);
      const d = tv - rv;
      diff = `<td class="${Math.abs(d) >= 1000 ? 'diff' : 'muted'}">${Math.abs(d) >= 1000 ? fmtK(d) : '―'}</td>`;
    }
    return `<tr class="${cls || ''}"><td>${name}</td>${cells}${diff}</tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="fs"><thead><tr><th>（単位：千円）${showTrue ? '<span class="true">実態</span>' : ''}</th>${heads}${diffHead}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function inboxItems() {
  const items = [];
  const pend = G.apps.filter(a => a.status === 'pending');
  if (pend.length) {
    const exp = pend.filter(a => a.exp <= G.m).length;
    items.push({ ico: '融', t1: `融資の申込 ${pend.length}件`, t2: exp ? `うち${exp}件は今月末が回答期限` : '回答期限は来月末', act: btn('審査する', 'go', { tab: 'loans' }, 'sm primary') });
  }
  const offers = PROJECTS.filter(P => G.city.projects[P.id]?.status === 'offered');
  for (const P of offers) {
    const st = G.city.projects[P.id];
    items.push({ ico: '案', t1: `開発案件：${P.name}`, t2: `シンジケートローン${fmtYen(st.debt)}。参加表明は${ymLabel(st.deadline)}末まで（現在の表明額 ${fmtYen(st.ourAmt || 0)}）`, act: btn('検討する', 'go', { tab: 'city', dist: P.d }, 'sm') });
  }
  for (const it of G.inbox) {
    if (it.type === 'resched') {
      const L = G.loans.find(x => x.id === it.loanId);
      if (!L) continue;
      items.push({ ico: '猶', cls: 'warn', t1: `返済猶予の申し出：${L.name}`, t2: `元金返済の1年間据置を希望（残高${fmtYen(L.bal)}）。応じると要管理先に区分`, act: btn('応じる', 'resched', { id: it.id, v: 1 }, 'sm') + btn('断る', 'resched', { id: it.id, v: 0 }, 'sm danger') });
    } else if (it.type === 'refi') {
      const L = G.loans.find(x => x.id === it.loanId);
      if (!L) continue;
      items.push({ ico: '期', cls: 'warn', t1: `期日到来：${L.name}`, t2: `${fmtYen(L.bal)}の一括返済が困難との申し出。1年延長（折り返し）するか、返済を求めるか`, act: btn('1年延長', 'refi', { id: it.id, v: 1 }, 'sm') + btn('返済を求める', 'refi', { id: it.id, v: 0 }, 'sm danger') });
    } else if (it.type === 'fsaNotice') {
      items.push({ ico: '検', cls: 'bad', t1: '金融庁検査の予告（来月）', t2: '自己査定の区分、決算書の検証、管理態勢を点検しておきましょう', act: btn('与信管理へ', 'go', { tab: 'portfolio' }, 'sm') });
    }
  }
  const gap = G.loans.filter(L => isActiveLoan(L) && sysClass(L) > L.cls).length;
  if (gap) items.push({ ico: '査', cls: 'warn', t1: `自己査定：システム判定より甘い区分の先が${gap}件`, t2: '承継した貸出には前経営陣の甘い査定が残っています。検査で指摘される前に見直しましょう', act: btn('見直す', 'pfGap', {}, 'sm') });
  const rev = G.inbox.filter(x => x.type === 'review').length;
  if (rev) items.push({ ico: '決', t1: `決算書の検証待ち ${rev}先`, t2: '融資先から新しい決算書が届いています。内容を確認し債務者区分を見直します', act: btn('確認する', 'go', { tab: 'portfolio' }, 'sm') });
  // 警告
  const cap = vaultCapacity(), tgt = cashRequired() * G.vault.buffer;
  if (tgt > cap * 0.95) items.push({ ico: '庫', cls: 'warn', t1: '金庫の容量が不足しています', t2: `必要な現金在高 ${fmtYen(tgt)} に対し収容能力 ${fmtYen(cap)}。年末などの需要期に現金不足でATMが止まる恐れ`, act: btn('金庫へ', 'go', { tab: 'facility' }, 'sm') });
  const load = coreLoad();
  if (load > 0.85) items.push({ ico: '系', cls: load > 1 ? 'bad' : 'warn', t1: `勘定系システムの使用率 ${fmtPct(load * 100, 0)}`, t2: load > 1 ? '処理能力を超えています。新規口座の受付が止まり、障害が頻発します' : '処理能力の上限が近づいています。システム更改を検討してください', act: btn('システムへ', 'go', { tab: 'system' }, 'sm') });
  const svc = serviceQuality();
  if (svc < 0.9) items.push({ ico: '人', cls: 'warn', t1: '窓口・事務の人員が不足しています', t2: `必要人員 ${fmtNum(opsRequired(), 0)}人に対し${G.staff.ops}人。待ち時間と事務ミスが増え、信用度が下がります`, act: btn('人事へ', 'go', { tab: 'hr' }, 'sm') });
  const cr = capitalRatio();
  if (cr < 8) items.push({ ico: '資', cls: cr < 4 ? 'bad' : 'warn', t1: `自己資本比率が${fmtPct(cr)}に低下`, t2: cr < 4 ? '国内基準の4%を下回っています。早期是正措置の対象です' : '格付と信用度に影響します。リスクアセットの抑制か増資を', act: btn('資本政策', 'go', { tab: 'finance', fin: 'capital' }, 'sm') });
  if (!G.rates.timeLink && G.rates.time < G.eco.mktTime - 0.1) items.push({ ico: '利', cls: 'warn', t1: '定期預金金利が市場を下回っています', t2: `当行 ${fmtRate(G.rates.time)} ／ 市場平均 ${fmtRate(G.eco.mktTime)}。満期時に預金が流出します`, act: btn('金利へ', 'go', { tab: 'rates' }, 'sm') });
  if (G.flags.publicOffer && !G.flags.publicFunds) items.push({ ico: '公', cls: 'bad', t1: '公的資金の注入を申請できます', t2: '自己資本比率が4%を下回りました', act: btn('検討する', 'publicFundsShow', {}, 'sm') });
  return items;
}

function ringiStampBox(app) {

function bigSeal(word, square) {

  if (square) return `<svg class="bigseal" viewBox="-30 -30 60 60" aria-label="${word}"><rect x="-22" y="-22" width="44" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><text x="0" y="-2" text-anchor="middle" font-size="17" fill="currentColor" font-family="var(--f-doc)" font-weight="700">${word[0]}</text><text x="0" y="16" text-anchor="middle" font-size="17" fill="currentColor" font-family="var(--f-doc)" font-weight="700">${word[1]}</text></svg>`;

function invPanel(app, defs, co) {
  const left = creditCapLeft();
  const cards = Object.entries(defs).map(([k, d]) => {
    if (d.cond && co && !d.cond(co)) return '';
    const r = app.inv[k];
    if (r) {
      const st = { ok: ['問題なし', 'ok'], minor: ['要確認', 'warn'], major: ['重大な問題', 'bad'] }[r.status];
      return `<div class="inv done st-${r.status}"><div class="row between"><span class="nm">${d.name}</span>${tag(st[0], st[1])}</div><div class="res">${esc(r.text)}</div></div>`;
    }
    const can = app.status === 'pending' && left >= d.days - 1e-9;
    return `<div class="inv"><div class="nm">${d.name}</div><div class="ds">${d.desc}</div><div class="row between"><span class="cost">${d.days ? fmtNum(d.days, 1) + '人日' : '外部委託'}${d.cost ? '・' + fmtYen(d.cost) : ''}</span>${app.status === 'pending' ? btn('調査する', 'invest', { id: app.id, k }, 'sm', { disabled: !can, 'data-tip': can ? '' : '審査部の人員に余裕がありません' }) : ''}</div></div>`;
  }).join('');
  return `<div class="inv-grid">${cards}</div>`;
}

function gradePanel(app, co) {
  const lv = G.sys.credit;
  const g = appSysGrade(app);
  let html = '';
  if (lv >= 1) {
    const sc = co ? bankScore(co) : null;
    html += `<div class="row" style="gap:16px;margin-bottom:8px"><div>${gradeBadge(g)} <span class="small">行内格付${co ? `（財務スコア ${fmtNum(sc, 0)}点）` : ''}</span></div><div class="small">想定デフォルト率 <b class="num">${fmtPct(GRADE_PD[g], 2)}</b>/年</div>${co && co.fraud && co.fraud.found ? `<div class="small">実態格付 ${gradeBadge(co.gTrue)}</div>` : ''}</div>`;
  } else html += '<p class="note">審査システムを導入すると、財務スコアと格付が自動で算出されます。</p>';
  if (co && lv >= 2) {
    const fl = fraudFlags(co);
    html += `<div class="flagbox" style="margin-bottom:8px"><b class="small">粉飾検知モジュール</b>${fl.length ? `<ul>${fl.map(f => `<li>${esc(f.t)}</li>`).join('')}</ul>` : '<div class="small muted">目立った異常値はありません</div>'}</div>`;
  }

  }
  html += `<div id="ringi-eval">${evalBlock(app)}</div>`;
  return html;
}

/* 採算と成約見込み（入力に合わせて更新） */
function fundCost() {
  const d = deposits();
  return d > 0 ? (B('depOrd') * G.rates.ord + sum(G.dep.coh, c => c.bal * c.rate)) / d : G.rates.ord;
}
function evalBlock(app) {
  const t = app.terms;
  const rate = appRate(app, t);
  const g = appSysGrade(app);
  let lgd;
  if (app.kind === 'biz') {
    const co = G.companies[app.coId];
    const col = t.collateral && co.ownsRE ? (co.reAppraised || reNow(co, co.reEst)) * (co.reLien ? 0.6 : 1) * 0.7 : 0;
    const cov = (t.guarantee === 'cgc' ? 0.8 : 0) * t.amount;
    lgd = clamp(1 - (col + cov) / Math.max(1, t.amount), 0.05, 1) * (t.guarantee === 'personal' ? 0.95 : 1);
  } else {
    const p = app.person;
    lgd = t.guarantee === 'company' ? 0.08 : clamp(1 - p.valueEst * 0.75 / Math.max(1, t.amount), 0.1, 1);
  }
  const pd = GRADE_PD[g] / 100;
  const fc = fundCost() / 100;
  const amt = t.amount;
  const inc = amt * rate / 100, fund = amt * fc, cost = amt * 0.0035, el = amt * pd * lgd;
  const prof = inc - fund - cost - el;
  const p = acceptProb(app, t, 'est');
  const pcls = p >= 0.6 ? 'ok' : p >= 0.35 ? 'warn' : 'bad';
  const mkt = app.kind === 'biz' ? marketLoanRate(G.companies[app.coId].gRep, t.termM) : (t.rateType === 'var' ? G.eco.mortVar : G.eco.mortFix);
  return `<div class="grid g2" style="gap:12px">
    <table class="t compact"><tbody>
      <tr><td>適用金利</td><td class="n"><b>${fmtRate(rate)}</b></td></tr>
      <tr><td>市場の目安金利</td><td class="n">${fmtRate(mkt)}</td></tr>
      <tr><td>年間の利息収入</td><td class="n">${fmtYen(inc)}</td></tr>
      <tr><td>資金調達コスト（${fmtRate(fc * 100)}）</td><td class="n">${MINUS}${fmtYen(fund)}</td></tr>
      <tr><td>経費（0.35%）</td><td class="n">${MINUS}${fmtYen(cost)}</td></tr>
      <tr><td>期待損失（PD ${fmtPct(pd * 100, 2)} × LGD ${fmtPct(lgd * 100, 0)}）</td><td class="n">${MINUS}${fmtYen(el)}</td></tr>
      <tr class="total"><td>想定採算（年）</td><td class="n ${prof < 0 ? 'neg' : ''}">${fmtYen(prof)}</td></tr>
    </tbody></table>
    <div><div class="small" style="margin-bottom:4px">成約見込み</div><div class="accept"><b class="num">${Math.round(p * 100)}%</b>${meter(p * 100, 100, pcls)}<span class="small muted">${pcls === 'ok' ? '受けてもらえそう' : pcls === 'warn' ? '五分五分' : '他行に流れそう'}</span></div>
    <p class="note">金利を上げるほど採算は良くなりますが、優良先ほど他行に流れます。業況の悪い先ほど高い金利でも受け入れる（逆選択）点に注意。</p>
    ${app.kind === 'mort' ? mortDTIBlock(app) : ''}</div></div>`;
}

function termsBiz(app) {
  const t = app.terms, co = G.companies[app.coId];
  const rateField = t.rateType === 'var'
    ? `<label class="field"><span>スプレッド（短プラ${fmtRate(G.rates.prime)}に加算）</span><span class="row"><input type="number" step="0.05" min="-1.5" max="10" value="${t.spread}" data-in="term" data-k="spread" style="width:100px"><span class="unit">%</span></span></label>`
    : `<label class="field"><span>固定金利</span><span class="row"><input type="number" step="0.05" min="0.1" max="15" value="${t.rate}" data-in="term" data-k="rate" style="width:100px"><span class="unit">%</span></span></label>`;
  return `<div class="terms">
    <label class="field"><span>融資額（申込 ${fmtYen(app.amountReq)}）</span><span class="row"><input type="number" step="100" min="100" max="${Math.round(app.amountReq / 1e4)}" value="${Math.round(t.amount / 1e4)}" data-in="term" data-k="amount" style="width:120px"><span class="unit">万円</span></span></label>
    <div class="field"><span>金利の種類</span><div class="seg">${[['var', '変動'], ['fixed', '固定']].map(([k, l]) => `<button type="button" data-act="termSet" data-k="rateType" data-v="${k}" aria-pressed="${t.rateType === k}">${l}</button>`).join('')}</div></div>
    ${rateField}
    <label class="field"><span>期間</span><span class="row"><input type="number" step="${t.repay === 'bullet' ? 1 : 12}" min="3" max="240" value="${t.termM}" data-in="term" data-k="termM" style="width:90px"><span class="unit">か月</span></span></label>
    <div class="field"><span>返済方法</span><div class="seg">${[['equal', '元金均等'], ['bullet', '期日一括']].map(([k, l]) => `<button type="button" data-act="termSet" data-k="repay" data-v="${k}" aria-pressed="${t.repay === k}">${l}</button>`).join('')}</div></div>
    <div class="field"><span>担保</span>${co.ownsRE ? `<label class="inline"><input type="checkbox" data-ch="termChk" data-k="collateral" ${t.collateral ? 'checked' : ''}> 不動産に抵当権を設定</label>` : '<span class="muted small">提供できる不動産なし</span>'}</div>
    <label class="field"><span>保証</span><select data-ch="termSel" data-k="guarantee">${[['none', 'なし'], ['personal', '代表者の個人保証'], ['cgc', '信用保証協会（80%保証）']].map(([k, l]) => `<option value="${k}"${t.guarantee === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
  </div>
  <p class="note">同一先への与信上限（大口信用供与規制）：${fmtYen(largeExposureLimit())}。信用保証協会の保証付き融資はリスクウェイトが10%に下がり、代位弁済で損失を抑えられますが、保証料の負担で先方は嫌がります。</p>`;
}

function decidedTerms(app) {
  const t = app.terms;
  if (app.status === 'expired') return '<p class="muted">回答期限を過ぎたため、申込は取り下げられました。</p>';
  if (app.status === 'rejected') return '<p class="muted">謝絶しました。</p>';
  const L = G.loans.find(x => x.appId === app.id);
  return `${kv([['融資額', fmtYen(t.amount)], ['適用金利', fmtRate(appRate(app, t))], ['期間', `${t.termM}か月`]])}${app.status === 'declined' ? '<p class="callout bad" style="margin-top:8px">先方は他行の条件を選びました。</p>' : ''}${L ? `<p style="margin-top:8px">${btn('融資先として見る', 'loanOpen', { id: L.id }, 'sm')}</p>` : ''}`;
}

function decideBar(app) {
  if (app.status !== 'pending') {
    const nxt = G.apps.find(a => a.status === 'pending' && a.id !== app.id);
    return `<div class="decide">${nxt ? btn('次の案件へ', 'pickApp', { id: nxt.id }, 'primary') : '<span class="muted small">審査待ちの案件はありません</span>'}</div>`;
  }
  return `<div class="decide"><span class="small muted" style="margin-right:auto">${app.exp <= G.m ? '回答期限：今月末' : '回答期限：来月末'}</span>${btn('謝絶する', 'decide', { id: app.id, v: 0 }, 'danger')}${btn('承認する', 'decide', { id: app.id, v: 1 }, 'primary')}</div>`;
}

/* 住宅ローン */
function mortDTIBlock(app) {
  const p = app.person, t = app.terms;
  const rate = appRate(app, t);
  const dti = mortDTI(p, t.amount, rate, t.termM / 12, false);
  const dtiS = mortDTI(p, t.amount, 3.5, t.termM / 12, false);
  const ltv = t.amount / p.valueEst;
  return `<table class="t compact" style="margin-top:8px"><tbody>
    <tr><td>返済負担率（適用金利）</td><td class="n ${dti > 0.35 ? 'neg' : ''}">${fmtPct(dti * 100, 1)}</td></tr>
    <tr><td>返済負担率（審査金利3.5%）</td><td class="n ${dtiS > 0.35 ? 'neg' : ''}">${fmtPct(dtiS * 100, 1)}</td></tr>
    <tr><td>担保掛目（融資額÷評価額）</td><td class="n ${ltv > 1 ? 'neg' : ''}">${fmtPct(ltv * 100, 0)}</td></tr>
    <tr><td>完済時の年齢</td><td class="n ${p.age + t.termM / 12 > 80 ? 'neg' : ''}">${Math.round(p.age + t.termM / 12)}歳</td></tr></tbody></table>
    <p class="note">一般的な目安：審査金利での返済負担率35%以内、完済時80歳未満。</p>`;
}
function ringiMort(app) {
  const p = app.person;
  const t = app.terms;
  const outline = kv([
    ['申込者', `${esc(p.name)}（${p.age}歳・${p.fam}）`], ['職業・勤務先', `${OCC[p.occ].name}／${esc(p.employer)}（勤続${p.yearsEmp}年）`],

Object.assign(ACTIONS, {

  appBack: () => { UI.appOpen = false; render(); },

  appFilter: d => { UI.appFilter = d.v; UI.appId = null; render(); },

    const app = G.apps.find(a => a.id === d.id);
    const r = runInvestigation(app, d.k);
    if (!r.ok) toast(r.msg, 'bad');
    else if (r.res.found) toast('重大な問題が見つかりました', 'bad');
    if (r.ok && r.res.found && app.kind === 'biz') UI.appShowTrue = true;
    render();
  },
  termSet: d => {
    const app = G.apps.find(a => a.id === UI.appId);
    if (!app) return;

    if (d.k === 'rateType' && app.kind === 'biz') {
      const r = suggestedRate(app, app.terms.termM);
      if (d.v === 'fixed') app.terms.rate = r; else app.terms.spread = +(r - G.rates.prime).toFixed(2);
    }
    render();
  },
  decide: d => {
    const app = G.apps.find(a => a.id === d.id);
    if (!app) return;
    const res = decideApp(app, d.v === '1', Object.assign({}, app.terms));
    if (!res.ok) { toast(res.msg, 'bad'); return; }
    UI.stampAnim = true;
    if (res.rejected) toast('謝絶しました');
    else if (res.accepted) toast(`融資を実行しました：${fmtYen(app.terms.amount)}`);
    else toast(res.msg, 'bad');
    render();
  },
});
Object.assign(INPUTS, {
  term: el => {

    if (!app) return;

});

function loanKindLabel(L) { return { biz: '事業性', mort: '住宅ローン', proj: 'プロジェクト', pool: '住宅ローン（承継）' }[L.kind]; }
function loanStatusTag(L) {
  const m = { current: ['正常返済', ''], late: [`延滞${L.dpd}か月`, 'warn'], default: [`延滞${L.dpd}か月`, 'bad'], bankrupt: ['破綻・回収中', 'bad'] }[L.status] || ['完了', ''];
  return tag(m[0], m[1]) + (L.restructured ? tag('条件変更', 'warn') : '') + (L.fraudKnown ? tag('粉飾判明', 'bad') : '');
}
function pfLoans() {
  const act = G.loans.filter(isActiveLoan);
  switch (UI.pfFilter) {
    case 'biz': return act.filter(L => L.kind === 'biz' || L.kind === 'proj');
    case 'mort': return act.filter(L => L.kind === 'mort' || L.kind === 'pool');
    case 'watch': return act.filter(L => L.cls >= 1 || L.status !== 'current' || sysClass(L) > L.cls);
    case 'gap': return act.filter(L => sysClass(L) > L.cls);
    default: return act;
  }
}

/* ---------- 審査基準による一括処理 ---------- */
function standardTerms(app) {
  const t = defaultTerms(app);
  if (app.kind === 'biz') {
    const g = appSysGrade(app);
    const co = G.companies[app.coId];
    t.collateral = !!co.ownsRE;
    if (g >= 6 && t.amount <= 2.8e8 && latestRep(co).S <= 300e8) t.guarantee = 'cgc';
    const lim = largeExposureLimit() - exposureOf(co.id);
    if (t.amount > lim) t.amount = Math.max(0, Math.floor(lim / 1e6) * 1e6);
  }
  return t;
}
UI.bulk = { kind: 'mort', ok: 4, ng: 8, deficit: true };
function bulkJudge(a) {
  const b = UI.bulk;
  if (a.kind === 'biz') {
    const co = G.companies[a.coId];
    if (co.fraud && co.fraud.found) return 'ng';
    if (b.deficit && (a.purpose === 'deficit' || a.purposeRevealed)) return 'ng';
  } else if (a.person.fraud && a.person.fraud.found) return 'ng';
  const g = appSysGrade(a);
  if (g <= b.ok) return 'ok';
  if (g >= b.ng) return 'ng';
  return 'hold';
}
MODALS.bulk = () => {
  const b = UI.bulk;
  const pend = G.apps.filter(a => a.status === 'pending' && (b.kind === 'all' || a.kind === b.kind));
  const cnt = { ok: 0, ng: 0, hold: 0 };
  for (const a of pend) cnt[bulkJudge(a)]++;
  const opt = (sel, from, to) => Array.from({ length: to - from + 1 }, (_, i) => from + i).map(g => `<option value="${g}"${g === sel ? ' selected' : ''}>格付${g}</option>`).join('');
  const body = `<p class="small" style="margin-top:0">審査基準（決裁権限の委譲）を決めて、審査待ちの申込をまとめて処理します。承認する案件は標準条件（市場の目安金利、不動産があれば担保を徴求、格付6以下は信用保証協会付き）で回答します。</p>
    <div class="field" style="margin-bottom:10px"><span>対象</span><div class="seg">${[['mort', '住宅ローン'], ['biz', '事業性'], ['all', 'すべて']].map(([k, l]) => `<button type="button" data-act="bulkSet" data-k="kind" data-v="${k}" aria-pressed="${b.kind === k}">${l}</button>`).join('')}</div></div>
    <div class="row" style="gap:16px;align-items:end"><label class="field"><span>承認する：行内格付が</span><select data-ch="bulkSel" data-k="ok">${opt(b.ok, 1, 9)}</select></label><span class="small" style="padding-bottom:6px">以内</span>
    <label class="field"><span>謝絶する：行内格付が</span><select data-ch="bulkSel" data-k="ng">${opt(b.ng, 2, 10)}</select></label><span class="small" style="padding-bottom:6px">以下</span></div>
    <label class="inline small" style="margin-top:10px"><input type="checkbox" data-ch="bulkChk" data-k="deficit" ${b.deficit ? 'checked' : ''}> 赤字補填が目的の申込は謝絶する（粉飾が判明した申込は常に謝絶）</label>
    <table class="t compact" style="margin-top:12px;max-width:360px"><tbody><tr><td>承認して回答</td><td class="n">${cnt.ok}件</td></tr><tr><td>謝絶</td><td class="n">${cnt.ng}件</td></tr><tr><td>保留（個別に審査）</td><td class="n">${cnt.hold}件</td></tr></tbody></table>
    <p class="callout" style="margin-top:12px">調査をせずに処理すると、粉飾は見抜けません。行内格付は提出された決算書から算出しています。</p>`;
  return modalFrame('審査基準で一括処理', body, btn('戻る', 'closeModal') + btn('実行する', 'bulkRun', {}, 'primary', { disabled: !(cnt.ok + cnt.ng) }), { size: 'narrow' });
};
Object.assign(ACTIONS, {
  bulkOpen: () => showModal('bulk'),
  bulkSet: d => { UI.bulk[d.k] = d.v; drawModal(); },
  bulkRun: () => {
    const b = UI.bulk;
    const pend = G.apps.filter(a => a.status === 'pending' && (b.kind === 'all' || a.kind === b.kind));
    let acc = 0, dec = 0, rej = 0, skip = 0, amt = 0;
    for (const a of pend) {
      const j = bulkJudge(a);
      if (j === 'ng') { decideApp(a, false); rej++; }
      else if (j === 'ok') {
        const t = standardTerms(a);
        if (t.amount < 1e6 || validateTerms(a, t)) { skip++; continue; }
        const r = decideApp(a, true, t);
        if (r.ok && r.accepted) { acc++; amt += t.amount; } else if (r.ok) dec++; else skip++;
      }
    }
    toast(`成約${acc}件（${fmtYen(amt)}）・先方辞退${dec}件・謝絶${rej}件${skip ? `・処理できず${skip}件` : ''}`);
    UI.appId = null;
    closeModal(true);
  },
});

  const depChart = hs.length >= 2 ? lineChart({ labels: hs.map(h => ymShort(h.m)), height: 190, series: [{ name: '普通預金', color: 's2', values: hs.map(h => h.bs.depOrd) }, { name: '定期預金', color: 's3', values: hs.map(h => h.bs.depTime) }] }) : '<div class="empty">月末を締めると表示されます</div>';
  const rateChart = hs.length >= 2 ? lineChart({ labels: hs.map(h => ymShort(h.m)), height: 190, yFmt: axisPct(2), tipFmt: v => fmtRate(v), series: [{ name: '政策金利', color: 's1', values: hs.map(h => h.kpi.policy) }, { name: '定期預金', color: 's3', values: hs.map(h => h.kpi.time) }, { name: '短プラ', color: 's2', values: hs.map(h => h.kpi.prime) }] }) : '';
  const ladder = G.dep.coh.map((c, i) => ({ i, bal: c.bal, rate: c.rate })).sort((a, b) => ((a.i - G.m % 12 + 12) % 12) - ((b.i - G.m % 12 + 12) % 12));
  const ladderChart = barChart({ labels: ladder.map(c => `${calMonth(G.m + ((c.i - G.m % 12 + 12) % 12))}月`), values: ladder.map(c => c.bal), name: '満期を迎える定期預金', color: 's3', height: 170 });
  const nii = niiSensitivity(), ir = irrbb(), cap = Math.max(1, coreCapital());
  const alm = `<table class="t compact"><tbody>
    <tr><td>金利が1%上がった時の資金利益の変化（1年）</td><td class="n ${nii < 0 ? 'neg' : ''}">${fmtYen(nii, { sign: true })}</td></tr>
    <tr><td>金利リスク量（+1%で失う経済価値）</td><td class="n">${fmtYen(ir)}</td></tr>
    <tr><td>同・コア資本に対する比率（基準20%）</td><td class="n ${ir / cap > 0.2 ? 'neg' : ''}">${fmtPct(ir / cap * 100, 1)}</td></tr>
    <tr><td>保有国債の含み損益</td><td class="n ${unrealizedGain() < 0 ? 'neg' : ''}">${fmtYen(unrealizedGain(), { sign: true })}</td></tr></tbody></table>
    <p class="note">変動金利の貸出が多いほど、金利上昇で資金利益は増えます。長期の固定金利資産（国債・固定ローン）が多いほど、金利上昇で経済価値が減ります。</p>`;
  return `<h1 class="h1">金利・預金（ALM）</h1>
  <p class="lead">預金金利と貸出の基準金利を決めます。市場より高い預金金利は預金を集めますが利鞘を削り、低すぎれば満期の定期預金が流出します。</p>
  <div class="grid g-side"><div class="stack">${panel('当行の金利', settings)}${panel('預金の見通し', outlook, { flush: true })}<div class="grid g2">${panel('預金残高の推移', depChart)}${panel('金利の推移', rateChart || '<div class="empty">―</div>')}</div>${panel('定期預金の満期の構成（今後12か月）', ladderChart)}</div>
  <div class="stack">${panel('市場の金利', mkt, { flush: true })}${panel('金利リスク', alm)}</div></div>`;
};
Object.assign(CHANGES, {
  rateLink: el => { G.rates[el.dataset.k] = el.checked; applyRateLinks(); render(); },
  rateNum: el => {
    const v = parseFloat(el.value);
    if (!isFinite(v)) return;
    const k = el.dataset.k;
    const lim = { ord: [0.001, 5], time: [0.002, 6], prime: [0.1, 8], ordSpread: [-1, 2], timeSpread: [-1, 3], primeMargin: [0, 5], mortDisc: [0, 2.5], mortFixSpread: [0, 3] }[k] || [-5, 10];
    G.rates[k] = Math.round(clamp(v, lim[0], lim[1]) * 1000) / 1000;
    applyRateLinks();
    for (const L of G.loans) if (isActiveLoan(L)) L.rate = currentRate(L);
    render();
  },
});

    ${nx ? `<hr class="sep"><div class="row between"><div><b>${nx.name}</b>へ拡張<div class="small muted">収容能力 ${fmtYen(nx.cap)}・工事${nx.months}か月・維持費 月${fmtYen(nx.maint)}</div></div>${btn(`拡張する（${fmtYen(nx.cost)}）`, 'vaultUp', {}, 'primary', { disabled: !!v.upgrade })}</div>` : '<p class="note">最大の金庫です。</p>'}`;

      <td style="min-width:110px">${b.type === 'hq' ? '' : meter(branchMaturity(b), 1, 'ok')}</td><td class="n">${b.type === 'hq' ? '自己所有' : fmtYen(DIST[b.d].rent * T.rentMul)}</td><td class="n">${b.type === 'hq' ? '' : btn('閉鎖', 'closeBranchAsk', { id: b.id }, 'sm danger')}</td></tr>`;

/* ---------- システム ---------- */
SCREENS.system = () => {
  const load = coreLoad();
  const cards = SYS_KEYS.map(k => {
    const S = SYSTEMS[k], lv = G.sys[k];
    const cur = S.levels[lv], nx = S.levels[lv + 1];
    const proj = G.itProjects.find(p => p.sys === k);
    let foot;
    if (proj) foot = `<div class="small">「${S.levels[proj.to].name}」へ移行中</div>${meter(G.m - proj.startM, proj.doneM - proj.startM, 'ok')}<div class="note">${ymLabel(proj.doneM)}稼働予定${proj.method === 'phased' ? '（段階移行）' : proj.method === 'bigbang' ? '（一括移行）' : ''}</div>`;
    else if (nx) {
      foot = `<div class="small">次の段階：<b>${nx.name}</b></div><div class="note">投資 ${fmtYen(nx.cost)}（5年償却）・${nx.months}か月・運用費 月${fmtYen(nx.maint)}</div>`;
      foot += k === 'core' ? `<div class="row" style="margin-top:6px">${btn('一括移行で更改', 'sysUp', { k, m: 'bigbang' }, 'sm')}${btn('段階移行で更改', 'sysUp', { k, m: 'phased' }, 'sm primary')}</div><p class="note">一括移行は安いが約18%の確率で大規模障害。段階移行は費用1.35倍・期間1.5倍で障害リスク約4%。</p>`
        : `<div style="margin-top:6px">${btn('導入する', 'sysUp', { k }, 'sm primary')}</div>`;
    } else foot = '<div class="note">最新の段階です。</div>';
    const extra = k === 'core' ? `<div class="small" style="margin:6px 0 2px">処理能力の使用率 ${fmtPct(load * 100, 0)}（口座等 ${fmtNum(accountsCount())}／能力 ${fmtNum(coreCapacity())}）</div>${meter(load, 1)}`
      : k === 'aml' ? `<div class="small" style="margin-top:6px">金融庁が求める水準：Lv${amlRequired()}　${lv >= amlRequired() ? tag('充足', 'ok') : tag('不足', 'bad')}</div>`
      : k === 'cyber' ? `<div class="small" style="margin-top:6px">${G.sys.digital >= 2 && lv < G.sys.digital - 1 ? tag('デジタル化に対して手薄', 'bad') : tag('概ね適切', 'ok')}</div>` : '';
    return `<section class="panel"><div class="ph"><h2>${S.name}</h2><span class="aside">Lv${lv}</span></div><div class="pb"><div style="font-weight:700">${cur.name}</div><p class="small muted" style="margin:4px 0">${S.desc}</p>${extra}<hr class="sep">${foot}</div></section>`;
  }).join('');
  const maint = sum(SYS_KEYS, k => SYSTEMS[k].levels[G.sys[k]].maint || 0);
  return `<h1 class="h1">システム</h1>
  <p class="lead">銀行の業容はシステムの処理能力に縛られます。審査システムは粉飾の発見を助け、デジタル化は預金を集めますが、セキュリティとマネロン対策が追いつかないと事故と行政処分を招きます。システムの運用費は月${fmtYen(maint)}。</p>
  <div class="grid g3">${cards}</div>`;
};
Object.assign(ACTIONS, {
  sysUp: d => {
    const S = SYSTEMS[d.k], nx = S.levels[G.sys[d.k] + 1];
    const cost = nx.cost * (d.m === 'phased' ? 1.35 : 1);
    confirmBox(`${S.name}の更改`, `「${nx.name}」を導入します。投資額${fmtYen(cost)}はソフトウェアとして5年で償却し、自己資本からも控除されます。`, '発注する', 'sysUpGo', { k: d.k, m: d.m || 'std' });
  },
  sysUpGo: d => { const r = startSystemUpgrade(d.k, d.m); toast(r.ok ? 'プロジェクトを開始しました' : r.msg, r.ok ? '' : 'bad'); closeModal(true); },
});

function fsTable(cols, rowsList) {
  const head = `<thead><tr><th>（単位：百万円）</th>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>`;
  const body = rowsList[0].map((r, i) => {
    if (r[1] === null) return `<tr class="head"><td colspan="${cols.length + 1}">${r[0]}</td></tr>`;
    return `<tr class="${r[2] || ''}"><td>${r[0]}</td>${rowsList.map(rows => { const v = rows[i][1]; return `<td class="${v < 0 ? 'neg' : ''}">${fmtM(v)}</td>`; }).join('')}</tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="fs">${head}<tbody>${body}</tbody></table></div>`;
}

      const sel = `<label class="field" style="max-width:280px"><span>表示する月</span><select data-ch="jMonth">${js.map(x => `<option value="${x.m}"${String(x.m) === String(UI.jMonth) ? ' selected' : ''}>${x.m === 'cur' ? `当月（${ymLabel(G.m)}・締め前）` : x.m < 0 ? '開業時' : ymLabel(x.m)}</option>`).join('')}</select></label>`;
      const jt = j && j.entries.length ? `<div class="tbl-wrap"><table class="t compact"><thead><tr><th>摘要</th><th class="n">件数</th><th>借方</th><th class="n">金額</th><th>貸方</th><th class="n">金額</th></tr></thead><tbody>${j.entries.map(en => {
        const dr = en.lines.filter(l => l[1] > 0), cr = en.lines.filter(l => l[2] > 0);
        const n = Math.max(dr.length, cr.length);
        let h = '';
        for (let i = 0; i < n; i++) h += `<tr>${i === 0 ? `<td rowspan="${n}">${esc(en.desc)}</td><td class="n" rowspan="${n}">${en.n}</td>` : ''}<td>${dr[i] ? ACCT[dr[i][0]].name : ''}</td><td class="n">${dr[i] ? fmtNum(dr[i][1]) : ''}</td><td>${cr[i] ? ACCT[cr[i][0]].name : ''}</td><td class="n">${cr[i] ? fmtNum(cr[i][2]) : ''}</td></tr>`;
        return h;
      }).join('')}</tbody></table></div>` : '<div class="empty">仕訳はまだありません</div>';
      let dT = 0, cT = 0;
      const tb = ACCT_KEYS.map(k => {
        const v = B(k);
        if (!v) return '';
        const debitSide = isDebitNature(k) ? v >= 0 : v < 0;
        const amt = Math.abs(v);
        if (debitSide) dT += amt; else cT += amt;
        return `<tr><td class="num">${ACCT[k].code}</td><td>${ACCT[k].name}</td><td class="n">${debitSide ? fmtNum(amt) : ''}</td><td class="n">${debitSide ? '' : fmtNum(amt)}</td></tr>`;
      }).join('');
      body = `<div class="grid g2"><div>${sel}<div style="margin-top:10px">${jt}</div><p class="note">同じ種類の取引は月ごとに集計して表示しています（件数欄）。</p></div>
        <div><h3 style="font-size:14px;margin:0 0 6px">合計残高試算表（現在）</h3><table class="t compact"><thead><tr><th>コード</th><th>勘定科目</th><th class="n">借方残高</th><th class="n">貸方残高</th></tr></thead><tbody>${tb}<tr class="grand"><td></td><td>合計</td><td class="n">${fmtNum(dT)}</td><td class="n">${fmtNum(cT)}</td></tr></tbody></table>
        <p class="small" style="margin-top:6px">${Math.abs(dT - cT) <= 1 ? tag('借方合計と貸方合計が一致', 'ok') : tag('不一致', 'bad')}</p></div></div>`;
      break;
    }
  }
  return `<h1 class="h1">決算・財務</h1>
  <p class="lead">${G.bankName}の財務諸表です。決算は毎年3月末。監査法人の監査を経て、税金を計上し、配当を決めます。</p>
  <div class="subtabs">${tabs.map(([k, l]) => `<button type="button" data-act="finTab" data-v="${k}" aria-pressed="${UI.finTab === k}">${l}</button>`).join('')}</div>
  <div class="panel"><div class="pb">${body}</div></div>`;
};

/* ---------- 監査・検査 ---------- */
SCREENS.audit = () => {
  const lv = G.sys.audit;
  const used = G.capUsed.audit, slots = auditSlots();
  const rows = openBranches().map(b => {
    const arr = G.branchReports[b.id] || [];
    const last = arr[arr.length - 1];
    if (!last) return `<tr><td>${esc(b.name)}</td><td colspan="7" class="muted">報告はまだありません</td></tr>`;
    const an = lv >= 1 ? branchAnomalies(b.id) : [];
    const risk = lv >= 2 ? fraudRiskScore(b.id) : null;
    const sp = k => sparkline(arr.map(x => x[k]), { w: 70, h: 20 });
    return `<tr><td><b>${esc(b.name)}</b><div class="small muted">${b.lastAudit !== undefined ? `前回の臨時監査 ${ymShort(b.lastAudit)}` : '臨時監査の実績なし'}</div></td>
      <td class="n">${fmtYen(last.exp)}<div>${sp('exp')}</div></td><td class="n">${fmtYen(last.suspense)}<div>${sp('suspense')}</div></td>
      <td class="n">${last.cashDiff}件<div>${sp('cashDiff')}</div></td><td class="n">${last.complaints}件<div>${sp('complaints')}</div></td><td class="n">${last.errors}件</td>
      <td>${an.length ? an.map(a => tag(a + 'に異常値', 'warn')).join(' ') : lv >= 1 ? '<span class="small muted">異常なし</span>' : '<span class="small muted">―</span>'}${risk !== null ? `<div class="small">不正リスク <b class="${risk >= 50 ? 'neg' : ''}">${risk}</b></div>` : ''}</td>
      <td class="n">${btn('臨時監査', 'audit', { id: b.id }, 'sm', { disabled: used >= slots })}</td></tr>`;
  }).join('');
  const cases = G.ifraud.filter(f => f.detected && !f.lost).slice().reverse().map(f => `<tr><td>${ymShort(f.detM)}</td><td>${esc(G.branches.find(b => b.id === f.bid)?.name || '（閉鎖店）')}</td><td>${f.type === 'embezzle' ? '顧客預金の着服' : '架空経費の計上'}</td><td class="n">${G.m - f.startM >= 0 ? (f.detM - f.startM) + 'か月' : ''}</td><td class="n">${fmtYen(f.cum)}</td><td>${{ special: '臨時監査', internal: '内部監査', external: '顧客の訴え・報道', fsa: '金融庁検査', auditor: '監査法人' }[f.how]}</td></tr>`).join('');
  const fsaRows = G.fsa.history.slice().reverse().map(h => `<tr><td>${ymLabel(h.m)}</td><td>${tag(h.text, h.grade <= 'B' ? 'ok' : 'bad')}</td><td class="small">${h.findings.length ? h.findings.map(f => esc(f.text)).join('<br>') : '指摘なし'}</td></tr>`).join('');
  const posture = `<table class="t compact"><tbody>
    <tr><td>管理・監査の人員</td><td class="n">${G.staff.comp}人（必要 ${fmtNum(compRequired(), 1)}人）</td><td>${compRatio() >= 1 ? tag('充足', 'ok') : tag('不足', 'bad')}</td></tr>
    <tr><td>内部監査支援システム</td><td class="n">Lv${lv}</td><td>${lv ? tag(SYSTEMS.audit.levels[lv].name, 'ok') : tag('紙ベース')}</td></tr>
    <tr><td>マネロン対策</td><td class="n">Lv${G.sys.aml}（求められる水準 Lv${amlRequired()}）</td><td>${G.sys.aml >= amlRequired() ? tag('充足', 'ok') : tag('不足', 'bad')}</td></tr>
    <tr><td>自己査定の区分ずれ（システム判定より甘い先）</td><td class="n">${G.loans.filter(L => isActiveLoan(L) && sysClass(L) > L.cls).length}件</td><td></td></tr>
    <tr><td>未検証の決算書</td><td class="n">${G.inbox.filter(x => x.type === 'review').length}先</td><td></td></tr>
    <tr><td>前回の金融庁検査</td><td class="n">${G.fsa.history.length ? ymLabel(G.fsa.history[G.fsa.history.length - 1].m) : 'まだ受けていない'}</td><td></td></tr></tbody></table>
    <p class="note">金融庁検査は概ね2〜3年ごと。予告は1か月前に届きます。重大な不祥事やシステム障害があると前倒しされます。</p>`;
  const audits = G.annual.slice().reverse().map(a => `<tr><td>${fyLabel(a.fy)}</td><td>${tag(a.audit.opinion, a.audit.opinion.includes('強調') ? 'warn' : 'ok')}</td><td class="small">${a.audit.notes.length ? a.audit.notes.map(esc).join('<br>') : '修正事項なし'}</td></tr>`).join('');
  return `<h1 class="h1">監査・検査</h1>
  <p class="lead">支店から毎月上がる報告に、行員の不正の兆候が紛れていることがあります。苦情や現金過不足の増加、仮払金や経費の不自然な膨張に注意し、怪しい店には臨時監査を入れましょう。</p>
  <div class="stack">${panel('支店の月次報告', `<div class="tbl-wrap"><table class="t"><thead><tr><th>店舗</th><th class="n">経費</th><th class="n">仮払金残高</th><th class="n">現金過不足</th><th class="n">顧客の苦情</th><th class="n">事務ミス</th><th>監査システムの所見</th><th class="n">臨時監査（今月 ${slots - used}/${slots}）</th></tr></thead><tbody>${rows}</tbody></table></div>`, { flush: true, aside: '直近の月と過去12か月の推移' })}
  <div class="grid g2">${panel('内部管理態勢', posture)}${panel('発覚した不正', cases ? `<table class="t compact"><thead><tr><th>発覚</th><th>店舗</th><th>内容</th><th class="n">期間</th><th class="n">被害額</th><th>発覚の経緯</th></tr></thead><tbody>${cases}</tbody></table>` : '<div class="empty">これまでに発覚した不正はありません</div>', { flush: !!cases })}</div>
  <div class="grid g2">${panel('金融庁検査の履歴', fsaRows ? `<table class="t compact"><thead><tr><th>実施</th><th>結果</th><th>指摘事項</th></tr></thead><tbody>${fsaRows}</tbody></table>` : '<div class="empty">まだ検査を受けていません</div>', { flush: !!fsaRows })}
  ${panel('監査法人の監査', audits ? `<table class="t compact"><thead><tr><th>決算期</th><th>監査意見</th><th>指摘</th></tr></thead><tbody>${audits}</tbody></table>` : '<div class="empty">最初の決算は3月末です</div>', { flush: !!audits })}</div></div>`;
};
Object.assign(ACTIONS, {

    const r = specialAudit(d.id);
    if (!r.ok) toast(r.msg, 'bad');
    else if (r.found) toast(`不正を発見しました：被害額${fmtYen(r.f.cum)}`, 'bad');

});

    ${small('完全失業率', [{ name: '失業率', color: 's2', values: hs.map(h => h.kpi.unemp) }], v => fmtNum(v, 1) + '%')}
    ${small('政策金利と10年国債', [{ name: '政策金利', color: 's1', values: hs.map(h => h.kpi.policy) }, { name: '10年国債', color: 's2', values: hs.map(h => h.kpi.y10) }], v => fmtNum(v, 2) + '%')}
    ${small('全国の地価指数', [{ name: '地価指数', color: 's3', values: hs.map(h => h.kpi.landN) }], v => fmtNum(v, 0))}
    ${small('株価指数', [{ name: '株価指数', color: 's2', values: hs.map(h => h.kpi.stockN) }], v => fmtNum(v, 0))}</div>`;

  <div class="stack">${charts}
  <div class="grid g-side">${panel('ニュース', `<div class="subtabs" style="padding:0 6px">${NEWS_CATS.map(([k, l]) => `<button type="button" data-act="newsCat" data-v="${k}" aria-pressed="${UI.newsCat === k}">${l}</button>`).join('')}</div><ul class="newslist">${list.map(n => `<li class="${n.tone}"><span class="when">${ymShort(n.m)}</span><span class="what">${esc(n.text)}</span></li>`).join('') || '<li><span></span><span class="muted">該当するニュースはありません</span></li>'}</ul>`, { flush: true })}

MODALS.annual = a => {
  const rep = G.annual.find(x => x.fy === a.fy);
  if (!rep) return modalFrame('決算', '<p>データがありません</p>', btn('閉じる', 'closeModal'));
  const body = `<div class="grid g2"><div><h3 style="font-size:14px;margin:0 0 6px">貸借対照表（期末）</h3>${fsTable([fyLabel(rep.fy)], [bankBSRows(rep.bs)])}</div><div><h3 style="font-size:14px;margin:0 0 6px">損益計算書</h3>${fsTable([fyLabel(rep.fy)], [bankPLRows(rep.plRaw)])}</div></div>`;
  return modalFrame(`${fyLabel(rep.fy)}の決算書`, body, btn('閉じる', 'closeModal', {}, 'primary'), { size: 'wide', sub: fyYearLabel(rep.fy) });
};

MODALS.fsa = a => {
  const h = G.fsa.history[a.idx];
  const body = `<p style="font-size:18px;margin:0 0 10px;font-family:var(--f-doc)">検査結果：<b class="${h.grade <= 'B' ? '' : 'neg'}">${h.text}</b></p>
    ${h.findings.length ? `<table class="t"><thead><tr><th>指摘事項</th><th>重要度</th></tr></thead><tbody>${h.findings.map(f => `<tr><td>${esc(f.text)}</td><td>${tag(['', '軽微', '重要', '重大'][f.sev], f.sev >= 3 ? 'bad' : f.sev === 2 ? 'warn' : '')}</td></tr>`).join('')}</tbody></table>` : '<p>指摘事項はありませんでした。日頃の管理態勢が評価されました。</p>'}
    ${h.addProv > 0 ? `<p class="callout bad" style="margin-top:10px">債務者区分の修正により、貸倒引当金を${fmtYen(h.addProv)}積み増しました。</p>` : ''}

  return modalFrame('金融庁検査の結果', body, btn('閉じる', 'closeModal', {}, 'primary'));
};

Object.assign(ACTIONS, {

    const ceo = ($('#stCeo')?.value || '').trim() || '汐見 太郎';

    if (!/銀行$/.test(bank)) bank += '銀行';
    newGame({ ceoName: ceo, bankName: bank, difficulty: UI.start.diff });
    UI.tab = 'dash'; UI.appId = null;
    render();
    autosave();
    showModal('intro');
  },
});

/* ---- 15_main.js ---- */
/* =========================================================
 *  15_main.js : 起動
 * ========================================================= */
(function boot() {
  try { const s = JSON.parse(lsGet(LS.settings) || 'null'); if (s) Object.assign(UI.settings, s); } catch (e) { /* 既定値のまま */ }
  applyTheme(lsGet(LS.theme) || 'auto');
  bindEvents();
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json'; inp.id = 'importFile'; inp.hidden = true;
  inp.setAttribute('data-ch', 'importFile');
  document.body.appendChild(inp);
  render();
  window.Toudori = { get G() { return G; }, render, advance: runAdvance, check: () => integrityCheck() };
})();

})();
</script>
