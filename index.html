/* ---------- 行員の不正（着服・架空経費） ---------- */
function branchSize(b) { return { hq: 1.4, full: 1.0, small: 0.55 }[b.type]; }

function processInternalFraudMonthly() {
  const auditLv = G.sys.audit;
  const cr = compRatio();
  for (const b of openBranches()) {
    if (G.ifraud.some(f => f.bid === b.id && !f.detected)) continue;
    const p = 0.0016 * branchSize(b) * (G.salaryLv < 1 ? 1.5 : 1) * [1, 0.7, 0.45][auditLv] * clamp(1.5 - cr, 0.5, 1.5);
    if (chance(p)) {
      const type = chance(0.55) ? 'embezzle' : 'expense';
      G.ifraud.push({ id: 'X' + (++G.seq.if), bid: b.id, type, startM: G.m, monthly: type === 'embezzle' ? uni(50e4, 250e4) : uni(30e4, 120e4), cum: 0, detected: false, who: personName() });
    }
  }
  for (const f of G.ifraud) {
    if (f.detected) continue;
    const b = G.branches.find(x => x.id === f.bid);
    if (!b) { f.detected = true; f.lost = true; continue; }
    const amt = Math.round(f.monthly * Math.pow(1.06, G.m - f.startM));
    f.cum += amt;
    if (f.type === 'embezzle') post('普通預金の払出（窓口）', [['depOrd', amt, 0], ['cash', 0, Math.min(amt, B('cash'))], ['boj', 0, Math.max(0, amt - B('cash'))]]);
    else payExpense(amt, 'premises', '支店経費（雑費）');
    const age = G.m - f.startM;
    // 内部監査による発見
    if (chance(0.02 + 0.05 * auditLv + 0.03 * Math.min(1, cr))) { detectInternalFraud(f, 'internal'); continue; }
    // 外部からの発覚（顧客の訴え・報道）
    if (age > 12 && chance(0.03 * (age - 12) / 6)) detectInternalFraud(f, 'external');
  }
}

function detectInternalFraud(f, how) {
  f.detected = true; f.detM = G.m; f.how = how;
  const b = G.branches.find(x => x.id === f.bid);
  const name = b ? b.name : '支店';
  const big = how === 'external';
  if (f.type === 'embezzle') post('行員の着服に伴う顧客への補償', [['extraLoss', f.cum, 0], ['depOrd', 0, f.cum]]);
  const recov = Math.round(f.cum * uni(0.1, 0.35));
  G.pendingRecoveries.push({ m: G.m + 6, amt: recov, desc: '不正行員からの損害賠償の回収' });
  const what = f.type === 'embezzle' ? '顧客預金の着服' : '架空経費の計上';
  const hit = big ? clamp(6 + f.cum / 1e8 * 3, 6, 25) : clamp(2 + f.cum / 1e8, 2, 8);
  G.trust = clamp(G.trust - hit, 0, 100);
  G.scandalHeat += big ? 10 : 4;
  G.stats.scandals++;
  const via = how === 'special' ? '臨時監査で' : how === 'internal' ? '内部監査で' : how === 'fsa' ? '金融庁検査で' : how === 'auditor' ? '監査法人の監査で' : '顧客からの訴えで';
  addNews('bank', `${name}の行員による${what}が${via}発覚。被害額${fmtYen(f.cum)}（${G.m - f.startM}か月間）`, 'bad');
  if (big && f.cum > 1e8) { G.fsa.special = true; }
}

function specialAudit(bid) {
  if (G.capUsed.audit >= auditSlots()) return { ok: false, msg: `今月の臨時監査の枠（${auditSlots()}件）を使い切りました。管理・監査の人員を増やしてください` };
  const b = G.branches.find(x => x.id === bid);
  if (!b) return { ok: false, msg: '店舗が見つかりません' };
  G.capUsed.audit++;
  payExpense(300e4, 'premises', '臨時監査費用');
  b.lastAudit = G.m;
  const f = G.ifraud.find(x => x.bid === bid && !x.detected);
  if (f && chance(0.9)) { detectInternalFraud(f, 'special'); G.stats.auditHits++; return { ok: true, found: true, f }; }
  return { ok: true, found: false };
}

/* ---------- 支店の月次報告 ---------- */
function makeBranchReports() {
  const tg = depositTargets();
  const pres = districtPresence();
  const svc = serviceQuality();
  const tot = sum(Object.values(tg.byD), x => x.ord + x.time) || 1;
  const dep = cityDeposits() - tg.nat;
  for (const b of openBranches()) {
    const T = BRANCH_TYPES[b.type];
    const sz = branchSize(b);
    const w = T.presence * branchMaturity(b) / Math.max(0.01, pres[b.d]);
    const d = tg.byD[b.d];
    const depB = dep * (d.ord + d.time) / tot * w;
    const loans = sum(G.loans.filter(L => L.district === b.d && isActiveLoan(L) && L.kind !== 'pool'), L => L.bal) * w;
    const staffCost = (T.ops + T.sales + 2) * BASE_SALARY * G.salaryLv / 12;
    const fr = G.ifraud.find(f => f.bid === b.id && !f.detected);
    const age = fr ? G.m - fr.startM : 0;
    const rep = {
      m: G.m,
      dep: depB, loans,
      exp: (b.type === 'hq' ? 0 : DIST[b.d].rent * T.rentMul) + staffCost + 80e4 * sz + randn() * 15e4 * sz + (fr && fr.type === 'expense' ? fr.monthly * Math.pow(1.06, age) : 0),
      suspense: Math.max(0, uni(50e4, 300e4) * sz + (fr && fr.type === 'expense' ? fr.cum * 0.4 : 0)),
      cashDiff: poisson(0.25 * sz) + (fr && fr.type === 'embezzle' ? poisson(0.5 + 0.04 * age) : 0),
      complaints: poisson(0.9 * sz * (svc < 0.9 ? 1.5 : 1)) + (fr && fr.type === 'embezzle' ? poisson(0.12 * age) : 0),
      errors: poisson(0.5 * sz / Math.max(0.5, svc)),
    };
    const arr = G.branchReports[b.id] || (G.branchReports[b.id] = []);
    arr.push(rep);
    while (arr.length > 12) arr.shift();
  }
}

/* 異常値の検知（監査支援システム） */
function branchAnomalies(bid) {
  const arr = G.branchReports[bid] || [];
  if (arr.length < 4) return [];
  const last = arr[arr.length - 1], prev = arr.slice(0, -1);
  const out = [];
  const z = (k) => {
    const v = prev.map(x => x[k]);
    const mu = sum(v) / v.length;
    const sd = Math.sqrt(sum(v, x => (x - mu) * (x - mu)) / v.length) || (Math.abs(mu) * 0.1 + 1);
    return (last[k] - mu) / sd;
  };
  if (z('exp') > 2) out.push('経費');
  if (z('suspense') > 2) out.push('仮払金');
  if (z('cashDiff') > 2 && last.cashDiff >= 2) out.push('現金過不足');
  if (z('complaints') > 2 && last.complaints >= 3) out.push('苦情');
  return out;
}
function fraudRiskScore(bid) {
  const arr = G.branchReports[bid] || [];
  if (arr.length < 4) return 0;
  const recent = arr.slice(-3), early = arr.slice(0, Math.max(1, arr.length - 3));
  const avg = (xs, k) => sum(xs, x => x[k]) / xs.length;
  let s = 10;
  s += clamp((avg(recent, 'complaints') - avg(early, 'complaints')) * 12, 0, 30);
  s += clamp((avg(recent, 'cashDiff') - avg(early, 'cashDiff')) * 15, 0, 25);
  s += clamp((avg(recent, 'suspense') / Math.max(1, avg(early, 'suspense')) - 1) * 30, 0, 25);
  s += clamp((avg(recent, 'exp') / Math.max(1, avg(early, 'exp')) - 1) * 80, 0, 20);
  return clamp(Math.round(s + randn() * 4), 0, 100);
}

/* ---------- 突発イベント ---------- */
function eventsStep() {
  const load = coreLoad();
  // システム障害
  if (chance(0.002 + clamp(load - 0.85, 0, 0.5) * 0.15)) {
    systemFailure(false);
    addNews('bank', `勘定系システムで障害が発生し、ATMと振込が数時間停止（処理能力の使用率${fmtPct(load * 100, 0)}）`, 'bad');
  }
  // サイバー攻撃
  if (chance(0.003 * (1 + G.sys.digital) * [1, 0.5, 0.25, 0.1][G.sys.cyber])) {
    const cost = Math.round(uni(0.5e8, 3e8) * Math.sqrt(Math.max(1, accountsCount() / 20000)));
    post('不正アクセス事案の対応費用', [['extraLoss', cost, 0], ['boj', 0, cost]]);
    G.trust = clamp(G.trust - uni(6, 12), 0, 100);
    G.scandalHeat += 6; G.stats.scandals++;
    addNews('bank', `ネットバンキングへの不正アクセスで顧客情報が流出した可能性。対応費用${fmtYen(cost)}`, 'bad');
  }
  // マネロン事案
  if (chance(0.0025 * Math.min(4, Math.sqrt(accountsCount() / 20000)) * [1, 0.55, 0.3, 0.12][G.sys.aml])) {
    const cost = Math.round(uni(0.3e8, 2e8) * Math.sqrt(Math.max(1, accountsCount() / 200000)));
    post('マネー・ローンダリング事案の対応費用', [['extraLoss', cost, 0], ['boj', 0, cost]]);
    G.trust = clamp(G.trust - 5, 0, 100);
    G.scandalHeat += 5; G.stats.scandals++;
    G.fsa.special = true;
    addNews('bank', '当行の口座が特殊詐欺グループの資金洗浄に悪用されていたことが判明。金融庁が報告を求める', 'bad');
  }
  // 大口預金の獲得
  if (chance(0.02 * clamp(G.trust / 60, 0.3, 1.5))) {
    const amt = roundTo(cityDeposits() * uni(0.02, 0.06), 1e8);
    G.flags.bigDep = (G.flags.bigDep || 0) + amt;
    addNews('bank', `地元企業から決済口座の集約を受け、約${fmtYen(amt)}の預金を獲得する見込み`, 'good');
  }
  // 指定金融機関
  if (!G.flags.designated && G.trust >= 70 && openBranches().length >= 5 && G.ratingIdx <= 5 && G.stats.projectsFunded >= 2) {
    G.flags.designated = roundTo(cityStats().depMkt * 0.02, 1e8);
    G.trust = clamp(G.trust + 3, 0, 100);
    addNews('city', `汐見市が当行を指定金融機関に選定。市の公金約${fmtYen(G.flags.designated)}の取扱いを開始`, 'good');
  }
  // 好意的な報道
  if (chance(0.008)) {
    G.trust = clamp(G.trust + 2, 0, 100);
    addNews('bank', pick(['地元紙が当行の事業承継支援を特集', '当行の創業支援融資が地域経済誌で紹介される', '高齢者向けの見守りサービスが好評']), 'good');
  }
  // 自然災害
  if (chance(0.006)) {
    const D = pick(DISTRICTS);
    const sev = uni(0.5, 1.5);
    districtDisaster(D.id, sev);
    const br = openBranches().filter(b => b.d === D.id);
    if (br.length) {
      const cost = Math.round(3000e4 * sev * br.length);
      post('災害による店舗の復旧費用', [['extraLoss', cost, 0], ['boj', 0, cost]]);
    }
    addNews('city', `${pick(['記録的な豪雨', '大型台風', '震度6弱の地震'])}で${D.name}に大きな被害。地元企業の操業に影響`, 'bad', { dist: D.id });
  }
  // 近隣金融機関の破綻
  if ((G.eco.regime === 'recession' || G.eco.regime === 'crisis') && chance(0.004)) {
    const inflow = G.trust >= 55 ? roundTo(cityDeposits() * uni(0.03, 0.08), 1e8) : 0;
    if (inflow) G.flags.bigDep = (G.flags.bigDep || 0) + inflow;
    addNews('eco', `近隣の第二地方銀行が経営破綻。${inflow ? `安全を求める預金が当行に流入（約${fmtYen(inflow)}）` : '預金者の不安が広がる'}`, inflow ? 'good' : 'bad');
    if (!inflow) G.trust = clamp(G.trust - 4, 0, 100);
  }
  // 経営不安の噂（取り付け）
  if (G.trust < 40 && capitalRatio() < 6 && chance(0.04)) {
    G.runShock = uni(0.08, 0.2);
    G.trust = clamp(G.trust - 8, 0, 100);
    addNews('bank', 'SNSで当行の経営不安の噂が拡散。ATMに預金を引き出す人の行列ができた', 'bad');
  }
  // 謝絶した粉飾企業の破綻（審査の目の正しさ）
  for (const r of G.rejectedLog.slice()) {
    if (r.fraud && G.m - r.m >= 3 && chance(0.04)) {
      addNews('loan', `当行が融資を謝絶した「${r.name}」が粉飾決算の発覚で破綻。審査部の判断が正しかった`, 'good');
      G.stats.fraudDodged++;
      G.rejectedLog = G.rejectedLog.filter(x => x !== r);
    } else if (G.m - r.m > 36) G.rejectedLog = G.rejectedLog.filter(x => x !== r);
  }
  // 回収予定
  for (const r of G.pendingRecoveries.slice()) {
    if (G.m >= r.m) {
      if (r.amt > 0) receive(r.amt, 'extraGain', r.desc);
      G.pendingRecoveries = G.pendingRecoveries.filter(x => x !== r);
    }
  }
  G.scandalHeat *= 0.96;
}

/* ---------- 信用度 ---------- */
function updateTrust() {
  const cr = capitalRatio() - (reqCR() - 4), npl = nplRatio();
  let t = 60;
  t += cr >= 12 ? 8 : cr >= 8 ? 4 : cr >= 4 ? -6 : -25;
  t += npl < 2 ? 4 : npl < 5 ? 0 : npl < 10 ? -8 : -18;
  t += [7, 6, 5, 4, 3, 2, 1, 0, -2, -5, -8, -12, -20][G.ratingIdx];
  t += clamp((serviceQuality() - 1) * 20, -12, 3);
  t += Math.min(8, sum(Object.values(districtPresence())) * 1.0 + G.adBudget / 2000e4 + natLevelSum() / 6);
  t -= G.scandalHeat;
  if (coreLoad() > 1) t -= 6;
  if (G.flags.publicFunds) t -= 4;
  G.trust = clamp(G.trust + (t - G.trust) * 0.06, 0, 100);
}

/* ---------- 金融庁検査 ---------- */
function fsaStep() {
  const f = G.fsa;
  if (f.special && f.nextM > G.m + 3) { f.nextM = G.m + 2; f.special = false; }
  if (G.m === f.nextM - 1) {
    addNews('reg', `金融庁から来月の立入検査の予告。自己査定と管理態勢を点検しておく必要がある`, 'neutral');
    G.inbox.push({ id: 'I' + (++G.seq.inbox), type: 'fsaNotice', m: G.m, exp: G.m });
  }
  if (G.m >= f.nextM) runInspection();
}

function amlRequired() {
  const d = deposits();
  const base = d > 3000e8 ? 3 : d > 1500e8 ? 2 : d > 600e8 ? 1 : 0;
  return Math.max(base, [0, 2, 3][G.stage || 0]);
}

function runInspection() {
  const f = G.fsa;
  const findings = [];
  let under = 0, addProv = 0, sev3 = false;
  const knows = {};
  for (const L of G.loans) {
    if (!isActiveLoan(L) || L.kind === 'pool' || L.kind === 'seg') continue;
    let k = false;
    if (L.kind === 'biz') {
      const co = G.companies[L.coId];
      if (co.fraud && co.fraud.years > 0) {
        if (knows[co.id] === undefined) knows[co.id] = co.fraud.found || chance(0.6 * (G.cfg || DIFFICULTY[G.difficulty]).fsa);
        k = knows[co.id];
        if (k && !co.fraud.found) { co.fraud.found = true; co.fraud.foundBy = 'fsa'; L.fraudKnown = true; }
      }
    } else if (L.kind === 'mort' && L.person.fraud) k = chance(0.5);
    const fc = fsaClass(L, k);
    if (fc > L.cls) {
      under++;
      addProv += provisionFor(L, fc) - provisionFor(L, L.cls);
      L.cls = fc;
    }
  }
  const cap = Math.max(1, coreCapital());
  if (under) {
    const s = addProv > cap * 0.1 ? 3 : addProv > cap * 0.03 ? 2 : 1;
    if (s === 3) sev3 = true;
    findings.push({ sev: s, text: `自己査定の甘さ：${under}先の債務者区分を引き下げ、${fmtYen(addProv)}の追加引当を要請` });
  }
  const unrev = G.inbox.filter(x => x.type === 'review' && G.m - x.m > 4).length;
  if (unrev) findings.push({ sev: unrev > 5 ? 2 : 1, text: `期中管理の不備：受領から5か月以上たっても検証していない決算書が${unrev}先` });
  if (G.sys.aml < amlRequired()) findings.push({ sev: 2, text: `マネロン・テロ資金供与対策の態勢が規模に見合っていない（必要水準 Lv${amlRequired()}）` });
  if (G.sys.digital >= 2 && G.sys.cyber < G.sys.digital - 1) findings.push({ sev: 1, text: 'デジタルチャネルの拡大に対し、サイバーセキュリティ対策が遅れている' });
  if (coreLoad() > 0.9) findings.push({ sev: 2, text: `勘定系システムの処理能力に余裕がない（使用率${fmtPct(coreLoad() * 100, 0)}）` });
  if (compRatio() < 0.8) findings.push({ sev: (G.stage || 0) >= 1 ? 2 : 1, text: '管理・監査部門の人員が業容に比べて不足している' });
  if ((G.stage || 0) >= 1 && G.sys.cyber < 2) findings.push({ sev: 2, text: '全国規模の決済インフラを担う銀行として、サイバーセキュリティ対策が不十分' });
  if ((G.stage || 0) >= 2 && G.sys.audit < 2) findings.push({ sev: 2, text: '海外拠点を含むグループ全体の内部監査態勢が整っていない' });
  for (const x of G.ifraud) {
    if (!x.detected && chance(0.5)) { detectInternalFraud(x, 'fsa'); findings.push({ sev: 3, text: '内部管理態勢の重大な欠陥：行員の不正を見逃していた' }); sev3 = true; }
  }
  const cr = capitalRatio();
  if (cr < reqCR() + 2) findings.push({ sev: 2, text: `自己資本比率が${fmtPct(cr)}と低く、資本の充実が必要` });
  const ir = irrbb() / cap * 100;
  if (ir > 20) findings.push({ sev: 1, text: `金利リスク量が自己資本の${fmtPct(ir, 0)}に達し、重要性テストの基準（20%）を超過` });
  const score = sum(findings, x => x.sev);
  let grade, text;
  if ((sev3 && score >= 4) || score >= 6) {
    grade = 'D'; text = '業務改善命令';
    G.flags.order = G.m + 12;
    G.trust = clamp(G.trust - 10, 0, 100);
    G.scandalHeat += 8;
    G.stock.price *= 0.88;
  } else if (score >= 3) { grade = 'C'; text = '改善指導'; G.trust = clamp(G.trust - 3, 0, 100); }
  else if (score >= 1) { grade = 'B'; text = '軽微な指摘'; }
  else { grade = 'A'; text = '指摘事項なし'; G.trust = clamp(G.trust + 2, 0, 100); }
  if (addProv > 0) trueUpProvisions('金融庁検査を受けた追加引当');
  const rec = { m: G.m, grade, text, findings, under, addProv };
  f.history.push(rec);
  f.nextM = G.m + ((G.stage || 0) >= 1 ? randInt(12, 20) : randInt(24, 36)) - (grade === 'D' ? 6 : 0);
  f.special = false;
  addNews('reg', `金融庁検査が終了。結果：${text}${findings.length ? `（指摘${findings.length}件）` : ''}`, grade <= 'B' ? 'good' : 'bad');
  if (grade === 'D') addNews('reg', `金融庁が当行に業務改善命令。1年間は新規出店が制限される`, 'bad');
  G.pendingModals.push({ type: 'fsa', idx: f.history.length - 1 });
}

/* ---------- 監査法人の期末監査 ---------- */
function externalAudit() {
  let adj = 0, n = 0;
  for (const L of G.loans) {
    if (!isActiveLoan(L) || L.kind === 'pool' || L.kind === 'seg') continue;
    let ac = sysClass(L);
    if (L.kind === 'biz') {
      const co = G.companies[L.coId];
      const s = co.fraud && co.fraud.found ? latestTrue(co) : latestRep(co);
      if (bankGrade(co) >= 9 && s.EQ < 0 && s.ORD < 0) ac = Math.max(ac, 3);
    }
    if (ac > L.cls) { adj += provisionFor(L, ac) - provisionFor(L, L.cls); L.cls = ac; n++; }
  }
  const notes = [];
  if (n) { trueUpProvisions('監査法人の指摘による追加引当'); notes.push(`${n}先の債務者区分の見直しを求められ、${fmtYen(adj)}を追加引当`); }
  for (const x of G.ifraud) if (!x.detected && chance(0.25)) { detectInternalFraud(x, 'auditor'); notes.push('監査の過程で行員の不正が見つかった'); }
  const opinion = notes.some(t => t.includes('不正')) ? '無限定適正意見（強調事項あり）' : '無限定適正意見';
  return { opinion, notes, adj };
}

/* ---- 09_budget.js ---- */
/* =========================================================
 *  09_budget.js : 銀行の予算（経営計画）と予実管理
 *  年度の初め（4月）に前期の実績から予算案を作り、頭取が目標を決める。
 *  毎月の実績（月次の損益）と比べて差異を示す。
 * ========================================================= */

const BUDGET_LINES = [
  ['nii', '資金利益', 'nii'], ['fee', '役務取引等利益', 'feeIncome'], ['gross', '業務粗利益', 'bankGross', 'sum'],
  ['opex', '経費', 'ohr', 'cost'], ['core', 'コア業務純益', 'coreProfit', 'sum'], ['credit', '与信関係費用', 'creditCost', 'cost'],
  ['ordinary', '経常利益', 'ord', 'grand'],
];
/* 経費の月ごとの重み（4月〜3月。6月と12月は賞与） */
const OPEX_SEASON = [1, 1, 2.1, 1, 1, 1, 1, 1, 2.1, 1, 1, 1];
const OPEX_SEASON_SUM = OPEX_SEASON.reduce((a, b) => a + b, 0);

/* 予算の土台：前期の実績（なければ開業時の見込み） */
function budgetBase(fy) {
  const last = G.annual.find(a => a.fy === fy - 1);
  if (last) {
    const p = last.pl;
    return { nii: p.nii, fee: p.feeNet, opex: p.opex, credit: Math.max(0, p.credit), loans: last.loans, dep: last.dep, from: 'last' };
  }
  const gross = G.initGP || 5.3e8;
  const opex = G.initOpex || 4.6e8;
  const credit = Math.max(0, gross - opex - (G.initNI || 0) / 0.7);

}
function defaultBudgetTargets(fy) {
  const b = budgetBase(fy);
  return { gL: 3, gD: 2, gOpex: 1, creditRate: +clamp(b.credit / Math.max(1, b.loans) * 100, 0.05, 1.5).toFixed(2) };
}
function makeBudget(fy, t) {
  const b = budgetBase(fy);
  const gL = t.gL / 100, gD = t.gD / 100;
  const nii = b.nii * (1 + gL * 0.6);
  const fee = b.fee * (1 + gD * 0.5 + 0.01);
  const opex = b.opex * (1 + t.gOpex / 100);
  const loansAvg = b.loans * (1 + gL / 2);
  const credit = loansAvg * t.creditRate / 100;
  const gross = nii + fee;
  const core = gross - opex;
  const lines = { nii, fee, gross, opex, core, credit, ordinary: core - credit };
  for (const k in lines) lines[k] = Math.round(lines[k]);
  return { fy, t: Object.assign({}, t), base: b, lines, loansEnd: Math.round(b.loans * (1 + gL)), depEnd: Math.round(b.dep * (1 + gD)), status: 'draft' };
}
/* 年度が変わったら予算案を作る */
function ensureBudget() {
  const fy = fyOf(G.m);
  if (G.budget && G.budget.fy === fy) return;
  if (G.budget) G.budgetLast = G.budget;
  G.budget = makeBudget(fy, defaultBudgetTargets(fy));
}
function setBudgetTargets(t) {

  const fy = G.budget.fy;
  const clean = {
    gL: clamp(+t.gL || 0, -20, 40), gD: clamp(+t.gD || 0, -20, 40),

  G.budget.approvedM = G.m;

/* 月ごとの予算（i = 年度の何か月目か 0〜11） */
function budgetMonth(bud, k, i) {
  const v = bud.lines[k];
  if (k === 'opex') return v * OPEX_SEASON[i] / OPEX_SEASON_SUM;
  if (k === 'gross') return budgetMonth(bud, 'nii', i) + budgetMonth(bud, 'fee', i);
  if (k === 'core') return budgetMonth(bud, 'gross', i) - budgetMonth(bud, 'opex', i);
  if (k === 'ordinary') return budgetMonth(bud, 'core', i) - budgetMonth(bud, 'credit', i);
  return v / 12;
}
/* 予実の集計（締めた月まで） */
function budgetVsActual(bud) {
  const fy = bud.fy;
  const months = G.hist.filter(h => h.m >= fy * 12 && h.m <= fy * 12 + 11);
  const n = months.length;
  const act = plSummary(sumPL(fy * 12, fy * 12 + 11));
  const actual = { nii: act.nii, fee: act.feeNet, gross: act.gross, opex: act.opex, core: act.core, credit: act.credit, ordinary: act.ordinary };
  const rows = BUDGET_LINES.map(([k, name, tk, cls]) => {
    let cum = 0;
    for (let i = 0; i < n; i++) cum += budgetMonth(bud, k, i);
    const a = actual[k];
    const cost = k === 'opex' || k === 'credit';
    const diff = a - cum;
    const fav = cost ? diff <= 0 : diff >= 0;
    let rest = 0;
    for (let i = n; i < 12; i++) rest += budgetMonth(bud, k, i);
    return { k, name, tk, cls, year: bud.lines[k], cum, a, diff, fav, rate: cum ? a / cum * 100 : NaN, outlook: a + rest, cost };
  });
  return { n, rows };
}
/* 予実の差についての短いコメント */
function budgetComments(bud, va) {
  const out = [];
  if (!va.n) return out;
  const r = Object.fromEntries(va.rows.map(x => [x.k, x]));
  const pct = x => Math.abs(x.diff) / Math.max(1, Math.abs(x.cum)) * 100;
  const loansNow = B('loans');
  const loanPlan = bud.base.loans + (bud.loansEnd - bud.base.loans) * va.n / 12;
  if (pct(r.nii) > 3) {
    out.push(`資金利益は予算比${fmtPct(r.nii.rate, 1)}。${r.nii.fav ? '予算を上回っています。' : '予算を下回っています。'}${loansNow < loanPlan * 0.98 ? `貸出金の残高（${fmtYen(loansNow)}）が計画（${fmtYen(loanPlan)}）に届いていないのが一因です。` : loansNow > loanPlan * 1.02 ? `貸出金の残高が計画を上回って伸びています。` : '貸出金利や預金金利の水準の変化が影響しています。'}`);
  }
  if (pct(r.opex) > 3) out.push(`経費は予算比${fmtPct(r.opex.rate, 1)}。${r.opex.fav ? '予算の範囲に収まっています。' : '予算を超えています。採用・店舗・システムの費用を見直しましょう。'}`);
  if (Math.abs(r.credit.diff) > Math.max(1e7, Math.abs(r.credit.cum) * 0.2)) out.push(`与信関係費用は${r.credit.fav ? '予算より少なく済んでいます' : `予算を${fmtYen(r.credit.diff)}上回っています。融資先の業況悪化や債務者区分の見直しで引当金が増えました`}。`);
  if (r.ordinary.outlook < bud.lines.ordinary * 0.9) out.push(`このままだと年間の経常利益は予算の${fmtPct(r.ordinary.outlook / Math.max(1, bud.lines.ordinary) * 100, 0)}にとどまる見通しです。`);
  else if (r.ordinary.outlook > bud.lines.ordinary * 1.1) out.push(`年間の経常利益は予算を上回る見通しです（${fmtYen(r.ordinary.outlook)}）。`);
  return out;
}
/* 前期の予算の達成率（株主総会で使う） */
function lastBudgetAchievement() {
  const b = G.budgetLast;
  if (!b) return null;
  const rep = G.annual.find(a => a.fy === b.fy);
  if (!rep || !b.lines.ordinary) return null;
  return { fy: b.fy, plan: b.lines.ordinary, actual: rep.pl.ordinary, rate: b.lines.ordinary > 0 ? rep.pl.ordinary / b.lines.ordinary * 100 : NaN };
}

  let prov = 0;
  for (const L of G.loans) { L.provision = provisionFor(L, L.cls); prov += L.provision; }
  post('承継債権に対する貸倒引当金の計上', [['retained', prov, 0], ['allowance', 0, prov]]);
  if (G.stage >= 1) {
    // 開業直後の格付・オペレーショナルリスクに使う収益見込み
    const rr = estimateRunRate();
    G.initGP = 5.3e8 * dm + rr.gp;
    G.initOpex = 4.6e8 + rr.opex;
    G.initNI = (G.initGP - G.initOpex - rr.el) * 0.7;
    // 自己資本比率が目標水準になるよう資本を積む
    const rw = rwaBreakdown();
    const target = Math.max(STAGES[G.stage].reqCR + 1.5, [0, 12.5, 13.5][G.stage] * cf);
    const add = Math.round(target / 100 * rw.total - coreCapitalParts(rw).core);
    if (add > 0) {
      const c1 = roundTo(add * 0.3, 1e8), c2 = roundTo(add * 0.3, 1e8);
      post('開業時の資産・負債の承継', [['boj', add, 0], ['capital', 0, c1], ['capSurplus', 0, c2], ['retained', 0, add - c1 - c2]]);
    }
    G.staff.comp = Math.ceil((2 + (G.staff.sales + G.staff.credit + G.staff.ops) * 0.06 + G.branches.length * 0.3 + netStaff() * 0.004) / 0.94);
    G.stock.shares = Math.max(3000e4, roundTo(netAssets() / 2000, 1e4));
  }
  G.ledger.mflow = {};
  closeJournalMonth(-1);
}

/* ---------- KPI ---------- */
function kpiSnapshot() {
  const rw = rwaBreakdown();
  const cs = cityStats();
  return {
    ta: Math.round(totalAssets()), dep: Math.round(deposits()), loans: Math.round(B('loans')), na: Math.round(netAssets()),
    cr: +(coreCapitalParts(rw).core / Math.max(1, rw.total) * 100).toFixed(2), npl: +nplRatio().toFixed(2), trust: +G.trust.toFixed(1),
    rating: G.ratingIdx, price: Math.round(G.stock.price || 0), pop: Math.round(cs.pop), vit: +cs.vit.toFixed(1),
    share: +(cs.share * 100).toFixed(2), policy: G.eco.policy, y10: +G.eco.y[10].toFixed(3), prime: G.rates.prime,
    ord: G.rates.ord, time: G.rates.time, unreal: Math.round(unrealizedGain()),
    gdp: +G.eco.gdp.toFixed(2), cpi: +G.eco.cpi.toFixed(2), unemp: +G.eco.unemp.toFixed(2), landN: +G.eco.land.toFixed(1), stockN: +G.eco.stock.toFixed(1),
    stage: G.stage || 0, natDep: Math.round(natDep()), ovsDep: Math.round(B('depFx')), segBal: Math.round(sum(segLoans(), L => L.bal)),
    natLv: natLevelSum(), ovsLv: ovsLevelSum(), natShare: +natShare().toFixed(3),
  };
}

/* 月次の損益集計（mflowから） */
function plSummary(pl) {
  const g = k => pl[k] || 0;
  const fundInc = g('intLoans') + g('intSec') + g('intCall') + g('intBoj');
  const fundExp = g('intDep') + g('intCallM') + g('intBorrow') + g('fundingCost');
  const feeNet = g('fees') - g('feeExp');
  const othNet = g('bondGain') - g('bondLoss') + g('fxGain') - g('fxLoss');
  const opex = g('personnel') + g('premises') + g('taxes') + g('depreciation') + g('depInsurance');
  const credit = g('provExp') + g('writeoff') - g('provRev') - g('recoveries');
  const ordRev = sum(REV_KEYS.filter(k => ACCT[k].grp !== 'extra'), k => g(k));
  const ordExp = sum(EXP_KEYS.filter(k => ACCT[k].grp !== 'extra' && ACCT[k].grp !== 'tax'), k => g(k));
  const ordinary = ordRev - ordExp;
  const extra = g('extraGain') - g('extraLoss');
  const pretax = ordinary + extra;
  const net = pretax - g('incomeTax');
  const gross = fundInc - fundExp + feeNet + othNet;
  return { fundInc, fundExp, nii: fundInc - fundExp, feeNet, othNet, gross, opex, core: gross - othNet - opex, credit, ordinary, extra, pretax, tax: g('incomeTax'), net, ordRev, ordExp };
}
function sumPL(fromM, toM) {
  const acc = {};
  for (const h of G.hist) if (h.m >= fromM && h.m <= toM) for (const k in h.pl) acc[k] = (acc[k] || 0) + h.pl[k];
  return acc;
}

/* ---------- 月次処理 ---------- */
function advanceMonth() {
  if (G.over) return null;
  const m = G.m;
  const before = { dep: deposits(), loans: B('loans'), ta: totalAssets(), trust: G.trust, newsLen: G.news.length };
  G.pendingModals = [];
  autoDelegate(); // 期限を迎える汐見市の小口案件を審査基準で処理（権限委譲している場合）
  // ===== 当月末の処理 =====
  processLoans();
  networkMonthEnd();
  processDeposits();
  payDepositInterest();
  processTreasuryMonthly();
  processFeesAndExpenses();
  depreciateAssets();
  processVault();
  processInternalFraudMonthly();
  trueUpProvisions();
  manageLiquidity();
  if (G.over) return finishAdvance(m, before);
  makeBranchReports();
  let fyClosed = false;
  if (calMonth(m) === 3) { yearEndClosing(); fyClosed = true; }
  const flow = closeJournalMonth(m);
  G.hist.push({ m, bs: bsSnapshot(), pl: flow, kpi: kpiSnapshot() });
  if ([6, 9, 12, 3].includes(calMonth(m))) { updateRating(); G.hist[G.hist.length - 1].kpi.rating = G.ratingIdx; stageQuarterly(); }
  pruneState();
  if (calMonth(m) === 4) approveBudget(true); // 4月末までに決めなければ予算案のまま確定
  // ===== 翌月 =====
  G.m = m + 1;
  if (calMonth(G.m) === 4) ensureBudget();
  G.capUsed = { credit: 0, audit: 0 };
  ecoStep();
  applyRateLinks();
  for (const D of DISTRICTS) { const s = G.city.d[D.id]; s.mortNew.push(s.mortCur || 0); s.mortCur = 0; }
  cityStep();
  expireApps();
  expireInbox();
  borrowerMonthly();
  itProjectsStep();
  networkNextMonth();
  stageReviewStep();
  vaultUpgradeStep();
  for (const b of G.branches) if (b.openM === G.m) addNews('bank', `「${b.name}」が開業した`, 'good');
  staffStep();
  eventsStep();
  fsaStep();
  if (calMonth(G.m) === 5) payTaxes();
  if (calMonth(G.m) === 6) shareholdersMeeting();
  updateTrust();
  updateStock();
  checkCapital();
  if (!G.over) manageLiquidity();
  if (!G.over) genApplications();
  return finishAdvance(m, before, fyClosed);
}

function finishAdvance(m, before, fyClosed) {
  const h = G.hist[G.hist.length - 1];
  const rep = {
    m, fyClosed: !!fyClosed,
    pl: h && h.m === m ? plSummary(h.pl) : null,
    dDep: deposits() - before.dep, dLoans: B('loans') - before.loans, dTA: totalAssets() - before.ta, dTrust: G.trust - before.trust,
    news: G.news.slice(0, Math.max(0, G.news.length - before.newsLen)).filter(n => n.m >= m),
    newApps: G.apps.filter(a => a.m === G.m && a.status === 'pending').length,
  };
  G.lastReport = rep;
  return rep;
}

function expireApps() {
  for (const a of G.apps) {
    if (a.status === 'pending' && a.exp < G.m) { a.status = 'expired'; a.decidedM = G.m - 1; }
  }
  // 古い案件と、取引のない企業データを整理
  G.apps = G.apps.filter(a => a.status === 'pending' || G.m - (a.decidedM ?? a.m) <= 2);
}

function pruneState() {
  // 完済・償却から3年以上たった融資を整理
  G.loans = G.loans.filter(L => isActiveLoan(L) || G.m - (L.closedM ?? G.m) <= 36);
  const keep = new Set();
  for (const L of G.loans) if (L.coId) keep.add(L.coId);
  for (const a of G.apps) if (a.coId) keep.add(a.coId);
  for (const r of G.rejectedLog) keep.add(r.coId);
  for (const id of Object.keys(G.companies)) if (!keep.has(id)) delete G.companies[id];
  if (G.annual.length > 30) G.annual.shift();
  if (G.hist.length > 400) G.hist.shift();
}

function payTaxes() {
  const t = B('taxPayable');
  if (t > 0) { ensureFunds(t); post('法人税等の納付', [['taxPayable', t, 0], ['boj', 0, t]]); }
}

/* 市場連動の金利設定 */
function applyRateLinks() {
  const r = G.rates, e = G.eco;
  const r3 = x => Math.round(x * 1000) / 1000;
  if (r.primeLink) r.prime = r3(e.policy + r.primeMargin);
  if (r.ordLink) r.ord = r3(Math.max(0.001, e.mktOrd + r.ordSpread));
  if (r.timeLink) r.time = r3(Math.max(0.002, e.mktTime + r.timeSpread));
}

/* ---------- 決算 ---------- */
function yearEndClosing() {
  const fy = fyOf(G.m);
  const audit = externalAudit();
  const pretax = curProfit();
  let tax = 0;
  if (pretax > 0) {
    const taxable = pretax - G.taxLossCF;
    if (taxable > 0) { tax = Math.round(taxable * TAX_RATE); G.taxLossCF = 0; }
    else G.taxLossCF -= pretax;
  } else G.taxLossCF += -pretax;
  tax += 300e4; // 住民税均等割など
  post('法人税、住民税及び事業税の計上', [['incomeTax', tax, 0], ['taxPayable', 0, tax]]);
  const rep = buildAnnualReport(fy, audit);
  G.annual.push(rep);
  closeBooks('決算振替（損益勘定を利益剰余金へ）');
  const ni = rep.pl.net;
  const allowed = !G.flags.publicFunds && capitalRatio() >= reqCR() + 2 && ni > 0;
  G.pendingDividend = { fy, ni, allowed, max: allowed ? Math.round(ni * 0.6) : 0 };
  G.pendingModals.push({ type: 'yearEnd', fy });
  if (G.termYears && fy === G.termYears - 1 && !G.termEnded) { G.termEnded = true; G.pendingModals.push({ type: 'term' }); }
}

function buildAnnualReport(fy, audit) {
  const fromM = fy * 12, toM = fy * 12 + 11;
  const acc = sumPL(fromM, toM - 1);
  for (const k in G.ledger.mflow) acc[k] = (acc[k] || 0) + G.ledger.mflow[k];
  const pl = plSummary(acc);
  const rw = rwaBreakdown();
  const parts = coreCapitalParts(rw);
  const npl = nplBreakdown();
  const prev = G.annual[G.annual.length - 1];
  const bs = bsSnapshot();
  return {
    fy, m: G.m, bs, plRaw: acc, pl,
    ta: totalAssets(), dep: deposits(), loans: B('loans'), na: netAssets(),
    cr: parts.core / rw.total * 100, core: parts.core, rwa: rw.total, npl: npl.ratio, nplAmt: npl.npl,
    roa: pl.net / Math.max(1, (totalAssets() + (prev ? prev.ta : totalAssets())) / 2) * 100,
    roe: pl.net / Math.max(1, (netAssets() + (prev ? prev.na : netAssets())) / 2) * 100,
    ohr: pl.gross > 0 ? pl.opex / pl.gross * 100 : 0,
    audit, rating: G.ratingIdx, trust: G.trust, price: G.stock.price, pop: cityStats().pop, vit: cityStats().vit,
    unreal: unrealizedGain(), branches: openBranches().length + netBranches(), staff: staffTotal() + netStaff(),
    stage: G.stage || 0, natDep: natDep(), ovsDep: B('depFx'), natLv: natLevelSum(), ovsLv: ovsLevelSum(),
  };
}

/* 配当の決定（決算モーダルから） */
function decideDividend(ratio) {
  const d = G.pendingDividend;
  if (!d) return { ok: false };
  const amt = d.allowed ? Math.round(Math.max(0, d.ni) * clamp(ratio, 0, 0.6)) : 0;
  if (amt > 0) post('剰余金の配当の決議', [['retained', amt, 0], ['divPayable', 0, amt]]);
  const rep = G.annual.find(a => a.fy === d.fy);
  if (rep) { rep.dividend = amt; rep.payout = d.ni > 0 ? amt / d.ni : 0; }
  G.lastPayout = d.ni > 0 ? amt / d.ni : 0;
  G.pendingDividend = null;
  return { ok: true, amt };
}

/* ---------- 株主総会（6月） ---------- */
function shareholdersMeeting() {
  const div = B('divPayable');
  if (div > 0) { ensureFunds(div); post('配当金の支払', [['divPayable', div, 0], ['boj', 0, div]]); }
  const last = G.annual[G.annual.length - 1];
  if (!last) return;
  const h12 = G.hist[G.hist.length - 13];
  const ret = h12 && h12.kpi.price ? (G.stock.price / h12.kpi.price - 1) * 100 : 0;
  let sat = 55 + 2.5 * clamp(last.roe, -8, 10) + 30 * Math.min(0.5, G.lastPayout || 0) + 0.2 * clamp(ret, -50, 50)
    - 6 * Math.min(3, G.scandalHeat / 6) + (G.ratingIdx <= 5 ? 5 : 0) - (G.shareholders.dilution || 0) * 25;
  if (last.pl.net < 0) sat -= 6;
  const ach = lastBudgetAchievement(); // 予算（経常利益）の達成度
  if (ach && isFinite(ach.rate)) sat += ach.rate >= 100 ? 4 : ach.rate < 80 ? -4 : 0;
  sat = clamp(sat, G.annual.length <= 1 ? 30 : 0, 100);
  G.shareholders.dilution = 0;
  G.shareholders.sat = sat;
  const approval = clamp(42 + sat * 0.6 + randn() * 2, 20, 99);
  G.shareholders.hist.push({ m: G.m, sat, approval });
  if (approval < 50) {
    if (G.shareholders.warn >= 1 && G.annual.length >= 2) { gameOver('dismissed', approval); return; }
    G.shareholders.warn = 1;
    const ap = 50 + rand() * 2;
    G.shareholders.hist[G.shareholders.hist.length - 1].approval = ap;
    addNews('bank', `株主総会で頭取の再任議案は大株主の支持で辛うじて可決（賛成率${fmtNum(ap, 1)}%）。来年も業績が振るわなければ解任は避けられない`, 'bad');
    G.pendingModals.push({ type: 'agm', approval: ap, sat, warn: true });
    return;
  }
  if (sat < 30) {
    G.shareholders.warn++;
    addNews('bank', `株主総会で経営陣への批判が相次ぐ。頭取の再任議案の賛成率は${fmtNum(approval, 1)}%`, 'bad');
  } else {
    G.shareholders.warn = 0;
    addNews('bank', `定時株主総会を開催。頭取の再任議案は賛成率${fmtNum(approval, 1)}%で可決`, 'good');
  }
  G.pendingModals.push({ type: 'agm', approval, sat });
}

/* ---------- 自己資本・存続判定 ---------- */
function checkCapital() {
  const cr = capitalRatio();
  const na = netAssets();
  if (na < 0) { gameOver('insolvent'); return; }
  const q = [6, 9, 12, 3].includes(calMonth(G.m));
  const req = reqCR(), S = STAGES[G.stage || 0];
  if (cr < req && !G.flags.publicFunds && !G.flags.publicOffer && G.stats.publicFundsAmt === undefined) {
    G.flags.publicOffer = true;
    G.pendingModals.push({ type: 'publicFunds' });
  }
  if (!q) return;
  if (cr < 0) { gameOver('suspended'); return; }
  if (cr < req / 2 && G.flags.pca !== 2) {
    G.flags.pca = 2; G.flags.lendingBan = G.m + 3;
    addNews('reg', `自己資本比率が${fmtPct(cr)}に低下。早期是正措置（第2区分）により新規融資の抑制を命じられた`, 'bad');
  } else if (cr < req && !G.flags.pca) {
    G.flags.pca = 1;
    addNews('reg', `自己資本比率が${fmtPct(cr)}と${S.basis}の${fmtPct(req, 1)}を下回り、早期是正措置（第1区分）として経営改善計画の提出を求められた`, 'bad');
  } else if (cr >= req) G.flags.pca = 0;
}

const OVER_TEXT = {
  liquidity: { title: '資金繰り破綻', text: '預金の払い戻しに応じる資金を調達できず、経営破綻に追い込まれました。' },
  insolvent: { title: '債務超過', text: '純資産がマイナスとなり、銀行として存続できなくなりました。' },
  suspended: { title: '業務停止命令', text: '自己資本比率がマイナスとなり、金融庁から業務停止命令を受けました。' },
  dismissed: { title: '頭取解任', text: '株主総会で再任議案が否決され、頭取の職を解かれました。' },
};
function gameOver(kind, extra) {
  if (G.over) return;
  G.over = { kind, m: G.m, extra };
  addNews('bank', `【${OVER_TEXT[kind].title}】${OVER_TEXT[kind].text}`, 'bad');
  G.pendingModals.push({ type: 'gameover' });
}

/* ---------- 経営評価（任期満了・終了時） ---------- */
function finalEvaluation() {
  const first = G.hist[0].kpi;
  const cs = cityStats();
  const ta = totalAssets();
  const cumNI = sum(G.annual, a => a.pl.net);
  const s = G.stats;
  const parts = [];
  const add = (name, pts, max, note) => parts.push({ name, pts: Math.round(clamp(pts, 0, max)), max, note });
  const avgRoe = G.annual.length ? sum(G.annual, a => a.roe) / G.annual.length : 0;
  const si = G.stageInfo || newStageInfo(0);
  const downs = si.hist.filter(h => h.kind === 'down').length;
  add('規模の拡大', Math.log2(ta / first.ta) * 10 + 4, 20, `総資産 ${fmtYen(first.ta)} → ${fmtYen(ta)}`);
  add('収益力', 4 + avgRoe * 1.6, 15, `平均ROE ${fmtPct(avgRoe)}、累計当期純利益 ${fmtYen(cumNI)}`);
  add('健全性', (capitalRatio() - reqCR()) * 1.5 + (5 - nplRatio()) * 1.5, 20, `自己資本比率 ${fmtPct(capitalRatio())}、不良債権比率 ${fmtPct(nplRatio())}`);
  add('審査の目', s.fraudFound * 1.2 + s.fraudDodged * 0.8 - s.fraudLent * 0.6 + 4, 15, `粉飾の発見 ${s.fraudFound}件、粉飾先への融資 ${s.fraudLent}件`);
  add('地域の発展', (cs.vit - 100) * 0.4 + (cs.pop / first.pop - 1) * 70 + s.projectsFunded + 3, 10, `人口 ${fmtNum(first.pop)}人 → ${fmtNum(cs.pop)}人、地域活力 ${fmtNum(cs.vit, 1)}`);
  add('業態の発展', (si.maxStage - si.startStage) * 6 + (G.stage || 0) * 3 + ((G.stage || 0) >= 2 ? ovsLevelSum() * 0.3 : natLevelSum() * 0.15) - downs * 5, 15,
    `${STAGES[si.startStage].name}として就任 → 現在は${STAGES[G.stage || 0].name}${downs ? `（格下げ${downs}回）` : ''}`);
  add('ガバナンス', 5 - s.scandals * 1.2 - G.fsa.history.filter(h => h.grade === 'D').length * 2 - (G.flags.publicFunds || s.publicFundsAmt ? 3 : 0), 5, `不祥事 ${s.scandals}件`);
  const total = sum(parts, p => p.pts);
  const rank = total >= 85 ? 'S' : total >= 70 ? 'A' : total >= 55 ? 'B' : total >= 40 ? 'C' : 'D';
  const title = { S: '名頭取として語り継がれる', A: '地域に信頼される名経営者', B: '堅実な経営者', C: '可もなく不可もない頭取', D: '課題の多い経営だった' }[rank];
  return { parts, total, rank, title };
}

function bankClass(ta = totalAssets()) {
  let c = BANK_CLASSES[0];
  for (const k of BANK_CLASSES) if (ta >= k.min) c = k;
  return c;
}

/* ---------- セーブ／ロード ---------- */
function serialize() { return JSON.stringify(G); }
function deserialize(json) {
  const s = JSON.parse(json);
  if (s && s.mode === 'kaisha') return ksDeserialize(s);
  if (!s || s.version !== SAVE_VERSION || !s.ledger) throw new Error('セーブデータの形式が違います');
  G = s;
  G.pendingModals = G.pendingModals || [];
  migrateSave();
  return G;
}
/* 旧バージョンのセーブデータに新しい項目を補う */
function migrateSave() {
  for (const k of ACCT_KEYS) if (G.ledger.bal[k] === undefined) G.ledger.bal[k] = 0;
  if (G.stage === undefined) G.stage = 0;
  if (!G.stageInfo) G.stageInfo = newStageInfo(G.stage);
  if (!G.net) G.net = newNetState();
  if (!G.credit) G.credit = defaultCredit();
  if (!G.goodwill) G.goodwill = [];
  if (!G.cfg) G.cfg = Object.assign({ bubbleUntil: -1 }, DIFFICULTY[G.difficulty] || DIFFICULTY.normal);
  if (G.termYears === undefined) G.termYears = TERM_YEARS;
  if (!G.policy) G.policy = { delegate: Object.assign({}, DELEGATE_DEFAULT) };
  if (!G.budget) { ensureBudget(); approveBudget(true); }
}

/* 内部整合性のチェック（開発・検証用） */
function integrityCheck() {
  const errs = [];
  const d = ledgerDiff();
  if (Math.abs(d) > 1) errs.push('貸借不一致 ' + d);
  const lsum = sum(G.loans.filter(isActiveLoan), L => L.bal);
  if (Math.abs(lsum - B('loans')) > 1) errs.push(`貸出金の補助元帳不一致 ${lsum} vs ${B('loans')}`);
  const bsum = sum(G.bonds, b => b.book);
  if (Math.abs(bsum - B('securities')) > 1) errs.push(`有価証券の補助元帳不一致 ${bsum} vs ${B('securities')}`);
  const tsum = sum(G.dep.coh, c => c.bal) + natTime();
  if (Math.abs(tsum - B('depTime')) > 1) errs.push(`定期預金の補助元帳不一致 ${tsum} vs ${B('depTime')}`);
  const fsum = G.net ? sum(OVERSEAS, R => G.net[R.id].dep) : 0;
  if (Math.abs(fsum - B('depFx')) > 1) errs.push(`海外店預金の補助元帳不一致 ${fsum} vs ${B('depFx')}`);
  const gw = sum(G.goodwill || [], g => g.book);
  if (Math.abs(gw - B('goodwill')) > 1) errs.push(`のれんの補助元帳不一致 ${gw} vs ${B('goodwill')}`);
  if (cityOrd() < -1) errs.push(`汐見市の普通預金がマイナス ${cityOrd()}`);
  const tg = sum(G.assets.filter(a => a.kind === 'tangible'), a => a.book);
  if (Math.abs(tg - B('tangible')) > 1) errs.push(`有形固定資産の補助元帳不一致 ${tg} vs ${B('tangible')}`);
  const ig = sum(G.assets.filter(a => a.kind === 'intangible'), a => a.book);
  if (Math.abs(ig - B('intangible')) > 1) errs.push(`無形固定資産の補助元帳不一致 ${ig} vs ${B('intangible')}`);
  const prov = sum(G.loans.filter(isActiveLoan), L => L.provision || 0);
  if (Math.abs(prov - B('allowance')) > 1) errs.push(`引当金の補助元帳不一致 ${prov} vs ${B('allowance')}`);
  for (const k of ['cash', 'boj', 'depOrd', 'depTime', 'depFx', 'goodwill']) if (B(k) < -1) errs.push(`${ACCT[k].name}がマイナス ${B(k)}`);
  for (const k of ACCT_KEYS) if (!isFinite(B(k))) errs.push(`${k} が数値でない`);
  for (const L of G.loans) if (isActiveLoan(L) && (!isFinite(L.bal) || L.bal < 0)) errs.push(`融資残高異常 ${L.id} ${L.bal}`);
  return errs;
}

/* ---- 09_stage.js ---- */
/* =========================================================
 *  09_stage.js : 業態ステージ（地域銀行 → メガバンク → テラバンク）
 *    全国・海外の店舗網、リテール・中小企業ポートフォリオ、
 *    為替と外貨調達、地銀・現地銀行の買収、規模に応じた大型リスク、
 *    格上げ審査・維持基準・格下げ
 * ========================================================= */

/* ---------- エリア（汐見市の地区・国内の地域・海外の地域）の共通アクセサ ---------- */
const isCityArea = a => !!DIST[a];
const isNatArea = a => !!NATR[a];
const isOvsArea = a => !!OVSR[a];
const areaDef = a => DIST[a] || NATR[a] || OVSR[a];
const regionDef = a => NATR[a] || OVSR[a];
function areaName(a) { const d = areaDef(a); return d ? d.name : String(a); }
function areaMix(a) { return areaDef(a).mix; }
function areaVit(a) {
  if (DIST[a]) return G.city.d[a].vit;
  const r = G.net && G.net[a];
  return r ? r.vit : 100;
}
function areaLand(a) {
  if (DIST[a]) return G.city.d[a].land;
  const r = G.net && G.net[a];
  return r ? r.land : 100;
}
const regionLevels = a => (isOvsArea(a) ? OVS_LEVELS : NAT_LEVELS);
const LEVEL_GAP = 12; // 一つの段階が完成してから次の拡大に着手できるまでの月数
const regionScale = a => (isOvsArea(a) ? ovsScale(OVSR[a]) : natScale(NATR[a]));

/* ---------- 状態 ---------- */
function newNetState() {
  const net = {};
  for (const R of NATIONS) net[R.id] = { lv: 0, build: null, since: -1, ord: 0, time: 0, tRate: 0.3, vit: 100 + randn() * 2, land: 100, pdMul: 1, pdUntil: -1, shock: null, frozenUntil: -1 };
  for (const R of OVERSEAS) net[R.id] = { lv: 0, build: null, since: -1, dep: 0, vit: 100 + 5 * (R.growth - 2.5), land: 100, rate: R.rate0, fx: 1, lastFx: 0, basis: 0.3, basisUntil: -1, gap: 0, pdMul: 1, pdUntil: -1, shock: null, frozenUntil: -1 };
  return net;
}
function newStageInfo(stage) {
  return { since: 0, review: null, strikes: 0, warnM: -1, cooldownUntil: -1, rejectedUntil: -1, maxStage: stage, startStage: stage, lastAcqM: -999, hist: [] };
}
function defaultCredit() { return { nat: { app: 'std', adj: 0 }, ovs: { app: 'std', adj: 0 }, hedge: 0.8 }; }

const stageOf = () => G.stage || 0;
const reqCR = () => STAGES[stageOf()].reqCR;
function natLevelSum() { return G.net ? sum(NATIONS, R => G.net[R.id].lv) : 0; }
function ovsLevelSum() { return G.net ? sum(OVERSEAS, R => G.net[R.id].lv) : 0; }

/* ---------- 預金の内訳 ---------- */
function natOrd() { return G.net ? sum(NATIONS, R => G.net[R.id].ord) : 0; }
function natTime() { return G.net ? sum(NATIONS, R => G.net[R.id].time) : 0; }
function natDep() { return natOrd() + natTime(); }
function cityOrd() { return B('depOrd') - natOrd(); }
function cityTime() { return B('depTime') - natTime(); }
function cityDeposits() { return cityOrd() + cityTime(); }
function domDeposits() { return B('depOrd') + B('depTime'); }
function natMarketDep() { return sum(NATIONS, R => R.dep) * 1e12; }
/* 国内の預金シェア（%）。全国の預金市場＋汐見市 */
function natShare() { return domDeposits() / (natMarketDep() + cityStats().depMkt) * 100; }

/* ---------- 店舗網の規模 ---------- */
function regionStaff(a) { const r = G.net[a]; return Math.round(regionLevels(a)[r.lv].staff * regionScale(a)); }
function regionBranches(a) {
  const r = G.net[a];
  const n = regionLevels(a)[r.lv].br;
  return n <= 2 ? n : Math.max(1, Math.round(n * Math.pow(regionScale(a), 0.6)));
}
function netStaff() { return G.net ? sum(NATIONS.concat(OVERSEAS), R => regionStaff(R.id)) : 0; }
function netBranches() { return G.net ? sum(NATIONS.concat(OVERSEAS), R => regionBranches(R.id)) : 0; }
function regionOpex(a) {
  const r = G.net[a], LV = regionLevels(a), sc = regionScale(a);
  let x = LV[r.lv].opex * sc;
  if (r.build) x += Math.max(0, LV[r.build.to].opex - LV[r.lv].opex) * sc * 0.25; // 開設準備
  return x;
}

/* ---------- リテール・中小企業ポートフォリオ（G.loans の kind:'seg'） ---------- */
function segMix(a, lv) {
  if (isOvsArea(a)) return lv >= 3 ? { retail: 0.3, sme: 0.7 } : { retail: 0, sme: 1 };
  return { retail: SEG.retail.mix, sme: SEG.sme.mix };
}
const segName = (a, seg) => (isOvsArea(a) ? SEG[seg].ovsName : SEG[seg].name);
function segLoans(a) { return G.loans.filter(L => L.kind === 'seg' && isActiveLoan(L) && (!a || L.area === a)); }
function areaLoanBal(a) { return sum(segLoans(a), L => L.bal); }
function findSegLoan(a, seg) { return G.loans.find(L => L.kind === 'seg' && L.area === a && L.seg === seg && L.status === 'current'); }
function ensureSegLoan(a, seg) {
  let L = findSegLoan(a, seg);
  if (!L) {
    L = {
      id: 'L' + (++G.seq.loan), kind: 'seg', seg, area: a, district: a, name: `${areaName(a)}・${segName(a, seg)}`, ind: 'seg',
      principal: 0, bal: 0, rate: 0, rate0: 0, termM: 0, startM: G.m, endM: G.m + 9999, repay: 'pool', status: 'current', dpd: 0, arrears: 0,
      cls: 0, provision: 0, paidInt: 0, restructured: false, ioUntil: -1, stressUntil: -1, grade: seg === 'retail' ? 3 : 5, fraudKnown: false,
      vr: 1, pd: SEG[seg].pd, npl: 0, lossYTD: 0,
    };
    G.loans.push(L);
  }
  return L;
}
function segRate(L) {
  const S = SEG[L.seg], ovs = isOvsArea(L.area);
  const pol = G.credit[ovs ? 'ovs' : 'nat'];
  const base = ovs ? G.net[L.area].rate + S.ovsSpread : G.rates.prime + S.spread;
  return Math.max(0.2, base + pol.adj);
}
const segLGD = L => SEG[L.seg].lgd + (isOvsArea(L.area) ? 0.1 : 0);
function segPD(L) {
  const S = SEG[L.seg], a = L.area, r = G.net[a];
  let pd = S.pd * Math.pow(G.eco.defMult / 0.9, 0.7) * (L.vr || 1) * Math.exp(-(r.vit - 100) / 50);
  if (isOvsArea(a)) pd *= COUNTRY_PD[OVSR[a].risk];
  if (r.pdUntil >= G.m) pd *= r.pdMul;
  return clamp(pd, 0.05, 35);
}
function segTarget(L) {
  const a = L.area, r = G.net[a], ovs = isOvsArea(a), R = regionDef(a);
  const lvd = regionLevels(a)[r.lv];
  if (!lvd || !lvd.loan || r.frozenUntil > G.m) return 0;
  const pol = G.credit[ovs ? 'ovs' : 'nat'];
  const mix = segMix(a, r.lv)[L.seg];
  const dem = ovs ? clamp(r.vit / 100, 0.6, 1.4) : clamp(G.eco.demand * r.vit / 100, 0.45, 1.5);
  const trustF = clamp(Math.pow(G.trust / 65, 0.5), 0.6, 1.2);
  return R.loan * 1e12 * lvd.loan * mix * APPETITE[pol.app].vol * Math.exp(-1.5 * pol.adj) * dem * trustF / (ovs ? 1 : Math.sqrt(R.compet));
}
/* 月次：利息・延滞と償却・約定返済・新規実行 */
function processSegPool(L) {
  const S = SEG[L.seg];
  const ovs = isOvsArea(L.area);
  L.rate = segRate(L);
  L.pd = segPD(L);
  const bal0 = L.bal;
  if (L.bal > 0) {
    const interest = Math.round(L.bal * L.rate / 1200);
    receive(interest, 'intLoans', ovs ? '貸出金利息の受入（海外拠点）' : '貸出金利息の受入（全国の店舗網）');
    L.paidInt += interest;
    const pdM = 1 - Math.pow(1 - Math.min(0.9, L.pd / 100), 1 / 12);
    const def = Math.min(L.bal, Math.round(L.bal * pdM * Math.exp(randn() * 0.15)));
    if (def > 0) {
      const rec = Math.round(def * (1 - segLGD(L)));
      if (rec > 0) { post('延滞債権の回収（担保処分・保証履行）', [['boj', rec, 0], ['loans', 0, rec]]); L.bal -= rec; }
      writeOffAmount(L, def - rec, ovs ? '貸出金の償却（海外拠点）' : '貸出金の償却（全国の店舗網）');
      L.lossYTD = (L.lossYTD || 0) + (def - rec);
    }
    const rep = Math.min(L.bal, Math.round(L.bal * S.repay));
    if (rep > 0) { post('貸出金の回収（約定返済）', [['boj', rep, 0], ['loans', 0, rep]]); L.bal -= rep; }
  }
  const target = segTarget(L);
  let nw = Math.round(Math.max(0, bal0 + (target - bal0) * 0.06 - L.bal));
  if (G.flags.lendingBan > G.m) nw = 0;
  if (coreLoad() > 1) nw = Math.round(nw * 0.3); // システムの処理能力不足で新規の受付を絞る
  if (nw > 0 && !ensureFunds(nw)) nw = Math.max(0, Math.min(nw, B('boj') - requiredReserve()));
  if (nw > 0) {
    const pol = G.credit[ovs ? 'ovs' : 'nat'];
    const f = APPETITE[pol.app].risk * Math.exp(0.5 * pol.adj);
    L.vr = ((L.vr || 1) * L.bal + f * nw) / (L.bal + nw);
    post(ovs ? '融資の実行（海外拠点）' : '融資の実行（全国の店舗網）', [['loans', nw, 0], ['boj', 0, nw]]);
    L.bal += nw; L.principal += nw;
  }
  // 不良債権の残高（延滞・条件変更先）。バルクセールの後は1年かけて積み上がる
  const refill = L.nplSoldM !== undefined ? clamp((G.m - L.nplSoldM) / 12, 0, 1) : 1;
  L.npl = Math.round(L.bal * Math.min(0.4, L.pd / 100 * 1.2) * refill);
}
/* 不良債権のバルクセール（全国 nat／海外 ovs の店舗網が抱える延滞債権をまとめて売る） */
function nplBulkQuote(scope) {
  let face = 0, price = 0;
  for (const L of segLoans()) {
    if ((scope === 'ovs') !== isOvsArea(L.area) || !(L.npl > 0)) continue;
    face += L.npl;
    price += L.npl * Math.max(0.05, 1 - segLGD(L) * 1.25);
  }
  return { face: Math.round(face), price: Math.round(price) };
}
function nplBulkSale(scope) {
  const q = nplBulkQuote(scope);
  if (q.face < 1e8) return { ok: false, msg: '売却できる不良債権がほとんどありません' };
  for (const L of segLoans()) {
    if ((scope === 'ovs') !== isOvsArea(L.area) || !(L.npl > 0)) continue;
    const x = Math.min(L.bal, L.npl);
    const p = Math.round(x * Math.max(0.05, 1 - segLGD(L) * 1.25));
    post('不良債権のバルクセール（入金）', [['boj', p, 0], ['loans', 0, p]]);
    L.bal -= p;
    writeOffAmount(L, x - p, '不良債権のバルクセールによる売却損');
    L.npl = 0; L.nplSoldM = G.m;
  }
  trueUpProvisions();
  G.stats.nplSold++;
  addNews('bank', `${scope === 'ovs' ? '海外拠点' : '全国の店舗網'}の不良債権${fmtYen(q.face)}を投資ファンドに一括売却（売却額${fmtYen(q.price)}）`, 'neutral');
  return { ok: true, q };
}

/* ---------- 国内の地域：預金 ---------- */
function natDepTarget(R) {
  const r = G.net[R.id], lvd = NAT_LEVELS[r.lv];
  if (!lvd.dep) return { ord: 0, time: 0 };
  const rt = G.rates, e = G.eco;
  const rfOrd = clamp(Math.exp(2.5 * (rt.ord - e.mktOrd)), 0.75, 1.6);
  const rfTime = clamp(Math.exp(4.0 * (rt.time - e.mktTime)), 0.6, 2.5);
  const trustF = clamp(Math.pow(G.trust / 65, 0.8), 0.4, 1.3);
  const base = R.dep * 1e12 * lvd.dep * trustF * (1 + 0.05 * G.sys.digital) * clamp(r.vit / 100, 0.85, 1.15) / Math.sqrt(R.compet);
  return { ord: base * (1 - R.time) * rfOrd, time: base * R.time * rfTime };
}
function natDepositStep(R) {
  const r = G.net[R.id];
  if (!r.lv && r.ord + r.time <= 0) return;
  const t = natDepTarget(R);
  let dO = (t.ord - r.ord) * 0.06 + r.ord * randn() * 0.004;
  let dT = (t.time - r.time) * 0.05 + r.time * randn() * 0.002;
  if (coreLoad() > 1) { if (dO > 0) dO *= 0.3; if (dT > 0) dT *= 0.3; }
  if (G.trust < 30) { dO -= r.ord * (30 - G.trust) / 30 * 0.1; dT -= r.time * (30 - G.trust) / 30 * 0.04; }
  if (G.runShock) { dO -= r.ord * G.runShock * 0.7; dT -= r.time * G.runShock * 0.3; }
  dO = Math.round(Math.max(-r.ord, dO)); dT = Math.round(Math.max(-r.time, dT));
  const inO = Math.max(0, dO), inT = Math.max(0, dT), outO = Math.max(0, -dO), outT = Math.max(0, -dT);
  if (inO + inT > 0) post('預金の純増（全国の店舗網）', [['boj', inO + inT, 0], ['depOrd', 0, inO], ['depTime', 0, inT]]);
  if (outO + outT > 0) { ensureFunds(outO + outT); post('預金の純減（全国の店舗網）', [['depOrd', outO, 0], ['depTime', outT, 0], ['boj', 0, outO + outT]]); }
  r.ord += dO; r.time += dT;
  r.tRate += (G.rates.time - r.tRate) / 12;
}

/* ---------- 海外の地域：金利・為替・預金・外貨調達 ---------- */
function ovsDepTarget(R) {
  const r = G.net[R.id], lvd = OVS_LEVELS[r.lv];
  if (!lvd.dep) return 0;
  return R.dep * 1e12 * lvd.dep * clamp(Math.pow(G.trust / 65, 0.6), 0.5, 1.2) * clamp(r.vit / 100, 0.7, 1.3);
}
function fxRevalue(a, dfx) {
  const r = G.net[a];
  const loans0 = areaLoanBal(a), dep0 = r.dep;
  let dL = 0;
  for (const L of segLoans(a)) { const d = Math.round(L.bal * dfx); L.bal += d; dL += d; }
  const dD = Math.round(dep0 * dfx);
  r.dep += dD;
  const hs = -Math.round(Math.max(0, loans0 - dep0) * G.credit.hedge * dfx); // 為替スワップ（ヘッジ）の損益
  const pl = dL - dD + hs;
  const lines = [];
  if (dL > 0) lines.push(['loans', dL, 0]); else if (dL < 0) lines.push(['loans', 0, -dL]);
  if (dD > 0) lines.push(['depFx', 0, dD]); else if (dD < 0) lines.push(['depFx', -dD, 0]);
  if (hs > 0) lines.push(['boj', hs, 0]); else if (hs < 0) { ensureFunds(-hs); lines.push(['boj', 0, -hs]); }
  if (pl > 0) lines.push(['fxGain', 0, pl]); else if (pl < 0) lines.push(['fxLoss', -pl, 0]);
  post('外貨建資産・負債の円換算（為替の変動）', lines);
  r.fxPL = (r.fxPL || 0) + pl;
}
function ovsStep(R) {
  const a = R.id, r = G.net[a], e = G.eco;
  r.rate = clamp(r.rate + (R.rate0 + 0.5 * (e.policy - 0.5) - r.rate) * 0.04 + randn() * 0.05, 0, 40);
  const vt = 100 + 5 * (R.growth - 2.5) + 6 * (e.gdp - 1);
  r.vit = clamp(r.vit + (vt - r.vit) * 0.05 + randn() * 0.8, 40, 170);
  r.land = clamp(r.land * (1 + (R.growth * 0.6 + (r.vit - 100) / 10) / 1200 + randn() * 0.003), 30, 400);
  const dfx = clamp(R.fxVol * randn() - 0.04 * Math.log(r.fx) + (e.regime === 'crisis' ? -0.012 : 0), -0.25, 0.25);
  r.fx *= 1 + dfx;
  r.lastFx = dfx;
  if (r.basisUntil < G.m) r.basis += (0.3 - r.basis) * 0.3;
  if (areaLoanBal(a) <= 0 && r.dep <= 0 && !r.lv) return;
  if (areaLoanBal(a) > 0 || r.dep > 0) fxRevalue(a, dfx);
  // 現地での預金
  let dD = (ovsDepTarget(R) - r.dep) * 0.05 + r.dep * randn() * 0.006;
  if (G.trust < 30) dD -= r.dep * 0.05;
  dD = Math.round(Math.max(-r.dep, dD));
  if (dD > 0) post('海外店預金の純増', [['boj', dD, 0], ['depFx', 0, dD]]);
  else if (dD < 0) { ensureFunds(-dD); post('海外店預金の純減', [['depFx', -dD, 0], ['boj', 0, -dD]]); }
  r.dep += dD;
  const di = Math.round(r.dep * r.rate * 0.6 / 1200);
  if (di > 0) { post('海外店預金利息の元加', [['intDep', di, 0], ['depFx', 0, di]]); r.dep += di; }
  // 貸出が現地の預金を上回る分は、円資金を為替スワップで外貨に換えて調達する
  r.gap = Math.max(0, areaLoanBal(a) - r.dep);
  const fc = Math.round(r.gap * G.credit.hedge * Math.max(0, r.rate - e.policy + r.basis) / 1200);
  payOut(fc, 'fundingCost', '外貨調達費用（為替スワップ）');
}
/* 支払前に資金を確保して費用を計上する */
function payOut(amount, acct, desc) {
  amount = Math.round(amount);
  if (amount <= 0) return;
  ensureFunds(amount);
  payExpense(amount, acct, desc);
}

/* ---------- 月末：ネットワーク全体の処理 ---------- */
function networkMonthEnd() {
  if (!G.net) return;
  const e = G.eco;
  for (const R of NATIONS) {
    const r = G.net[R.id];
    const tgt = 100 + 5 * (e.gdp - 1) + (R.dep >= 150 ? 3 : R.dep < 60 ? -3 : 0);
    r.vit = clamp(r.vit + (tgt - r.vit) * 0.05 + randn() * 0.6, 50, 160);
    r.land = clamp(r.land * (1 + REGIMES[e.regime].land * (R.dep >= 100 ? 1 : 0.6) / 1200 + randn() * 0.002), 30, 300);
    natDepositStep(R);
  }
  for (const R of OVERSEAS) ovsStep(R);
  for (const L of G.loans) if (L.kind === 'seg' && isActiveLoan(L)) processSegPool(L);
  networkCosts();
  amortizeGoodwill();
}
function networkCosts() {
  let natOp = 0, ovsOp = 0;
  for (const R of NATIONS) natOp += regionOpex(R.id);
  for (const R of OVERSEAS) ovsOp += regionOpex(R.id);
  payOut(natOp * 0.55, 'personnel', '全国の店舗網の人件費');
  payOut(natOp * 0.45, 'premises', '全国の店舗網の物件費');
  payOut(ovsOp * 0.55, 'personnel', '海外拠点の人件費');
  payOut(ovsOp * 0.45, 'premises', '海外拠点の物件費');
  const f = networkFees();
  const natFee = f.nat / 12, ovsFee = f.ovs / 12;
  receive(Math.round(natFee), 'fees', '役務取引等収益（全国の店舗網：融資関連・保険・資産運用）');
  receive(Math.round(ovsFee), 'fees', '役務取引等収益（海外拠点：貿易金融・送金）');
}
/* 店舗網が生む手数料（年額）：融資関連・保険と投信の販売・資産運用・決済、海外は貿易金融・送金 */
function networkFees() {
  let nat = natDep() * 0.0015, ovs = 0;
  for (const L of segLoans()) {
    if (isOvsArea(L.area)) ovs += L.bal * 0.004; else nat += L.bal * 0.003;
  }
  for (const R of OVERSEAS) ovs += G.net[R.id].dep * 0.002;
  return { nat, ovs };
}
function amortizeGoodwill() {
  let t = 0;
  for (const g of G.goodwill) {
    const d = Math.min(g.book, Math.round(g.cost / g.life));
    g.book -= d; t += d;
  }
  if (t > 0) post('のれん償却', [['otherExp', t, 0], ['goodwill', 0, t]]);
  G.goodwill = G.goodwill.filter(g => g.book > 0);
}

/* ---------- 翌月：工事の完了・買収先の問題の発覚・大型リスク ---------- */

/* ---------- 店舗網の拡大・撤退 ---------- */

function buildRegion(a) {

/* 必要な資金を用意する（コール・日銀借入で足りなければ国債を売る） */

/* 地域からの撤退。forced=格下げに伴う売却（条件が悪い） */

/* ---------- 買収（国内：地方銀行、海外：現地の有力銀行） ---------- */
const NAT_BANK_PRE = { 'n-shutoken': '武蔵野', 'n-kansai': '浪速', 'n-chubu': '尾張', 'n-kitakanto': '上毛', 'n-hokuriku': '越州', 'n-tohoku': 'みちのく', 'n-hokkaido': '蝦夷', 'n-chushikoku': '瀬戸内', 'n-kyushu': '筑紫' };
const OVS_BANK_NAME = { 'o-na': 'ハドソン・ナショナル銀行', 'o-eu': 'ラインラント商業銀行', 'o-cn': '東亜聯合銀行', 'o-sea': 'マラッカ・ユナイテッド銀行', 'o-in': 'デカン・フィナンシャル', 'o-me': 'ガルフ・コマーシャル銀行', 'o-latam': 'バンコ・ソル・アメリカーノ', 'o-oc': 'サザンクロス銀行' };
function acqQuote(a) {

  }
  const d = Math.round(R.dep * 1e12 * (LV[to].dep - LV[r.lv].dep));
  const l = Math.round(R.loan * 1e12 * (LV[to].loan - LV[r.lv].loan));
  const na = Math.round(d * (ovs ? 0.08 : 0.05));
  const price = Math.round(na * r.quote.prem);
  const name = ovs ? OVS_BANK_NAME[a] : `${NAT_BANK_PRE[a]}銀行`;
  const rw = isOvsArea(a) ? (0.3 * SEG.retail.rw + 0.7 * SEG.sme.rw) * (1 + 0.15 * (OVSR[a].risk - 1)) : SEG.retail.mix * SEG.retail.rw + SEG.sme.mix * SEG.sme.rw;
  return { to, d, l, na, price, goodwill: price - na, prem: r.quote.prem, name, addRWA: l * rw + (l * 0.012 + d * 0.002) * 1.875 };
}
function proFormaCR(addCore, addRWA) {

}
function marketCap() { return G.stock.price * G.stock.shares; }
function acqCheck(a, method) {
  const r = G.net[a], ovs = isOvsArea(a), st = stageOf();
  if (!ovs && st < 1) return { ok: false, msg: '地方銀行の買収はメガバンクに格上げされてから行えます' };
  if (ovs && st < 2) return { ok: false, msg: '海外の銀行の買収はテラバンクに格上げされてから行えます' };
  if (!ovs && r.lv > 2) return { ok: false, msg: 'すでに地域全域に店舗網があります' };
  if (ovs && (r.lv < 1 || r.lv > 3)) return { ok: false, msg: r.lv < 1 ? 'まず駐在員事務所を開いて現地を調べる必要があります' : 'すでに現地の有力銀行を傘下に持っています' };
  if (r.build) return { ok: false, msg: '拡大の準備中は買収できません' };
  if (G.flags.order > G.m) return { ok: false, msg: '業務改善命令の期間中は買収できません' };
  if (r.frozenUntil > G.m) return { ok: false, msg: '当局から業務の制限を受けています' };
  if (G.m - G.stageInfo.lastAcqM < 12) return { ok: false, msg: `買収は1年に1件までです（次は${ymLabel(G.stageInfo.lastAcqM + 12)}から）` };
  const q = acqQuote(a);
  if (method === 'stock' && q.price > marketCap()) return { ok: false, msg: `株式交換で発行できる株式は時価総額（${fmtYen(marketCap())}）までです`, q };
  const net = q.d + q.na - q.l - (method === 'cash' ? q.price : 0); // 買収で手元に入る資金（マイナスなら持ち出し）
  if (net < 0 && !canFund(-net)) return { ok: false, msg: `買収に必要な資金（${fmtYen(-net)}）が足りません`, q };
  const cr = proFormaCR((method === 'stock' ? q.price : 0) - q.goodwill, q.addRWA);
  if (cr < reqCR() + 1) return { ok: false, msg: `買収後の自己資本比率が${fmtPct(cr)}となり、当局の認可が下りません（${fmtPct(reqCR() + 1)}以上が必要）`, q, cr };
  return { ok: true, q, cr };
}
function acquireRegion(a, method) {
  const c = acqCheck(a, method);
  if (!c.ok) return c;
  const q = c.q, r = G.net[a], R = regionDef(a), ovs = isOvsArea(a);
  const mix = segMix(a, q.to);
  let lsum = 0;
  const parts = [];
  for (const seg of ['retail', 'sme']) {
    const x = Math.round(q.l * mix[seg]);
    if (x > 0) { parts.push([seg, x]); lsum += x; }
  }
  const cashIn = q.d + q.na - lsum; // 買収先の手元資金（預け金・有価証券）
  const depLines = [];
  let dOrd = 0, dTime = 0;
  if (ovs) depLines.push(['depFx', 0, q.d]);
  else { dTime = Math.round(q.d * R.time); dOrd = q.d - dTime; depLines.push(['depOrd', 0, dOrd], ['depTime', 0, dTime]); }
  if (method === 'stock') {
    const half = Math.round(q.price / 2);
    if (cashIn < 0) ensureFunds(-cashIn);
    post(`${q.name}の買収（株式交換）`, [['loans', lsum, 0], cashIn >= 0 ? ['boj', cashIn, 0] : ['boj', 0, -cashIn], ['goodwill', q.goodwill, 0], ...depLines, ['capital', 0, half], ['capSurplus', 0, q.price - half]]);
    const sh = Math.round(q.price / (G.stock.price * 0.97));
    G.shareholders.dilution = (G.shareholders.dilution || 0) + q.price / marketCap() * 0.4;

  G.goodwill.push({ id: 'W' + (++G.seq.asset), area: a, name: q.name, cost: q.goodwill, book: q.goodwill, m0: G.m, life: 240 });
  r.lv = q.to; r.build = null; r.quote = null; r.lvM = G.m;
  if (r.since < 0) r.since = G.m;
  if (chance(ovs ? 0.45 : 0.35)) r.shock = { m: G.m + randInt(3, 9), mul: +uni(1.8, 2.6).toFixed(2), name: q.name };
  payOut(q.na * 0.04, 'extraLoss', '経営統合費用（システム統合・店舗の再編）');
  G.stageInfo.lastAcqM = G.m;
  G.trust = clamp(G.trust + 1, 0, 100);
  addNews('bank', `${q.name}を${method === 'stock' ? '株式交換で' : ''}買収（買収額${fmtYen(q.price)}、のれん${fmtYen(q.goodwill)}）。${R.name}の預金${fmtYen(q.d)}・貸出${fmtYen(lsum)}を引き継いだ`, 'good');

/* ---------- 格上げの条件・審査 ---------- */
function stageRequirements(to) {
  const cr = capitalRatio(), npl = nplRatio(), ta = totalAssets();

    add('行政処分', '業務改善命令の期間外', G.flags.order > G.m ? '命令の期間中' : 'なし', G.flags.order <= G.m);
  } else if (to === 2) {

const REVIEW_COST = [0, 2e8, 30e8];

/* メガバンクの誕生：全国の地方銀行2行と経営統合（株式交換・対等の条件） */
function promotionMerger() {

  const names = [];

    const mix = segMix(a, 3);
    const parts = [];

    const dTime = Math.round(q.d * R.time), dOrd = q.d - dTime;

    if (cashIn < 0) ensureFunds(-cashIn);
    post('経営統合（株式交換）による資産・負債の承継', [['loans', lsum, 0], ['tangible', tang, 0], cashIn >= 0 ? ['boj', cashIn, 0] : ['boj', 0, -cashIn],

    G.assets.push({ id: 'F' + (++G.seq.asset), name: `勘定系システム（${SYSTEMS.core.levels[4].name}・統合相手から承継）`, kind: 'intangible', cost: 45e8, life: 60, m0: G.m - 20, book: v });

function promote(to) {

    addNews('bank', `${G.bankName}は${mg.names.join('・')}と経営統合し、メガバンク・グループが誕生。預金${fmtYen(mg.D)}・貸出${fmtYen(mg.L)}を引き継いだ`, 'good');
  }
  si.since = G.m; si.strikes = 0; si.maxStage = Math.max(si.maxStage, to);
  si.hist.push({ m: G.m, from: to - 1, to, kind: 'up' });
  G.trust = clamp(G.trust + 6, 0, 100);
  G.stock.price *= 1.15;
  if (G.fsa.nextM > G.m + 12) G.fsa.nextM = G.m + randInt(8, 12);
  addNews('bank', to === 1
    ? `${G.bankName}がメガバンクに格上げ。全国展開の認可を受け、日本各地に店舗網を広げられるようになった`
    : `${G.bankName}がテラバンクに格上げ。グローバルなシステム上重要な銀行として、海外への展開を認められた`, 'good');
  G.pendingModals.push({ type: 'stage', kind: 'up', to, merger: to === 1 ? si.merger : null });
}

/* ---------- 維持基準と格下げ ---------- */
function maintChecks(st) {
  const S = STAGES[st];
  const cr = capitalRatio(), npl = nplRatio(), l = lcr();
  const o = [
    { name: '自己資本比率', need: `${S.reqCR}%以上`, cur: fmtPct(cr), ok: cr >= S.reqCR },
    { name: '格付', need: `${RATINGS[S.minRating]}以上`, cur: RATINGS[G.ratingIdx], ok: G.ratingIdx <= S.minRating },
    { name: '不良債権比率', need: `${S.maxNpl}%以下`, cur: fmtPct(npl), ok: npl <= S.maxNpl },
    { name: '流動性カバレッジ比率', need: '100%以上', cur: fmtPct(l, 0), ok: l >= 100 },
  ];
  if (st >= 2) o.push({ name: 'マネロン・不正取引検知', need: 'Lv3', cur: 'Lv' + G.sys.aml, ok: G.sys.aml >= 3 });
  return o;
}
function stageQuarterly() {
  const st = stageOf();
  if (st < 1 || G.over) return;
  const S = STAGES[st], si = G.stageInfo;
  const cr = capitalRatio();
  if (cr < S.reqCR * 0.6) { demote(`自己資本比率が${fmtPct(cr)}まで低下し、${S.name}の最低基準（${fmtPct(S.reqCR)}）を大きく下回った`); return; }
  const ng = maintChecks(st).filter(x => !x.ok);
  if (!ng.length) {
    if (si.strikes) addNews('reg', `${S.name}の維持基準を回復。格下げは回避された`, 'good');
    si.strikes = 0;
    return;
  }
  si.strikes++;
  if (si.strikes >= 2) { demote(`${ng.map(x => x.name).join('・')}が2四半期続けて${S.name}の維持基準を満たさなかった`); return; }
  si.warnM = G.m;
  addNews('reg', `【格下げ警告】${S.name}の維持基準を満たしていない（${ng.map(x => `${x.name} ${x.cur}`).join('、')}）。次の四半期も未達なら${STAGES[st - 1].name}へ格下げされる`, 'bad');
  G.pendingModals.push({ type: 'stage', kind: 'warn', ng: ng.map(x => `${x.name}：${x.cur}（基準 ${x.need}）`) });
}
function demote(reason) {
  const from = stageOf(), to = from - 1;
  if (from < 1) return;
  const pl0 = curProfit();
  const exits = (from === 2 ? OVERSEAS : NATIONS).filter(R => G.net[R.id].lv > 0 || G.net[R.id].build);
  for (const R of exits) exitRegion(R.id, true);
  const loss = pl0 - curProfit();
  const si = G.stageInfo;
  G.stage = to;
  si.since = G.m; si.strikes = 0; si.review = null; si.cooldownUntil = G.m + 36;
  si.hist.push({ m: G.m, from, to, kind: 'down', reason });
  G.trust = clamp(G.trust - (from === 2 ? 20 : 15), 0, 100);
  G.scandalHeat += 10;
  G.stock.price *= 0.65;
  G.ratingPenalty = (G.ratingPenalty || 0) + 10;
  updateRating();
  addNews('reg', `【格下げ】${G.bankName}は${STAGES[from].name}から${STAGES[to].name}に格下げされた。${reason}。${from === 2 ? '海外の拠点' : '全国の店舗網'}を売却し、損失${fmtYen(Math.max(0, loss))}を計上`, 'bad');
  G.pendingModals.push({ type: 'stage', kind: 'down', from, to, reason, loss: Math.max(0, loss), n: exits.length });
}

/* ---------- 規模が大きいほど大きくなるリスク ---------- */
function stageEventsStep() {
  const st = stageOf();
  const ta = totalAssets();
  const acc = accountsCount();
  // 全国規模のシステム障害
  if (chance(0.003 + clamp(coreLoad() - 0.9, 0, 0.6) * 0.1)) {
    const cost = Math.round(acc * uni(150, 450));
    payOut(cost, 'extraLoss', '大規模システム障害の補償・対応費用');
    G.trust = clamp(G.trust - uni(8, 14), 0, 100);
    G.scandalHeat += 8; G.stats.sysFailures++; G.fsa.special = true;
    const again = G.lastBigOutage !== undefined && G.m - G.lastBigOutage < 24;
    G.lastBigOutage = G.m;
    addNews('bank', `全国のATMとネットバンキングが終日停止する大規模システム障害が発生。補償と対応の費用は${fmtYen(cost)}${again ? '。度重なる障害に金融庁が業務改善命令を発出' : ''}`, 'bad');
    if (again) { G.flags.order = G.m + 12; G.stock.price *= 0.9; }
  }
  // 不正販売・顧客情報の流出などの不祥事
  if (chance(0.003 * (1 + 0.5 * st) * clamp(1.6 - compRatio(), 0.4, 1.6))) {
    const cost = Math.round(ta * uni(0.0002, 0.0008));
    payOut(cost, 'extraLoss', '不祥事に伴う顧客への補償・制裁金');
    G.trust = clamp(G.trust - uni(6, 10), 0, 100);
    G.scandalHeat += 8; G.stats.scandals++;
    addNews('bank', `${pick(['投資信託の不適切な販売', '顧客情報の大量流出', '高齢者への仕組債の不適切な勧誘', '営業ノルマに起因する不正契約'])}が全国の店舗で発覚。補償など${fmtYen(cost)}`, 'bad');
  }
  // 金融危機時の市場部門の損失
  if (G.eco.regime === 'crisis' && chance(0.08)) {
    const loss = Math.round(ta * uni(0.0003, 0.0015));
    payOut(loss, 'bondLoss', '市場部門の損失（保有有価証券の減損・トレーディング）');
    addNews('bank', `金融市場の混乱で市場部門が${fmtYen(loss)}の損失`, 'bad');
  }
  // 国内の地域での大災害
  for (const R of NATIONS) {
    const r = G.net[R.id];
    if (r.lv >= 1 && chance(0.0015)) {
      r.pdMul = 1.6; r.pdUntil = G.m + 12; r.vit = clamp(r.vit - 10, 50, 160);
      const dmg = Math.round(sum(G.assets.filter(x => x.area === R.id), x => x.book) * 0.03);
      if (dmg > 0) payOut(dmg, 'extraLoss', '災害による店舗の復旧費用');
      addNews('city', `${pick(['大地震', '記録的な豪雨', '大型台風'])}が${R.name}を襲う。地元企業や個人の返済に影響が出る見込み`, 'bad');
    }
  }
  if (st < 2) return;
  const ovsLoans = sum(OVERSEAS, R => areaLoanBal(R.id));
  const pres = OVERSEAS.filter(R => G.net[R.id].lv >= 1);
  // 各国の通貨危機・金融危機
  for (const R of pres) {
    const r = G.net[R.id];
    if (chance(0.0015 * R.risk * (G.eco.regime === 'crisis' ? 3 : 1))) {
      const drop = 0.08 + 0.05 * R.risk * uni(0.7, 1.3);
      r.fx *= 1 - drop;
      if (areaLoanBal(R.id) > 0 || r.dep > 0) fxRevalue(R.id, -drop);
      r.pdMul = 1.5 + 0.5 * R.risk; r.pdUntil = G.m + 12;
      r.vit = clamp(r.vit - 15, 40, 170);
      const out = Math.round(r.dep * 0.15);
      if (out > 0) { ensureFunds(out); post('海外店預金の流出（現地の危機）', [['depFx', out, 0], ['boj', 0, out]]); r.dep -= out; }
      addNews('eco', `${R.name}で通貨危機。現地通貨が約${fmtNum(drop * 100, 0)}%下落し、企業の倒産が急増している`, 'bad');
    }
    // 地政学リスク（資産凍結・規制強化）
    if (R.geo && r.lv >= 2 && chance(0.002)) {
      const ls = segLoans(R.id);
      const w = uni(0.05, 0.15);
      let tot = 0;
      for (const L of ls) { const x = Math.round(L.bal * w); writeOffAmount(L, x, '地政学リスクによる貸出債権の減損'); tot += x; }
      r.pdMul = 2.2; r.pdUntil = G.m + 18; r.frozenUntil = G.m + 12;
      addNews('eco', `${R.name}で地政学的な緊張が高まり、外資系銀行への規制が強化された。当行は${fmtYen(tot)}の減損を計上し、新規業務を1年間停止`, 'bad');
    }
  }
  // マネロン・制裁違反の制裁金（海外当局）
  if (pres.length && chance(0.003 * ovsLevelSum() / 8 * [3, 2, 1.2, 0.5][G.sys.aml])) {
    const R = wpick(pres, pres.map(x => x.reg));
    const fine = Math.round(uni(300e8, 3000e8) * clamp(ovsLoans / 5e12, 0.2, 2));
    payOut(fine, 'extraLoss', '海外当局への制裁金（マネロン・経済制裁違反）');
    G.net[R.id].frozenUntil = G.m + 24;
    G.trust = clamp(G.trust - 8, 0, 100); G.scandalHeat += 10; G.stats.scandals++;
    addNews('reg', `${R.name}の当局が、マネロン対策と経済制裁の違反で当行に${fmtYen(fine)}の制裁金を科した。現地での新規業務は2年間制限される`, 'bad');
  }
  // 外貨調達の逼迫（ドル資金市場の混乱）
  const gap = sum(OVERSEAS, R => G.net[R.id].gap || 0);
  if (gap > 0.5e12 && chance(G.eco.regime === 'crisis' ? 0.06 : 0.004)) {
    for (const R of pres) { const r = G.net[R.id]; r.basis = 1.8; r.basisUntil = G.m + 6; }
    G.trust = clamp(G.trust - 3, 0, 100);
    addNews('eco', 'ドル資金市場が逼迫し、為替スワップによる外貨調達のコストが急上昇。外貨の貸出が大きい邦銀に重荷', 'bad');
  }
  // 市場部門の不正取引（ローグトレーダー）
  if (chance(0.0012 * [1.6, 1, 0.6][G.sys.audit] * clamp(1.5 - compRatio(), 0.5, 1.5))) {
    const loss = Math.round(uni(300e8, 2000e8) * clamp(ta / 30e12, 0.3, 2));
    payOut(loss, 'extraLoss', '市場部門の不正取引による損失');
    G.trust = clamp(G.trust - 10, 0, 100); G.scandalHeat += 10; G.stats.scandals++; G.fsa.special = true;
    addNews('bank', `${pick(['ロンドン', 'ニューヨーク', 'シンガポール'])}拠点のトレーダーが損失を隠して無断取引を重ねていたことが発覚。損失は${fmtYen(loss)}`, 'bad');
  }
}

/* ---------- 開業時の店舗網（カスタムスタート） ---------- */
const MEGA_START = { 'n-shutoken': 4, 'n-kansai': 3, 'n-chubu': 3 };
const TERA_START_NAT = { 'n-shutoken': 5, 'n-kansai': 4, 'n-chubu': 4 };
const TERA_START_OVS = { 'o-na': 3, 'o-eu': 3, 'o-sea': 2, 'o-cn': 2, 'o-oc': 1 };
function setRegionMature(a, lv) {
  const r = G.net[a];
  r.lv = lv;
  if (!lv) return;
  r.since = -randInt(24, 120);
  r.lvM = -24;
  if (isNatArea(a)) { const t = natDepTarget(NATR[a]); r.ord = Math.round(t.ord); r.time = Math.round(t.time); r.tRate = G.rates.time; }
  else r.dep = Math.round(ovsDepTarget(OVSR[a]));
  const mix = segMix(a, lv);
  if (regionLevels(a)[lv].loan > 0) {
    for (const seg of ['retail', 'sme']) {
      if (!(mix[seg] > 0)) continue;
      const L = ensureSegLoan(a, seg);
      L.startM = -60;
      L.bal = Math.round(segTarget(L));
      L.principal = L.bal;
      L.pd = segPD(L);
      L.rate = L.rate0 = segRate(L);
    }
  }
  const LV = regionLevels(a);
  let capex = 0;
  for (let i = 1; i <= lv; i++) capex += (LV[i].capex || 0) * regionScale(a);
  if (capex > 0) G.assets.push({ id: 'F' + (++G.seq.asset), name: `${regionDef(a).name}の店舗・設備`, kind: 'tangible', cost: Math.round(capex), life: 180, m0: -60, book: Math.round(capex * 0.55), area: a });
}
function setupNetworkOpening(stage) {
  for (const R of NATIONS) setRegionMature(R.id, stage >= 2 ? (TERA_START_NAT[R.id] || 3) : (MEGA_START[R.id] || 2));
  if (stage >= 2) for (const R of OVERSEAS) setRegionMature(R.id, TERA_START_OVS[R.id] || 0);
}
/* 開業直後の格付に使う年間の収益見込み */
function estimateRunRate() {
  let nii = 0, el = 0, opex = 0;
  for (const L of segLoans()) {
    const ovs = isOvsArea(L.area);
    nii += L.bal * (segRate(L) - (ovs ? G.net[L.area].rate * 0.6 : G.eco.policy)) / 100;
    el += L.bal * segPD(L) / 100 * segLGD(L);
  }
  const depRate = G.rates.ord * 0.58 + G.rates.time * 0.42;
  nii += natDep() * Math.max(0, G.eco.policy - depRate) / 100;
  const nf = networkFees();
  const fees = accountsCount() * 95 * 12 + nf.nat + nf.ovs;
  for (const R of NATIONS.concat(OVERSEAS)) opex += regionOpex(R.id) * 12;
  for (const k of SYS_KEYS) opex += (SYSTEMS[k].levels[G.sys[k]].maint || 0) * 12;
  opex += sum(G.assets, x => x.life ? x.cost / x.life * 12 : 0);
  return { gp: nii + fees, opex, el };
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(b64) {
  const s = atob(b64);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function packSave(str) {
  if (typeof CompressionStream === 'undefined') return 'J' + str;
  try {
    const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
    return 'Z' + bufToB64(await new Response(stream).arrayBuffer());
  } catch (e) { return 'J' + str; }
}
async function unpackSave(s) {
  if (!s) return null;
  if (s[0] === 'J') return s.slice(1);
  if (s[0] === 'Z') {
    const stream = new Blob([b64ToBytes(s.slice(1))]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  return s;
}

/* ---- 11_ui_charts.js ---- */
/* =========================================================
 *  11_ui_charts.js : SVGチャートと汐見市の地図
 *  線は2px、罫線は1pxの細線、ラベルは本文色。値はツールチップと表で確認できる。
 * ========================================================= */

function niceScale(lo, hi, n = 4) {
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  const mid = (lo + hi) / 2, minSpan = Math.abs(mid) * 0.04;
  if (hi - lo < minSpan) { lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
  if (lo === hi) { const d = Math.abs(lo) * 0.1 || 1; lo -= d; hi += d; }
  const raw = (hi - lo) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  return { lo: Math.floor(lo / step + 1e-9) * step, hi: Math.ceil(hi / step - 1e-9) * step, step };
}
function axisYen(v) {
  const a = Math.abs(v), s = v < 0 ? MINUS : '';
  if (a >= 1e12) return s + fmtNum(a / 1e12, a % 1e12 ? 1 : 0) + '兆';
  if (a >= 1e8) return s + fmtNum(a / 1e8, a >= 1e10 || a % 1e8 === 0 ? 0 : 1) + '億';
  if (a >= 1e4) return s + fmtNum(a / 1e4, 0) + '万';
  return s + fmtNum(a, 0);
}
const axisPct = d => v => fmtNum(v, d) + '%';

/* 折れ線（複数系列）。series: [{name, color:'s1', values:[]}] */
const chartW = () => (typeof window !== 'undefined' && window.innerWidth < 640 ? 380 : 640);
function lineChart(o) {
  const W = o.width || chartW(), H = Math.round((o.height || 210) * (chartW() < 640 ? 0.85 : 1));
  const L = 52, R = o.endLabels === false ? 12 : (W < 500 ? 80 : 96), T = 12, Bt = 24;
  const n = o.labels.length;
  if (!n) return '<div class="empty">データがまだありません</div>';
  let lo = Infinity, hi = -Infinity;
  for (const s of o.series) for (const v of s.values) if (v !== null && isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (o.minZero) lo = Math.min(0, lo);
  if (o.yMin !== undefined) lo = Math.min(lo, o.yMin);
  const sc = niceScale(lo, hi, o.ticks || 4);
  const yf = o.yFmt || axisYen;
  const x = i => L + (W - L - R) * (n <= 1 ? 0.5 : i / (n - 1));
  const y = v => T + (H - T - Bt) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  let g = '';
  for (let v = sc.lo; v <= sc.hi + sc.step / 2; v += sc.step) {
    g += `<line class="gl" x1="${L}" x2="${W - R + 4}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${yf(v)}</text>`;
  }
  if (sc.lo < 0 && sc.hi > 0) g += `<line class="ax" x1="${L}" x2="${W - R + 4}" y1="${y(0)}" y2="${y(0)}"/>`;
  const every = Math.max(1, Math.ceil(n / (W < 500 ? 4 : 7)));
  for (let i = 0; i < n; i += every) g += `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.labels[i])}</text>`;
  let paths = '', ends = [];
  for (const s of o.series) {
    let d = '', started = false;
    s.values.forEach((v, i) => {
      if (v === null || !isFinite(v)) { started = false; return; }
      d += `${started ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      started = true;
    });
    paths += `<path d="${d}" fill="none" stroke="var(--${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
    const li = s.values.length - 1;
    const lv = s.values[li];
    if (lv !== null && isFinite(lv)) {
      paths += `<circle cx="${x(li).toFixed(1)}" cy="${y(lv).toFixed(1)}" r="4" fill="var(--${s.color})" stroke="var(--sheet)" stroke-width="2"/>`;
      ends.push({ y: y(lv), s, v: lv });
    }
  }
  let labels = '';
  if (o.endLabels !== false) {
    ends.sort((a, b) => a.y - b.y);
    const ok = ends.every((e, i) => i === 0 || e.y - ends[i - 1].y >= 26);
    if (ok) for (const e of ends) labels += `<text class="glab" x="${W - R + 10}" y="${(e.y - 2).toFixed(1)}">${esc(e.s.name)}</text><text x="${W - R + 10}" y="${(e.y + 11).toFixed(1)}" style="fill:var(--ink-2)">${(o.tipFmt || fmtYen)(e.v)}</text>`;
  }
  let hits = '';
  const tf = o.tipFmt || fmtYen;
  const slot = (W - L - R) / Math.max(1, n - 1);
  for (let i = 0; i < n; i++) {
    const tip = o.labels[i] + '\n' + o.series.map(s => `${s.name}　${s.values[i] === null || !isFinite(s.values[i]) ? '―' : tf(s.values[i])}`).join('\n');
    const x0 = n <= 1 ? L : x(i) - slot / 2;
    hits += `<g class="hitg"><line class="xh" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${T}" y2="${H - Bt}"/><rect class="hit" x="${Math.max(L, x0).toFixed(1)}" y="${T}" width="${(n <= 1 ? W - L - R : slot).toFixed(1)}" height="${H - T - Bt}" data-tip="${esc(tip)}"/></g>`;
  }
  const legend = o.series.length > 1 ? `<div class="legend" style="margin-bottom:6px">${o.series.map(s => `<span><i class="ln" style="background:var(--${s.color})"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `${legend}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || o.series.map(s => s.name).join('・') + 'の推移')}">${g}${paths}${labels}${hits}</svg>`;
}

/* 棒グラフ（正負対応）。値がマイナスの棒は朱色（赤字） */
function barChart(o) {
  const W = o.width || chartW(), H = Math.round((o.height || 190) * (chartW() < 640 ? 0.85 : 1));
  const L = 52, R = 12, T = 12, Bt = 24;
  const n = o.values.length;
  if (!n) return '<div class="empty">データがまだありません</div>';
  const vals = o.values.map(v => (isFinite(v) ? v : 0));
  const sc = niceScale(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const yf = o.yFmt || axisYen;
  const slot = (W - L - R) / n;
  const bw = Math.min(24, slot * 0.62);
  const y = v => T + (H - T - Bt) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  let g = '';
  for (let v = sc.lo; v <= sc.hi + sc.step / 2; v += sc.step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${yf(v)}</text>`;
  const y0 = y(0);
  g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}"/>`;
  const every = Math.max(1, Math.ceil(n / (W < 500 ? 5 : 8)));
  let bars = '';
  vals.forEach((v, i) => {
    const cx = L + slot * (i + 0.5);
    if (i % every === 0) g += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.labels[i])}</text>`;
    const yv = y(v);
    const hgt = Math.abs(yv - y0);
    const r = Math.min(4, hgt, bw / 2);
    const x0 = cx - bw / 2, x1 = cx + bw / 2;
    let d;
    if (hgt < 0.5) d = '';
    else if (v >= 0) d = `M${x0},${y0}V${yv + r}Q${x0},${yv} ${x0 + r},${yv}H${x1 - r}Q${x1},${yv} ${x1},${yv + r}V${y0}Z`;
    else d = `M${x0},${y0}V${yv - r}Q${x0},${yv} ${x0 + r},${yv}H${x1 - r}Q${x1},${yv} ${x1},${yv - r}V${y0}Z`;
    if (d) bars += `<path d="${d}" fill="var(--${v < 0 ? (o.negColor || 'shu') : (o.color || 's1')})"/>`;

function sparkline(values, o = {}) {
  const W = o.w || 96, H = o.h || 22;
  const v = values.filter(x => isFinite(x));
  if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v);
  const span = hi - lo || 1;
  const pts = v.map((x, i) => `${(2 + (W - 4) * i / (v.length - 1)).toFixed(1)},${(H - 3 - (H - 6) * (x - lo) / span).toFixed(1)}`);
  const [lx, ly] = pts[pts.length - 1].split(',');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="vertical-align:middle"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--${o.color || 'ink-3'})" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--${o.color || 'ink-3'})"/></svg>`;
}

/* 区分構成の横帯（セグメントバー） */
function segBar(parts, o = {}) {
  const tot = sum(parts, p => Math.max(0, p.v)) || 1;
  const segs = parts.filter(p => p.v > 0).map(p => `<span style="flex:${p.v / tot};background:var(--${p.color});height:${o.h || 10}px;min-width:2px;border-radius:2px" data-tip="${esc(p.name + '　' + fmtYen(p.v) + '（' + fmtPct(p.v / tot * 100, 1) + '）')}"></span>`).join('');
  const legend = `<div class="legend" style="margin-top:6px">${parts.map(p => `<span><i class="sw" style="background:var(--${p.color})"></i>${esc(p.name)}</span>`).join('')}</div>`;
  return `<div style="display:flex;gap:2px">${segs}</div>${legend}`;
}

const MAP_SEA = [[20, 440], [262, 428], [560, 432], [640, 405], [780, 420], [780, 470], [20, 470]];
const MAP_LOTS = {};
function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function lotsFor(D, idx) {
  if (MAP_LOTS[D.id]) return MAP_LOTS[D.id];
  const r = seeded(1000 + idx * 7919);
  const xs = D.poly.map(p => p[0]), ys = D.poly.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const lots = [];
  let tries = 0;
  while (lots.length < 40 && tries < 4000) {
    tries++;
    const x = x0 + 10 + r() * (x1 - x0 - 20), y = y0 + 10 + r() * (y1 - y0 - 20);
    if (!pointInPoly(x, y, D.poly)) continue;
    if (!pointInPoly(x - 8, y - 10, D.poly) || !pointInPoly(x + 8, y + 4, D.poly)) continue;
    if (Math.hypot(x - D.label[0], y - D.label[1]) < 34) continue;
    if (lots.some(l => Math.abs(l.x - x) < 13 && Math.abs(l.y - y) < 13)) continue;
    lots.push({ x, y, k: r() });
  }
  // 地区の中心に近い区画ほど先に建つ
  lots.sort((a, b) => Math.hypot(a.x - D.label[0], a.y - D.label[1]) - Math.hypot(b.x - D.label[0], b.y - D.label[1]));
  MAP_LOTS[D.id] = lots;
  return lots;
}

function fmtRatio(v, unit) {

function fsTableOf(ys, view, opt = {}) {
  const disp = ys.slice(1);
