/* ---------- 決算書 ---------- */
function ksInvLabel() { const I = ksI(); return I.invAcct === 'mat' ? '材料' : '商品'; }
function ksPLRows(cur, prev) {
  const rows = [];
  const val = (st, f) => (st ? f(st.pl) : null);
  const R = (label, f, cls = 'i1', tk = '', ded = false) => rows.push({ label, c: val(cur, f), p: val(prev, f), cls, tk, ded });
  const H = label => rows.push({ label, head: true });
  const union = key => { const s = new Set(); for (const st of [prev, cur]) if (st) for (const [k] of st.pl[key]) s.add(k); return KS_KEYS.filter(k => s.has(k)); };
  const item = (key, k) => pl => { const e = pl[key].find(x => x[0] === k); return e ? e[1] : 0; };
  const I = ksI();
  const con = G.ind === 'con';
  R(`Ⅰ ${ksSalesName()}`, p => p.sales, 'sum', con ? 'conRev' : 'sales');
  H(`Ⅱ ${con ? '完成工事原価' : '売上原価'}`);
  const kind = cur.pl.cogsDetail.kind;
  if (kind === 'sanbun') {
    const nm = ksInvLabel();
    R(`期首${nm}棚卸高`, p => p.cogsDetail.begin, 'i1', 'begInv');
    R(`当期${I.labels.purch ? I.labels.purch.replace(/高$/, '') + '高' : nm + '仕入高'}`, p => p.cogsDetail.purch, 'i1', 'purch');
    R('合計', p => p.cogsDetail.begin + p.cogsDetail.purch, 'i2');
    R(`期末${nm}棚卸高`, p => -p.cogsDetail.end, 'i1', 'endInv', true);
  } else if (kind === 'mfg') {
    R('期首製品棚卸高', p => p.cogsDetail.begin, 'i1', 'begInv');
    R('当期製品製造原価', p => p.cogsDetail.mfgCost, 'i1', 'mfgCost');
    R('合計', p => p.cogsDetail.begin + p.cogsDetail.mfgCost, 'i2');
    R('期末製品棚卸高', p => -p.cogsDetail.end, 'i1', 'endInv', true);
  } else if (kind === 'con') {
    const parts = p => { const d = p.cogsDetail; const mat = Math.round(d.parts.mat || 0), sub = Math.round(d.parts.sub || 0); return { mat, sub, exp: d.conCost - mat - sub + (d.exp || 0), labor: d.labor }; };
    R('材料費', p => parts(p).mat, 'i1', 'matCost');
    R('労務費（現場監督）', p => parts(p).labor, 'i1', 'labor');
    R('外注費', p => parts(p).sub, 'i1', 'subcon');
    R('経費', p => parts(p).exp, 'i1', 'mfgOH');
  } else {
    R('労務費（エンジニアの給与など）', p => p.cogsDetail.labor + (p.cogsDetail.devTransfer || 0), 'i1', 'labor');
    if ((cur.pl.cogsDetail.devTransfer || 0) || (prev && prev.pl.cogsDetail.devTransfer)) R('ソフトウェア仮勘定への振替', p => -(p.cogsDetail.devTransfer || 0), 'i1', 'intangible', true);
    R('外注費', p => p.cogsDetail.subcon, 'i1', 'subcon');
    R(I.labels.mfgExp || '経費', p => p.cogsDetail.exp, 'i1', 'mfgOH');
  }
  R(con ? '完成工事原価' : '売上原価', p => p.cogs, 'sum', con ? 'conCost' : 'cogs');
  R(con ? '完成工事総利益' : '売上総利益', p => p.gp, 'sum', 'gp');
  H('Ⅲ 販売費及び一般管理費');
  for (const k of union('sgaItems')) R(ksAcctName(k), item('sgaItems', k), 'i1', KS_ACCT[k].tk);
  R('販売費及び一般管理費 合計', p => p.sga, 'sum', 'sga');
  R('営業利益', p => p.opi, 'sum', 'opi');
  const nk = union('noiItems');
  if (nk.length) { H('Ⅳ 営業外収益'); for (const k of nk) R(ksAcctName(k), item('noiItems', k), 'i1', KS_ACCT[k].tk); }
  const ek = union('noeItems');
  if (ek.length) { H('Ⅴ 営業外費用'); for (const k of ek) R(ksAcctName(k), item('noeItems', k), 'i1', KS_ACCT[k].tk); }
  R('経常利益', p => p.ord, 'sum', 'ord');
  const gk = union('exgItems'), lk = union('exlItems');
  if (gk.length) { H('Ⅵ 特別利益'); for (const k of gk) R(ksAcctName(k), item('exgItems', k), 'i1', 'extra'); }
  if (lk.length) { H('Ⅶ 特別損失'); for (const k of lk) R(ksAcctName(k), item('exlItems', k), 'i1', 'extra'); }
  R('税引前当期純利益', p => p.pretax, 'sum', 'pretax');
  R('法人税、住民税及び事業税', p => p.tax, 'i1', 'tax');
  R('当期純利益', p => p.ni, 'grand', 'ni');
  return rows;
}
function ksBSRows(cur, prev) {
  const rows = { a: [], l: [] };
  const v = (st, f) => (st ? f(st.bs) : null);

    const c = v(cur, f), p = v(prev, f);

    rows[side].push({ label, c, p, cls, tk, ded: label === '貸倒引当金' || label === '減価償却累計額' });
  };
  const H = (side, label) => rows[side].push({ label, head: true });
  const nm = k => ksAcctName(k, 'bs');
  const tk = k => KS_ACCT[k].tk;
  const grp = (b, g) => KS_BSK.filter(k => KS_ACCT[k].g === g).reduce((s, k) => s + (KS_ACCT[k].t === 'C' ? -b[k] : b[k]), 0);
  H('a', 'Ⅰ 流動資産');
  for (const k of KS_BSK.filter(k => KS_ACCT[k].g === 'ca')) add('a', nm(k), b => (KS_ACCT[k].t === 'C' ? -b[k] : b[k]), 'i1', tk(k));
  add('a', '流動資産合計', b => grp(b, 'ca'), 'sum', 'ca', true);
  H('a', 'Ⅱ 固定資産');
  for (const k of KS_BSK.filter(k => KS_ACCT[k].g === 'fa')) add('a', nm(k), b => (KS_ACCT[k].t === 'C' ? -b[k] : b[k]), 'i1', tk(k));
  add('a', '有形固定資産合計', b => grp(b, 'fa'), 'sum', 'ppe', true);
  for (const k of KS_BSK.filter(k => KS_ACCT[k].g === 'ia')) add('a', nm(k), b => b[k], 'i1', tk(k));
  add('a', '無形固定資産合計', b => grp(b, 'ia'), 'sum', 'intangible');
  for (const k of KS_BSK.filter(k => KS_ACCT[k].g === 'io')) add('a', nm(k), b => b[k], 'i1', tk(k));
  add('a', '投資その他の資産合計', b => grp(b, 'io'), 'sum', 'invest');
  add('a', '固定資産合計', b => grp(b, 'fa') + grp(b, 'ia') + grp(b, 'io'), 'sum', 'fa', true);

  R('Ⅰ 材料費', p => parts(p).mat, 'i1', 'matCost');

function ksEntryLines(e) {

  }
  return { dr, cr };
}

function ksTrialBalance() {

function ksLedger(k) {

    let bal;

    }
    rows.push(`<tr><td>${ymLabel(j.m)}</td><td class="n">${d ? fmtNum(d) : ''}</td><td class="n">${c ? fmtNum(c) : ''}</td><td class="n">${bal === null || bal === undefined ? '―' : fmtNum(bal)}</td></tr>`);
  }
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>月</th><th class="n">借方（増えた額${ksDebitNature(k) ? '' : 'の逆'}）</th><th class="n">貸方</th><th class="n">月末の残高</th></tr></thead><tbody>${rows.reverse().join('')}</tbody></table></div>

}

      ${as.map(a => `<tr><td>${esc(a.n)}${a.part === 'C' ? ' <span class="tag">製造</span>' : ''}</td><td>${KS_ASSET_NAMES[a.acct] || ''}</td><td>${a.acqM < -60 ? `${ymOf(a.acqM).y}年` : ymLabel(a.acqM)}</td><td class="n">${fmtYen(a.cost)}</td><td class="n">${a.life ? a.life + '年' : '償却しない'}</td><td class="n">${fmtYen(a.booked)}</td><td class="n">${fmtYen(a.cost - a.booked)}</td><td class="n">${a.life ? fmtYen(ksDepFor(a, fy)) : '―'}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">${term('固定資産台帳', 'fixedRegister')}。${term('定額法', 'straightLine')}で、毎年「取得価額÷耐用年数」を${term('減価償却費', 'dep')}にします（期の途中で買った資産は月割）。土地は使っても価値が減らないので償却しません。工場の機械の償却費は製造原価に入ります。</p>`;

function ksBudPreview(bud) {
  return `<table class="t compact"><tbody>${KS_BUD_LINES.map(([k, name, tk, cls]) => `<tr class="${cls === 'grand' ? 'grand' : cls === 'sum' ? 'total' : ''}"><td>${term(k === 'sales' ? ksSalesName() : name, tk)}</td><td class="n">${fmtYen(bud.lines[k])}</td></tr>`).join('')}</tbody></table>`;
}
KS_SCREENS.k_budget = () => {
  const bud = G.budget;
  if (!bud) return '<div class="empty">予算はまだありません</div>';
  const st = bud.status === 'draft' ? tag('予算案', 'warn') : bud.status === 'auto' ? tag('決定（案のまま）') : tag('決定済み', 'ok');
  let form = '';
  if (bud.status === 'draft') {
    const t = bud.t, b = bud.base;
    const f = (k, label, help, step) => `<label class="field"><span>${label}</span><span class="row"><input type="number" step="${step}" value="${t[k]}" data-in="kBudT" data-k="${k}" style="width:90px"><span class="unit">%</span></span><span class="small muted">${help}</span></label>`;
    form = panel(`${ksFyLabel(bud.fy)}の予算案を決める`, `<div class="grid g2" style="gap:16px"><div class="stack" style="gap:10px">
      <p class="small" style="margin:0">直近12か月の実績（${ksSalesName()} ${fmtYen(b.sales)}・粗利 ${fmtYen(b.gp)}）をもとに予算案を作りました。目標を変えると右の予算が計算し直されます。</p>
      ${f('gS', `${ksSalesName()}の伸び（前年比）`, '客数・単価・取引先・受注をどれだけ増やすか。', 0.5)}
      ${f('gm', '売上総利益率（粗利率）', `直近は${fmtPct(b.sales ? b.gp / b.sales * 100 : 0, 1)}。値上げ・仕入の見直しで上がります。`, 0.1)}
      ${f('gPeople', '人件費（販売・事務・役員）の伸び', '採用や昇給の計画。工場・現場の人件費は売上原価に入ります。', 0.5)}
      ${f('gOther', 'その他の経費の伸び', '広告・水道光熱費・修繕など。', 0.5)}
      <div>${btn('この予算で決定する', 'kBudApprove', {}, 'primary')}</div></div>
      <div><div class="small muted" style="margin-bottom:4px">予算（年間）</div><div id="kBudPreview">${ksBudPreview(bud)}</div>
      <p class="note">${term('予算', 'budget')}は、1年の目標を数字にしたものです。銀行も「今期の計画」を聞いてきます。無理な目標は現場を疲れさせ、低すぎる目標は会社を成長させません。</p></div></div>`);
  }
  const va = ksBudgetVA(bud);
  const rows = va.rows.map(r => {
    const diff = !va.n ? '<td>―</td>' : Math.abs(r.diff) < 5e4 ? '<td class="muted">0</td>' : `<td class="${r.fav ? 'pos' : 'neg'}">${r.fav ? '+' : '△'}${fmtK(Math.abs(r.diff))}</td>`;
    const rate = !va.n || !r.cum || r.cum <= 0 || r.a < 0 ? '―' : fmtPct(r.a / r.cum * 100, 1);
    return `<tr class="${r.cls === 'grand' ? 'grand' : r.cls === 'sum' ? 'sum' : ''}"><td>${term(r.k === 'sales' ? ksSalesName() : r.name, r.tk)}</td><td>${fmtK(r.year)}</td><td>${va.n ? fmtK(r.cum) : '―'}</td><td class="${r.a < 0 && !r.cost ? 'neg' : ''}">${va.n ? fmtK(r.a) : '―'}</td>${diff}<td>${rate}</td><td>${fmtK(r.outlook)}</td></tr>`;
  }).join('');
  const ord = va.rows.find(r => r.k === 'ord'), sales = va.rows.find(r => r.k === 'sales'), gp = va.rows.find(r => r.k === 'gp');
  const cm = [];
  if (va.n) {
    if (Math.abs(sales.diff) > Math.abs(sales.cum) * 0.03) cm.push(`${ksSalesName()}は予算比${fmtPct(sales.a / Math.max(1, sales.cum) * 100, 1)}。${sales.fav ? '予算を上回っています。' : '予算に届いていません。客数・単価・受注のどこが足りないかを現場の数字で確かめましょう。'}`);
    const gmA = sales.a ? gp.a / sales.a * 100 : 0;
    if (Math.abs(gmA - bud.t.gm) > 1) cm.push(`粗利率は実績${fmtPct(gmA, 1)}（予算${fmtPct(bud.t.gm, 1)}）。${gmA < bud.t.gm ? '値引き・廃棄・原価の上昇で粗利が削られています。' : '予算より高い粗利率を確保できています。'}`);
    if (ord.outlook < bud.lines.ord - Math.abs(bud.lines.ord) * 0.1) cm.push(`このままだと年間の経常利益は${fmtYen(ord.outlook)}（予算${fmtYen(bud.lines.ord)}）の見通しです。`);
    else if (ord.outlook > bud.lines.ord + Math.abs(bud.lines.ord) * 0.1) cm.push(`年間の経常利益は予算を上回る見通しです（${fmtYen(ord.outlook)}）。`);
  }
  let chart = '';
  if (va.n) {
    const labels = [], plan = [], act = [];
    let cp = 0, ca = 0;
    for (let i = 0; i < 12; i++) {
      const m = bud.fy * 12 + i;
      labels.push(`${ymOf(m).mo}月`);
      cp += ksBudgetMonth(bud, 'ord', i); plan.push(cp);
      const x = G.months.find(y => y.m === m);
      if (x) { ca += x.mg.ord; act.push(ca); } else act.push(null);
    }
    chart = panel('経常利益の累計（予算と実績）', lineChart({ labels, height: 190, series: [{ name: '予算', color: 's2', values: plan, dash: true }, { name: '実績', color: 's1', values: act }] }));
  }
  const ach = G.budgetLast ? (() => {
    const st = G.fys[G.budgetLast.fy];
    if (!st) return '';
    const plan = G.budgetLast.lines.ord, act = st.pl.ord;
    const v = plan > 0 && act >= 0 ? `<b class="num ${act < plan ? 'neg' : 'pos'}">${fmtPct(act / plan * 100, 1)}</b>` : `<b class="num ${act < plan ? 'neg' : 'pos'}">${act < plan ? '未達' : '達成'}</b>`;
    return `<span class="small">前期の経常利益：予算 ${fmtYen(plan)} → 決算 ${fmtYen(act)}（${v}）</span>`;
  })() : '';
  return `<div class="row between" style="margin-bottom:10px"><h1 class="h1" style="margin:0">予算と実績</h1>${ach}</div>
    <p class="lead">${ksFyLabel(bud.fy)}（${ksFyYear(bud.fy)}）の予算 ${st}。毎月の実績（月次決算）と比べ、ずれの原因を探して手を打つのが${term('予実管理', 'yojitsu')}です。</p>
    ${form}<div class="tbl-wrap" style="margin-top:12px"><table class="fs"><thead><tr><th>（千円）</th><th>年間予算</th><th>予算（${va.n ? `${va.n}か月` : '未経過'}）</th><th>実績</th><th>差異</th><th>予算比</th><th>年間見通し</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">差異の「＋」は利益を増やす方向（売上が多い・費用が少ない）、「△」は利益を減らす方向。年間見通し＝実績＋残りの月の予算。予算・実績とも月次の数字（管理会計）です。</p>
    ${cm.length ? `<div class="callout" style="margin-top:10px"><b>予実のポイント</b><ul style="margin:6px 0 0;padding-left:1.2em">${cm.map(c => `<li>${c}</li>`).join('')}</ul></div>` : ''}
    <div style="margin-top:12px">${chart}</div>`;
};

/* ---------- 月の進行 ---------- */
function ksRequestAdvance() {
  if (!G || G.over) return;
  if (G.closing) { showModal('kClose'); return; }
  const fc = ksForecast(1)[0];
  if (UI.settings.confirmAdvance && fc && fc.short) {
    confirmBox('資金が足りなくなる見込みです', `今月末の現預金が<b>${fmtYen(fc.bal)}</b>になる見込みです。足りない分は銀行の緊急融資を頼むことになり、それも受けられなければ会社は続けられません。運転資金を借りるか、支払を見直してから締めることをおすすめします。<br>このまま月末を締めますか？`, '締めて翌月へ', 'kAdvanceNow', {}, true);
    return;
  }
  ksRunAdvance();
}
function ksRunAdvance() {
  UI.modal = null;
  const rep = ksAdvance();
  UI.queue = [];
  if (rep && UI.settings.monthly) UI.queue.push({ name: 'kMonth', args: { m: rep.m } });
  if (G.closing) { G.closing.view = G.closing.i; UI.queue.push({ name: 'kClose', args: {} }); }
  for (const s of (G.pendingModals || [])) UI.queue.push({ name: s.type, args: s });
  G.pendingModals = [];
  if (G.over) UI.queue.push({ name: 'kOver', args: {} });
  render();
  autosave();
  if (UI.queue.length) { const n = UI.queue.shift(); showModal(n.name, n.args); } else drawModal();
}
Object.assign(ACTIONS, {
  kAdvanceNow: () => ksRunAdvance(),
  kCloseOpen: () => { if (G.closing) showModal('kClose'); },
});

/* ---------- 月次報告 ---------- */
function ksMonthTip(x) {
  const mo = calMonth(x.m);
  const I = ksI();
  const tips = [];
  if (mo === 4) tips.push('4月は新しい期の始まり。前期末に計上した未払費用・前払費用を元に戻す「再振替仕訳」をしました（仕訳帳で確かめられます）。');
  if (mo === 5) tips.push('5月は前期の法人税等を納める月です。費用は前期の決算で計上済みなので、今期の利益は減りませんが、現預金は減ります。');
  if (mo === 6 || mo === 12) tips.push('賞与の月は人件費の支払が大きくなります。利益より先にお金が出ていくので、資金繰り表で確かめておきましょう。');
  if (mo === 2) tips.push('来月は決算です。3月末に在庫を数え（実地棚卸）、減価償却費や引当金を計上して決算書を作ります。');
  if ((x.cf.collect || 0) + (x.cf.cashSales || 0) < x.mg.sales * 0.8 && I.inv !== 'con') tips.push('今月は売上より入金が少ない月でした。売掛金が増えると、利益が出ていても現預金は増えません。');

function ksEvaluation() {
  const fys = ksFYList();
  const startFy = fyOf(G.startedM) - 1;
  const base = G.fys[startFy] || G.fys[fys[0]];
  const last = G.fys[fys[fys.length - 1]];
  const bs = st => ksToBankFS(st);
  const b0 = bs(base), b1 = bs(last);
  const parts = [];
  const eqG = b0.EQ > 0 ? b1.EQ / b0.EQ : b1.EQ > 0 ? 2 : 0;
  parts.push({ name: '純資産の成長', pts: Math.round(clamp(interp(eqG, [[0.5, 0], [1, 10], [1.5, 18], [2.2, 25]]), 0, 25)), max: 25, note: `${fmtYen(b0.EQ)} → ${fmtYen(b1.EQ)}` });
  const played = fys.filter(f => f > startFy).map(f => G.fys[f]);
  const ordm = played.length ? sum(played, s => s.pl.ord / Math.max(1, s.pl.sales)) / played.length * 100 : 0;
  const avg = industryAvg(ksI().avg).ordm;
  parts.push({ name: '稼ぐ力', pts: Math.round(clamp(interp(ordm / Math.max(0.5, avg), [[-0.5, 0], [0, 5], [0.5, 12], [1, 18], [1.6, 25]]), 0, 25)), max: 25, note: `経常利益率の平均 ${fmtPct(ordm, 1)}（業界平均 ${fmtPct(avg, 1)}）` });
  const eqR = b1.EQ / b1.TA * 100;
  parts.push({ name: '財務の安全性', pts: Math.round(clamp(interp(eqR, [[0, 0], [10, 6], [30, 14], [50, 20]]), 0, 20)), max: 20, note: `自己資本比率 ${fmtPct(eqR, 1)}` });
  parts.push({ name: '銀行の信頼', pts: Math.round(clamp((10 - (G.grade || 10)) / 9 * 15, 0, 15)), max: 15, note: `格付 ${G.grade}${G.flags.fraudFoundM !== undefined ? '・粉飾の発覚あり' : ''}` });
  const q = G.quiz || { asked: 0, correct: 0 };
  const fraud = Object.values(G.fys).some(s => s.fraudInv) || G.flags.fraudFoundM !== undefined;
  parts.push({ name: '正しい決算', pts: fraud ? 0 : Math.round(q.asked ? q.correct / q.asked * 15 : 8), max: 15, note: fraud ? '在庫の水増し（粉飾）をした' : q.asked ? `決算整理クイズ ${q.correct}/${q.asked}問正解` : '―' });
  const total = sum(parts, p => p.pts);
  const rank = total >= 85 ? 'S' : total >= 70 ? 'A' : total >= 55 ? 'B' : total >= 40 ? 'C' : 'D';
  const title = { S: '地域を代表する名経営者', A: '銀行も一目置く堅実な社長', B: '会社をしっかり守った社長', C: 'まだ伸びしろのある社長', D: '苦しい経営だった社長' }[rank];
  return { parts, total, rank, title };
}

function ksSaveMeta() { return JSON.stringify({ co: G.coName, ceo: G.ceo, m: G.m, ind: G.ind, at: Date.now(), over: !!G.over }); }
function ksDeserialize(s) {
  if (s.version !== KS_SAVE_VERSION || !s.bal) throw new Error('セーブデータの形式が違います');
  G = s;
  G.pendingModals = G.pendingModals || [];
  for (const k of KS_KEYS) if (G.bal[k] === undefined) G.bal[k] = 0;
  if (!G.quiz) G.quiz = { asked: 0, correct: 0 };
  if (!G.flags) G.flags = {};
  return G;
}

const KS_OPS = {};

const KS_FMT = {

function ksCtl(p) {
  const v = G.op[p.k];

    <span class="ctl-in"><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}" data-ch="kOp" data-in="kOpLive" data-k="${p.k}" data-f="${p.f}" aria-label="${esc(p.label)}"><output class="num">${KS_FMT[p.f](v)}</output></span>

CHANGES.kOp = el => {

/* ---------- 人員 ---------- */
function ksHireCost(r) { return r.id === 'eng' ? 150e4 : r.wage < 15e4 ? 3e4 : 35e4; }
function ksStaffPanel(need = {}, opt = {}) {
  const I = ksI();
  const rows = I.roles.map(r => {
    const n = G.staff[r.id] || 0;
    const nd = need[r.id];
    const short = nd !== undefined && n < Math.round(nd) - 0.01;
    const big = r.wage < 15e4;
    return `<tr><td><b>${esc(r.n)}</b><div class="small muted">${esc(r.desc)}</div></td>
      <td class="n"><b class="${short ? 'neg' : ''}">${n}人</b>${nd !== undefined ? `<div class="small muted">目安 ${fmtNum(nd, 0)}人</div>` : ''}</td>
      <td class="n">${fmtYen(ksRoleWage(r))}<div class="small muted">${r.cost === 'labor' ? '労務費（原価）' : '給料手当（販管費）'}</div></td>
      <td class="n nowrap">${big ? btn('−5', 'kHire', { r: r.id, n: -5 }, 'sm', { disabled: n < 5 }) : ''}${btn('−1', 'kHire', { r: r.id, n: -1 }, 'sm', { disabled: n < 1 })}${btn('+1', 'kHire', { r: r.id, n: 1 }, 'sm')}${big ? btn('+5', 'kHire', { r: r.id, n: 5 }, 'sm') : ''}</td></tr>`;
  }).join('');
  const pe = ksPayrollEstimate();
  return panel('人員', `<div class="tbl-wrap"><table class="t"><thead><tr><th>職種</th><th class="n">人数</th><th class="n">月給（1人）</th><th class="n">採用・退職</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">人件費の目安は月${fmtYen(pe.total)}（賞与・社会保険料・役員報酬を含む平均）。採用には求人・紹介の費用（${I.roles.map(r => `${r.n.replace(/（.*?）/, '')} ${fmtYen(ksHireCost(r))}`).join('・')}）がかかり、人を減らすと退職金として給与1か月分がかかります。${opt.note || ''}</p>`);
}
ACTIONS.kHire = d => {
  const r = ksI().roles.find(x => x.id === d.r);
  const n = +d.n;
  if (!r || !n) return;
  const cur = G.staff[r.id] || 0;
  if (n > 0) {
    const cost = ksHireCost(r) * n;
    ksPayCash('recruit', cost, 'recruit');
    ksHire(r.id, n);
    if (r.id === 'eng') for (let i = 0; i < n; i++) G.op.hires.push(G.m);
    toast(`${r.n.replace(/（.*?）/, '')}を${n}人採用しました（採用費 ${fmtYen(cost)}）`);
  } else {
    const k = Math.min(cur, -n);
    if (k <= 0) return;
    const sev = Math.round(ksRoleWage(r) * k);
    ksPayCash(r.cost === 'labor' ? 'labor' : 'salary', sev, 'retire');
    ksHire(r.id, -k);
    toast(`${r.n.replace(/（.*?）/, '')}が${k}人退職しました（退職金 ${fmtYen(sev)}）`);
  }
  render();
};

/* 固定資産の売却 */
function ksSalePrice(a) { return Math.round(Math.max(a.cost * 0.05, (a.cost - a.booked) * 0.8) / 1e4) * 1e4; }
ACTIONS.kSellAsset = d => {
  const a = G.assets.find(x => x.id === d.id);
  if (!a) return;
  const fy = fyOf(G.m);
  const months = Math.max(0, G.m - Math.max(fy * 12, a.acqM));
  const depNow = a.life ? Math.max(0, Math.min(Math.round(a.cost / a.life * months / 12), a.cost - 1 - a.booked)) : 0;
  const bv = a.cost - a.booked - depNow;
  const price = ksSalePrice(a);
  confirmBox(`${esc(a.n)}を売る`, `取得価額 ${fmtYen(a.cost)}、売る時点の帳簿価額 ${fmtYen(bv)}（今期の分の減価償却 ${fmtYen(depNow)} を計上した後）。中古の買取価格は <b>${fmtYen(price)}</b> です。<br>売ると帳簿価額との差 <b>${fmtYen(price - bv)}</b> が${price >= bv ? '固定資産売却益（特別利益）' : '固定資産売却損（特別損失）'}になります。`, '売却する', 'kSellGo', { id: a.id });
};
ACTIONS.kSellGo = d => {
  const a = G.assets.find(x => x.id === d.id);
  if (!a || a.soldM !== undefined) return;
  const price = ksSalePrice(a);
  const gain = ksSellAsset(a, price);
  ksNews(`${a.n}を${fmtYen(price)}で売却しました（売却${gain >= 0 ? '益' : '損'} ${fmtYen(Math.abs(gain))}）`, 'info');
  toast(`${a.n}を売却しました`);
  closeModal(true);
  render();
};

/* =========================================================
 *  25_kaisha_close.js : 決算整理（3月末）
 *   手順ごとに「なぜやるのか」の解説 → 数字 → 問題 → 記帳する仕訳 を順に見せ、
 *   最後に決算書を確定する。在庫の水増し・減価償却の見送りという「誘惑」も選べる（粉飾の学び）。
 * ========================================================= */

const KS_STEP_INFO = {
  stock: { t: '実地棚卸と売上原価', s: '棚卸' },
  con: { t: '工事の確認', s: '工事' },
  dep: { t: '減価償却', s: '償却' },
  allow: { t: '貸倒引当金', s: '引当金' },
  accrual: { t: '未払費用と前払費用', s: '経過勘定' },
  tax: { t: '法人税等', s: '税金' },
  done: { t: '決算書の完成', s: '完成' },
};
const ksYenX = v => `${fmtNum(Math.round(v))}円`;
/* 選択肢の並びを決算期と手順で固定する（描き直しても並びが変わらない） */
function ksShuffle(arr, seed) {
  const a = arr.map((x, i) => ({ x, i, h: Math.sin((seed + 1) * 9301 + (i + 1) * 49297) * 233280 % 1 }));
  a.sort((p, q) => p.h - q.h);
  return a;
}
function ksFlowSumFY(k, fy) { return sum(G.months.filter(x => fyOf(x.m) === fy), x => (x.flow[k] || 0)); }
/* 金額の選択肢をつくる（重複を避ける） */
function ksAmtChoices(correct, wrongs) {
  const out = [correct];
  for (const w of wrongs) { const r = Math.round(w); if (isFinite(r) && r > 0 && out.every(o => Math.abs(o - r) > Math.max(1000, Math.abs(correct) * 0.002))) out.push(r); }
  let k = 1;
  while (out.length < 4) { const r = Math.round(correct * (1 + 0.17 * k * (k % 2 ? 1 : -1))); if (out.every(o => Math.abs(o - r) > 1000)) out.push(r); k++; }
  return out.slice(0, 4);
}

/* ---------- 手順ごとの問題（一度つくった問題は決算整理が終わるまで変えない） ---------- */
function ksQuizFor(step) {
  const c = G.closing;
  c.qz = c.qz || {};
  if (!(step in c.qz)) c.qz[step] = ksMakeQuiz(step);
  return c.qz[step];
}
function ksMakeQuiz(step) {
  const c = G.closing;
  const I = ksI();
  const fy = c.fy;
  if (step === 'stock') {
    if (I.inv === 'sanbun') {
      const it = c.data.stock.items[0];
      const purch = ksFlowSumFY('purch', fy);
      const ans = it.begin + purch - it.book;
      const ch = ksAmtChoices(ans, [purch, it.begin + purch, purch + it.book - it.begin]);
      return { q: `今期の売上原価はいくらでしょう？（期首の在庫 ${ksYenX(it.begin)}・今期の仕入高 ${ksYenX(purch)}・期末の帳簿の在庫 ${ksYenX(it.book)}）`, choices: ch.map(ksYenX), correct: 0,
        explain: `売上原価 ＝ 期首棚卸高 ${ksYenX(it.begin)} ＋ 当期仕入高 ${ksYenX(purch)} − 期末棚卸高 ${ksYenX(it.book)} ＝ <b>${ksYenX(ans)}</b>。前期から残っていた在庫は今期に売れたものとして費用に加え、売れ残った在庫は来期に売るものとして今期の費用から除きます。` };
    }
    const [mat] = c.data.stock.items;
    const purch = ksFlowSumFY('matPurch', fy);
    const ans = mat.begin + purch - mat.book;
    const ch = ksAmtChoices(ans, [purch, mat.begin + purch, purch + mat.book - mat.begin]);
    return { q: `今期の材料費（使った材料の額）はいくらでしょう？（期首の材料 ${ksYenX(mat.begin)}・今期の材料仕入高 ${ksYenX(purch)}・期末の帳簿の材料 ${ksYenX(mat.book)}）`, choices: ch.map(ksYenX), correct: 0,
      explain: `材料費 ＝ 期首材料棚卸高 ＋ 当期材料仕入高 − 期末材料棚卸高 ＝ <b>${ksYenX(ans)}</b>。使った分だけが今期の製造原価になり、残った材料は資産として来期に繰り越します。` };
  }
  if (step === 'con') {
    return { q: 'まだ完成していない工事に、これまでにかかった材料費・外注費・現場の経費は、決算書のどこに載るでしょう？', choices: ['完成工事原価（損益計算書の費用）', '未成工事支出金（貸借対照表の資産）', '未成工事受入金（貸借対照表の負債）', '前払費用（貸借対照表の資産）'], correct: 1,
      explain: '完成していない工事の費用は、まだ売上が立っていないので費用にしません。<b>未成工事支出金</b>（流動資産）にためておき、完成して引き渡した期に完成工事原価に振り替えます。完成前に受け取った代金は未成工事受入金（負債）です。' };
  }
  if (step === 'dep') {
    const rows = c.data.dep.filter(r => r.life && r.dep > 0 && r.dep === Math.round(r.cost / r.life * r.months / 12));
    const r = rows.sort((a, b) => b.dep - a.dep)[0] || c.data.dep.filter(x => x.dep > 0).sort((a, b) => b.dep - a.dep)[0];
    if (!r) return { q: '減価償却費は、どんな考え方で計上する費用でしょう？', choices: ['買った年にまとめて費用にする', '使う期間（耐用年数）に分けて少しずつ費用にする', '売ったときに費用にする', '費用にはしない'], correct: 1, explain: '長く使う資産は、使う期間に分けて少しずつ費用にします。' };
    c.data.depQ = r.id;
    const ans = r.dep;
    const ch = ksAmtChoices(ans, [r.cost / r.life / 12 * (r.months === 12 ? 1 : 12), r.cost * 2 / r.life * (r.months / 12), (r.cost - r.booked) / r.life, r.cost / r.life * 1.5]);
    return { q: `「${r.n}」（取得価額 ${ksYenX(r.cost)}・耐用年数 ${r.life}年・今期に使った月数 ${r.months}か月）の今期の減価償却費はいくらでしょう？（定額法）`, choices: ch.map(ksYenX), correct: 0,
      explain: `定額法：取得価額 ${ksYenX(r.cost)} ÷ 耐用年数 ${r.life}年 × ${r.months}/12 ＝ <b>${ksYenX(ans)}</b>。毎年同じ額を費用にします。期の途中で買った資産は、使った月数で月割りにします。` };
  }
  if (step === 'allow') {
    const a = c.data.allow;
    const cur = a.cur;
    const diff = a.req - cur;
    const ratePct = fmtNum(a.rate * 100, 2);
    if (diff >= 0) {
      const ch = ksAmtChoices(diff, [a.req, a.req + cur, cur]);
      return { q: `期末の売掛金は ${ksYenX(a.ar)}、過去の貸倒れの実績から ${ratePct}% が回収できなくなると見込みます（必要な引当金 ${ksYenX(a.req)}）。すでに貸倒引当金が ${ksYenX(cur)} あります。今期に繰り入れる額は？（差額補充法）`, choices: ch.map(ksYenX), correct: 0,
        explain: `必要な額 ${ksYenX(a.req)} − 今ある引当金 ${ksYenX(cur)} ＝ <b>${ksYenX(diff)}</b> を貸倒引当金繰入額（費用）にします。差額だけを補うので「差額補充法」といいます。` };
    }
    return { q: `必要な貸倒引当金は ${ksYenX(a.req)} ですが、すでに ${ksYenX(cur)} あります（売掛金が減ったため）。どう処理するでしょう？`, choices: [`${ksYenX(-diff)} を戻し入れて収益にする（貸倒引当金戻入額）`, `${ksYenX(a.req)} を繰り入れる`, '何もしない', `${ksYenX(cur)} を全部取り崩す`], correct: 0,
      explain: `引当金が多すぎる分 <b>${ksYenX(-diff)}</b> は、貸倒引当金戻入額（収益）として戻します。` };
  }
  if (step === 'accrual') {
    const a = c.data.accrual;
    if (a.rent > 0) {
      return { q: `3月末に、4月分の家賃 ${ksYenX(a.rent)} を払いました（払ったときに地代家賃（費用）として記帳しています）。決算ではどうするでしょう？`, choices: ['今期に払ったので、そのまま今期の費用にする', '前払費用（資産）に振り替えて、来期の費用にする', '未払費用（負債）を計上する', '売上高から差し引く'], correct: 1,
        explain: `4月分の家賃は来期のサービスの代金なので、今期の費用から除いて<b>前払費用</b>（資産）にします。あわせて、3月分の社会保険料 ${ksYenX(a.labor + a.welfare)} は4月に払いますが3月の費用なので<b>未払費用</b>（負債）を計上します。費用は「払った時」ではなく「発生した期」に計上する（発生主義）のが決算のルールです。` };
    }
    return { q: `3月分の社会保険料（会社負担）${ksYenX(a.labor + a.welfare)} は、4月末に払います。決算ではどうするでしょう？`, choices: ['払うのは来期なので、今期は何もしない', '未払費用（負債）を計上して、今期の費用にする', '前払費用（資産）を計上する', '来期の売上から差し引く'], correct: 1,
      explain: '3月分の保険料は3月に発生した費用です。払うのは4月でも今期の費用として、まだ払っていない分を<b>未払費用</b>（負債）にします（発生主義）。4月の初めに元に戻す仕訳（再振替仕訳）をするので、払ったときに二重に費用にはなりません。' };

      return { q: `税引前当期純利益は ${ksYenX(t.pretax)}${t.loss ? `、過去の赤字（繰越欠損金）が ${ksYenX(t.loss)}` : ''}です。所得のうち800万円までは25%、超える部分は34%、さらに住民税の均等割7万円がかかります。法人税等はいくら？`, choices: ch.map(ksYenX), correct: 0,
        explain: `所得 ${ksYenX(t.taxable)}${t.loss ? `（利益から繰越欠損金を差し引いた額）` : ''} × 税率 ＝ ${ksYenX(t.income)}、均等割 7万円を加えて <b>${ksYenX(t.tax)}</b>。納めるのは5月なので、それまでは未払法人税等（負債）です。` };
    }
    return { q: `今期の税引前当期純利益は ${ksYenX(t.pretax)}${t.pretax > 0 ? `ですが、過去の赤字（繰越欠損金）${ksYenX(t.loss)}で相殺されます` : '（赤字）です'}。法人税等はいくらでしょう？`, choices: ['0円（もうけがないので税金はかからない）', '7万円（住民税の均等割だけはかかる）', `△${ksYenX(Math.abs(t.pretax) * 0.25)}（税金が戻ってくる）`, ksYenX(Math.abs(t.pretax) * 0.25)], correct: 1,
      explain: `所得がなければ法人税はかかりませんが、住民税の<b>均等割（7万円）</b>は赤字でもかかります。今期の赤字 ${ksYenX(t.lossAfter)} は繰越欠損金として、来期以降の利益と相殺できます。` };
  }
  return null;
}

/* ---------- 手順ごとの画面 ---------- */
function ksStepLearn(step) {

  switch (step) {

  const row = (n, tk, v, pv, f = fmtYen) => `<tr><td>${term(n, tk)}</td><td class="n">${pv === null || pv === undefined ? '―' : f(pv)}</td><td class="n ${v < 0 ? 'neg' : ''}">${f(v)}</td></tr>`;
  const gb = r.gradeBefore, ga = r.gradeAfter;
  const gtxt = !gb ? '' : ga < gb ? `<span class="pos">${gb} → ${ga} に上がりました</span>` : ga > gb ? `<span class="neg">${gb} → ${ga} に下がりました</span>` : `${ga} のまま`;
  const body = `<div class="row" style="gap:16px;align-items:center;margin-bottom:12px"><div class="gradebig">${ga}</div><div><b>銀行の格付</b> ${gtxt}<div class="small">${ksGradeText(ga)}</div></div></div>
    ${st.bankNote ? `<p class="callout bad">${esc(st.bankNote)}</p>` : ''}
    <table class="t compact"><thead><tr><th></th><th class="n">前期</th><th class="n">今期</th></tr></thead><tbody>
      ${row(ksSalesName(), 'sales', st.pl.sales, prev && prev.pl.sales)}${row('経常利益', 'ord', st.pl.ord, prev && prev.pl.ord)}${row('当期純利益', 'ni', st.pl.ni, prev && prev.pl.ni)}
      ${row('純資産', 'eq', s.EQ, p && p.EQ)}${row('自己資本比率', 'eqR', s.EQ / s.TA * 100, p ? p.EQ / p.TA * 100 : null, v => fmtPct(v, 1))}${row('借入金', 'debt', s.STD + s.LTD, p && p.STD + p.LTD)}</tbody></table>
    ${st.quiz && st.quiz.asked ? `<p class="small" style="margin-top:10px">決算整理の問題 <b>${st.quiz.correct}/${st.quiz.asked}問</b> 正解。</p>` : ''}
    <p class="note">4月から${ksFyLabel(r.fy + 1)}が始まります。まず「予算と実績」で今期の予算を決めましょう。決算書は「決算書」の画面でいつでも読めます。銀行がどう読んだかは「資金と銀行」で確かめられます。</p>`;
  return modalFrame(`${ksFyLabel(r.fy)}の決算が確定しました`, body, btn('銀行から見た決算書', 'kGo', { tab: 'k_bank', sec: 'view' }) + btn('決算書を見る', 'kGoFs', { v: 'pl' }) + btn('閉じる', 'closeModal', {}, 'primary'), { sub: ksFyYear(r.fy) });
};

/* =========================================================
 *  99_main.js : 起動（すべてのファイルの後に読み込む）
 * ========================================================= */
/* iPhone：開いたときにステータスバーと重なっている高さを一度だけ測り、
   ページの流れの中の余白（--band0）に使う。スクロールで変わる値（--band）は固定表示の要素だけが使う。 */
function measureSafeTop() {
  try {
    const p = document.createElement('div');
    p.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:var(--band);visibility:hidden;pointer-events:none';
    document.body.appendChild(p);
    const h = p.getBoundingClientRect().height || 0;
    p.remove();
    document.documentElement.style.setProperty('--band0', `${Math.round(h)}px`);
  } catch (e) { /* 測れなければ 0 のまま */ }
}
(function boot() {
  measureSafeTop();
  window.addEventListener('orientationchange', () => setTimeout(() => { if (window.scrollY < 4) measureSafeTop(); }, 400));
  try { const s = JSON.parse(lsGet(LS.settings) || 'null'); if (s) Object.assign(UI.settings, s); } catch (e) { /* 既定値のまま */ }
  applyTheme(lsGet(LS.theme) || 'auto');
  bindEvents();
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json'; inp.id = 'importFile'; inp.hidden = true;
  inp.setAttribute('data-ch', 'importFile');
  document.body.appendChild(inp);
  render();
  window.Toudori = { get G() { return G; }, render, advance: () => (isK() ? ksRunAdvance() : runAdvance()), check: () => (isK() ? ksCheck() : integrityCheck()), show: (name, args) => showModal(name, args || {}) };
})();

})();
</script>
