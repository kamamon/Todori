      if (!f) return `<tr class="head"><td colspan="${disp.length + 2}">${name}</td></tr>`;
      const cells = rs.map(r => `<td>${fmtRatio(f(r), unit)}</td>`).join('');
      return `<tr class="${rowCls('i1', tk)}"><td>${label(name, tk)}</td>${cells}<td class="muted">${avgKey && avg[avgKey] !== undefined ? fmtRatio(avg[avgKey], unit) : '―'}</td></tr>`;
    }).join('');
    return `<div class="tbl-wrap"><table class="fs"><thead><tr><th>指標${opt.trueLabel ? '（実態）' : ''}</th>${heads}<th>業界平均</th></tr></thead><tbody>${body}</tbody></table></div><p class="note">業界平均は中小企業の目安。金額は${FS_BIG ? '百万円' : '千円'}単位。</p>`;

    const cells = vals.map(v => `<td class="${v < 0 ? 'neg' : ''}">${fmtFS(v)}</td>`).join('');
    return `<tr class="${rowCls(cls, key)}"><td>${label(name, tk)}</td>${cells}${opt.diff ? opt.diff(f, view) : ''}</tr>`;
  }).join('');

}

    diff = (f, v) => {
      const last = years[years.length - 1], prevY = years[years.length - 2];
      const tv = f(last.T, v === 'cf' ? cfOf(last.T, prevY.T) : null);
      const rv = f(repOf(last), v === 'cf' ? cfOf(repOf(last), repOf(prevY)) : null);
      const d = tv - rv;
      const th = FS_BIG ? 1e6 : 1000;
      return `<td class="${Math.abs(d) >= th ? 'diff' : 'muted'}">${Math.abs(d) >= th ? fmtFS(d) : '―'}</td>`;
    };
  }
  return fsTableOf(ys, view, { ctx, heads, ind: co.ind, trueLabel: showTrue, diff });
}

  const ys = co.years.slice(-4).map(y => (showTrue ? y.T : repOf(y)));

  }

  for (const P of offers) {

    items.push({ ico: '案', t1: `開発案件：${P.name}`, t2: `シンジケートローン${fmtYen(st.debt)}。参加表明は${ymLabel(st.deadline)}末まで（現在の表明額 ${fmtYen(st.ourAmt || 0)}）`, act: btn('検討する', 'go', { tab: 'city', dist: P.d }, 'sm') });

    } else if (it.type === 'refi') {
      const L = G.loans.find(x => x.id === it.loanId);
      if (!L) continue;
      items.push({ ico: '期', cls: 'warn', t1: `期日到来：${L.name}`, t2: `${fmtYen(L.bal)}の一括返済が困難との申し出。1年延長（折り返し）するか、返済を求めるか`, act: btn('1年延長', 'refi', { id: it.id, v: 1 }, 'sm') + btn('返済を求める', 'refi', { id: it.id, v: 0 }, 'sm danger') });
    } else if (it.type === 'fsaNotice') {

    }
  }
  const gap = G.loans.filter(L => isActiveLoan(L) && sysClass(L) > L.cls).length;
  if (gap) items.push({ ico: '査', cls: 'warn', t1: `自己査定：システム判定より甘い区分の先が${gap}件`, t2: '承継した貸出には前経営陣の甘い査定が残っています。検査で指摘される前に見直しましょう', act: btn('見直す', 'pfGap', {}, 'sm') });
  if (G.budget && G.budget.status === 'draft') items.push({ ico: '予', t1: `第${G.budget.fy + 1}期の予算を決める`, t2: '貸出・預金・経費の目標を決めて予算を立てます。4月末までに決めなければ予算案のまま決まります', act: btn('予算へ', 'go', { tab: 'finance', fin: 'budget' }, 'sm') });
  const rev = G.inbox.filter(x => x.type === 'review').length;
  if (rev) items.push({ ico: '決', t1: `決算書の検証待ち ${rev}先`, t2: '融資先から新しい決算書が届いています。内容を確認し債務者区分を見直します', act: btn('確認する', 'go', { tab: 'portfolio' }, 'sm') });
  // 警告
  const cap = vaultCapacity(), tgt = cashRequired() * G.vault.buffer;
  if (tgt > cap * 0.95) items.push({ ico: '庫', cls: 'warn', t1: '金庫の容量が不足しています', t2: `必要な現金在高 ${fmtYen(tgt)} に対し収容能力 ${fmtYen(cap)}。年末などの需要期に現金不足でATMが止まる恐れ`, act: btn('金庫へ', 'go', { tab: 'facility' }, 'sm') });
  const load = coreLoad();
  if (load > 0.85) items.push({ ico: '系', cls: load > 1 ? 'bad' : 'warn', t1: `勘定系システムの使用率 ${fmtPct(load * 100, 0)}`, t2: load > 1 ? '処理能力を超えています。新規口座の受付が止まり、障害が頻発します' : '処理能力の上限が近づいています。システム更改を検討してください', act: btn('システムへ', 'go', { tab: 'system' }, 'sm') });
  const svc = serviceQuality();
  if (svc < 0.9) items.push({ ico: '人', cls: 'warn', t1: '窓口・事務の人員が不足しています', t2: `必要人員 ${fmtNum(opsRequired(), 0)}人に対し${G.staff.ops}人。待ち時間と事務ミスが増え、信用度が下がります`, act: btn('人事へ', 'go', { tab: 'hr' }, 'sm') });
  const cr = capitalRatio();

  if (G.flags.publicOffer && !G.flags.publicFunds) items.push({ ico: '公', cls: 'bad', t1: '公的資金の注入を申請できます', t2: '自己資本比率が4%を下回りました', act: btn('検討する', 'publicFundsShow', {}, 'sm') });
  return items;
}

  const fs = `<div class="row between" style="margin-bottom:6px"><div class="subtabs" role="tablist" style="margin:0;border:0">${views.map(([k, l]) => `<button type="button" data-act="appView" data-v="${k}" aria-pressed="${UI.appView === k}">${l}</button>`).join('')}</div>
    ${found ? `<label class="inline small"><input type="checkbox" data-ch="appTrue" ${UI.appShowTrue ? 'checked' : ''}> 実態の数値で表示</label>` : ''}</div>

  <section><h3>調査</h3>${invPanel(app, INV_BIZ, co)}</section>

function invPanel(app, defs, co) {
  const left = creditCapLeft();
  const cards = Object.entries(defs).map(([k, d]) => {
    if (d.cond && co && !d.cond(co)) return '';
    const r = app.inv[k];
    if (r) {
      const st = { ok: ['問題なし', 'ok'], minor: ['要確認', 'warn'], major: ['重大な問題', 'bad'] }[r.status];
      return `<div class="inv done st-${r.status}"><div class="row between"><span class="nm">${d.name}</span>${tag(st[0], st[1])}</div><div class="res">${esc(r.text)}</div></div>`;
    }
    const can = app.status === 'pending' && left >= d.days - 1e-9;
    return `<div class="inv"><div class="nm">${d.name}</div><div class="ds">${d.desc}</div><div class="row between"><span class="cost">${d.days ? fmtNum(d.days, 1) + '人日' : '外部委託'}${d.cost ? '・' + fmtYen(d.cost) : ''}</span>${app.status === 'pending' ? btn('調査する', 'invest', { id: app.id, k }, 'sm', { disabled: !can, 'data-tip': can ? '' : '審査部の人員に余裕がありません' }) : ''}</div></div>`;
  }).join('');
  return `<div class="inv-grid">${cards}</div>`;
}

function gradePanel(app, co) {
  const lv = G.sys.credit;
  const g = appSysGrade(app);
  let html = '';
  if (lv >= 1) {
    const sc = co ? bankScore(co) : null;
    html += `<div class="row" style="gap:16px;margin-bottom:8px"><div>${gradeBadge(g)} <span class="small">行内格付${co ? `（財務スコア ${fmtNum(sc, 0)}点）` : ''}</span></div><div class="small">想定デフォルト率 <b class="num">${fmtPct(GRADE_PD[g], 2)}</b>/年</div>${co && co.fraud && co.fraud.found ? `<div class="small">実態格付 ${gradeBadge(co.gTrue)}</div>` : ''}</div>`;
  } else html += '<p class="note">審査システムを導入すると、財務スコアと格付が自動で算出されます。</p>';
  if (co && lv >= 2) {
    const fl = fraudFlags(co);
    html += `<div class="flagbox" style="margin-bottom:8px"><b class="small">粉飾検知モジュール</b>${fl.length ? `<ul>${fl.map(f => `<li>${esc(f.t)}</li>`).join('')}</ul>` : '<div class="small muted">目立った異常値はありません</div>'}</div>`;
  }
  if (co && lv >= 3) {
    const ai = aiEstimate(co);
    html += `<div class="row small" style="margin-bottom:8px;gap:16px"><span>AI推定格付 ${gradeBadge(ai.grade)}</span><span>粉飾の可能性 <b class="num ${ai.fp > 0.4 ? 'neg' : ''}">${fmtPct(ai.fp * 100, 0)}</b></span></div>`;
  }
  html += `<div id="ringi-eval">${evalBlock(app)}</div>`;
  return html;
}

/* 採算と成約見込み（入力に合わせて更新） */
function fundCost() {
  const d = deposits();
  return d > 0 ? (B('depOrd') * G.rates.ord + sum(G.dep.coh, c => c.bal * c.rate)) / d : G.rates.ord;
}
function evalBlock(app) {
  const t = app.terms;
  const rate = appRate(app, t);
  const g = appSysGrade(app);
  let lgd;
  if (app.kind === 'biz') {
    const co = G.companies[app.coId];
    const col = t.collateral && co.ownsRE ? (co.reAppraised || reNow(co, co.reEst)) * (co.reLien ? 0.6 : 1) * 0.7 : 0;
    const cov = (t.guarantee === 'cgc' ? 0.8 : 0) * t.amount;
    lgd = clamp(1 - (col + cov) / Math.max(1, t.amount), 0.05, 1) * (t.guarantee === 'personal' ? 0.95 : 1);
  } else {
    const p = app.person;
    lgd = t.guarantee === 'company' ? 0.08 : clamp(1 - p.valueEst * 0.75 / Math.max(1, t.amount), 0.1, 1);
  }
  const pd = GRADE_PD[g] / 100;
  const fc = fundCost() / 100;
  const amt = t.amount;
  const inc = amt * rate / 100, fund = amt * fc, cost = amt * 0.0035, el = amt * pd * lgd;
  const prof = inc - fund - cost - el;
  const p = acceptProb(app, t, 'est');
  const pcls = p >= 0.6 ? 'ok' : p >= 0.35 ? 'warn' : 'bad';
  const mkt = app.kind === 'biz' ? marketLoanRate(G.companies[app.coId].gRep, t.termM) : (t.rateType === 'var' ? G.eco.mortVar : G.eco.mortFix);
  return `<div class="grid g2" style="gap:12px">
    <table class="t compact"><tbody>
      <tr><td>適用金利</td><td class="n"><b>${fmtRate(rate)}</b></td></tr>
      <tr><td>市場の目安金利</td><td class="n">${fmtRate(mkt)}</td></tr>
      <tr><td>年間の利息収入</td><td class="n">${fmtYen(inc)}</td></tr>
      <tr><td>資金調達コスト（${fmtRate(fc * 100)}）</td><td class="n">${MINUS}${fmtYen(fund)}</td></tr>
      <tr><td>経費（0.35%）</td><td class="n">${MINUS}${fmtYen(cost)}</td></tr>
      <tr><td>期待損失（PD ${fmtPct(pd * 100, 2)} × LGD ${fmtPct(lgd * 100, 0)}）</td><td class="n">${MINUS}${fmtYen(el)}</td></tr>
      <tr class="total"><td>想定採算（年）</td><td class="n ${prof < 0 ? 'neg' : ''}">${fmtYen(prof)}</td></tr>
    </tbody></table>
    <div><div class="small" style="margin-bottom:4px">成約見込み</div><div class="accept"><b class="num">${Math.round(p * 100)}%</b>${meter(p * 100, 100, pcls)}<span class="small muted">${pcls === 'ok' ? '受けてもらえそう' : pcls === 'warn' ? '五分五分' : '他行に流れそう'}</span></div>
    <p class="note">金利を上げるほど採算は良くなりますが、優良先ほど他行に流れます。業況の悪い先ほど高い金利でも受け入れる（逆選択）点に注意。</p>
    ${app.kind === 'mort' ? mortDTIBlock(app) : ''}</div></div>`;
}

function termsBiz(app) {
  const t = app.terms, co = G.companies[app.coId];
  const rateField = t.rateType === 'var'
    ? `<label class="field"><span>スプレッド（短プラ${fmtRate(G.rates.prime)}に加算）</span><span class="row"><input type="number" step="0.05" min="-1.5" max="10" value="${t.spread}" data-in="term" data-k="spread" style="width:100px"><span class="unit">%</span></span></label>`
    : `<label class="field"><span>固定金利</span><span class="row"><input type="number" step="0.05" min="0.1" max="15" value="${t.rate}" data-in="term" data-k="rate" style="width:100px"><span class="unit">%</span></span></label>`;

    <label class="field"><span>融資額（申込 ${fmtYen(app.amountReq)}）</span><span class="row"><input type="number" step="100" min="100" max="${Math.round(app.amountReq / 1e4)}" value="${Math.round(t.amount / 1e4)}" data-in="term" data-k="amount" style="width:120px"><span class="unit">万円</span></span></label>
    <div class="field"><span>金利の種類</span><div class="seg">${[['var', '変動'], ['fixed', '固定']].map(([k, l]) => `<button type="button" data-act="termSet" data-k="rateType" data-v="${k}" aria-pressed="${t.rateType === k}">${l}</button>`).join('')}</div></div>
    ${rateField}
    <label class="field"><span>期間</span><span class="row"><input type="number" step="${t.repay === 'bullet' ? 1 : 12}" min="3" max="240" value="${t.termM}" data-in="term" data-k="termM" style="width:90px"><span class="unit">か月</span></span></label>
    <div class="field"><span>返済方法</span><div class="seg">${[['equal', '元金均等'], ['bullet', '期日一括']].map(([k, l]) => `<button type="button" data-act="termSet" data-k="repay" data-v="${k}" aria-pressed="${t.repay === k}">${l}</button>`).join('')}</div></div>
    <div class="field"><span>担保</span>${co.ownsRE ? `<label class="inline"><input type="checkbox" data-ch="termChk" data-k="collateral" ${t.collateral ? 'checked' : ''}> 不動産に抵当権を設定</label>` : '<span class="muted small">提供できる不動産なし</span>'}</div>
    <label class="field"><span>保証</span><select data-ch="termSel" data-k="guarantee">${(G.companies[app.coId].big ? [['none', 'なし'], ['personal', '代表者の個人保証（大企業は応じない）']] : [['none', 'なし'], ['personal', '代表者の個人保証'], ['cgc', '信用保証協会（80%保証）']]).map(([k, l]) => `<option value="${k}"${t.guarantee === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
  </div>
  <p class="note">同一先への与信上限（大口信用供与規制）：${fmtYen(largeExposureLimit())}。信用保証協会の保証付き融資はリスクウェイトが10%に下がり、代位弁済で損失を抑えられますが、保証料の負担で先方は嫌がります。</p>`;
}

function decidedTerms(app) {
  const t = app.terms;
  if (app.status === 'expired') return '<p class="muted">回答期限を過ぎたため、申込は取り下げられました。</p>';
  if (app.status === 'rejected') return '<p class="muted">謝絶しました。</p>';
  const L = G.loans.find(x => x.appId === app.id);
  return `${kv([['融資額', fmtYen(t.amount)], ['適用金利', fmtRate(appRate(app, t))], ['期間', `${t.termM}か月`]])}${app.status === 'declined' ? '<p class="callout bad" style="margin-top:8px">先方は他行の条件を選びました。</p>' : ''}${L ? `<p style="margin-top:8px">${btn('融資先として見る', 'loanOpen', { id: L.id }, 'sm')}</p>` : ''}`;
}

function decideBar(app) {
  if (app.status !== 'pending') {
    const nxt = G.apps.find(a => a.status === 'pending' && a.id !== app.id);
    return `<div class="decide">${nxt ? btn('次の案件へ', 'pickApp', { id: nxt.id }, 'primary') : '<span class="muted small">審査待ちの案件はありません</span>'}</div>`;
  }
  return `<div class="decide"><span class="small muted" style="margin-right:auto">${app.exp <= G.m ? '回答期限：今月末' : '回答期限：来月末'}</span>${btn('謝絶する', 'decide', { id: app.id, v: 0 }, 'danger')}${btn('承認する', 'decide', { id: app.id, v: 1 }, 'primary')}</div>`;
}

/* 住宅ローン */
function mortDTIBlock(app) {
  const p = app.person, t = app.terms;
  const rate = appRate(app, t);
  const dti = mortDTI(p, t.amount, rate, t.termM / 12, false);
  const dtiS = mortDTI(p, t.amount, 3.5, t.termM / 12, false);
  const ltv = t.amount / p.valueEst;
  return `<table class="t compact" style="margin-top:8px"><tbody>
    <tr><td>返済負担率（適用金利）</td><td class="n ${dti > 0.35 ? 'neg' : ''}">${fmtPct(dti * 100, 1)}</td></tr>
    <tr><td>返済負担率（審査金利3.5%）</td><td class="n ${dtiS > 0.35 ? 'neg' : ''}">${fmtPct(dtiS * 100, 1)}</td></tr>
    <tr><td>担保掛目（融資額÷評価額）</td><td class="n ${ltv > 1 ? 'neg' : ''}">${fmtPct(ltv * 100, 0)}</td></tr>
    <tr><td>完済時の年齢</td><td class="n ${p.age + t.termM / 12 > 80 ? 'neg' : ''}">${Math.round(p.age + t.termM / 12)}歳</td></tr></tbody></table>
    <p class="note">一般的な目安：審査金利での返済負担率35%以内、完済時80歳未満。</p>`;
}
function ringiMort(app) {

    ['年収（申告）', `<b class="num">${fmtYen(p.repIncome)}</b>${p.fraud && p.fraud.found && p.fraud.type === 'income' ? `　実際 ${fmtYen(p.income)}` : ''}`],
    ['他の借入（申告）', p.otherDebt ? `年間返済 ${fmtYen(p.otherDebt)}` : 'なし'],
    ['物件', `${esc(p.ptype)}（${DIST[p.district].name}）価格 ${fmtYen(p.price)}`], ['頭金', p.downR ? fmtPct(p.downR * 100, 0) : 'なし（諸費用も借入）'],

    <div class="field"><span>金利タイプ</span><div class="seg">${[['var', '変動'], ['fix10', '10年固定']].map(([k, l]) => `<button type="button" data-act="termSet" data-k="rateType" data-v="${k}" aria-pressed="${t.rateType === k}">${l}</button>`).join('')}</div></div>
    <label class="field"><span>店頭金利からの上乗せ（＋）・引下げ（−）</span><span class="row"><input type="number" step="0.05" min="-1" max="3" value="${t.rateAdj || 0}" data-in="term" data-k="rateAdj" style="width:90px"><span class="unit">%</span></span></label>
    <label class="field"><span>期間</span><span class="row"><input type="number" step="1" min="5" max="35" value="${t.termM / 12}" data-in="term" data-k="termY" style="width:80px"><span class="unit">年</span></span></label>
    <div class="field"><span>保証会社</span><label class="inline"><input type="checkbox" data-ch="termChk" data-k="mortGuar" ${t.guarantee === 'company' ? 'checked' : ''}> 保証会社の保証を付ける</label></div>
  </div><p class="note">店頭金利：変動 ${fmtRate(mortVarRate())}（短プラ−${fmtNum(G.rates.mortDisc, 2)}%）、10年固定 ${fmtRate(mortFixRate())}。保証会社が付くと延滞時に代位弁済を受けられます（申込内容に虚偽があれば免責）。</p>` : decidedTerms(app);

function refreshEval() {
  const app = G.apps.find(a => a.id === UI.appId);
  const box = $('#ringi-eval');
  if (app && box) box.innerHTML = evalBlock(app);
}

Object.assign(ACTIONS, {
  pickApp: d => { UI.appId = d.id; UI.appShowTrue = false; UI.appOpen = true; UI.guideSel = null; render(); if (window.innerWidth < 960) window.scrollTo({ top: 0 }); },
  appBack: () => { UI.appOpen = false; render(); },
  pfGap: () => { UI.tab = 'portfolio'; UI.pfFilter = 'gap'; UI.pfPage = 0; render(); window.scrollTo({ top: 0 }); },
  appFilter: d => { UI.appFilter = d.v; UI.appId = null; render(); },
  appView: d => { UI.appView = d.v; render(); },
  invest: d => {
    const app = G.apps.find(a => a.id === d.id);
    const r = runInvestigation(app, d.k);
    if (!r.ok) toast(r.msg, 'bad');
    else if (r.res.found) toast('重大な問題が見つかりました', 'bad');
    if (r.ok && r.res.found && app.kind === 'biz') UI.appShowTrue = true;
    render();
  },
  termSet: d => {
    const app = G.apps.find(a => a.id === UI.appId);
    if (!app) return;
    app.terms[d.k] = d.v;
    if (d.k === 'rateType' && app.kind === 'biz') {
      const r = suggestedRate(app, app.terms.termM);
      if (d.v === 'fixed') app.terms.rate = r; else app.terms.spread = +(r - G.rates.prime).toFixed(2);
    }
    render();
  },
  decide: d => {
    const app = G.apps.find(a => a.id === d.id);
    if (!app) return;
    const res = decideApp(app, d.v === '1', Object.assign({}, app.terms));
    if (!res.ok) { toast(res.msg, 'bad'); return; }
    UI.stampAnim = true;
    if (res.rejected) toast('謝絶しました');
    else if (res.accepted) toast(`融資を実行しました：${fmtYen(app.terms.amount)}`);
    else toast(res.msg, 'bad');
    render();
  },
});
Object.assign(INPUTS, {
  term: el => {
    const app = G.apps.find(a => a.id === UI.appId);
    if (!app) return;
    const v = parseFloat(el.value);
    if (!isFinite(v)) return;
    const k = el.dataset.k;
    if (k === 'amount') app.terms.amount = clamp(Math.round(v) * 1e4, 1e6, app.amountReq);
    else if (k === 'termY') app.terms.termM = clamp(Math.round(v), 5, 35) * 12;
    else if (k === 'termM') app.terms.termM = clamp(Math.round(v), 3, 240);
    else app.terms[k] = v;
    refreshEval();
  },
});
Object.assign(CHANGES, {
  appTrue: el => { UI.appShowTrue = el.checked; render(); },
  termChk: el => {
    const app = G.apps.find(a => a.id === UI.appId);
    if (!app) return;
    if (el.dataset.k === 'mortGuar') app.terms.guarantee = el.checked ? 'company' : 'none';
    else app.terms[el.dataset.k] = el.checked;
    refreshEval();
  },
  termSel: el => { const app = G.apps.find(a => a.id === UI.appId); if (app) { app.terms[el.dataset.k] = el.value; refreshEval(); } },
});

/* ---------- 与信管理 ---------- */
function loanKindLabel(L) {
  if (L.kind === 'seg') return isOvsArea(L.area) ? '海外拠点の小口融資' : '全国の店舗網の小口融資';
  if (L.kind === 'biz' && G.companies[L.coId] && G.companies[L.coId].big) return isOvsArea(L.district) ? '海外企業' : '大企業';
  return { biz: '事業性', mort: '住宅ローン', proj: 'プロジェクト', pool: '住宅ローン（承継）' }[L.kind];
}
function loanStatusTag(L) {
  const m = { current: ['正常返済', ''], late: [`延滞${L.dpd}か月`, 'warn'], default: [`延滞${L.dpd}か月`, 'bad'], bankrupt: ['破綻・回収中', 'bad'] }[L.status] || ['完了', ''];
  return tag(m[0], m[1]) + (L.restructured ? tag('条件変更', 'warn') : '') + (L.fraudKnown ? tag('粉飾判明', 'bad') : '');
}
function pfLoans() {
  const act = G.loans.filter(isActiveLoan);
  switch (UI.pfFilter) {
    case 'biz': return act.filter(L => L.kind === 'biz' || L.kind === 'proj');
    case 'mort': return act.filter(L => L.kind === 'mort' || L.kind === 'pool');
    case 'watch': return act.filter(L => L.cls >= 1 || L.status !== 'current' || sysClass(L) > L.cls);
    case 'gap': return act.filter(L => sysClass(L) > L.cls);

      if (j === 'ng') { decideApp(a, false); rej++; }
      else if (j === 'ok') {
        const t = standardTerms(a);
        if (t.amount < 1e6 || validateTerms(a, t)) { skip++; continue; }
        const r = decideApp(a, true, t);
        if (r.ok && r.accepted) { acc++; amt += t.amount; } else if (r.ok) dec++; else skip++;
      }
    }
    toast(`成約${acc}件（${fmtYen(amt)}）・先方辞退${dec}件・謝絶${rej}件${skip ? `・処理できず${skip}件` : ''}`);
    UI.appId = null;
    closeModal(true);
  },
});

  bulkChk: el => { UI.bulk[el.dataset.k] = el.checked; drawModal(); },

    <table class="t compact" style="margin-top:8px"><tbody>
      <tr><td>収容能力（本店＋各店）</td><td class="n">${fmtYen(cap)}</td></tr>
      <tr><td>現金在高</td><td class="n">${fmtYen(B('cash'))}</td></tr>
      <tr><td>平常月の必要現金</td><td class="n">${fmtYen(req)}</td></tr>

    <p class="note">余裕を持たせるほどATMの現金切れは起きにくくなりますが、金庫の容量を使い、盗難時の被害も大きくなります。</p>
    ${nx ? `<hr class="sep"><div class="row between"><div><b>${nx.name}</b>へ拡張<div class="small muted">収容能力 ${fmtYen(nx.cap)}・工事${nx.months}か月・維持費 月${fmtYen(nx.maint)}</div></div>${btn(`拡張する（${fmtYen(nx.cost)}）`, 'vaultUp', {}, 'primary', { disabled: !!v.upgrade })}</div>` : '<p class="note">最大の金庫です。</p>'}`;
  const security = `<div class="row between"><div><div class="small muted">警備体制</div><b>${sec.name}</b></div><span class="small">盗難リスク ${fmtPct(sec.risk * 100, 0)}</span></div>
    ${snx ? `<div class="row between" style="margin-top:10px"><div class="small">次：${snx.name}（維持費 月${fmtYen(snx.maint)}）</div>${btn(`強化する（${fmtYen(snx.cost)}）`, 'secUp', {}, 'sm')}</div>` : ''}`;
  const brRows = G.branches.map(b => {

    return `<tr><td>${esc(b.name)}</td><td>${DIST[b.d].name}</td><td>${T.name}</td><td>${b.openM > G.m ? tag(ymLabel(b.openM) + '開業', 'warn') : b.type === 'hq' ? '―' : ymLabel(b.openM)}</td>
      <td style="min-width:110px">${b.type === 'hq' ? '' : meter(branchMaturity(b), 1, 'ok')}</td><td class="n">${b.type === 'hq' ? '自己所有' : fmtYen(DIST[b.d].rent * T.rentMul)}</td><td class="n">${b.type === 'hq' ? '' : btn('閉鎖', 'closeBranchAsk', { id: b.id }, 'sm danger')}</td></tr>`;
  }).join('');
  const openForm = `<div class="row" style="gap:12px;align-items:end">
    <label class="field"><span>地区</span><select id="obD">${DISTRICTS.map(D => `<option value="${D.id}">${D.name}（店舗${G.branches.filter(b => b.d === D.id).length}）</option>`).join('')}</select></label>
    <label class="field"><span>種類</span><select id="obT"><option value="full">支店（${fmtYen(BRANCH_TYPES.full.capex)}・${BRANCH_TYPES.full.ops + BRANCH_TYPES.full.sales}人）</option><option value="small">出張所（${fmtYen(BRANCH_TYPES.small.capex)}・${BRANCH_TYPES.small.ops + BRANCH_TYPES.small.sales}人）</option></select></label>

  <div class="grid g2">${panel('金庫', vault)}<div class="stack">${panel('警備', security)}${panel('店舗外ATM', `<table class="t compact"><tbody>${atmRows}</tbody></table><p class="note" style="padding:0 10px">ATM全${totalATMs()}台（店舗内を含む）。1台1,200万円、維持費 月5万円。</p>`, { flush: true })}</div></div>

Object.assign(CHANGES, { vaultBuffer: el => { G.vault.buffer = clamp(+el.value / 100, 1, 2); render(); } });

/* ---------- システム ---------- */
SCREENS.system = () => {
  const load = coreLoad();
  const cards = SYS_KEYS.map(k => {
    const S = SYSTEMS[k], lv = G.sys[k];
    const cur = S.levels[lv], nx = S.levels[lv + 1];
    const proj = G.itProjects.find(p => p.sys === k);
    let foot;
    if (proj) foot = `<div class="small">「${S.levels[proj.to].name}」へ移行中</div>${meter(G.m - proj.startM, proj.doneM - proj.startM, 'ok')}<div class="note">${ymLabel(proj.doneM)}稼働予定${proj.method === 'phased' ? '（段階移行）' : proj.method === 'bigbang' ? '（一括移行）' : ''}</div>`;
    else if (nx) {
      foot = `<div class="small">次の段階：<b>${nx.name}</b></div><div class="note">投資 ${fmtYen(nx.cost)}（5年償却）・${nx.months}か月・運用費 月${fmtYen(nx.maint)}</div>`;
      foot += k === 'core' ? `<div class="row" style="margin-top:6px">${btn('一括移行で更改', 'sysUp', { k, m: 'bigbang' }, 'sm')}${btn('段階移行で更改', 'sysUp', { k, m: 'phased' }, 'sm primary')}</div><p class="note">一括移行は安いが約18%の確率で大規模障害。段階移行は費用1.35倍・期間1.5倍で障害リスク約4%。</p>`
        : `<div style="margin-top:6px">${btn('導入する', 'sysUp', { k }, 'sm primary')}</div>`;
    } else foot = '<div class="note">最新の段階です。</div>';
    const extra = k === 'core' ? `<div class="small" style="margin:6px 0 2px">処理能力の使用率 ${fmtPct(load * 100, 0)}（口座等 ${fmtNum(accountsCount())}／能力 ${fmtNum(coreCapacity())}）</div>${meter(load, 1)}`
      : k === 'aml' ? `<div class="small" style="margin-top:6px">金融庁が求める水準：Lv${amlRequired()}　${lv >= amlRequired() ? tag('充足', 'ok') : tag('不足', 'bad')}</div>`
      : k === 'cyber' ? `<div class="small" style="margin-top:6px">${G.sys.digital >= 2 && lv < G.sys.digital - 1 ? tag('デジタル化に対して手薄', 'bad') : tag('概ね適切', 'ok')}</div>` : '';
    return `<section class="panel"><div class="ph"><h2>${S.name}</h2><span class="aside">Lv${lv}</span></div><div class="pb"><div style="font-weight:700">${cur.name}</div><p class="small muted" style="margin:4px 0">${S.desc}</p>${extra}<hr class="sep">${foot}</div></section>`;
  }).join('');
  const maint = sum(SYS_KEYS, k => SYSTEMS[k].levels[G.sys[k]].maint || 0);
  return `<h1 class="h1">システム</h1>
  <p class="lead">銀行の業容はシステムの処理能力に縛られます。審査システムは粉飾の発見を助け、デジタル化は預金を集めますが、セキュリティとマネロン対策が追いつかないと事故と行政処分を招きます。システムの運用費は月${fmtYen(maint)}。</p>
  <div class="grid g3">${cards}</div>`;
};
Object.assign(ACTIONS, {
  sysUp: d => {
    const S = SYSTEMS[d.k], nx = S.levels[G.sys[d.k] + 1];
    const cost = nx.cost * (d.m === 'phased' ? 1.35 : 1);
    confirmBox(`${S.name}の更改`, `「${nx.name}」を導入します。投資額${fmtYen(cost)}はソフトウェアとして5年で償却し、自己資本からも控除されます。`, '発注する', 'sysUpGo', { k: d.k, m: d.m || 'std' });
  },
  sysUpGo: d => { const r = startSystemUpgrade(d.k, d.m); toast(r.ok ? 'プロジェクトを開始しました' : r.msg, r.ok ? '' : 'bad'); closeModal(true); },
});

function budgetScreen() {
  const bud = G.budget;
  if (!bud) return '<div class="empty">予算はまだありません</div>';
  const va = budgetVsActual(bud);
  const st = bud.status === 'draft' ? tag('予算案', 'warn') : bud.status === 'auto' ? tag('決定（案のまま）') : tag('決定済み', 'ok');
  const ach = lastBudgetAchievement();
  let html = `<div class="row between" style="margin-bottom:10px"><h3 style="margin:0;font-size:15px">第${bud.fy + 1}期（${fyYearLabel(bud.fy)}）の予算 ${st}</h3>${ach ? `<span class="small">前期の予算達成率（経常利益）<b class="num ${ach.rate < 100 ? 'neg' : 'pos'}">${fmtPct(ach.rate, 1)}</b></span>` : ''}</div>`;
  if (bud.status === 'draft') html += budgetForm(bud);
  // 予実表
  const pctCell = r => {
    if (!va.n || !isFinite(r.rate) || r.cum <= 0 || r.a < 0) return '―';
    return fmtPct(r.rate, 1);
  };
  /* 差異は「利益への影響」の向きで表示する（収益が多い・費用が少ない＝＋） */
  const diffCell = r => {
    if (!va.n) return '<td>―</td>';
    if (Math.abs(r.diff) < 5e5) return '<td class="muted">0</td>';
    return `<td class="${r.fav ? 'pos' : 'neg'}">${r.fav ? '+' : '△'}${fmtM(Math.abs(r.diff))}</td>`;
  };
  const rows = va.rows.map(r => `<tr class="${r.cls === 'grand' ? 'grand' : r.cls === 'sum' ? 'sum' : ''}"><td>${term(r.name, r.tk)}</td><td>${fmtM(r.year)}</td><td>${va.n ? fmtM(r.cum) : '―'}</td><td class="${r.a < 0 && !r.cost ? 'neg' : ''}">${va.n ? fmtM(r.a) : '―'}</td>
    ${diffCell(r)}<td>${pctCell(r)}</td><td>${fmtM(r.outlook)}</td></tr>`).join('');
  const loanPlan = bud.base.loans + (bud.loansEnd - bud.base.loans) * va.n / 12;
  const depPlan = bud.base.dep + (bud.depEnd - bud.base.dep) * va.n / 12;
  const bal = (name, tk, end, plan, now) => `<tr><td>${term(name, tk)}</td><td>${fmtM(end)}</td><td>${fmtM(plan)}</td><td>${fmtM(now)}</td><td class="${now >= plan ? 'pos' : 'neg'}">${now >= plan ? '+' : '△'}${fmtM(Math.abs(now - plan))}</td><td>${fmtPct(now / Math.max(1, plan) * 100, 1)}</td><td>―</td></tr>`;
  html += `<div class="tbl-wrap"><table class="fs"><thead><tr><th>（単位：百万円）</th><th>年間予算</th><th>予算（${va.n ? `4月〜${ymOf(fyOf(G.m) * 12 + va.n - 1).mo}月` : '未経過'}）</th><th>実績</th><th>差異</th><th>予算比</th><th>年間見通し</th></tr></thead><tbody>
    ${rows}<tr class="head"><td colspan="7">残高（期末の目標と、今月末の計画・実績）</td></tr>
    ${bal('貸出金残高', 'bankLoans', bud.loansEnd, loanPlan, B('loans'))}${bal('預金残高', 'bankDep', bud.depEnd, depPlan, deposits())}</tbody></table></div>
    <p class="note">差異の「＋」は利益を増やす方向（収益が予算より多い、費用が予算より少ない）の場合に緑で、「△」は利益を減らす方向の場合に赤で表示します。年間見通し＝実績＋残りの月の予算。</p>`;
  const cm = budgetComments(bud, va);
  if (cm.length) html += `<div class="callout" style="margin-top:10px"><b>予実のポイント</b><ul style="margin:6px 0 0;padding-left:1.2em">${cm.map(c => `<li>${c}</li>`).join('')}</ul></div>`;
  // 経常利益の累計グラフ
  if (va.n) {
    const labels = [], plan = [], act = [];
    let cp = 0, ca = 0;
    for (let i = 0; i < 12; i++) {
      const m = bud.fy * 12 + i;
      labels.push(`${ymOf(m).mo}月`);
      cp += budgetMonth(bud, 'ordinary', i);
      plan.push(cp);
      const h = G.hist.find(x => x.m === m);
      if (h) { ca += plSummary(h.pl).ordinary; act.push(ca); } else act.push(null);
    }
    html += `<div class="grid g2" style="margin-top:12px">${panel('経常利益の累計（予算と実績）', lineChart({ labels, height: 190, series: [{ name: '予算', color: 's2', values: plan, dash: true }, { name: '実績', color: 's1', values: act }] }))}
      ${panel('予算の立て方', `<ol class="small" style="margin:0;padding-left:1.3em;display:grid;gap:4px"><li>前期の実績から出発する（${term('業務粗利益', 'bankGross')}・${term('経費', 'ohr')}・${term('与信関係費用', 'creditCost')}）。</li><li>貸出金と預金をどれだけ伸ばすかを決める。${term('利ざや', 'spread')}が変わらなければ、貸出金の伸びがそのまま資金利益の伸びになります。</li><li>店舗・人員・システムの計画から経費を見積もる。6月と12月は賞与で経費が増えます。</li><li>景気を見て、貸倒れに備える費用を見積もる。</li><li>毎月の実績と比べ、差の原因を調べる（${term('予実管理', 'yojitsu')}）。</li></ol>`)}</div>`;
  }
  html += `<p class="note" style="margin-top:10px">${term('予実管理', 'yojitsu')}は、予算と実績の差を毎月確かめ、原因を調べて手を打つことです。銀行では貸出の残高と利ざや、経費、与信関係費用の4つが利益を大きく左右します。</p>`;
  return html;
}

function fsTable(cols, rowsList) {

          <tr class="${cr < reqCR() / 2 && cr >= 0 ? 'sel' : ''}"><td>0%以上${fmtPct(reqCR() / 2, 2)}未満</td><td>第2区分：新規融資の抑制など</td></tr><tr class="${cr < 0 ? 'sel' : ''}"><td>0%未満</td><td>第3区分：業務停止命令</td></tr></tbody></table></div></div>
        <div class="panel"><div class="pb"><b>増資（第三者割当）</b><p class="small muted" style="margin:4px 0 8px">株価 ${fmtNum(G.stock.price, 0)}円・時価総額 ${fmtYen(cap)}。発行価格は株価の92%。既存株主の持分は薄まります。</p>
          <div class="row"><input type="number" id="raiseAmt" min="1" step="1" value="${Math.max(1, Math.round(cap * 0.1 / 1e8))}" style="width:90px"><span class="unit">億円</span>${btn('増資する', 'raiseAsk', {}, 'primary')}</div></div></div>
        ${G.flags.publicFunds ? `<div class="panel"><div class="pb"><b>公的資金</b><p class="small">優先株式 ${fmtYen(B('prefCapital'))}。返済後も自己資本比率${fmtPct(Math.max(8, reqCR() + 2), 1)}以上を保てる場合に返済できます。</p>${btn('公的資金を返済する', 'repayPF', {}, 'sm')}</div></div>` : ''}
        ${G.flags.publicOffer && !G.flags.publicFunds ? `<div class="panel"><div class="pb"><b>公的資金の申請</b><p class="small">自己資本比率が${fmtPct(reqCR(), 1)}を下回ったため、公的資金の注入を申請できます。</p>${btn('申請を検討する', 'publicFundsShow', {}, 'sm danger')}</div></div>` : ''}</div></div>`;
      break;

    case 'npl': {

      const hs = G.hist.filter(h => h.m >= 0).slice(-36);
      body = `<div class="grid g2"><div><table class="t"><thead><tr><th>金融再生法開示債権</th><th class="n">残高</th><th class="n">構成比</th></tr></thead><tbody>
        <tr><td>破産更生債権及びこれらに準ずる債権（実質破綻先・破綻先）</td><td class="n">${fmtYen(n.bk)}</td><td class="n">${fmtPct(n.bk / Math.max(1, n.total) * 100)}</td></tr>
        <tr><td>危険債権（破綻懸念先）</td><td class="n">${fmtYen(n.doubt)}</td><td class="n">${fmtPct(n.doubt / Math.max(1, n.total) * 100)}</td></tr>
        <tr><td>要管理債権（要管理先）</td><td class="n">${fmtYen(n.sub)}</td><td class="n">${fmtPct(n.sub / Math.max(1, n.total) * 100)}</td></tr>
        <tr class="total"><td>小計（不良債権）</td><td class="n">${fmtYen(n.npl)}</td><td class="n">${fmtPct(n.ratio)}</td></tr>
        <tr><td>正常債権</td><td class="n">${fmtYen(n.normal)}</td><td class="n">${fmtPct(n.normal / Math.max(1, n.total) * 100)}</td></tr>
        <tr class="grand"><td>合計</td><td class="n">${fmtYen(n.total)}</td><td class="n">100.00%</td></tr></tbody></table>
        <p class="small" style="margin-top:8px">保全率（担保・保証・引当で手当て済みの割合）：<b>${n.npl > 0 ? fmtPct(Math.min(1, prot / n.npl) * 100, 1) : '―'}</b></p>
        <p class="note">開示は当行が付けた債務者区分に基づきます。区分を甘くすると見かけの不良債権比率は下がりますが、検査で修正されます。</p></div>
        ${panel('不良債権比率の推移', hs.length >= 2 ? lineChart({ labels: hs.map(h => ymShort(h.m)), height: 190, yFmt: axisPct(1), tipFmt: v => fmtPct(v), series: [{ name: '不良債権比率', color: 's3', values: hs.map(h => h.kpi.npl) }], endLabels: false }) : '<div class="empty">―</div>')}</div>`;
      break;
    }
    case 'history': {
      const rows = G.annual.slice().reverse().map(a => `<tr class="click" data-act="annualOpen" data-fy="${a.fy}"><td>${fyLabel(a.fy)}<div class="small muted">${fyYearLabel(a.fy)}</div></td><td class="n">${fmtYen(a.ta)}</td><td class="n">${fmtYen(a.dep)}</td><td class="n">${fmtYen(a.loans)}</td><td class="n ${a.pl.net < 0 ? 'neg' : ''}">${fmtYen(a.pl.net)}</td><td class="n">${fmtPct(a.roa)}</td><td class="n">${fmtPct(a.ohr, 1)}</td><td class="n">${fmtPct(a.cr)}</td><td class="n">${fmtPct(a.npl)}</td><td>${RATINGS[a.rating]}</td><td class="n">${a.dividend !== undefined ? fmtYen(a.dividend) : '―'}</td><td class="small">${esc(a.audit.opinion)}</td></tr>`).join('');
      body = rows ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>決算期</th><th class="n">総資産</th><th class="n">預金</th><th class="n">貸出金</th><th class="n">当期純利益</th><th class="n">ROA</th><th class="n">OHR</th><th class="n">自己資本比率</th><th class="n">不良債権比率</th><th>格付</th><th class="n">配当</th><th>監査意見</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">行をクリックすると決算書の詳細を表示します。</p>` : '<div class="empty">最初の決算は3月末です</div>';
      break;
    }
    case 'journal': {
      const cur = { m: 'cur', entries: Object.values(G.ledger.jcur).map(j => ({ desc: j.desc, n: j.n, lines: Object.entries(j.lines).map(([k, v]) => [k, v[0], v[1]]) })) };
      const js = [cur].concat(G.ledger.journal.slice().reverse());
      if (UI.jMonth === null || !js.some(j => String(j.m) === String(UI.jMonth))) UI.jMonth = cur.entries.length ? 'cur' : String(js[1] ? js[1].m : 'cur');
      const j = js.find(x => String(x.m) === String(UI.jMonth));
      const sel = `<label class="field" style="max-width:280px"><span>表示する月</span><select data-ch="jMonth">${js.map(x => `<option value="${x.m}"${String(x.m) === String(UI.jMonth) ? ' selected' : ''}>${x.m === 'cur' ? `当月（${ymLabel(G.m)}・締め前）` : x.m < 0 ? '開業時' : ymLabel(x.m)}</option>`).join('')}</select></label>`;
      const jt = j && j.entries.length ? `<div class="tbl-wrap"><table class="t compact"><thead><tr><th>摘要</th><th class="n">件数</th><th>借方</th><th class="n">金額</th><th>貸方</th><th class="n">金額</th></tr></thead><tbody>${j.entries.map(en => {
        const dr = en.lines.filter(l => l[1] > 0), cr = en.lines.filter(l => l[2] > 0);
        const n = Math.max(dr.length, cr.length);
        let h = '';
        for (let i = 0; i < n; i++) h += `<tr>${i === 0 ? `<td rowspan="${n}">${esc(en.desc)}</td><td class="n" rowspan="${n}">${en.n}</td>` : ''}<td>${dr[i] ? ACCT[dr[i][0]].name : ''}</td><td class="n">${dr[i] ? fmtNum(dr[i][1]) : ''}</td><td>${cr[i] ? ACCT[cr[i][0]].name : ''}</td><td class="n">${cr[i] ? fmtNum(cr[i][2]) : ''}</td></tr>`;
        return h;
      }).join('')}</tbody></table></div>` : '<div class="empty">仕訳はまだありません</div>';
      let dT = 0, cT = 0;
      const tb = ACCT_KEYS.map(k => {
        const v = B(k);
        if (!v) return '';
        const debitSide = isDebitNature(k) ? v >= 0 : v < 0;
        const amt = Math.abs(v);
        if (debitSide) dT += amt; else cT += amt;
        return `<tr><td class="num">${ACCT[k].code}</td><td>${ACCT[k].name}</td><td class="n">${debitSide ? fmtNum(amt) : ''}</td><td class="n">${debitSide ? '' : fmtNum(amt)}</td></tr>`;
      }).join('');
      body = `<div class="grid g2"><div>${sel}<div style="margin-top:10px">${jt}</div><p class="note">同じ種類の取引は月ごとに集計して表示しています（件数欄）。</p></div>
        <div><h3 style="font-size:14px;margin:0 0 6px">合計残高試算表（現在）</h3><table class="t compact"><thead><tr><th>コード</th><th>勘定科目</th><th class="n">借方残高</th><th class="n">貸方残高</th></tr></thead><tbody>${tb}<tr class="grand"><td></td><td>合計</td><td class="n">${fmtNum(dT)}</td><td class="n">${fmtNum(cT)}</td></tr></tbody></table>
        <p class="small" style="margin-top:6px">${Math.abs(dT - cT) <= 1 ? tag('借方合計と貸方合計が一致', 'ok') : tag('不一致', 'bad')}</p></div></div>`;
      break;
    }
  }
  return `<h1 class="h1">決算・財務</h1>
  <p class="lead">${G.bankName}の財務諸表です。決算は毎年3月末。監査法人の監査を経て、税金を計上し、配当を決めます。</p>
  <div class="subtabs">${tabs.map(([k, l]) => `<button type="button" data-act="finTab" data-v="${k}" aria-pressed="${UI.finTab === k}">${l}</button>`).join('')}</div>
  <div class="panel"><div class="pb">${body}</div></div>`;
};
Object.assign(ACTIONS, {
  finTab: d => { UI.finTab = d.v; render(); },
  annualOpen: d => showModal('annual', { fy: +d.fy }),

  repayPF: () => { const r = repayPublicFunds(); toast(r.ok ? '公的資金を返済しました' : r.msg, r.ok ? '' : 'bad'); render(); },

/* ---------- 監査・検査 ---------- */
SCREENS.audit = () => {
  const lv = G.sys.audit;
  const used = G.capUsed.audit, slots = auditSlots();
  const rows = openBranches().map(b => {
    const arr = G.branchReports[b.id] || [];
    const last = arr[arr.length - 1];
    if (!last) return `<tr><td>${esc(b.name)}</td><td colspan="7" class="muted">報告はまだありません</td></tr>`;
    const an = lv >= 1 ? branchAnomalies(b.id) : [];
    const risk = lv >= 2 ? fraudRiskScore(b.id) : null;
    const sp = k => sparkline(arr.map(x => x[k]), { w: 70, h: 20 });
    return `<tr><td><b>${esc(b.name)}</b><div class="small muted">${b.lastAudit !== undefined ? `前回の臨時監査 ${ymShort(b.lastAudit)}` : '臨時監査の実績なし'}</div></td>
      <td class="n">${fmtYen(last.exp)}<div>${sp('exp')}</div></td><td class="n">${fmtYen(last.suspense)}<div>${sp('suspense')}</div></td>
      <td class="n">${last.cashDiff}件<div>${sp('cashDiff')}</div></td><td class="n">${last.complaints}件<div>${sp('complaints')}</div></td><td class="n">${last.errors}件</td>
      <td>${an.length ? an.map(a => tag(a + 'に異常値', 'warn')).join(' ') : lv >= 1 ? '<span class="small muted">異常なし</span>' : '<span class="small muted">―</span>'}${risk !== null ? `<div class="small">不正リスク <b class="${risk >= 50 ? 'neg' : ''}">${risk}</b></div>` : ''}</td>
      <td class="n">${btn('臨時監査', 'audit', { id: b.id }, 'sm', { disabled: used >= slots })}</td></tr>`;
  }).join('');
  const cases = G.ifraud.filter(f => f.detected && !f.lost).slice().reverse().map(f => `<tr><td>${ymShort(f.detM)}</td><td>${esc(G.branches.find(b => b.id === f.bid)?.name || '（閉鎖店）')}</td><td>${f.type === 'embezzle' ? '顧客預金の着服' : '架空経費の計上'}</td><td class="n">${G.m - f.startM >= 0 ? (f.detM - f.startM) + 'か月' : ''}</td><td class="n">${fmtYen(f.cum)}</td><td>${{ special: '臨時監査', internal: '内部監査', external: '顧客の訴え・報道', fsa: '金融庁検査', auditor: '監査法人' }[f.how]}</td></tr>`).join('');
  const fsaRows = G.fsa.history.slice().reverse().map(h => `<tr><td>${ymLabel(h.m)}</td><td>${tag(h.text, h.grade <= 'B' ? 'ok' : 'bad')}</td><td class="small">${h.findings.length ? h.findings.map(f => esc(f.text)).join('<br>') : '指摘なし'}</td></tr>`).join('');
  const posture = `<table class="t compact"><tbody>
    <tr><td>管理・監査の人員</td><td class="n">${G.staff.comp}人（必要 ${fmtNum(compRequired(), 1)}人）</td><td>${compRatio() >= 1 ? tag('充足', 'ok') : tag('不足', 'bad')}</td></tr>
    <tr><td>内部監査支援システム</td><td class="n">Lv${lv}</td><td>${lv ? tag(SYSTEMS.audit.levels[lv].name, 'ok') : tag('紙ベース')}</td></tr>
    <tr><td>マネロン対策</td><td class="n">Lv${G.sys.aml}（求められる水準 Lv${amlRequired()}）</td><td>${G.sys.aml >= amlRequired() ? tag('充足', 'ok') : tag('不足', 'bad')}</td></tr>
    <tr><td>自己査定の区分ずれ（システム判定より甘い先）</td><td class="n">${G.loans.filter(L => isActiveLoan(L) && sysClass(L) > L.cls).length}件</td><td></td></tr>
    <tr><td>未検証の決算書</td><td class="n">${G.inbox.filter(x => x.type === 'review').length}先</td><td></td></tr>
    <tr><td>前回の金融庁検査</td><td class="n">${G.fsa.history.length ? ymLabel(G.fsa.history[G.fsa.history.length - 1].m) : 'まだ受けていない'}</td><td></td></tr></tbody></table>
    <p class="note">金融庁検査は概ね2〜3年ごと。予告は1か月前に届きます。重大な不祥事やシステム障害があると前倒しされます。</p>`;
  const audits = G.annual.slice().reverse().map(a => `<tr><td>${fyLabel(a.fy)}</td><td>${tag(a.audit.opinion, a.audit.opinion.includes('強調') ? 'warn' : 'ok')}</td><td class="small">${a.audit.notes.length ? a.audit.notes.map(esc).join('<br>') : '修正事項なし'}</td></tr>`).join('');
  return `<h1 class="h1">監査・検査</h1>
  <p class="lead">支店から毎月上がる報告に、行員の不正の兆候が紛れていることがあります。苦情や現金過不足の増加、仮払金や経費の不自然な膨張に注意し、怪しい店には臨時監査を入れましょう。</p>
  <div class="stack">${panel('支店の月次報告', `<div class="tbl-wrap"><table class="t"><thead><tr><th>店舗</th><th class="n">経費</th><th class="n">仮払金残高</th><th class="n">現金過不足</th><th class="n">顧客の苦情</th><th class="n">事務ミス</th><th>監査システムの所見</th><th class="n">臨時監査（今月 ${slots - used}/${slots}）</th></tr></thead><tbody>${rows}</tbody></table></div>`, { flush: true, aside: '直近の月と過去12か月の推移' })}
  <div class="grid g2">${panel('内部管理態勢', posture)}${panel('発覚した不正', cases ? `<table class="t compact"><thead><tr><th>発覚</th><th>店舗</th><th>内容</th><th class="n">期間</th><th class="n">被害額</th><th>発覚の経緯</th></tr></thead><tbody>${cases}</tbody></table>` : '<div class="empty">これまでに発覚した不正はありません</div>', { flush: !!cases })}</div>
  <div class="grid g2">${panel('金融庁検査の履歴', fsaRows ? `<table class="t compact"><thead><tr><th>実施</th><th>結果</th><th>指摘事項</th></tr></thead><tbody>${fsaRows}</tbody></table>` : '<div class="empty">まだ検査を受けていません</div>', { flush: !!fsaRows })}
  ${panel('監査法人の監査', audits ? `<table class="t compact"><thead><tr><th>決算期</th><th>監査意見</th><th>指摘</th></tr></thead><tbody>${audits}</tbody></table>` : '<div class="empty">最初の決算は3月末です</div>', { flush: !!audits })}</div></div>`;
};
Object.assign(ACTIONS, {
  audit: d => {
    const r = specialAudit(d.id);
    if (!r.ok) toast(r.msg, 'bad');
    else if (r.found) toast(`不正を発見しました：被害額${fmtYen(r.f.cum)}`, 'bad');
    else toast('臨時監査の結果、異常はありませんでした');
    render();
  },
});

/* ---------- 経済・ニュース ---------- */
const NEWS_CATS = [['all', 'すべて'], ['eco', '経済'], ['ind', '業界'], ['city', CITY_NAME], ['bank', '当行'], ['loan', '融資先'], ['reg', '規制・検査']];
SCREENS.news = () => {

    ${small('消費者物価指数（前年比）', [{ name: '消費者物価', color: 's3', values: hs.map(h => h.kpi.cpi) }], v => fmtNum(v, 1) + '%')}
    ${small('完全失業率', [{ name: '失業率', color: 's2', values: hs.map(h => h.kpi.unemp) }], v => fmtNum(v, 1) + '%')}
    ${small('政策金利と10年国債', [{ name: '政策金利', color: 's1', values: hs.map(h => h.kpi.policy) }, { name: '10年国債', color: 's2', values: hs.map(h => h.kpi.y10) }], v => fmtNum(v, 2) + '%')}
    ${small('全国の地価指数', [{ name: '地価指数', color: 's3', values: hs.map(h => h.kpi.landN) }], v => fmtNum(v, 0))}
    ${small('株価指数', [{ name: '株価指数', color: 's2', values: hs.map(h => h.kpi.stockN) }], v => fmtNum(v, 0))}</div>`;
  const indRows = INDUSTRIES.map(i => {
    const v = indCond(i.id);
    const w = Math.abs(v) / 1.2 * 50;
    const bar = `<div style="position:relative;height:10px;background:var(--sheet-3);border-radius:2px"><span style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)"></span><span style="position:absolute;top:0;bottom:0;${v >= 0 ? `left:50%;width:${w}%;background:var(--s1)` : `right:50%;width:${w}%;background:var(--shu)`};border-radius:2px"></span></div>`;
    return `<tr><td>${i.name}</td><td style="width:45%">${bar}</td><td class="n">${v >= 0.15 ? '好調' : v <= -0.15 ? '不調' : '平常'}</td></tr>`;
  }).join('');
  return `<h1 class="h1">経済・ニュース</h1>

  const views = [['nat', '全国の店舗網'], ['ovs', '海外の拠点'], ['credit', '融資方針・権限']];
  const sub = `<div class="subtabs">${views.map(([k, l]) => `<button type="button" data-act="netView" data-v="${k}" aria-pressed="${UI.netView === k}">${l}</button>`).join('')}</div>`;
  const body = UI.netView === 'credit' ? creditPolicyPanel() : networkPanel(UI.netView);
  return `<h1 class="h1">経営戦略</h1>
  <p class="lead">業態の格上げを目指し、全国・海外の店舗網を広げます。大きくなるほど動かすお金は増えますが、維持基準は厳しくなり、失敗したときの格下げの痛手も大きくなります。</p>
  <div class="stack">${head}<div class="grid g2">${up}${keep || hist}</div>${keep ? hist : ''}${sub}${body}</div>`;
};
function nextQuarterEnd() { let m = G.m; while (![6, 9, 12, 3].includes(calMonth(m))) m++; return m; }

/* ---------- 地域の地図（タイル） ---------- */
function tileMap(defs, scope) {
  const cw = 92, ch = 64, gap = 6;
  const cols = Math.max(...defs.map(R => R.tile[0])) + 1, rows = Math.max(...defs.map(R => R.tile[1])) + 1;
  const W = cols * (cw + gap) + gap, H = rows * (ch + gap) + gap;
  const sel = UI.netSel && defs.some(R => R.id === UI.netSel) ? UI.netSel : null;
  const home = scope === 'ovs' ? `<g><rect x="${gap + 6 * (cw + gap)}" y="${gap + 1 * (ch + gap)}" width="${cw}" height="${ch}" rx="6" class="tile home"/><text x="${gap + 6 * (cw + gap) + cw / 2}" y="${gap + 1 * (ch + gap) + ch / 2 + 5}" text-anchor="middle" class="tile-t">日本</text></g>` : '';
  const tiles = defs.map(R => {
    const r = G.net[R.id];
    const x = gap + R.tile[0] * (cw + gap), y = gap + R.tile[1] * (ch + gap);
    const lv = r.lv;
    const cls = `tile lv${lv}${r.build ? ' building' : ''}${sel === R.id ? ' sel' : ''}${r.frozenUntil > G.m ? ' frozen' : ''}`;
    const dots = Array.from({ length: 5 }, (_, i) => `<circle cx="${x + cw / 2 - 20 + i * 10}" cy="${y + ch - 13}" r="3" class="${i < lv ? 'on' : r.build && i === lv ? 'bd' : 'off'}"/>`).join('');
    return `<g data-act="netSel" data-a="${R.id}" role="button" tabindex="0" aria-label="${R.name} Lv${lv}"><rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="6" class="${cls}"/>
      <text x="${x + cw / 2}" y="${y + 24}" text-anchor="middle" class="tile-t ${lv >= 3 ? 'inv' : ''}">${R.name}</text>${dots}</g>`;
  }).join('');
  return `<svg class="tilemap" viewBox="0 0 ${W} ${H}" role="img" aria-label="${scope === 'ovs' ? '海外の拠点' : '全国の店舗網'}の地図">${home}${tiles}</svg>`;
}

function networkPanel(scope) {
  const st = stageOf();
  const ovs = scope === 'ovs';
  const defs = ovs ? OVERSEAS : NATIONS;
  const locked = ovs ? st < 2 : st < 1;
  if (!UI.netSel || !defs.some(R => R.id === UI.netSel)) UI.netSel = (defs.find(R => G.net[R.id].lv > 0) || defs[0]).id;
  const rows = defs.map(R => {
    const r = G.net[R.id];
    const LV = regionLevels(R.id);
    const dep = ovs ? r.dep : r.ord + r.time;
    const loans = areaLoanBal(R.id);
    const state = r.build ? tag(`拡大中→Lv${r.build.to}（${ymShort(r.build.doneM)}）`, 'warn') : r.frozenUntil > G.m ? tag('業務制限', 'bad') : r.pdUntil >= G.m && r.pdMul > 1 ? tag('貸倒れ増加', 'bad') : '';
    return `<tr class="click${UI.netSel === R.id ? ' sel' : ''}" data-act="netSel" data-a="${R.id}"><td>${R.name}<div class="small muted">${esc(ovs ? R.city : R.sub)}</div></td><td>Lv${r.lv} ${esc(LV[r.lv].name)}</td>
      <td class="n">${dep ? fmtYen(dep) : '―'}</td><td class="n">${loans ? fmtYen(loans) : '―'}</td><td class="n">${r.lv || r.build ? fmtYen(regionOpex(R.id)) : '―'}</td><td>${state}</td></tr>`;
  }).join('');
  const totDep = ovs ? B('depFx') : natDep();
  const totLoans = sum(defs, R => areaLoanBal(R.id));
  const lockMsg = locked ? `<p class="callout">${ovs ? '海外への展開はテラバンクに格上げされてから行えます。' : '全国への展開はメガバンクに格上げされてから行えます。'}地図と市場の規模は今のうちに確かめておけます。</p>` : '';
  const summary = kv([[ovs ? '海外店預金' : '全国の店舗網の預金', fmtYen(totDep)], [ovs ? '海外の貸出' : '全国の店舗網の貸出', fmtYen(totLoans)],
    ['店舗・行員', `${fmtNum(sum(defs, R => regionBranches(R.id)))}店・${fmtNum(sum(defs, R => regionStaff(R.id)))}人`], ['月間の経費', fmtYen(sum(defs, R => regionOpex(R.id)))],
    ovs ? ['外貨の調達ギャップ', fmtYen(sum(OVERSEAS, R => G.net[R.id].gap || 0))] : ['国内の預金シェア', `${fmtPct(natShare())}（上限5%）`]]);
  return `${lockMsg}<div class="grid g-side"><div class="stack">${panel(ovs ? '海外の拠点' : '全国の店舗網', `${tileMap(defs, scope)}<p class="note">マスをクリックすると地域の詳細が出ます。点の数が店舗網の段階（最大5）。</p>`)}
    ${panel('地域の一覧', `<div class="tbl-wrap"><table class="t"><thead><tr><th>地域</th><th>段階</th><th class="n">預金</th><th class="n">貸出</th><th class="n">月間経費</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`, { flush: true })}</div>
    <div class="stack">${panel('合計', summary)}${regionDetail(UI.netSel, locked)}</div></div>`;
}

function regionDetail(a, locked) {
  const R = regionDef(a), r = G.net[a], ovs = isOvsArea(a);
  const LV = regionLevels(a), sc = regionScale(a);
  const cur = LV[r.lv], nx = LV[r.lv + 1];
  const dep = ovs ? r.dep : r.ord + r.time;
  const segs = segLoans(a);
  const rows = [
    ['市場の規模', `預金 ${fmtNum(R.dep)}兆円・貸出 ${fmtNum(R.loan)}兆円`],
    ovs ? ['現地の金利・為替', `政策金利 ${fmtPct(r.rate, 2)}・通貨 ${r.fx >= 1 ? '+' : MINUS}${fmtNum(Math.abs(r.fx - 1) * 100, 1)}%（進出の基準比）`] : ['競争の激しさ', R.compet >= 1.2 ? '激しい' : R.compet >= 1 ? '普通' : 'ゆるやか'],
    ovs ? ['カントリーリスク・規制', `${'★'.repeat(R.risk)}${'☆'.repeat(5 - R.risk)}・規制${R.reg >= 2.5 ? '厳しい' : R.reg >= 2 ? '普通' : 'ゆるやか'}${R.geo ? '・地政学リスク' : ''}`] : null,
    ['現在の段階', `Lv${r.lv} ${esc(cur.name)}（店舗${fmtNum(regionBranches(a))}・行員${fmtNum(regionStaff(a))}人）`],
    ['預金', dep ? fmtYen(dep) : '―'],
    ...segs.map(L => [esc(segName(a, L.seg)), `${fmtYen(L.bal)}（金利${fmtRate(L.rate)}・延滞率${fmtPct(L.pd, 2)}）`]),
    ['月間の経費', fmtYen(regionOpex(a))],
    ovs && r.gap ? ['外貨の調達ギャップ', `${fmtYen(r.gap)}（ヘッジ ${fmtNum(G.credit.hedge * 100, 0)}%）`] : null,
  ];
  let act = '';
  if (!locked) {
    const b = buildCheck(a);
    const acq = acqQuote(a);
    const parts = [];
    if (nx && !nx.acqOnly) parts.push(`<div class="nextlv"><b>次の段階：Lv${nx.lv} ${esc(nx.name)}</b><div class="small muted">投資 ${fmtYen(nx.capex * sc)}・完成まで${nx.months}か月・月間経費 ${fmtYen(nx.opex * sc)}・預金シェアの目安 ${fmtPct(nx.dep * 100, 2)}</div>
      <div class="row" style="margin-top:6px">${btn('拡大する', 'regionBuildAsk', { a }, 'primary sm', { disabled: !b.ok })}${b.ok ? '' : `<span class="small muted">${esc(b.msg)}</span>`}</div></div>`);
    if (acq && (ovs ? r.lv >= 1 : true)) {
      const c = acqCheck(a, 'stock');
      parts.push(`<div class="nextlv"><b>${ovs ? '現地の有力銀行' : '地方銀行'}を買収：${esc(acq.name)}</b><div class="small muted">Lv${acq.to}へ一気に拡大。預金 ${fmtYen(acq.d)}・貸出 ${fmtYen(acq.l)}・買収額 ${fmtYen(acq.price)}（のれん ${fmtYen(acq.goodwill)}）</div>
        <div class="row" style="margin-top:6px">${btn('買収を検討する', 'acqOpen', { a }, 'sm')}${c.ok || c.q ? '' : `<span class="small muted">${esc(c.msg)}</span>`}</div></div>`);
    }
    if (r.lv || r.build) parts.push(`<div class="row" style="margin-top:8px">${btn('この地域から撤退する', 'regionExitAsk', { a }, 'sm danger')}</div>`);
    act = parts.join('');
  }
  return panel(`${R.name}`, `${kv(rows.filter(Boolean))}${act}`, { aside: ovs ? esc(R.city) : esc(R.sub) });
}

/* ---------- 融資方針・権限 ---------- */
function creditPolicyPanel() {
  const st = stageOf();
  const polRow = (scope, label) => {
    const p = G.credit[scope];
    const ls = segLoans().filter(L => (scope === 'ovs') === isOvsArea(L.area));
    const bal = sum(ls, L => L.bal);
    const el = sum(ls, L => L.bal * L.pd / 100 * segLGD(L));
    const npl = sum(ls, L => L.npl || 0);
    const adjOpts = [-0.3, -0.15, 0, 0.15, 0.3, 0.6].map(v => `<option value="${v}"${Math.abs(p.adj - v) < 1e-9 ? ' selected' : ''}>${v > 0 ? '+' : v < 0 ? MINUS : '±'}${fmtNum(Math.abs(v), 2)}%</option>`).join('');
    const q = nplBulkQuote(scope);
    return `<div class="policy"><h3>${label}</h3>
      <div class="field"><span>新規融資の姿勢</span><div class="seg">${Object.entries(APPETITE).map(([k, A]) => `<button type="button" data-act="creditSet" data-scope="${scope}" data-v="${k}" aria-pressed="${p.app === k}">${A.name}</button>`).join('')}</div></div>
      <label class="field" style="margin-top:8px"><span>金利の上乗せ（店頭の標準金利に対して）</span><select data-ch="creditAdj" data-scope="${scope}">${adjOpts}</select></label>
      <p class="small muted" style="margin:6px 0 0">積極にすると量は増えますが、審査が甘くなり延滞が増えます。金利を上げると量は減り、借り手の質も下がります（逆選択）。変更は新しく貸す分から効いてきます。</p>
      ${kv([['残高', fmtYen(bal)], ['年間の予想損失', fmtYen(el)], ['不良債権', `${fmtYen(npl)}（${fmtPct(bal ? npl / bal * 100 : 0)}）`]])}
      ${q.face >= 1e8 ? `<div class="row" style="margin-top:6px">${btn(`不良債権を一括売却（${fmtYen(q.face)} → ${fmtYen(q.price)}）`, 'nplSaleAsk', { scope }, 'sm danger')}</div>` : ''}</div>`;
  };
  const d = G.policy.delegate;
  const gopt = (sel, from, to) => Array.from({ length: to - from + 1 }, (_, i) => from + i).map(g => `<option value="${g}"${g === sel ? ' selected' : ''}>格付${g}</option>`).join('');
  const amtOpt = [1e8, 3e8, 10e8, 30e8].map(v => `<option value="${v}"${d.max === v ? ' selected' : ''}>${fmtYen(v)}以下</option>`).join('');
  const deleg = panel('決裁権限の委譲（支店長決裁）', `<p class="small" style="margin:0 0 8px">回答期限を迎えた${CITY_NAME}の小口の申込を、月末に審査基準で自動的に処理します（調査はしないため粉飾は見抜けません）。大企業・海外企業の案件は常に頭取決裁です。</p>
    <label class="inline"><input type="checkbox" data-ch="delegOn" ${d.on ? 'checked' : ''}> 委譲する</label>
    <div class="row" style="gap:12px;margin-top:8px;flex-wrap:wrap"><label class="field"><span>承認：格付</span><select data-ch="delegSel" data-k="ok">${gopt(d.ok, 1, 9)}</select></label>
    <label class="field"><span>謝絶：格付</span><select data-ch="delegSel" data-k="ng">${gopt(d.ng, 2, 10)}</select></label>
    <label class="field"><span>対象の金額</span><select data-ch="delegMax">${amtOpt}</select></label></div>
    ${G.lastDelegate ? `<p class="small muted" style="margin:8px 0 0">前回：承認${G.lastDelegate.acc}件（${fmtYen(G.lastDelegate.amt)}）・謝絶${G.lastDelegate.ng}件</p>` : ''}`);
  const hedge = [0, 0.5, 0.8, 1].map(v => `<button type="button" data-act="hedgeSet" data-v="${v}" aria-pressed="${Math.abs(G.credit.hedge - v) < 1e-9}">${fmtNum(v * 100, 0)}%</button>`).join('');
  const fx = st >= 2 ? panel('為替ヘッジ（外貨調達）', `<p class="small" style="margin:0 0 8px">海外の貸出が現地の預金を上回る分は、円を為替スワップで外貨に換えて賄います。ヘッジすると現地との金利差ぶんの調達コストがかかり、ヘッジしない分は為替の変動がそのまま損益に出ます（自己資本比率の計算でも為替リスクとして加算）。</p>
    <div class="field"><span>ヘッジ比率</span><div class="seg">${hedge}</div></div>`) : '';
  return `<div class="grid g2">${panel('リテール・中小企業向け融資の方針', `${polRow('nat', '全国の店舗網')}${st >= 2 ? '<hr class="sep">' + polRow('ovs', '海外の拠点') : ''}`)}<div class="stack">${deleg}${fx}</div></div>`;
}

Object.assign(ACTIONS, {

    confirmBox(`${STAGES[to].name}への格上げを申請`, `金融庁に${to === 1 ? '全国展開' : '海外展開'}の認可を申請します。審査は${to === 1 ? 3 : 6}か月で、審査の終わりにも条件を満たしている必要があります。対応費用として${fmtYen(REVIEW_COST[to])}がかかります。`, '申請する', 'upgradeGo');
  },
  upgradeGo: () => { const r = applyUpgrade(); toast(r.ok ? `格上げを申請しました（${r.months}か月の審査）` : r.msg, r.ok ? '' : 'bad'); closeModal(true); },
  regionBuildAsk: d => {
    const c = buildCheck(d.a);
    if (!c.ok) { toast(c.msg, 'bad'); return; }
    const R = regionDef(d.a), sc = regionScale(d.a);

  },
  regionBuildGo: d => { const r = buildRegion(d.a); toast(r.ok ? '拡大に着手しました' : r.msg, r.ok ? '' : 'bad'); closeModal(true); },
  regionExitAsk: d => {
    const R = regionDef(d.a), ovs = isOvsArea(d.a);
    confirmBox(`${R.name}から撤退`, `貸出債権を${ovs ? '5' : '1.5'}%引きで売却し、預金は他行に引き継ぎます。店舗・設備は簿価の6割で売却し、のれんは全額償却します。撤退後も地域の大企業との取引は続きます。`, '撤退する', 'regionExitGo', { a: d.a }, true);
  },
  regionExitGo: d => { const r = exitRegion(d.a, false); toast(r.ok ? `撤退しました（損失 ${fmtYen(Math.max(0, r.loss))}）` : r.msg, r.ok ? '' : 'bad'); trueUpProvisionsSilent(); closeModal(true); },
  acqOpen: d => showModal('acq', { a: d.a, method: 'stock' }),
  acqMethod: d => { UI.modal.args.method = d.v; drawModal(); },
  acqGo: d => { const r = acquireRegion(d.a, d.m); toast(r.ok ? `${r.q.name}を買収しました` : r.msg, r.ok ? '' : 'bad'); if (r.ok) closeModal(true); else drawModal(); },
  creditSet: d => { G.credit[d.scope].app = d.v; render(); },
  hedgeSet: d => { G.credit.hedge = +d.v; render(); },
  nplSaleAsk: d => {
    const q = nplBulkQuote(d.scope);
    confirmBox('不良債権の一括売却', `延滞・条件変更先の債権 ${fmtYen(q.face)} を投資ファンドに ${fmtYen(q.price)} で売却します。差額は売却損になりますが、不良債権比率はすぐに下がります（1年ほどかけて再び積み上がります）。`, '売却する', 'nplSaleGo', { scope: d.scope }, true);
  },
  nplSaleGo: d => { const r = nplBulkSale(d.scope); toast(r.ok ? '不良債権を売却しました' : r.msg, r.ok ? '' : 'bad'); closeModal(true); },
});
Object.assign(CHANGES, {
  creditAdj: el => { G.credit[el.dataset.scope].adj = +el.value; render(); },
  delegOn: el => { G.policy.delegate.on = el.checked; render(); },
  delegSel: el => { G.policy.delegate[el.dataset.k] = +el.value; render(); },

});

/* ---------- 買収 ---------- */
MODALS.acq = a => {
  const R = regionDef(a.a), ovs = isOvsArea(a.a);
  const q = acqQuote(a.a);
  if (!q) return modalFrame('買収', '<p>買収できる銀行はありません。</p>', btn('閉じる', 'closeModal'));
  const m = a.method;
  const c = acqCheck(a.a, m);
  const cap = marketCap();
  const body = `<p style="margin:0 0 10px">${R.name}の${ovs ? '有力銀行' : '地方銀行'}「<b>${esc(q.name)}</b>」が買収に応じる意向です。買収すると${R.name}の店舗網は一気に<b>Lv${q.to}</b>になります。</p>
    <div class="grid g2"><div>${kv([['引き継ぐ預金', fmtYen(q.d)], ['引き継ぐ貸出', fmtYen(q.l)], ['相手の純資産', fmtYen(q.na)], ['買収額（純資産の' + fmtNum(q.prem, 2) + '倍）', `<b>${fmtYen(q.price)}</b>`], ['のれん（20年で償却・資本から控除）', fmtYen(q.goodwill)], ['経営統合の費用', fmtYen(q.na * 0.04)]])}</div>
    <div><div class="field"><span>支払方法</span><div class="seg"><button type="button" data-act="acqMethod" data-v="stock" aria-pressed="${m === 'stock'}">株式交換</button><button type="button" data-act="acqMethod" data-v="cash" aria-pressed="${m === 'cash'}">現金</button></div></div>
    <p class="small" style="margin:8px 0">${m === 'stock' ? `新しい株式を発行して支払います。資本が増えるので自己資本比率は保ちやすい一方、既存株主の持分が薄まります（時価総額 ${fmtYen(cap)}）。` : '手元の資金で支払います。株主の持分は薄まりませんが、のれんと引き継ぐ貸出の分だけ自己資本比率が下がります。'}</p>
    ${kv([['買収後の自己資本比率（見込み）', c.cr !== undefined ? `<b class="${c.cr < reqCR() + 1 ? 'neg' : ''}">${fmtPct(c.cr)}</b>` : '―']])}</div></div>
    <p class="callout${c.ok ? '' : ' bad'}" style="margin-top:10px">${c.ok ? '買収のあとで、統合前の査定では見えなかった不良債権が見つかることがあります（貸倒れが当面増えます）。買収は1年に1件までです。' : esc(c.msg)}</p>`;
  return modalFrame(`${esc(q.name)}の買収`, body, btn('見送る', 'closeModal') + btn('買収する', 'acqGo', { a: a.a, m }, 'primary', { disabled: !c.ok }), { sub: R.name });
};

/* ---------- 格上げ・格下げの演出 ---------- */
MODALS.stage = a => {
  if (a.kind === 'up') {
    const S = STAGES[a.to];
    const mg = a.merger;
    const body = `${scene(STAGE_ART[a.to], { cls: 'modal-art', alt: S.name })}

      <p class="small">増資で資本を厚くする、不良債権を売却する、リスクの高い地域から撤退する、融資方針を慎重にする、などで立て直してください。</p>`;

};

/* =========================================================
 *  16_learn.js : 学習サポート
 *   - 用語のリンク（term）と解説カード、用語集
 *   - 決算書の読み方ガイド（審査の手順。どこを見るかを順に示し、表の行を光らせる）
 *   銀行の稟議書と、会社経営モードの決算書の両方で使う。
 * ========================================================= */

/* ---------- 用語のリンク ---------- */
function term(label, key, cls = '') {
  const t = TERMS[key];
  if (!t) return label;
  return `<button type="button" class="term${cls ? ' ' + cls : ''}" data-act="term" data-k="${key}" data-tip="${esc(t.s)}">${label}</button>`;
}
/* 表の見出しなど、文字列から用語を引く（完全一致） */
const TERM_BY_NAME = (() => {
  const m = {};
  for (const k of Object.keys(TERMS)) m[TERMS[k].n] = k;
  return m;
})();
function termAuto(label, key) { return term(esc(label), key || TERM_BY_NAME[label]); }

MODALS.term = a => {
  const t = TERMS[a.k];
  if (!t) return modalFrame('用語', '<p>見つかりません</p>', btn('閉じる', 'closeModal', {}, 'primary'), { size: 'narrow' });
  const cat = (TERM_CATS.find(c => c[0] === t.c) || [0, ''])[1];
  const see = (t.see || []).filter(k => TERMS[k]);
  const body = `<div class="termcard">
    <p class="lead">${t.s}</p>
    ${t.b ? `<p>${t.b}</p>` : ''}
    ${t.f ? `<div class="formula">${esc(t.f)}</div>` : ''}
    ${t.p ? `<div class="lookhere"><b>決算書のここを見る</b><p>${t.p}</p></div>` : ''}
    ${t.g ? `<p class="small"><b>目安：</b>${t.g}</p>` : ''}
    ${see.length ? `<div class="see"><span class="small muted">関連する用語</span><div class="chips">${see.map(k => `<button type="button" class="chip" data-act="term" data-k="${k}">${esc(TERMS[k].n)}</button>`).join('')}</div></div>` : ''}
  </div>`;
  return modalFrame(esc(t.n), body, btn('用語集', 'glossary') + btn('閉じる', 'closeModal', {}, 'primary'), { size: 'narrow', sub: esc(cat) });
};

function glossList(cat, q) {
  const qq = (q || '').trim();
  const keys = TERM_KEYS.filter(k => {
    const t = TERMS[k];
    if (cat !== 'all' && t.c !== cat) return false;
    return !qq || (t.n + t.s + (t.b || '') + (t.p || '')).includes(qq);
  });
  if (qq) keys.sort((a, b) => (TERMS[b].n.includes(qq) ? 1 : 0) - (TERMS[a].n.includes(qq) ? 1 : 0));
  if (!keys.length) return '<div class="empty">見つかりませんでした</div>';
  return `<ul class="glist">${keys.map(k => `<li><button type="button" class="gitem" data-act="term" data-k="${k}"><b>${esc(TERMS[k].n)}</b><span>${TERMS[k].s}</span></button></li>`).join('')}</ul>`;
}
MODALS.glossary = () => {
  const cat = UI.glossCat || 'all';
  const tabs = [['all', 'すべて'], ...TERM_CATS];
  const body = `<div class="subtabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" data-act="glossCat" data-v="${k}" aria-pressed="${cat === k}">${l}</button>`).join('')}</div>
    <input type="search" class="gsearch" data-in="glossQ" value="${esc(UI.glossQ || '')}" placeholder="用語を探す（例：減価償却、債務償還年数）" aria-label="用語を探す">
    <div id="glossList">${glossList(cat, UI.glossQ)}</div>`;
  return modalFrame('用語集', body, btn('閉じる', 'closeModal', {}, 'primary'), { size: 'wide', sub: `決算書・経営指標・簿記・予算・銀行の用語 ${TERM_KEYS.length}語` });
};

/* 用語カードは、開いていた画面（モーダル）に戻れるようにする */
function pushModalBack(name) {
  if (UI.modal && UI.modal.name !== name && !(name === 'term' && UI.modal.name === 'term')) {
    UI.mstack = UI.mstack || [];
    UI.mstack.push(UI.modal);
    if (UI.mstack.length > 6) UI.mstack.shift();
  }
}
Object.assign(ACTIONS, {
  term: d => { hideTip(); pushModalBack('term'); showModal('term', { k: d.k }); },
  glossary: () => { hideTip(); pushModalBack('glossary'); showModal('glossary'); },
  glossCat: d => { UI.glossCat = d.v; showModal('glossary'); },
});
INPUTS.glossQ = el => { UI.glossQ = el.value; const box = $('#glossList'); if (box) box.innerHTML = glossList(UI.glossCat || 'all', el.value); };

/* ---------- 決算書の読み方ガイド ---------- */
const EVAL = { good: ['良好', 'ok'], mid: ['普通', ''], warn: ['注意', 'warn'], bad: ['危険', 'bad'], none: ['―', ''] };

/* ys: 決算（古い順。先頭は前期比較用に1期多く含めてよい） */
function fsGuideSteps(ys, ind) {
  const n = ys.length;
  if (!n) return [];
  const L = ys[n - 1], P = n > 1 ? ys[n - 2] : null;
  const disp = ys.slice(-3);
  const r = ratiosOf(L, P);
  const rp = P ? ratiosOf(P, n > 2 ? ys[n - 3] : null) : null;
  const avg = industryAvg(ind);
  const yen = v => fmtYen(v);
  const steps = [];

  /* ① 規模と成長 */
  const g = disp.length >= 2 ? (disp[disp.length - 1].S / Math.max(1, disp[0].S) - 1) * 100 : NaN;
  steps.push({
    t: '売上は伸びているか', sub: '規模と成長', view: 'pl', rows: ['sales'], terms: ['sales', 'salesG'],
    vals: `売上高 ${disp.map(s => yen(s.S)).join(' → ')}`,
    ev: !isFinite(g) ? 'none' : g > 5 ? 'good' : g >= -5 ? 'mid' : 'warn',
    msg: !isFinite(g) ? '比べる前期がありません。' : `${disp.length}期で${fmtPct(g, 1, { sign: true })}。${g < -5 ? '売上が縮むと家賃や人件費などの固定費をまかなえなくなります。客数・単価・取引先のどこが減ったのかを確かめます。' : g > 20 ? '急成長の会社は、売掛金や在庫が膨らんで現金が足りなくなりやすい（黒字倒産）。運転資金の伸びも一緒に見ます。' : '大きな変化はありません。次は利益が出ているかを見ます。'}`,
  });

  /* ② 稼ぐ力 */
  const prof = disp.filter(s => s.ORD > 0).length;
  steps.push({
    t: '本業で稼げているか', sub: '収益性', view: 'pl', rows: ['gp', 'opi', 'ord'], terms: ['opi', 'ord', 'ordm'],
    vals: `経常利益 ${disp.map(s => yen(s.ORD)).join(' → ')}（経常利益率 ${fmtPct(r.ordm, 1)}・業界平均 ${fmtPct(avg.ordm, 1)}）`,
    ev: L.ORD <= 0 ? (prof === 0 ? 'bad' : 'warn') : r.ordm >= avg.ordm ? 'good' : 'mid',
    msg: L.ORD <= 0 ? `直近期は経常赤字（${disp.length}期中${prof}期が黒字）。${L.OPI <= 0 ? '営業利益から赤字なので、商売のやり方そのもの（粗利・経費）に問題があります。' : '営業利益は黒字なので、借入の利息が重いのが原因です。'}`
      : `経常利益は${prof}期とも黒字${prof < disp.length ? 'ではありません' : ''}。${r.ordm >= avg.ordm ? '利益率は業界平均以上です。' : '利益率は業界平均を下回ります。粗利率と販管費のどちらに原因があるか見ます。'}`,
  });

  /* ③ 安全性 */
  steps.push({
    t: '財務は安全か', sub: '安全性', view: 'bs', rows: ['eq', 'ta'], terms: ['eqR', 'insolvent', 'eq'],
    vals: `純資産 ${yen(L.EQ)}・自己資本比率 ${fmtPct(r.eqR, 1)}`,
    ev: L.EQ < 0 ? 'bad' : r.eqR < 10 ? 'warn' : r.eqR < 30 ? 'mid' : 'good',
    msg: L.EQ < 0 ? '純資産がマイナスの債務超過です。資産を全部売っても借入を返しきれません。銀行は新しい融資に非常に慎重になります。'
      : r.eqR < 10 ? '自己資本比率が10%未満で、借入に頼った財務です。少しの赤字で債務超過になりかねません。'
        : r.eqR < 30 ? '自己資本比率は中小企業として普通の水準です。' : '自己資本比率が高く、返さなくてよいお金が厚い安全な財務です。',
  });

  /* ④ 返済能力 */
  const debt = L.STD + L.LTD;
  steps.push({
    t: '借入金を返せるか', sub: '返済能力', view: 'ratio', rows: ['dsy', 'icr', 'debtMonths'], terms: ['dsy', 'icr', 'debt'],
    vals: `借入金 ${yen(debt)}・債務償還年数 ${fmtRatio(r.dsy, '年')}・ICR ${fmtRatio(r.icr, '倍')}`,
    ev: debt <= 0 || r.dsy === 0 ? 'good' : !isFinite(r.dsy) ? 'bad' : r.dsy <= 10 ? 'good' : r.dsy <= 20 ? 'warn' : 'bad',
    msg: debt <= 0 ? '借入金はありません（実質無借金）。'
      : r.dsy === 0 ? '借入金より現預金が多く、実質的に無借金です。'
        : !isFinite(r.dsy) ? '返済に使えるお金（経常利益＋減価償却費）がマイナスで、今の稼ぎでは返済できません。'
          : `今の稼ぎ（経常利益×0.7＋減価償却費）で、実質の借入を約${fmtNum(r.dsy, 1)}年で返せる計算です。${r.dsy <= 10 ? '10年以内なので正常の目安に収まっています。' : '10年を超えると返済能力に不安があるとみなされます。'}`,
  });

  /* ⑤ お金の流れ */
  const cf = P ? cfOf(L, P) : null;
  steps.push({
    t: '利益が現金を伴っているか', sub: 'キャッシュ・フロー', view: 'cf', rows: ['ocf', 'cfNi', 'cfAr', 'cfInv'], terms: ['cfo', 'ocfNi', 'kuroji'],
    vals: cf ? `当期純利益 ${yen(L.NI)}・営業CF ${yen(cf.ocf)}` : '前期がないため計算できません',
    ev: !cf ? 'none' : cf.ocf < 0 && L.NI > 0 ? 'bad' : cf.ocf < 0 ? 'warn' : L.NI > 0 && cf.ocf < L.NI * 0.3 ? 'warn' : 'good',
    msg: !cf ? '' : cf.ocf < 0 && L.NI > 0 ? '黒字なのに営業CFがマイナスです。売掛金や在庫が利益以上に増えています。回収の遅れ、売れ残り、または架空売上・在庫の水増しを疑います。'
      : cf.ocf < 0 ? '本業で現金が出ていっています。赤字か、運転資金の増加が原因です。'
        : L.NI > 0 && cf.ocf < L.NI * 0.3 ? '営業CFが利益に比べて小さく、利益の一部が売掛金や在庫に変わっています。' : '本業でしっかり現金を生み出しています。',
  });

  /* ⑥ 回転日数（運転資金と粉飾の兆候） */
  const dAr = rp ? r.arDays - rp.arDays : 0, dInv = rp ? r.invDays - rp.invDays : 0;
  const arBad = rp && dAr > Math.max(12, rp.arDays * 0.3) && r.arDays > avg.arDays;
  const invBad = rp && dInv > Math.max(10, rp.invDays * 0.3) && r.invDays > avg.invDays;
  steps.push({
    t: '売掛金と在庫は膨らんでいないか', sub: '運転資金・粉飾の兆候', view: 'ratio', rows: ['arDays', 'invDays', 'apDays', 'depRate'], terms: ['arDays', 'invDays', 'wc', 'fraud'],
    vals: `売上債権回転日数 ${fmtRatio(r.arDays, '日')}${rp ? `（前期 ${fmtRatio(rp.arDays, '日')}）` : ''}・棚卸資産回転日数 ${fmtRatio(r.invDays, '日')}${rp ? `（前期 ${fmtRatio(rp.invDays, '日')}）` : ''}`,
    ev: !rp ? 'none' : arBad || invBad ? 'warn' : 'mid',
    msg: !rp ? '' : arBad || invBad ? `${arBad ? '売上債権' : ''}${arBad && invBad ? 'と' : ''}${invBad ? '棚卸資産' : ''}の回転日数が前期から大きく延び、業界平均（売上債権${fmtNum(avg.arDays, 0)}日・在庫${fmtNum(avg.invDays, 0)}日）も上回っています。回収できない売掛金や売れ残りがないか、数字を作っていないかを調べます。`
      : `回転日数に大きな変化はありません（業界平均 売上債権${fmtNum(avg.arDays, 0)}日・在庫${fmtNum(avg.invDays, 0)}日）。急に延びていたら要注意です。`,
  });
  return steps;
}

function fsGuidePanel(steps, ctx) {
  if (!steps.length) return '';
  UI.guideCache = UI.guideCache || {};
  UI.guideCache[ctx] = steps;
  const sel = UI.guideSel && UI.guideSel.ctx === ctx ? UI.guideSel.i : -1;
  const warn = steps.filter(s => s.ev === 'warn' || s.ev === 'bad').length;
  const items = steps.map((s, i) => {
    const [lab, cls] = EVAL[s.ev] || EVAL.none;
    return `<li class="gstep${sel === i ? ' on' : ''}">
      <div class="gst-head"><span class="gnum" aria-hidden="true">${i + 1}</span><div><b>${s.t}</b><span class="small muted">　${s.sub}</span></div>${s.ev !== 'none' ? tag(lab, cls) : ''}</div>
      <div class="gst-vals num small">${s.vals}</div>
      ${s.msg ? `<p class="small">${s.msg}</p>` : ''}
      <div class="row gst-foot">${btn('決算書で見る', 'guideGo', { ctx, i, view: s.view }, 'sm')}<span class="small muted">${s.terms.map(k => term(esc(TERMS[k] ? TERMS[k].n.replace(/（.*?）/, '') : k), k)).join('・')}</span></div>
    </li>`;
  }).join('');
  return `<div class="guide"><div class="guide-head"><b>決算書の読み方ガイド</b><span class="small muted">銀行の審査と同じ順番で見ていきます。${warn ? `気になる点が<b>${warn}つ</b>あります。` : '大きな問題は見当たりません。'}</span></div><ol class="gsteps">${items}</ol>
    <p class="note">ガイドは決算書の基本的な読み方を示すもので、粉飾をすべて見抜けるわけではありません。判断するのはあなたです。点線の下線がある言葉を押すと解説が出ます。${btn('用語集', 'glossary', {}, 'sm linkish')}</p></div>`;
}

/* ガイドの手順を選ぶと、表を切り替えて該当の行を光らせる */
function guideRows(ctx, view) {
  const g = UI.guideSel;
  if (!g || g.ctx !== ctx || g.view !== view) return [];
  return g.rows || [];
}
ACTIONS.guideGo = d => {
  const ctx = d.ctx, i = +d.i;
  const steps = UI.guideCache && UI.guideCache[ctx];
  const s = steps && steps[i];
  if (!s) return;
  UI.guideSel = { ctx, i, view: s.view, rows: s.rows };
  if (ctx === 'app') UI.appView = s.view;
  if (ctx === 'loan' && UI.modal && UI.modal.name === 'loan') UI.modal.args.view = s.view;
  if (ctx === 'co') UI.coFsView = s.view;
  if (UI.modal && ctx === 'loan') drawModal(); else render();
  const el = document.querySelector('tr.focus') || document.querySelector('.fs');

/* =========================================================
 *  21_kaisha_core.js : 会社経営モードの共通エンジン
 *  複式簿記の元帳・給与・売掛金と買掛金・固定資産・借入と銀行の審査・
 *  月次の処理・決算整理・決算書の作成・予算・資金繰り

 * ========================================================= */

const KS_LOSS_RATE = 0.01; // 貸倒実績率（初期値）

/* ---------- 元帳 ---------- */
function ksPost(code, lines, o = {}) {
  const rl = [];
  let d = 0, c = 0;
  for (const [k, dd, cc] of lines) {
    if (!(k in KS_ACCT)) throw new Error('勘定科目がありません: ' + k);
    const a = Math.round(dd || 0), b = Math.round(cc || 0);
    if (!a && !b) continue;
    if (a < 0 || b < 0) throw new Error(`負の仕訳金額: ${code} ${k} ${a} ${b}`);
    rl.push([k, a, b]);
    d += a; c += b;
  }
  if (!rl.length) return;
  if (d !== c) {
    const diff = d - c;
    if (Math.abs(diff) > 3) throw new Error(`貸借不一致の仕訳: ${code} 借方${d} 貸方${c}`);
    const side = diff > 0 ? 2 : 1;
    let best = rl[0];
    for (const l of rl) if (l[side] > best[side]) best = l;
    best[side] += Math.abs(diff);
  }
  const fl = o.closing ? G.flowC : G.flow;
  for (const [k, a, b] of rl) {
    const delta = ksDebitNature(k) ? a - b : b - a;
    G.bal[k] += delta;
    const t = KS_ACCT[k].t;
    if (t === 'R' || t === 'X') fl[k] = (fl[k] || 0) + delta;
    if (k === 'cash' && !o.closing) { const cat = o.cf || 'other'; G.cfm[cat] = (G.cfm[cat] || 0) + (a - b); }
  }
  const key = code + (o.key ? ':' + o.key : '');
  const j = G.jcur[key] || (G.jcur[key] = { code, d: o.desc || '', n: 0, l: {}, c: !!o.closing });
  j.n++;
  for (const [k, a, b] of rl) { const e = j.l[k] || (j.l[k] = [0, 0]); e[0] += a; e[1] += b; }
}
const ksB = k => G.bal[k] || 0;
function ksAcctName(k, where) {
  const I = KS_INDS[G.ind];
  const a = KS_ACCT[k];
  const lab = I.labels[k];
  if (where === 'bs' && a.bs && !lab) return a.bs;
  if (k === 'goods' && where === 'bs') return '商品';
  return lab || a.n;
}
function ksAssets() { return KS_KEYS.filter(k => KS_ACCT[k].t === 'A').reduce((s, k) => s + ksB(k), 0) - ksB('allow') - ksB('accDep'); }
function ksLiab() { return KS_KEYS.filter(k => KS_ACCT[k].t === 'L').reduce((s, k) => s + ksB(k), 0); }
function ksProfitOpen() { let r = 0; for (const k of KS_PL) r += KS_ACCT[k].t === 'R' ? ksB(k) : -ksB(k); return r; }
function ksEquity() { return ksB('capital') + ksB('re') + ksProfitOpen(); }
function ksDebt() { return ksB('std') + ksB('ltd'); }
function ksBalanceDiff() { return Math.round(ksAssets() - ksLiab() - ksEquity()); }
