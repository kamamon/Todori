<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頭取 ― 地方銀行経営シミュレーション</title>
<meta name="description" content="経営破綻した信用組合を承継した地方銀行の頭取として、融資審査・粉飾の見抜き・金利設定・金庫やシステムの拡張・決算までを経営する銀行シミュレーションゲーム。">
<meta name="theme-color" content="#1d5240">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%231d5240'/%3E%3Ccircle cx='20' cy='20' r='14' fill='none' stroke='%23f4f8f5' stroke-width='2'/%3E%3Crect x='15' y='15' width='10' height='10' fill='none' stroke='%23f4f8f5' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
 *  頭取 ― 地方銀行経営シミュレーション  スタイル
 *  基調：帳票（青罫の台帳）と金庫の緑。朱は印影と赤字にだけ使う。
 * ========================================================= */
:root {
  color-scheme: light;
  --paper: #edf1ec;
  --sheet: #fbfcfa;
  --sheet-2: #f2f5f1;
  --sheet-3: #e7ede8;
  --rule: #cdd8d2;
  --rule-strong: #94a89f;
  --ink: #17242b;
  --ink-2: #4a5a5e;
  --ink-3: #6f7f82;
  --vault: #1d5240;
  --vault-2: #2b6b55;
  --vault-soft: #dbe8e1;
  --on-vault: #f4f8f5;
  --mast: #1d5240;
  --on-mast: #f4f8f5;
  --brass: #8a6316;
  --brass-soft: #f3ead6;
  --shu: #c0392b;
  --shu-soft: #f7e3de;
  --ok: #1e7b4f;
  --warn: #9a640f;
  --warn-soft: #fbf0d9;
  --s1: #0e8a5c;
  --s2: #3366b8;
  --s3: #a9760a;
  --grid: #e1e8e3;
  --axis: #b7c4bd;
  --shadow: 0 1px 0 rgba(23, 36, 43, .06), 0 8px 24px -16px rgba(23, 36, 43, .35);
  --r-s: 3px;
  --r-m: 6px;
  --r-l: 10px;
  --f-ui: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
  --f-doc: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", serif;
  --f-num: "BIZ UDGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0e1614; --sheet: #15201d; --sheet-2: #1a2824; --sheet-3: #20302b;
    --rule: #2a3b35; --rule-strong: #43594f;
    --ink: #e2ebe6; --ink-2: #a8b7b1; --ink-3: #85958f;
    --vault: #4fa585; --vault-2: #62b897; --vault-soft: #1f3a31; --on-vault: #0d1613; --mast: #12352a; --on-mast: #e6f0eb;
    --brass: #d3a650; --brass-soft: #3a2f18;
    --shu: #ef6a55; --shu-soft: #3d1f1a;
    --ok: #4cc58d; --warn: #e0a543; --warn-soft: #3a2d14;
    --s1: #37a57c; --s2: #5b86d6; --s3: #b3832a;
    --grid: #22312c; --axis: #3a4d46;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -18px rgba(0, 0, 0, .8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0e1614; --sheet: #15201d; --sheet-2: #1a2824; --sheet-3: #20302b;
  --rule: #2a3b35; --rule-strong: #43594f;
  --ink: #e2ebe6; --ink-2: #a8b7b1; --ink-3: #85958f;
  --vault: #4fa585; --vault-2: #62b897; --vault-soft: #1f3a31; --on-vault: #0d1613; --mast: #12352a; --on-mast: #e6f0eb;
  --brass: #d3a650; --brass-soft: #3a2f18;
  --shu: #ef6a55; --shu-soft: #3d1f1a;
  --ok: #4cc58d; --warn: #e0a543; --warn-soft: #3a2d14;
  --s1: #37a57c; --s2: #5b86d6; --s3: #b3832a;
  --grid: #22312c; --axis: #3a4d46;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -18px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.6;
  font-feature-settings: "palt" 1;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--vault); }
:focus-visible { outline: 2px solid var(--vault-2); outline-offset: 2px; }
.num, td.n, th.n { font-family: var(--f-num); font-feature-settings: normal; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.neg { color: var(--shu); }
.pos { color: var(--ok); }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- 枠組み ---------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.mast {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 10px 20px;
  background: var(--mast);
  color: var(--on-mast);
}
.mast-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mast-brand svg { width: 38px; height: 38px; flex: none; }
.bank-name { font-family: var(--f-doc); font-size: 20px; font-weight: 700; letter-spacing: .06em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bank-sub { font-size: 12px; opacity: .8; }
.mast-date { justify-self: center; text-align: center; line-height: 1.25; }
.mast-date .wareki { font-family: var(--f-doc); font-size: 19px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.mast-date .sub { font-size: 12px; opacity: .8; }
.mast-actions { display: flex; gap: 8px; align-items: center; }
.mbtn {
  border: 1px solid color-mix(in srgb, var(--on-mast) 35%, transparent);
  background: transparent; color: var(--on-mast);
  padding: 6px 12px; border-radius: var(--r-m); cursor: pointer; white-space: nowrap;
}
.mbtn:hover { background: color-mix(in srgb, var(--on-mast) 12%, transparent); }
.btn-advance {
  border: 0; cursor: pointer; white-space: nowrap;
  background: var(--sheet); color: var(--vault);
  font-weight: 700; padding: 9px 16px; border-radius: var(--r-m);
  box-shadow: inset 0 -2px 0 var(--rule-strong);
}
.btn-advance:hover { background: var(--vault-soft); }
.btn-advance:disabled { opacity: .5; cursor: default; }

/* 主要指標：通帳の記帳行のように一列に並べる */
.strip {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  background: var(--sheet);
  border-bottom: 1px solid var(--rule-strong);
}
.strip > div { padding: 7px 14px 8px; border-right: 1px solid var(--rule); min-width: 0; }
.strip > div:last-child { border-right: 0; }
.strip .k { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.strip .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .d { font-size: 11px; font-family: var(--f-num); white-space: nowrap; }

.body { flex: 1; display: grid; grid-template-columns: 168px minmax(0, 1fr); min-height: 0; }
.tabs {
  border-right: 1px solid var(--rule);
  background: var(--sheet-2);
  padding: 12px 0;
  display: flex; flex-direction: column; gap: 2px;
}
.tab {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border: 0; background: transparent; cursor: pointer; text-align: left;
  padding: 9px 14px 9px 18px; font-size: 14px; color: var(--ink-2);
  border-left: 3px solid transparent;
}
.tab:hover { background: var(--sheet-3); color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--sheet); border-left-color: var(--vault); }
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--vault); color: var(--on-vault); font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-num);
}
.badge.alert { background: var(--shu); color: #fff; }
main { padding: 20px 24px 48px; min-width: 0; }

/* ---------- 汎用部品 ---------- */
.h1 { font-family: var(--f-doc); font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: .04em; }
.lead { color: var(--ink-2); margin: 0 0 16px; max-width: 72ch; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) 340px; }
.g-list { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
.panel {
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: var(--r-m);
  min-width: 0;
}
.panel > .ph {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--rule);
}
.ph h2, .ph h3 { margin: 0; font-size: 15px; font-weight: 700; }
.ph .aside { font-size: 12px; color: var(--ink-3); }
.pb { padding: 12px 14px; }
.pb.flush { padding: 0; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.sep { border: 0; border-top: 1px solid var(--rule); margin: 12px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink);
  padding: 6px 12px; border-radius: var(--r-s); cursor: pointer; white-space: nowrap; font-size: 13px;
}
.btn:hover { background: var(--sheet-3); }
.btn.primary { background: var(--vault); border-color: var(--vault); color: var(--on-vault); font-weight: 700; }
.btn.primary:hover { background: var(--vault-2); }
.btn.danger { color: var(--shu); border-color: color-mix(in srgb, var(--shu) 55%, var(--rule)); }
.btn.danger:hover { background: var(--shu-soft); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--vault); padding-left: 6px; padding-right: 6px; }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--r-s); overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--vault); color: var(--on-vault); font-weight: 700; }

input[type="number"], input[type="text"], select {
  border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r-s);
  padding: 5px 8px; min-width: 0;
}
input[type="number"] { font-family: var(--f-num); text-align: right; }
input[type="range"] { accent-color: var(--vault); width: 100%; }
input[type="checkbox"] { accent-color: var(--vault); width: 16px; height: 16px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; color: var(--ink-3); }
.unit { color: var(--ink-3); font-size: 12px; }

/* 表：帳票の罫線 */
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th, .t td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; }
.t thead th { font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--sheet-2); white-space: nowrap; position: sticky; top: 0; }
.t td.n, .t th.n { text-align: right; white-space: nowrap; }
.t tr.sub td { color: var(--ink-2); }
.t tr.ind td:first-child { padding-left: 24px; }
.t tr.ind2 td:first-child { padding-left: 38px; }
.t tr.total td { font-weight: 700; border-top: 1px solid var(--rule-strong); }
.t tr.grand td { font-weight: 700; border-top: 1px solid var(--ink-2); border-bottom: 3px double var(--ink-2); }
.t tr.sec td { background: var(--sheet-2); font-weight: 700; font-size: 12px; color: var(--ink-2); }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--vault-soft); }
.t tr.sel td { background: var(--vault-soft); }
.t.compact td, .t.compact th { padding: 4px 8px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; }
.kv dt { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.kv dd { margin: 0; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap;
  border: 1px solid var(--rule-strong); color: var(--ink-2); background: var(--sheet);
}
.tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--rule)); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--rule)); background: var(--warn-soft); }
.tag.bad { color: var(--shu); border-color: color-mix(in srgb, var(--shu) 50%, var(--rule)); background: var(--shu-soft); }
.tag.brass { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, var(--rule)); background: var(--brass-soft); }
.tag.solid { background: var(--vault); color: var(--on-vault); border-color: var(--vault); }
.grade {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%; font-family: var(--f-num); font-weight: 700; font-size: 13px;
  border: 1.5px solid currentColor;
}
.grade.g1, .grade.g2, .grade.g3 { color: var(--ok); }
.grade.g4, .grade.g5, .grade.g6 { color: var(--ink-2); }
.grade.g7, .grade.g8 { color: var(--warn); }
.grade.g9, .grade.g10 { color: var(--shu); }

.meter { height: 8px; border-radius: 4px; background: var(--sheet-3); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--vault); }
.meter.warn > i { background: var(--warn); }
.meter.bad > i { background: var(--shu); }
.note { font-size: 12px; color: var(--ink-3); }
.callout { border-left: 3px solid var(--brass); background: var(--brass-soft); padding: 8px 12px; border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 13px; }
.callout.bad { border-left-color: var(--shu); background: var(--shu-soft); }
.callout.ok { border-left-color: var(--vault); background: var(--vault-soft); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); }

/* ---------- 頭取室 ---------- */
.inbox { list-style: none; margin: 0; padding: 0; }
.inbox li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--rule); }
.inbox li:last-child { border-bottom: 0; }
.inbox .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--vault-soft); color: var(--vault); }
.inbox .ico.bad { background: var(--shu-soft); color: var(--shu); }
.inbox .ico.warn { background: var(--warn-soft); color: var(--warn); }
.inbox .t1 { font-weight: 700; font-size: 13px; }
.inbox .t2 { font-size: 12px; color: var(--ink-3); }
.newslist { list-style: none; margin: 0; padding: 0; }
.newslist li { padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 13px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; }
.newslist li:last-child { border-bottom: 0; }
.newslist .when { font-family: var(--f-num); font-size: 11px; color: var(--ink-3); padding-top: 2px; }
.newslist li.bad .what::before, .newslist li.good .what::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.newslist li.bad .what::before { background: var(--shu); }
.newslist li.good .what::before { background: var(--s1); }

/* ---------- 稟議書 ---------- */
.applist { display: flex; flex-direction: column; gap: 8px; }
.appcard {
  display: block; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-m); padding: 10px 12px;
}
.appcard:hover { border-color: var(--rule-strong); }
.appcard[aria-current="true"] { border-color: var(--vault); box-shadow: inset 3px 0 0 var(--vault); }
.appcard .nm { font-weight: 700; font-size: 14px; line-height: 1.35; }
.appcard .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.appcard .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 8px; }
.appcard .amt { font-family: var(--f-num); font-weight: 700; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--sheet-3); border: 1px solid var(--rule-strong); }
.dots i.ok { background: var(--vault); border-color: var(--vault); }
.dots i.minor { background: var(--warn); border-color: var(--warn); }
.dots i.major { background: var(--shu); border-color: var(--shu); }

.ringi {
  background: var(--sheet);
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-s);
  box-shadow: var(--shadow);
}
.ringi-head {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start;
  padding: 18px 20px 14px; border-bottom: 2px solid var(--ink-2);
}
.ringi-title { font-family: var(--f-doc); font-size: 24px; font-weight: 700; letter-spacing: .3em; margin: 0; }
.ringi-no { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ringi-name { font-family: var(--f-doc); font-size: 19px; font-weight: 700; margin-top: 8px; line-height: 1.35; }
.stamps { display: grid; grid-template-columns: repeat(4, 64px); border: 1px solid var(--ink-2); }
.stamps > div { border-right: 1px solid var(--ink-2); text-align: center; }
.stamps > div:last-child { border-right: 0; }
.stamps .lab { font-size: 11px; border-bottom: 1px solid var(--ink-2); padding: 2px 0; color: var(--ink-2); }
.stamps .box { height: 64px; display: grid; place-items: center; position: relative; }
.seal-sm {
  width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--shu); color: var(--shu);
  display: grid; place-items: center; font-family: var(--f-doc); font-weight: 700; font-size: 13px;
  transform: rotate(-8deg); opacity: .85; line-height: 1;
}
.ringi section { padding: 14px 20px; border-bottom: 1px solid var(--rule); }
.ringi section:last-child { border-bottom: 0; }
.ringi h3 { font-family: var(--f-doc); font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.ringi h3::before { content: ""; width: 4px; height: 16px; background: var(--vault); display: inline-block; }
.subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule-strong); margin-bottom: 10px; overflow-x: auto; }
.subtabs button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 13px; }
.subtabs button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--vault); }
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.inv {
  border: 1px solid var(--rule); border-radius: var(--r-s); padding: 9px 10px; background: var(--sheet-2);
  display: grid; gap: 4px; align-content: start;
}
.inv .nm { font-weight: 700; font-size: 13px; }
.inv .ds { font-size: 12px; color: var(--ink-3); }
.inv .cost { font-size: 11px; color: var(--ink-3); font-family: var(--f-num); }
.inv.done { background: var(--sheet); }
.inv .res { font-size: 13px; line-height: 1.55; }

<script>
'use strict';

/* ---- 00_util.js ---- */
/* =========================================================
 *  頭取 ― 地方銀行経営シミュレーション
 *  00_util.js : 乱数・数値・書式ユーティリティ
 * ========================================================= */

let G = null; // ゲーム状態（セーブ対象）

/* ---------- 乱数（シード付き mulberry32。状態は G.rs に保存） ---------- */
function rand() {
  if (!G) return Math.random();
  let a = G.rs | 0;
  a = (a + 0x6D2B79F5) | 0;
  G.rs = a;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function randn() {
  let u = 0;
  while (u === 0) u = rand();
  const v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const uni = (a, b) => a + (b - a) * rand();
const randInt = (a, b) => Math.floor(uni(a, b + 1));
const chance = p => rand() < p;
const pick = arr => arr[Math.floor(rand() * arr.length)];
function wpick(items, weights) {
  let s = 0;
  for (const w of weights) s += Math.max(0, w);
  if (s <= 0) return items[0];
  let r = rand() * s;
  for (let i = 0; i < items.length; i++) {
    r -= Math.max(0, weights[i]);
    if (r <= 0) return items[i];
  }
  return items[items.length - 1];
}
function poisson(l) {
  if (l <= 0) return 0;
  if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * randn()));
  const L = Math.exp(-l);
  let k = 0, p = 1;
  do { k++; p *= rand(); } while (p > L);
  return k - 1;
}
/* 固定シードの補助乱数（地図の建物配置など、ゲーム進行に影響しない用途） */
function seeded(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  };

function interp(x, pts) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (x <= pts[i][0]) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);

const MINUS = '−';
function fmtNum(x, d = 0) {

/* 金額をわかりやすく（12.3億円 / 4,560万円） */
function fmtYen(x, opt = {}) {
  if (!isFinite(x)) return '―';
  const neg = x < 0;
  const a = Math.abs(x);
  let s;
  if (a >= 1e12) s = fmtNum(a / 1e12, a >= 1e13 ? 1 : 2) + '兆';
  else if (a >= 1e8) {
    const o = a / 1e8;

/* ---- 02_ledger.js ---- */
/* =========================================================
 *  02_ledger.js : 複式簿記の総勘定元帳
 *  すべての取引は post() による仕訳で記帳し、
 *  貸借対照表・損益計算書は元帳残高から作成する。
 * ========================================================= */

function newLedger() {
  const bal = {};
  for (const k of ACCT_KEYS) bal[k] = 0;
  return { bal, mflow: {}, jcur: {}, journal: [] };
}
const isDebitNature = k => { const t = ACCT[k].type; return t === 'A' || t === 'X'; };
const isPL = k => { const t = ACCT[k].type; return t === 'R' || t === 'X'; };

/* 仕訳の記帳。lines = [[勘定, 借方, 貸方], ...]（金額は円） */
function post(desc, lines) {
  const L = G.ledger;
  let dsum = 0, csum = 0;
  const rl = [];
  for (const [k, d, c] of lines) {
    if (!(k in ACCT)) throw new Error('勘定科目がありません: ' + k);
    const dd = Math.round(d || 0), cc = Math.round(c || 0);
    if (dd === 0 && cc === 0) continue;
    if (dd < 0 || cc < 0) throw new Error('負の仕訳金額: ' + desc + ' ' + k);
    rl.push([k, dd, cc]);
    dsum += dd; csum += cc;
  }
  if (!rl.length) return;
  if (dsum !== csum) {
    const diff = dsum - csum;
    if (Math.abs(diff) > 2) throw new Error(`貸借不一致の仕訳: ${desc} 借方${dsum} 貸方${csum}`);
    // 端数調整（丸め誤差のみ）
    const side = diff > 0 ? 2 : 1;
    let best = rl[0];
    for (const l of rl) if (l[side] > best[side]) best = l;
    best[side] += Math.abs(diff);
  }
  for (const [k, d, c] of rl) {
    const delta = isDebitNature(k) ? d - c : c - d;
    L.bal[k] += delta;
    if (isPL(k)) L.mflow[k] = (L.mflow[k] || 0) + delta;
  }
  const j = L.jcur[desc] || (L.jcur[desc] = { desc, n: 0, lines: {} });
  j.n++;
  for (const [k, d, c] of rl) {
    const e = j.lines[k] || (j.lines[k] = [0, 0]);
    e[0] += d; e[1] += c;
  }
}

/* よく使う定型仕訳 */
function receive(amount, revAcct, desc) { // 収益の受入（日銀当座へ）
  if (amount <= 0) return;
  post(desc, [['boj', amount, 0], [revAcct, 0, amount]]);
}
function payExpense(amount, expAcct, desc) { // 費用の支払（日銀当座から）
  if (amount <= 0) return;
  post(desc, [[expAcct, amount, 0], ['boj', 0, amount]]);
}

const B = k => G.ledger.bal[k];
function curProfit() {
  let r = 0;
  for (const k of REV_KEYS) r += B(k);
  for (const k of EXP_KEYS) r -= B(k);
  return r;
}
function totalAssets() {
  return B('cash') + B('boj') + B('callLoan') + B('securities') + B('loans') + B('tangible') + B('intangible') + B('otherAssets') - B('allowance');
}
function totalLiab() {
  return B('depOrd') + B('depTime') + B('callMoney') + B('bojBorrow') + B('taxPayable') + B('divPayable') + B('otherLiab');
}
function netAssets() { return B('capital') + B('prefCapital') + B('capSurplus') + B('retained') + curProfit(); }
function ledgerDiff() { return totalAssets() - totalLiab() - netAssets(); }
function deposits() { return B('depOrd') + B('depTime'); }

/* 月末の元帳スナップショット（BS科目＋当月PL） */
function bsSnapshot() {
  const s = {};
  for (const k of ACCT_KEYS) if (!isPL(k)) s[k] = G.ledger.bal[k];
  s.curProfit = curProfit();
  return s;
}

/* 月次の仕訳帳を確定（直近24か月を保持） */
function closeJournalMonth(m) {
  const L = G.ledger;
  const entries = Object.values(L.jcur).map(j => ({
    desc: j.desc, n: j.n,
    lines: Object.entries(j.lines).map(([k, v]) => [k, v[0], v[1]]),
  }));
  L.journal.push({ m, entries });
  while (L.journal.length > 24) L.journal.shift();
  L.jcur = {};
  const flow = L.mflow;
  L.mflow = {};
  return flow;
}

/* 決算整理：収益・費用勘定を利益剰余金へ振り替える */
function closeBooks(desc) {
  const lines = [];
  let net = 0;
  for (const k of REV_KEYS) { const v = B(k); if (v) { lines.push([k, v > 0 ? v : 0, v < 0 ? -v : 0]); net += v; } }
  for (const k of EXP_KEYS) { const v = B(k); if (v) { lines.push([k, v < 0 ? -v : 0, v > 0 ? v : 0]); net -= v; } }
  if (net > 0) lines.push(['retained', 0, net]);
  else if (net < 0) lines.push(['retained', -net, 0]);
  // 振替仕訳は月次損益（mflow）に含めない
  const saved = Object.assign({}, G.ledger.mflow);
  if (lines.length) post(desc, lines);
  G.ledger.mflow = saved;
  return net;
}

/* 期間（年）に応じた国債利回り（補間） */
function yieldAt(n) {
  const e = G.eco;
  const pts = [[0, e.call], [2, e.y[2]], [5, e.y[5]], [10, e.y[10]], [20, e.y[20]], [40, e.y[20] + 0.3]];
  return interp(Math.max(0, n), pts);
}

/* 市場の貸出金利（格付・期間別、% ） */
function marketLoanRate(grade, termM) {
  const e = G.eco;
  const base = e.policy + 0.35 + GRADE_SPREAD[clamp(Math.round(grade), 1, 10)];
  const termPrem = clamp((termM / 12 - 3) * 0.04, -0.05, 0.4) + Math.max(0, yieldAt(termM / 24) - e.policy) * 0.3;
  return Math.max(0.3, base + termPrem);
}

function ecoStep() {
  const e = G.eco, diff = DIFFICULTY[G.difficulty];
  // 景気局面の遷移
  const tr = REGIME_TRANS[e.regime];
  const items = tr.map(t => t[0]);
  const w = tr.map(t => {
    if (t[0] === 'crisis' && e.regime !== 'crisis') return G.m < 18 ? 0 : t[1] * diff.crisis;
    return t[1];
  });
  const next = wpick(items, w);
  if (next !== e.regime) {
    e.regime = next; e.age = 0;
    addNews('eco', REGIME_NEWS[next], next === 'boom' || next === 'expansion' ? 'good' : 'bad');
  } else e.age++;
  const R = REGIMES[e.regime];
  e.gdp += (R.gdp - e.gdp) * 0.18 + randn() * 0.12;
  e.cpi += (R.cpi - e.cpi) * 0.10 + randn() * 0.07;
  e.unemp = clamp(e.unemp + (R.unemp - e.unemp) * 0.10 + randn() * 0.03, 1.8, 7);
  e.defMult += (R.def - e.defMult) * 0.2;
  e.demand += (R.demand - e.demand) * 0.2;
  e.land *= 1 + (R.land / 100) / 12 + randn() * 0.003;
  e.stock *= Math.exp((R.stock / 100) / 12 + randn() * 0.045);
  // 日銀金融政策決定会合（年8回）
  if ([1, 3, 4, 6, 7, 9, 10, 12].includes(calMonth(G.m))) bojMeeting();
  // イールドカーブ
  e.termShock = e.termShock * 0.9 + randn() * 0.05;
  const ex = 0.45 * (e.cpi - 2.0) + 0.25 * (e.gdp - 1.0);
  const tgt = {
    2: e.policy + 0.12 + 0.3 * ex + 0.3 * e.termShock,
    5: e.policy + 0.42 + 0.45 * ex + 0.7 * e.termShock,
    10: e.policy + 1.05 + 0.45 * ex + e.termShock,
    20: e.policy + 1.85 + 0.35 * ex + 1.15 * e.termShock,
  };
  for (const k of [2, 5, 10, 20]) e.y[k] = Math.max(k <= 5 ? -0.1 : 0.05, e.y[k] + (tgt[k] - e.y[k]) * 0.45);
  e.call = Math.max(0, e.policy - 0.02 + (e.regime === 'crisis' ? 0.25 + rand() * 0.3 : randn() * 0.01));
  // 業界の景況
  for (const ind of INDUSTRIES) {
    const s = e.ind[ind.id];
    const target = clamp(ind.beta * (e.gdp - 1.0) / 4, -0.8, 0.6);
    s.shock *= 0.93;
    s.cond = clamp(s.cond + (target - s.cond) * 0.08 + randn() * 0.03, -1, 1);
  }
  if (chance(0.32)) industryNews();
  // 競合の金利動向
  if (e.compBoostUntil < G.m) e.compBoost *= 0.75;
  if (chance(0.015) && G.m > 3) {
    e.compBoost = 0.08 + rand() * 0.1; e.compBoostUntil = G.m + 6;
    addNews('eco', `ネット銀行各行が定期預金の金利上乗せキャンペーンを開始（+${e.compBoost.toFixed(2)}%）`, 'neutral');
  }
  e.mktOrd = Math.max(0.001, 0.35 * e.policy + e.compBoost * 0.2);
  e.mktTime = Math.max(0.002, 0.55 * e.policy + 0.04 + e.compBoost);
  e.mktPrime = e.policy + 1.375;
  e.mortVar = Math.max(0.3, e.policy + 0.35);
  e.mortFix = e.y[10] + 0.65;
}

function bojMeeting() {
  const e = G.eco;
  let target = 1.0 + 1.3 * (e.cpi - 2.0) + 0.5 * (e.gdp - 1.0);
  if (e.regime === 'crisis') target = Math.min(target, 0);
  target = clamp(target, 0, 4);
  const d = target - e.policy;
  if (d > 0.3 && chance(0.5)) {
    e.policy = Math.round((e.policy + 0.25) * 100) / 100;
    addNews('eco', `日銀、政策金利を0.25%引き上げ ${e.policy.toFixed(2)}%に。物価目標の実現に自信`, 'neutral', { rate: 1 });
  } else if (d < -0.35 && e.policy > 0 && chance(0.6)) {
    const cut = e.regime === 'crisis' ? Math.min(0.5, e.policy) : Math.min(0.25, e.policy);
    e.policy = Math.round((e.policy - cut) * 100) / 100;
    addNews('eco', `日銀、政策金利を${cut.toFixed(2)}%引き下げ ${e.policy.toFixed(2)}%に。景気下支えを優先`, 'neutral', { rate: -1 });
  }
}

  med: [['介護報酬がプラス改定に', 0.2], ['介護人材の不足で事業所の閉鎖が相次ぐ', -0.25]],
  htl: [['インバウンド需要が過去最高を更新、宿泊業が好調', 0.35], ['大型台風の影響で観光客が激減', -0.35], ['旅行支援策の終了で宿泊需要が反動減', -0.2]],
  agr: [['天候不順で野菜の出荷量が減少', -0.25], ['農産物の輸出が過去最高に。6次産業化も追い風', 0.25], ['飼料価格の高騰で畜産農家の経営が圧迫される', -0.3]],
};
function industryNews() {
  const ind = pick(INDUSTRIES);
  const [text, shock] = pick(IND_NEWS[ind.id]);
  G.eco.ind[ind.id].shock = clamp(G.eco.ind[ind.id].shock + shock, -0.8, 0.8);
  addNews('ind', `【${ind.name}】${text}`, shock > 0 ? 'good' : 'bad', { ind: ind.id });
}

/* ---- 04_city.js ---- */
/* =========================================================
 *  04_city.js : 汐見市の成長（人口・事業所・地域活力・地価）
 *  銀行の融資と都市開発プロジェクトが街を育て、
 *  育った街が預金と融資需要を生む。
 * ========================================================= */

function newCity() {
  const c = { d: {}, projects: {}, boost: 0, hist: [] };
  for (const D of DISTRICTS) {
    c.d[D.id] = {
      pop: D.pop, firms: D.firms, income: D.income, vit: 100, land: 100,
      projBoost: 0, disaster: 0, failPen: 0, mortBoost: 0,
      lendHist: [], mortNew: [], depMkt: 0, closures: 0, startups: 0,
    };
  }
  for (const D of DISTRICTS) updateDepMkt(D, c.d[D.id]);
  return c;
}

function updateDepMkt(D, st) {
  const s = st || G.city.d[D.id];
  s.depMkt = s.pop * 500e4 * s.income * D.sav + s.firms * 3500e4 * Math.sqrt(Math.max(0.3, s.vit / 100));
}

/* 地区内の当行の事業性融資残高 */
function districtBizLending(did) {
  let t = 0;
  for (const L of G.loans) if (L.district === did && (L.kind === 'biz' || L.kind === 'proj') && isActiveLoan(L)) t += L.bal;
  return t;
}

function cityStep() {
  const c = G.city, e = G.eco;
  for (const D of DISTRICTS) {
    const s = c.d[D.id];
    const biz = districtBizLending(D.id);
    s.lendHist.push(biz);
    while (s.lendHist.length > 13) s.lendHist.shift();
    const d12 = biz - s.lendHist[0];
    const impulse = d12 / (s.firms * 0.05e8);
    while (s.mortNew.length > 12) s.mortNew.shift();
    const housing = sum(s.mortNew) / (s.pop * 5e4);
    let ic = 0, iw = 0;
    for (const [k, w] of Object.entries(D.mix)) { ic += indCond(k) * w; iw += w; }
    ic /= iw;
    s.disaster *= 0.93;
    s.failPen *= 0.95;
    s.impulse = impulse;
    const target = 100 + 30 * Math.tanh(impulse * 2.5) + 12 * Math.tanh(housing * 2) + s.projBoost + 14 * ic
      + 3.5 * (e.gdp - 1) + s.disaster + c.boost - s.failPen;
    s.vit = clamp(s.vit + (target - s.vit) * 0.05 + randn() * 0.25, 40, 200);
    const vg = (s.vit - 100) / 100;
    const popA = D.trend + 2.0 * vg + 0.3 * (e.gdp - 1) + s.mortBoost;
    s.mortBoost *= 0.97;
    const prevFirms = s.firms;
    s.pop *= 1 + popA / 100 / 12;
    const firmA = -1.0 + 3.5 * vg + 0.4 * (e.gdp - 1) + Math.tanh(impulse * 3);
    s.firms *= 1 + firmA / 100 / 12;
    s.startups = Math.max(0, s.firms - prevFirms);
    s.income *= 1 + (0.6 + 0.4 * e.gdp + 1.5 * vg) / 100 / 12;
    const landA = REGIMES[e.regime].land * 0.8 + 12 * vg;
    s.land = Math.max(20, s.land * (1 + landA / 100 / 12 + randn() * 0.002));
    updateDepMkt(D);
  }
  c.boost *= 0.995;
  projectsStep();
  const st = cityStats();
  c.hist.push({ m: G.m, pop: Math.round(st.pop), firms: Math.round(st.firms), vit: +st.vit.toFixed(1), share: +(st.share * 100).toFixed(2) });
  if (c.hist.length > 240) c.hist.shift();
}

function cityStats() {
  const c = G.city;
  let pop = 0, firms = 0, vitW = 0, dep = 0, land = 0;
  for (const D of DISTRICTS) {
    const s = c.d[D.id];
    pop += s.pop; firms += s.firms; vitW += s.vit * s.pop; dep += s.depMkt; land += s.land * s.pop;
  }
  return { pop, firms, vit: vitW / pop, depMkt: dep, land: land / pop, share: deposits() / dep };
}

/* 地区の開発段階（地図の描画用、1〜10） */
function devLevel(did) {
  const D = DIST[did], s = G.city.d[did];
  const base = Math.log2((s.pop / D.pop) * 0.5 + (s.firms / D.firms) * 0.5) * 6 + 4;
  const done = PROJECTS.filter(P => P.d === did && G.city.projects[P.id]?.status === 'done').length;
  return clamp(base + (s.vit - 100) / 12 + done * 1.2, 1, 10);
}

/* ---------- 都市開発プロジェクト ---------- */
function projectsStep() {
  const c = G.city;
  for (const P of PROJECTS) {
    const st = c.projects[P.id];
    if (!st) continue;
    if (st.status === 'offered' && G.m > st.deadline) resolveProjectOffer(P, st);
    else if (st.status === 'building' && G.m >= st.doneM) completeProject(P, st);
  }
  const offered = PROJECTS.some(P => c.projects[P.id]?.status === 'offered');
  if (!offered && G.m >= 3 && chance(0.075 * G.eco.demand)) {
    const eligible = PROJECTS.filter(P => {
      const st = c.projects[P.id];
      if (st && ['offered', 'building', 'done'].includes(st.status)) return false;
      if (st && (st.status === 'cancelled' || st.status === 'failed') && G.m - st.offerM < 24) return false;
      if (P.req && c.projects[P.req]?.status !== 'done') return false;
      return true;
    });
    if (eligible.length) offerProject(pick(eligible));
  }
}

function offerProject(P) {
  const debt = P.cost * 0.7;
  const others = clamp(uni(0.4, 0.75) * G.eco.demand, 0.25, 0.85);
  const st = {
    status: 'offered', offerM: G.m, deadline: G.m + 2, debt, others,
    maxOurs: debt * 0.6, ourAmt: 0, grade: P.risk + 1,
  };
  G.city.projects[P.id] = st;
  addNews('city', `【案件】${DIST[P.d].name}で「${P.name}」の計画。総事業費${fmtYen(P.cost)}、シンジケートローン${fmtYen(debt)}の参加行を募集`, 'good', { proj: P.id });
}

/* プロジェクトの適用金利 */
function projectRate(P) {
  const st = G.city.projects[P.id];
  return +(marketLoanRate(st.grade, 180) + 0.15).toFixed(3);
}

function resolveProjectOffer(P, st) {
  const ours = st.ourAmt || 0;
  const leadBonus = ours >= st.debt * 0.4 ? 0.15 : 0;
  const total = ours + Math.min(1, st.others + leadBonus) * st.debt;
  if (total + 1 >= st.debt) {
    st.status = 'building'; st.startM = G.m; st.doneM = G.m + P.months;
    st.lead = ours >= st.debt * 0.4;
    if (ours > 0) {
      const L = bookProjectLoan(P, st, ours);
      st.loanId = L.id;
      if (st.lead) {
        const fee = Math.round(st.debt * 0.008);
        receive(fee, 'fees', 'シンジケートローン組成手数料（アレンジャーフィー）');
        G.trust = clamp(G.trust + 2, 0, 100);
      }
    }
    G.city.d[P.d].projBoost += 2;
    addNews('city', `「${P.name}」の資金調達が完了し着工。${ours > 0 ? (st.lead ? '当行が主幹事として' : '当行も') + fmtYen(ours) + 'を融資' : '当行は不参加'}`, 'good', { proj: P.id });
    G.stats.projectsFunded += ours > 0 ? 1 : 0;
  } else {
    st.status = 'cancelled';
    G.city.d[P.d].failPen += 4;
    addNews('city', `「${P.name}」は資金調達が難航し、計画は白紙に（必要額${fmtYen(st.debt)}に対し${fmtYen(total)}）`, 'bad', { proj: P.id });
  }
}

function completeProject(P, st) {
  st.status = 'done';
  const s = G.city.d[P.d];
  const fx = P.fx;
  s.firms += fx.firms || 0;
  s.pop += fx.pop || 0;
  s.projBoost += fx.vit || 0;
  s.land *= 1 + (fx.land || 0);
  s.mortBoost += fx.mort || 0;
  if (fx.city) G.city.boost += fx.city;
  if (fx.ind) for (const [k, v] of Object.entries(fx.ind)) G.eco.ind[k].shock = clamp(G.eco.ind[k].shock + v, -0.8, 0.8);
  updateDepMkt(DIST[P.d]);
  addNews('city', `「${P.name}」が完成。${DIST[P.d].name}に新たな人の流れが生まれている`, 'good', { proj: P.id });
}

/* プロジェクト融資の破綻（建設中なら計画頓挫） */
function projectLoanFailed(L) {
  const st = Object.values(G.city.projects).find(x => x.loanId === L.id);
  if (!st) return;
  const P = PROJECTS.find(p => G.city.projects[p.id] === st);
  if (st.status === 'building') {
    st.status = 'failed'; st.offerM = G.m;
    G.city.d[P.d].failPen += 10;
    addNews('city', `「${P.name}」の事業会社が経営破綻。工事は中断し、計画は頓挫した`, 'bad', { proj: P.id });
  }
}

/* 地区への災害 */
function districtDisaster(did, sev) {
  const s = G.city.d[did];
  s.disaster -= 12 * sev;
  s.land *= 1 - 0.06 * sev;
  for (const co of Object.values(G.companies)) if (co.district === did) co.q -= uni(0.2, 0.8) * sev;
}

/* ---- 05_company.js ---- */
/* =========================================================
 *  05_company.js : 企業・個人の生成、決算書（実態／提出）、
 *                  粉飾モデル、財務分析、スコアリング
 *  決算書は千円単位で丸め、貸借が必ず一致するよう生成する。
 * ========================================================= */

const K = x => Math.round(x / 1000) * 1000;

const FRAUD_TYPES = {
  fakeSales:    { name: '架空売上の計上', short: '架空売上' },
  inventory:    { name: '在庫の水増し', short: '在庫水増し' },
  expenseCap:   { name: '費用の資産計上（仮払金等）', short: '費用の資産計上' },
  depreciation: { name: '減価償却費の計上不足', short: '償却不足' },
  hiddenDebt:   { name: '簿外債務（借入金の隠蔽）', short: '簿外債務' },
};

function pickFraudType(indId) {
  const b2b = ['whl', 'it', 'con', 'mfg', 'trn'].includes(indId);
  const invH = ['mfg', 'whl', 'ret', 'agr', 're'].includes(indId);
  const ppeH = ['mfg', 'trn', 'htl', 'med', 're', 'agr'].includes(indId);
  return wpick(['fakeSales', 'inventory', 'expenseCap', 'depreciation', 'hiddenDebt'],
    [b2b ? 3 : 0.4, invH ? 3 : 0.3, 1.5, ppeH ? 2.5 : 0.5, 1.8]);
}
function fraudSeverity(type) {
  switch (type) {
    case 'fakeSales': return uni(0.025, 0.06);
    case 'inventory': return uni(0.02, 0.045);
    case 'expenseCap': return uni(0.012, 0.035);
    case 'depreciation': return uni(0.5, 0.95);
    default: return uni(0.02, 0.05);
  }
}

/* 小計・合計の再計算 */
function finalize(s) {
  s.GP = s.S - s.COGS;
  s.OPI = s.GP - s.SGA - s.DEP;
  s.ORD = s.OPI + s.NONOP - s.INT;
  s.PRETAX = s.ORD + s.EXTRA;
  s.NI = s.PRETAX - s.TAX;
  s.CA = s.CASH + s.AR + s.INV + s.OCA;
  s.FA = s.PPE + s.INVEST;
  s.TA = s.CA + s.FA;
  s.CL = s.AP + s.STD + s.OCL;
  s.TL = s.CL + s.LTD;
  s.EQ = s.CAP + s.RE;
  return s;
}

function capitalFor(S) {
  if (S < 3e8) return pick([3e6, 10e6, 10e6]);
  if (S < 10e8) return pick([10e6, 20e6, 30e6]);
  if (S < 50e8) return pick([30e6, 50e6]);
  return pick([50e6, 100e6]);
}

/* 期首（表示しない基準年度）の貸借対照表 */
function genOpening(co) {
  const ind = IND[co.ind];
  const S = co.S0;
  const s = { S: K(S), COGS: K(S * (1 - ind.gm)), SGA: K(S * (ind.gm - ind.opm)), DEP: 0, NONOP: 0, INT: 0, EXTRA: 0, TAX: 0, DIV: 0, CAPEX: 0 };
  s.AR = K(S * co.arBase / 365);
  s.INV = K(s.COGS * co.invBase / 365);
  s.OCA = K(S * co.ocaR);
  s.PPE = K(S * ind.ppe * Math.exp(randn() * 0.25));
  s.LAND = co.ownsRE ? K(s.PPE * uni(0.3, 0.6)) : 0;
  s.INVEST = K(S * uni(0.01, 0.05));
  s.AP = K(s.COGS * co.apBase / 365);
  s.OCL = K(S * 0.025);
  const cashT = S / 12 * clamp(1.2 + 0.5 * co.q, 0.3, 3);
  const nonCash = s.AR + s.INV + s.OCA + s.PPE + s.INVEST;
  const TA = nonCash + cashT;
  const eqR = clamp(0.22 + 0.13 * co.q + randn() * 0.06, -0.25, 0.65);
  const EQ = TA * eqR;
  const debt = Math.max(0, TA - EQ - s.AP - s.OCL);
  s.LTD = K(debt * 0.65);
  s.STD = K(debt * 0.35);
  s.CAP = capitalFor(S);
  s.RE = K(EQ - s.CAP);
  s.CASH = s.AP + s.OCL + s.STD + s.LTD + s.CAP + s.RE - nonCash;
  const minCash = K(cashT * 0.3);
  if (s.CASH < minCash) { const add = minCash - s.CASH; s.STD += add; s.CASH += add; }
  return finalize(s);
}

/* 1年分の実態決算を生成。P=前期（実態） */
function genYear(co, P, ctx) {
  const ind = IND[co.ind];
  const q = ctx.q;
  const T = {};
  const g = ind.trend + 0.012 * ind.beta * (ctx.gdp - 1) + 0.025 * q + 0.05 * ctx.cond
    + 0.03 * (ctx.vit - 100) / 30 + randn() * 0.065 + (ctx.gBoost || 0);
  T.S = K(Math.max(P.S * 0.45, P.S * (1 + g)));
  const gm = clamp(ind.gm + 0.012 * q + 0.012 * ctx.cond + randn() * 0.007, 0.03, 0.92);
  const opm = ind.opm + 0.017 * q + 0.016 * ctx.cond + 0.1 * (g - ind.trend) + randn() * 0.009;
  T.COGS = K(T.S * (1 - gm));
  T.DEP = K(Math.max(0, P.PPE - P.LAND) * ind.dep);
  T.SGA = K(Math.max(T.S * 0.02, T.S * (gm - opm) - T.DEP));
  T.NONOP = K(T.S * 0.003 + Math.max(0, P.CASH) * 0.001);
  const rf = (0.9 + 0.45 * Math.max(0, -q) + 0.8 * ctx.policy) / 100;
  T.INT = K((P.STD + P.LTD) * rf);
  T.EXTRA = chance(0.12) ? K(T.S * uni(0.004, 0.025) * (chance(0.7) ? -1 : 1)) : 0;
  let hidden = null;
  const f = co.fraud;
  if (f && f.type === 'hiddenDebt' && ctx.fraudActive) {
    hidden = { hInt: K(f.H * 0.07), loss: K(T.S * f.sev * (1 + 0.3 * (ctx.fy - 1))) };
    T.INT += hidden.hInt;
    T.EXTRA -= hidden.loss;
  }
  const pre = T.S - T.COGS - T.SGA - T.DEP + T.NONOP - T.INT + T.EXTRA;
  T.TAX = pre > 0 ? K(pre * 0.3) : 70000;
  const ni = pre - T.TAX;
  T.DIV = ni > 0 ? K(ni * uni(0, 0.12)) : 0;
  T.AR = K(T.S * co.arBase * Math.exp(randn() * 0.06) / 365);
  T.INV = K(T.COGS * co.invBase * Math.exp(randn() * 0.07) / 365);
  T.OCA = K(T.S * co.ocaR * Math.exp(randn() * 0.12));
  T.AP = K(T.COGS * co.apBase * Math.exp(randn() * 0.06) / 365);
  T.OCL = K(T.S * 0.022 + T.TAX * 0.5);
  const big = chance(ctx.bigCapexP ?? 0.12) ? T.S * uni(0.05, 0.25) : 0;
  T.CAPEX = K(T.DEP * uni(0.6, 1.25) + Math.max(0, T.S - P.S) * ind.ppe * 0.5 + big + (ctx.plannedCapex || 0));
  T.PPE = P.PPE + T.CAPEX - T.DEP;
  T.LAND = P.LAND;
  T.INVEST = K(P.INVEST * (1 + randn() * 0.03));
  T.CAP = P.CAP;
  T.RE = P.RE + ni - T.DIV;
  T.LTD = K(P.LTD * (1 - 1 / 7) + big * 0.7 + (ctx.newLTD || 0));
  const cashT = T.S / 12 * clamp(1.2 + 0.5 * q, 0.3, 3);
  const preCash = T.AP + T.OCL + T.LTD + T.CAP + T.RE + P.STD - (T.AR + T.INV + T.OCA + T.PPE + T.INVEST);
  T.STD = K(Math.max(0, P.STD + cashT - preCash));
  T.CASH = preCash + (T.STD - P.STD);
  finalize(T);
  return { T, hidden };
}

/* 粉飾後の「提出決算書」を作る（粉飾なしなら null） */
function makeReported(co, T, ctx, hidden) {
  const f = co.fraud;
  if (!f || !ctx.fraudActive) return null;
  const R = Object.assign({}, T);
  const grow = 1 + 0.6 * (ctx.fy - 1);
  switch (f.type) {
    case 'fakeSales': { const F = K(T.S * f.sev * grow); f.cum += F; R.S = T.S + F; R.AR = T.AR + f.cum; break; }
    case 'inventory': { const F = K(Math.min(T.COGS * 0.5, T.S * f.sev * grow)); f.cum += F; R.COGS = T.COGS - F; R.INV = T.INV + f.cum; break; }
    case 'expenseCap': { const F = K(Math.min(T.SGA * 0.6, T.S * f.sev * grow)); f.cum += F; R.SGA = T.SGA - F; R.OCA = T.OCA + f.cum; break; }
    case 'depreciation': { const F = K(T.DEP * clamp(f.sev, 0, 1)); f.cum += F; R.DEP = T.DEP - F; R.PPE = T.PPE + f.cum; break; }
    case 'hiddenDebt': {
      f.H += hidden.loss + hidden.hInt;
      R.INT = T.INT - hidden.hInt;
      R.EXTRA = T.EXTRA + hidden.loss;
      let h = f.H;
      const s1 = Math.min(h, T.STD); R.STD = T.STD - s1; h -= s1;
      const s2 = Math.min(h, T.LTD); R.LTD = T.LTD - s2; h -= s2;
      f.hiddenNow = f.H - h;
      break;
    }
  }
  R.RE = T.RE + (f.type === 'hiddenDebt' ? f.hiddenNow : f.cum);
  return finalize(R);
}

function newCompanyName(indId) {
  const pre = pick(CO_PREFIX), core = pick(CO_CORE[indId]);
  const r = rand();
  if (core === '組') return `株式会社${pre}組`;
  if (core === '旅館' && r < 0.5) return `有限会社${pre}旅館`;
  if (r < 0.48) return `株式会社${pre}${core}`;
  if (r < 0.93) return `${pre}${core}株式会社`;
  return `有限会社${pre}${core}`;
}
const personName = () => pick(FAMILY_NAMES) + ' ' + pick(GIVEN_NAMES);

/* 最新の決算期末（現在月より2か月以上前） */
function lastFiscalEnd(fyEnd, m) {
  let e = m - 2;
  while (calMonth(e) !== fyEnd) e--;
  return e;
}

function genCompany(opts) {
  const did = opts.district;
  const D = DIST[did];
  const indId = opts.ind || wpick(Object.keys(D.mix), Object.values(D.mix));
  const ind = IND[indId];
  let q = clamp(randn() * 0.9 + (opts.qBias || 0), -3, 3);
  const df = DIFFICULTY[G.difficulty];
  const fp = df.fraud * (q < -0.7 ? 2.2 : q < 0 ? 1.2 : 0.35) * (opts.fraudMul ?? 1);
  let fraud = null;
  if (chance(fp)) {
    const type = pickFraudType(indId);
    fraud = { type, sev: fraudSeverity(type), start: chance(0.6) ? 2 : 3, cum: 0, H: 0, hiddenNow: 0, years: 0, found: false, exposed: false };
    q -= 0.35;
  }
  const drift = fraud ? -0.12 : randn() * 0.06;
  const co = {
    id: 'c' + (++G.seq.co), name: newCompanyName(indId), rep: personName(), ind: indId, district: did,
    founded: ymOf(G.m).y - randInt(3, 62), fyEnd: wpick([3, 6, 9, 12, 5, 8, 11, 2], [40, 8, 10, 14, 6, 6, 6, 6]),
    q, qStmt: q, mq: clamp(0.5 * q + randn() * 0.85, -2.5, 2.5), drift,
    arBase: ind.ar * Math.exp(randn() * 0.15), invBase: ind.inv * Math.exp(randn() * 0.18), apBase: ind.ap * Math.exp(randn() * 0.15),
    ocaR: uni(0.008, 0.025), ownsRE: chance(ind.re), fraud, years: [], decoy: null, mon: {}, pendingLoan: 0, pendingCapex: 0,
  };
  co.S0 = clamp(ind.size * Math.exp(randn() * 0.75) * (opts.sizeMul || 1), 0.4e8, 300e8);
  // 正直な企業にも紛らわしい変化を混ぜる（調査すれば説明がつく）
  if (!fraud && chance(0.14)) {
    co.decoy = chance(0.6)
      ? { type: 'ar', year: randInt(2, 3), mult: uni(1.25, 1.45), reason: pick(['大口取引先の支払条件が手形から60日サイトに変更されたため', '年度末に大型案件の検収が集中したため', '新規の大口取引先が月末締め翌々月払いのため']) }
      : { type: 'inv', year: randInt(2, 3), mult: uni(1.25, 1.5), reason: pick(['新製品の投入に向けて戦略的に在庫を積み増したため', '原材料の値上げ前に先行して仕入れたため', '大口受注の納品待ちの完成品在庫のため']) };
  }
  const lastEnd = lastFiscalEnd(co.fyEnd, G.m);
  const T0 = genOpening(co);
  co.years.push({ endM: lastEnd - 36, T: T0 });
  let qh = q - drift * 3 + randn() * 0.15;
  let Tp = T0;
  for (let i = 1; i <= 3; i++) {
    qh += drift + randn() * 0.1;
    const fraudActive = !!fraud && i >= fraud.start;
    if (fraudActive) fraud.years++;
    if (co.decoy && i === co.decoy.year) {
      if (co.decoy.type === 'ar') co.arBase *= co.decoy.mult; else co.invBase *= co.decoy.mult;
    }
    const ctx = {
      q: qh, gdp: G.eco.gdp + randn() * 0.8, cond: indCond(indId) * 0.5 + randn() * 0.2, vit: G.city.d[did].vit,
      policy: G.eco.policy, fraudActive, fy: fraud ? fraud.years : 0,
    };
    const { T, hidden } = genYear(co, Tp, ctx);
    const R = makeReported(co, T, ctx, hidden);
    co.years.push(R ? { endM: lastEnd - 36 + 12 * i, T, R } : { endM: lastEnd - 36 + 12 * i, T });
    Tp = T;
  }
  co.q = qh; co.qStmt = qh;
  const last = co.years[co.years.length - 1];
  co.emp = Math.max(3, Math.round(last.T.S / ind.spe * uni(0.8, 1.2)));
  if (co.ownsRE) {
    co.reTrue = (last.T.LAND * uni(1.0, 1.6) + (last.T.PPE - last.T.LAND) * 0.3) * (G.city.d[did].land / 100);
    co.reLand0 = G.city.d[did].land;
    co.reEst = co.reTrue * uni(0.78, 1.3);
    co.reLien = chance(0.3); // 他行の先順位抵当
  }
  refreshGrades(co);
  return co;
}

/* 決算書アクセサ */
const repOf = y => y.R || y.T;
function latestRep(co) { return repOf(co.years[co.years.length - 1]); }
function latestTrue(co) { return co.years[co.years.length - 1].T; }

/* 翌年度の決算を生成（融資先の期中管理用） */
function advanceCompanyYear(co) {
  const last = co.years[co.years.length - 1];
  const f = co.fraud;
  const fraudActive = !!f && !f.exposed;
  if (fraudActive) f.years++;
  const ctx = {
    q: co.q, gdp: G.eco.gdp, cond: indCond(co.ind), vit: G.city.d[co.district].vit, policy: G.eco.policy,
    fraudActive, fy: f ? f.years : 0, newLTD: co.pendingLoan * 0.9, plannedCapex: co.pendingCapex,
  };
  co.pendingLoan = 0; co.pendingCapex = 0;
  const { T, hidden } = genYear(co, last.T, ctx);
  const R = makeReported(co, T, ctx, hidden);
  co.years.push(R ? { endM: last.endM + 12, T, R } : { endM: last.endM + 12, T });
  while (co.years.length > 7) co.years.shift();
  co.qStmt = co.q;
  co.mon = {};
  refreshGrades(co);
}

/* ---------- 財務分析 ---------- */
function cfOf(s, p) {
  if (!p) return null;
  const ocf = s.NI + s.DEP - (s.AR - p.AR) - (s.INV - p.INV) - (s.OCA - p.OCA) + (s.AP - p.AP) + (s.OCL - p.OCL);
  const capex = s.PPE - p.PPE + s.DEP;
  const icf = -capex - (s.INVEST - p.INVEST);
  const fcf = (s.STD - p.STD) + (s.LTD - p.LTD) - s.DIV;
  return { ocf, icf, fcf, capex, dSTD: s.STD - p.STD, dLTD: s.LTD - p.LTD, dCash: s.CASH - p.CASH, begin: p.CASH, end: s.CASH,
    dAR: -(s.AR - p.AR), dINV: -(s.INV - p.INV), dAP: s.AP - p.AP, dOther: -(s.OCA - p.OCA) + (s.OCL - p.OCL), dInvest: -(s.INVEST - p.INVEST) };
}

function ratiosOf(s, p) {
  const debt = s.STD + s.LTD;
  const cf = cfOf(s, p);
  const cfSimple = s.ORD * 0.7 + s.DEP;
  const netDebt = debt - s.CASH;
  const r = {
    eqR: s.EQ / s.TA * 100,
    cr: s.CA / Math.max(1, s.CL) * 100,
    qr: (s.CASH + s.AR) / Math.max(1, s.CL) * 100,
    fixLong: s.FA / Math.max(1, s.EQ + s.LTD) * 100,
    debtMonths: debt / (s.S / 12),
    gpm: s.GP / s.S * 100,
    opm: s.OPI / s.S * 100,
    ordm: s.ORD / s.S * 100,
    roa: s.ORD / s.TA * 100,
    arDays: s.AR / s.S * 365,
    invDays: s.INV / Math.max(1, s.COGS) * 365,
    apDays: s.AP / Math.max(1, s.COGS) * 365,
    turn: s.S / s.TA,
    dsy: netDebt <= 0 ? 0 : (cfSimple > 0 ? netDebt / cfSimple : Infinity),
    icr: s.INT > 0 ? (s.OPI + s.NONOP * 0.5) / s.INT : Infinity,
    taxRate: s.PRETAX > 0 ? s.TAX / s.PRETAX * 100 : NaN,
    ocaS: s.OCA / s.S * 100,
  };
  if (p) {
    r.salesG = (s.S / p.S - 1) * 100;
    r.arG = (s.AR / Math.max(1, p.AR) - 1) * 100;
    r.depRate = s.DEP / Math.max(1, p.PPE - p.LAND) * 100;
    r.impliedInt = s.INT / Math.max(1, (debt + p.STD + p.LTD) / 2) * 100;
    r.ocf = cf.ocf;
    r.ocfNi = s.NI > 0 ? cf.ocf / s.NI : NaN;
  }
  return r;
}

/* 業界平均（参考値） */
function industryAvg(indId) {
  const i = IND[indId];
  return {
    eqR: 28, cr: 150, gpm: i.gm * 100, opm: i.opm * 100, ordm: i.opm * 100 * 0.95,
    arDays: i.ar, invDays: i.inv, apDays: i.ap, depRate: i.dep * 100, taxRate: 30,
  };
}

/* 財務スコア（0〜100）。years = 古い順の決算（最大4、先頭は前期比較用） */
function scoreFin(years) {
  const L = years[years.length - 1];
  const shown = years.slice(-3);
  const r = ratiosOf(L, years.length > 1 ? years[years.length - 2] : null);
  let s = 0;
  s += interp(r.eqR / 100, [[-0.2, 0], [0, 5], [0.1, 11], [0.2, 16], [0.3, 20], [0.45, 25]]);
  s += interp(r.ordm / 100, [[-0.05, 0], [0, 6], [0.02, 11], [0.05, 16], [0.1, 20]]);
  if (r.dsy === 0) s += 20;
  else if (isFinite(r.dsy)) s += interp(r.dsy, [[0, 20], [3, 17], [7, 12], [10, 8], [15, 5], [25, 1], [40, 0]]);
  s += isFinite(r.icr) ? interp(r.icr, [[0, 0], [1, 2], [3, 5], [10, 8], [20, 10]]) : 10;
  s += interp(r.cr / 100, [[0.6, 0], [0.8, 2], [1.0, 4], [1.2, 6], [1.5, 8], [2, 10]]);
  const g = shown.length >= 2 ? shown[shown.length - 1].S / shown[0].S - 1 : 0;
  s += interp(g, [[-0.15, 0], [0, 2.5], [0.15, 5]]);
  const py = shown.filter(y => y.ORD > 0).length;
  s += [0, 3, 6, 10][py] ?? 10;
  return clamp(s, 0, 100);
}
function gradeOfScore(sc) {
  for (let i = 0; i < GRADE_THRESH.length; i++) if (sc >= GRADE_THRESH[i]) return i + 1;
  return 10;
}

/* 格付の更新（実態・提出の両方） */
function refreshGrades(co) {
  const yr = co.years.slice(-4);
  co.scoreRep = scoreFin(yr.map(repOf));
  co.scoreTrue = scoreFin(yr.map(y => y.T));
  co.gRep = gradeOfScore(co.scoreRep);
  co.gTrue = gradeOfScore(co.scoreTrue);
}
/* 銀行から見える格付（粉飾を見抜いていれば実態ベース） */
function bankGrade(co) { return co.fraud && co.fraud.found ? co.gTrue : co.gRep; }
function bankScore(co) { return co.fraud && co.fraud.found ? co.scoreTrue : co.scoreRep; }

/* 粉飾チェック（審査システムLv2以上で表示） */
function fraudFlags(co) {
  const ys = co.years.slice(-4).map(repOf);
  const flags = [];
  if (ys.length < 3) return flags;
  const n = ys.length;
  const cur = ratiosOf(ys[n - 1], ys[n - 2]);
  const prv = ratiosOf(ys[n - 2], ys[n - 3]);
  const avg = industryAvg(co.ind);
  if (cur.arDays > prv.arDays * 1.18 && cur.arDays > avg.arDays * 1.15) flags.push({ k: 'ar', t: `売上債権回転日数が${fmtNum(prv.arDays, 0)}日→${fmtNum(cur.arDays, 0)}日に急増` });
  if (cur.arG - cur.salesG > 20 && cur.salesG > -5) flags.push({ k: 'arg', t: `売上の伸び（${fmtPct(cur.salesG, 1)}）を大きく上回る売上債権の増加（${fmtPct(cur.arG, 1)}）` });
  if (cur.invDays > prv.invDays * 1.2 && cur.invDays > avg.invDays * 1.15) flags.push({ k: 'inv', t: `棚卸資産回転日数が${fmtNum(prv.invDays, 0)}日→${fmtNum(cur.invDays, 0)}日に悪化（在庫の滞留）` });
  if (cur.gpm - prv.gpm > 2.5) flags.push({ k: 'gpm', t: `売上総利益率が${fmtPct(prv.gpm, 1)}→${fmtPct(cur.gpm, 1)}に不自然に改善` });
  if (ys[n - 1].NI > 0 && isFinite(cur.ocfNi) && cur.ocfNi < 0.3) flags.push({ k: 'cf', t: `当期純利益は黒字だが営業CFが${cur.ocf < 0 ? 'マイナス' : '利益を大きく下回る'}（利益の質に疑問）` });
  if (isFinite(cur.depRate) && isFinite(prv.depRate) && cur.depRate < prv.depRate * 0.7) flags.push({ k: 'dep', t: `減価償却率が${fmtPct(prv.depRate, 1)}→${fmtPct(cur.depRate, 1)}に低下（償却不足の疑い）` });
  if (cur.ocaS > Math.max(prv.ocaS * 1.6, 3.5)) flags.push({ k: 'oca', t: `その他流動資産（仮払金・前払費用等）が売上比${fmtPct(cur.ocaS, 1)}に膨張` });
  if (isFinite(cur.taxRate) && ys[n - 1].PRETAX > 5e6 && cur.taxRate < 18) flags.push({ k: 'tax', t: `税負担率が${fmtPct(cur.taxRate, 1)}と異常に低い（申告所得との乖離の疑い）` });
  if (cur.impliedInt > 4.5) flags.push({ k: 'int', t: `支払利息÷有利子負債が${fmtPct(cur.impliedInt, 1)}と高すぎる（簿外借入の疑い）` });
  return flags;
}

/* AI審査の推定（審査システムLv3、結果は一度だけ算出して保存） */
function aiEstimate(co) {
  if (co.ai) return co.ai;
  const flags = fraudFlags(co).length;
  let grade, fp;
  if (co.fraud && !co.fraud.found) {
    grade = chance(0.6) ? clamp(co.gTrue + randInt(-1, 1), 1, 10) : co.gRep;
    fp = clamp(0.35 + 0.12 * flags + 0.25 * rand(), 0.2, 0.95);
  } else {
    grade = clamp(bankGrade(co) + (chance(0.25) ? randInt(-1, 1) : 0), 1, 10);
    fp = clamp(0.03 + 0.07 * flags + 0.08 * rand(), 0.01, 0.6);
  }
  co.ai = { grade, fp };
  return co.ai;
}

/* ---------- 個人（住宅ローン申込者） ---------- */
function annuityPayment(P, ratePct, months) {
  const i = ratePct / 1200;
  if (months <= 0) return P;
  if (Math.abs(i) < 1e-9) return P / months;
  return P * i / (1 - Math.pow(1 + i, -months));
}

function genPerson(did) {
  const occ = wpick(OCCUPATIONS, OCCUPATIONS.map(o => o.w));
  const age = randInt(26, 54);
  const s = G.city.d[did];
  const income = roundTo(uni(occ.inc[0], occ.inc[1]) * (1 + (age - 32) * 0.012) * 1e4 * s.income / DIST[did].income, 10e4);
  const ptype = pick(PROPERTY_TYPES);
  const price = clamp(roundTo(income * uni(5, 8.5) * Math.pow(s.land / 100, 0.5), 100e4), 1800e4, 12000e4);
  const downR = wpick([0, 0.05, 0.1, 0.2, 0.3], [35, 15, 25, 15, 10]);
  const overloan = downR === 0 && chance(0.4);
  const amount = roundTo(price * (1 - downR) + (overloan ? price * 0.06 : 0), 10e4);
  const maxTerm = Math.min(35, 80 - age);
  const termY = clamp(maxTerm - (chance(0.3) ? randInt(0, 10) : 0), 10, 35);
  const otherDebt = chance(0.35) ? roundTo(uni(12e4, 60e4), 1e4) : 0;
  let fraud = null;
  if (chance(DIFFICULTY[G.difficulty].fraud * 0.6)) fraud = { type: wpick(['income', 'hiddenDebt', 'investment'], [4, 4, 2]), found: false };
  const repIncome = fraud && fraud.type === 'income' ? roundTo(income * uni(1.25, 1.6), 10e4) : income;
  const hiddenDebt = fraud && fraud.type === 'hiddenDebt' ? roundTo(uni(60e4, 200e4), 1e4) : 0;
  const valueTrue = price * (ptype.startsWith('新築') || ptype === '注文住宅' ? uni(0.82, 0.95) : uni(0.85, 1.05)) * (fraud && fraud.type === 'investment' ? 0.85 : 1);
  const employer = occ.id === 'self' ? '自営（' + pick(['飲食店', '設計事務所', '美容室', '整骨院', 'IT受託開発', '運送業']) + '）'
    : occ.id === 'civil' ? pick(['汐見市役所', '県庁', '公立学校', '消防本部'])
    : occ.id === 'doctor' ? pick(['汐見市民病院', '学園都市大学病院', '開業医（内科）'])
    : newCompanyName(pick(['mfg', 'whl', 'it', 'con', 'trn', 'med']));
  return {
    id: 'p' + (++G.seq.p), name: personName(), age, occ: occ.id, employer, income, repIncome,
    yearsEmp: clamp(randInt(1, age - 22), 1, 35), fam: pick(['単身', '夫婦', '夫婦・子1人', '夫婦・子2人', '夫婦・子3人']),
    ptype, price, downR, amount, termY, otherDebt, hiddenDebt, valueTrue, valueEst: valueTrue * uni(0.85, 1.2), district: did, fraud,
  };
}
const OCC = Object.fromEntries(OCCUPATIONS.map(o => [o.id, o]));

/* 返済負担率（DTI） useTrue: 真の所得・債務を使う */
function mortDTI(p, amount, ratePct, termY, useTrue) {
  const pay = annuityPayment(amount, ratePct, termY * 12) * 12;
  const inc = useTrue ? p.income : p.repIncome;
  const other = p.otherDebt + (useTrue ? p.hiddenDebt : 0);
  return (pay + other) / inc;
}
function mortPD(p, amount, ratePct, termY, useTrue = true) {
  const dti = mortDTI(p, amount, ratePct, termY, useTrue);
  let pd = interp(dti, [[0.15, 0.08], [0.2, 0.12], [0.25, 0.2], [0.3, 0.35], [0.35, 0.6], [0.4, 1.1], [0.5, 2.0], [0.7, 4]]);
  pd *= OCC[p.occ].risk;
  const val = useTrue ? p.valueTrue : p.valueEst;
  if (amount / val > 1.0) pd *= 1.4;
  if (p.age + termY > 75) pd *= 1.25;
  if (useTrue && p.fraud && p.fraud.type === 'investment') pd *= 2.2;
  if (G) pd *= Math.exp((G.eco.unemp - 2.6) * 0.35);
  return pd;
}
/* 住宅ローンの行内スコア → 格付相当 */
function mortGrade(p, amount, ratePct, termY) {
  const pd = mortPD(p, amount, ratePct, termY, false);
  for (let g = 1; g <= 10; g++) if (pd <= GRADE_PD[g] * 1.3) return g;
  return 10;
}

/* =========================================================
 *  06_loans.js : 融資の申込・調査・条件・実行・管理・回収

const isActiveLoan = L => L.status === 'current' || L.status === 'late' || L.status === 'default' || L.status === 'bankrupt';

/* ---------- 申込の生成 ---------- */
function genApplications() {
  if (G.flags.lendingBan > G.m) return;
  const pres = districtPresence();
  const totalPres = sum(Object.values(pres));
  const trustF = 0.6 + 0.8 * G.trust / 100;
  const lamBiz = (1.0 + 0.2 * G.staff.sales + 0.7 * totalPres) * G.eco.demand * trustF;
  const nBiz = Math.min(10, poisson(lamBiz));
  for (let i = 0; i < nBiz; i++) {
    const did = wpick(DISTRICTS.map(d => d.id), DISTRICTS.map(d => (pres[d.id] + 0.08) * G.city.d[d.id].firms * Math.pow(G.city.d[d.id].vit / 100, 1.5)));
    // 既存取引先からの追加融資の申込
    const borrowers = [...new Set(G.loans.filter(L => L.kind === 'biz' && L.status === 'current' && L.coId && G.m - L.startM > 8).map(L => L.coId))];
    let co;
    if (borrowers.length && chance(0.22)) {
      co = G.companies[pick(borrowers)];
      if (!co || G.apps.some(a => a.coId === co.id)) continue;
    } else {
      co = genCompany({ district: did, sizeMul: 1.4 });
      G.companies[co.id] = co;
    }
    G.apps.push(makeBizApp(co));
  }
  // 住宅ローン
  const ourVar = mortVarRate();
  const comp = Math.exp(-4 * (ourVar - G.eco.mortVar));
  let mortDemand = 0;
  for (const d of DISTRICTS) mortDemand += (pres[d.id] + 0.05) * d.mort * (1 + G.city.d[d.id].mortBoost) * (G.city.d[d.id].pop / d.pop);
  const lamM = (0.1 + 0.3 * mortDemand + 0.2 * G.sys.digital) * clamp(comp, 0.3, 2.5) * trustF * Math.exp(-0.3 * (G.eco.mortVar - 0.85));
  const nM = Math.min(8, poisson(lamM));
  for (let i = 0; i < nM; i++) {
    const did = wpick(DISTRICTS.map(d => d.id), DISTRICTS.map(d => (pres[d.id] + 0.05 + 0.1 * G.sys.digital) * d.mort * G.city.d[d.id].pop));
    G.apps.push(makeMortApp(genPerson(did)));
  }
}

function makeBizApp(co) {
  const Lr = latestRep(co), Lt = latestTrue(co);
  const existing = G.loans.some(L => L.coId === co.id && isActiveLoan(L));
  const losing = Lt.ORD < 0 || (co.fraud && co.q < -0.8);
  const purpose = wpick(Object.keys(PURPOSES), [30, 12, 30, existing ? 4 : 15, losing ? 18 : 2]);
  const P = PURPOSES[purpose];
  let amt;
  switch (purpose) {
    case 'wc': amt = Lr.S / 12 * uni(1.0, 2.5); break;
    case 'season': amt = Lr.S / 12 * uni(0.5, 1.2); break;
    case 'capex': amt = Lr.S * uni(0.08, 0.4); break;
    case 'refi': amt = (Lr.STD + Lr.LTD) * uni(0.3, 0.7); break;
    default: amt = Lr.S / 12 * uni(0.5, 1.5);
  }
  amt = niceAmount(clamp(amt, 5e6, 60e8));
  let termM = randInt(P.term[0], P.term[1]);
  termM = purpose === 'season' ? termM : Math.max(12, Math.round(termM / 12) * 12);
  const hiddenPurpose = losing && purpose !== 'deficit' && chance(0.6);
  const app = {
    id: 'A' + (++G.seq.app), kind: 'biz', m: G.m, exp: G.m + 1, coId: co.id, district: co.district,
    purpose, amountReq: amt, termReqM: termM, repayReq: P.repay, rateTypeReq: chance(0.6) ? 'var' : 'fixed',
    hasRE: !!co.ownsRE, existing, inv: {}, noise: randn() * 0.35, hiddenPurpose, status: 'pending',
    otherRate: purpose === 'refi' ? +(marketLoanRate(co.gRep, termM) + uni(0.1, 0.6)).toFixed(2) : null,
  };
  if (purpose === 'capex') app.capexItem = pick({
    mfg: ['NC旋盤・マシニングセンタの更新', '新工場棟の建設', '自動化ラインの導入'], con: ['重機の購入', '資材置場の取得'],
    whl: ['物流倉庫の新設', '配送車両の入替'], ret: ['新店舗の出店', '既存店の全面改装'], food: ['2号店の出店', '厨房設備の更新'],
    trn: ['トラック10台の入替', '物流センターの新設'], re: ['賃貸マンションの建設', '収益ビルの取得'], it: ['データセンター設備の増強', '本社移転・開発環境の整備'],
    med: ['介護施設の新設', '医療機器の更新'], htl: ['客室の全面改装', '露天風呂付き客室の新設'], agr: ['ハウス栽培施設の建設', '農業機械の購入'],
  }[co.ind]);
  app.terms = defaultTerms(app);
  return app;
}

function makeMortApp(p) {
  const rateTypeReq = chance(0.72) ? 'var' : 'fix10';
  const app = {
    id: 'A' + (++G.seq.app), kind: 'mort', m: G.m, exp: G.m + 1, person: p, district: p.district,
    purpose: 'mort', amountReq: p.amount, termReqM: p.termY * 12, repayReq: 'annuity', rateTypeReq,
    hasRE: true, inv: {}, noise: randn() * 0.35, status: 'pending',
  };
  app.terms = defaultTerms(app);
  return app;
}

/* ---------- 金利 ---------- */
function mortVarRate() { return Math.max(0.1, G.rates.prime - G.rates.mortDisc); }
function mortFixRate() { return Math.max(0.1, G.eco.y[10] + G.rates.mortFixSpread); }

function appSysGrade(app) {
  if (app.kind === 'biz') return bankGrade(G.companies[app.coId]);
  const p = app.person, t = app.terms;
  return mortGrade(p, t.amount, appRate(app, t), t.termM / 12);
}
function suggestedRate(app, termM) {
  if (app.kind === 'mort') return app.terms.rateType === 'var' ? mortVarRate() : mortFixRate();
  return +marketLoanRate(appSysGrade(app), termM).toFixed(2);
}
function defaultTerms(app) {
  if (app.kind === 'mort') {
    return { amount: app.amountReq, rateType: app.rateTypeReq, rateAdj: 0, termM: app.termReqM, repay: 'annuity', guarantee: 'company' };
  }
  const fixed = suggestedRate(app, app.termReqM);
  return {
    amount: app.amountReq, rateType: app.rateTypeReq, rate: fixed,
    spread: +(fixed - G.rates.prime).toFixed(2), termM: app.termReqM, repay: app.repayReq,
    collateral: app.hasRE, guarantee: 'none',
  };
}
/* 条件から実効金利（%）を求める */
function appRate(app, t) {
  if (app.kind === 'mort') return Math.max(0.1, (t.rateType === 'var' ? mortVarRate() : mortFixRate()) + (t.rateAdj || 0));
  return Math.max(0.1, t.rateType === 'var' ? G.rates.prime + t.spread : t.rate);
}

/* ---------- 成約確率 ---------- */
function acceptProb(app, t, mode = 'true') {
  const rate = appRate(app, t);
  let x;
  if (app.kind === 'biz') {
    const co = G.companies[app.coId];
    const mkt = marketLoanRate(co.gRep, t.termM);
    const gd = mode === 'true' ? co.gTrue : bankGrade(co);
    let desp = clamp((gd - 4) / 6, 0, 1);
    if (mode === 'true' && co.fraud) desp = Math.min(1, desp + 0.3);
    const sens = 3.6 * (1 - 0.7 * desp);
    x = 1.5 - sens * (rate - mkt);
    x -= 2.2 * Math.max(0, 1 - t.amount / app.amountReq);
    x -= 0.6 * Math.max(0, (app.termReqM - t.termM) / app.termReqM);
    if (t.collateral && app.hasRE) x -= 0.35;
    if (t.guarantee === 'cgc') x -= 0.45;
    if (t.guarantee === 'personal') x -= 0.3;
    if (app.existing) x += 0.5;
    if (app.purpose === 'refi' && app.otherRate) x += 3 * (app.otherRate - rate) * 0.5;
  } else {
    const mkt = t.rateType === 'var' ? G.eco.mortVar : G.eco.mortFix;
    x = 1.6 - 5.5 * (rate - mkt);
    x -= 2.5 * Math.max(0, 1 - t.amount / app.amountReq);
    x -= 0.6 * Math.max(0, (app.termReqM - t.termM) / app.termReqM);
    if (t.guarantee === 'company') x -= 0.2;
  }
  x += (G.trust - 60) / 40 * 0.4;
  if (mode === 'true') x += app.noise;
  return sigmoid(x);
}

  for (const L of G.loans) if (isActiveLoan(L) && (L.coId === key || L.projId === key)) t += L.bal;

}

/* 不動産の現在価値（地区の地価で補正） */
function reNow(co, v) { return v * G.city.d[co.district].land / (co.reLand0 || G.city.d[co.district].land); }

function fraudAmountOf(co) {
  const f = co.fraud;
  if (!f) return 0;
  return f.type === 'hiddenDebt' ? f.hiddenNow : f.cum;
}

function creditCapacity() { return G.staff.credit * 10 * (G.sys.credit >= 3 ? 1.3 : 1); }
function creditCapLeft() { return creditCapacity() - G.capUsed.credit; }

/* 調査の実行。target: 申込（app）または 融資先企業（co）の期中モニタリング */
function runInvestigation(target, key, isMonitor) {
  const kind = isMonitor ? 'biz' : target.kind;
  const def = (kind === 'mort' ? INV_MORT : INV_BIZ)[key];
  const store = isMonitor ? target.mon : target.inv;
  if (!def || store[key]) return { ok: false, msg: '実施済みです' };
  if (creditCapLeft() < def.days - 1e-9) return { ok: false, msg: '今月の審査部の人員に余裕がありません（審査担当を増員してください）' };
  G.capUsed.credit += def.days;
  if (def.cost) payExpense(def.cost, 'premises', '信用調査費・鑑定料等');
  const res = kind === 'mort' ? runMortInv(target, key) : runBizInv(isMonitor ? target : G.companies[target.coId], key, isMonitor ? null : target);
  store[key] = res;
  G.stats.investigations++;
  return { ok: true, res };
}

function runBizInv(co, key, app) {
  const f = co.fraud;
  const active = f && f.years > 0 && !f.exposed;
  if (active && !f.found && chance(DETECT[key]?.[f.type] || 0)) {
    f.found = true;
    f.foundM = G.m;
    f.foundBy = key;
    G.stats.fraudFound++;
    const X = fmtYen(fraudAmountOf(co));
    const tx = (FOUND_TEXT[f.type][key] || FOUND_TEXT[f.type].other)(X);
    for (const L of G.loans) if (L.coId === co.id && isActiveLoan(L)) L.fraudKnown = true;
    return { status: 'major', text: tx, found: true };
  }
  if (active && f.found && key !== 'appraisal') {
    return { status: 'major', text: `粉飾（${FRAUD_TYPES[f.type].name}）はすでに判明している。実態の財務内容で判断すること。` };
  }
  const r = ratiosOf(latestTrue(co), co.years[co.years.length - 2].T);
  switch (key) {
    case 'bureau': {
      const sc = Math.round(clamp(co.scoreTrue * 0.55 + co.scoreRep * 0.45 + randn() * 4, 20, 90));
      const pay = co.q < -1.1 ? '一部の仕入先への支払遅延情報あり。' : '支払状況：遅延の情報なし。';
      const rep = co.mq > 0.8 ? '代表者は地元経済界での信頼が厚い。' : co.mq < -1 ? '代表者の経営手腕を疑問視する声もある。' : '業界内での評判は標準的。';
      const st = active && chance(0.35) ? 'minor' : co.q < -1.1 ? 'minor' : 'ok';
      return { status: st, text: `評点${sc}点。${pay}${rep}${st === 'minor' && active ? HINT_TEXT.bureau : ''}`, score: sc };
    }
    case 'interview': {
      const mq = co.mq + randn() * 0.3;
      let t = mq > 1 ? '事業計画が具体的で、数字にも明るい。後継者も育っている。' : mq > 0 ? '堅実な経営姿勢で、説明は筋が通っている。'
        : mq > -1 ? '売上見通しが楽観的で、計画の根拠がやや弱い。' : '経営管理が場当たり的で、資金繰り表も作成していない。';
      let st = mq < -1 ? 'minor' : 'ok';
      if (app && app.hiddenPurpose && chance(0.6)) { t += '資金使途は運転資金とされているが、実態は赤字補填とみられる。'; st = 'minor'; app.purposeRevealed = true; }
      if (active && chance(0.4)) { t += HINT_TEXT.interview; st = 'minor'; }
      return { status: st, text: t, mq: Math.round(mq * 10) / 10 };
    }
    case 'site': {
      const q = co.q + randn() * 0.3;
      let t = q > 0.7 ? '工場・店舗はフル稼働。受注残も豊富で活気がある。' : q > -0.3 ? '稼働状況は概ね良好。設備の手入れも行き届いている。'
        : q > -1.2 ? '稼働率はやや低く、一部の設備が遊休化している。' : '稼働はまばらで、従業員にも覇気がない。業況は相当厳しい。';
      let st = q < -1.2 ? 'minor' : 'ok';
      if (co.decoy && co.decoy.type === 'inv') { t += `在庫の増加は${co.decoy.reason}。実在を確認した。`; }
      if (active && chance(0.35)) { t += HINT_TEXT.site; st = 'minor'; }
      return { status: st, text: t };
    }
    case 'tax': {
      let t = '申告書と決算書の数値は一致。納税証明書でも滞納はない。';
      let st = 'ok';
      if (co.q < -1.3 && chance(0.5)) { t = '申告書と決算書は一致するが、消費税の分納（滞納）がある。'; st = 'minor'; }
      if (active && chance(0.3)) { t += HINT_TEXT.tax; st = 'minor'; }
      return { status: st, text: t };
    }
    case 'ar': {
      const refuseP = active ? (f.type === 'fakeSales' ? 0.45 : 0.2) : 0.05;
      if (chance(refuseP)) return { status: 'minor', text: '先方が売掛先への確認に同意しなかった。「取引先に迷惑がかかる」との説明。' };
      if (co.decoy && co.decoy.type === 'ar') return { status: 'ok', text: `主要売掛先の残高はすべて一致。売掛金の増加は${co.decoy.reason}。` };
      return { status: 'ok', text: '主要売掛先5社に残高確認を実施。すべて一致した。' };
    }
    case 'bank': {
      let t = r.salesG > 0 ? '入出金は売上規模と整合的。不審な資金移動はない。' : '入出金は売上規模と整合的。売上減少に伴い残高は減少傾向。';

      return { status: 'ok', text: `鑑定評価額 ${fmtYen(v)}（簡易評価 ${fmtYen(co.reEst)}）。${lien}`, value: v };
